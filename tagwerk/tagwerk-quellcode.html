":"src/engine/__tests__/time.test.ts","content":"import {\n  addDaysToKey,\n  circularMeanHours,\n  dateKey,\n  dayOfWeekOfKey,\n  formatClock,\n  formatDuration,\n  formatHHmm,\n  hourOfDay,\n  localTimeToMs,\n  makeClock,\n  mean,\n  median,\n  parseHHmm,\n  percentile,\n  stddev,\n  tzOffsetMin,\n  wrapMin,\n} from '../time';\nimport { TZ } from './fixtures';\n\ndescribe('time helpers', () => {\n  it('maps UTC instants to local date keys across midnight', () => {\n    const ms = Date.UTC(2025, 5, 1, 22, 30); // 00:30 on 2 June in Berlin (CEST)\n    expect(dateKey(ms, TZ)).toBe('2025-06-02');\n    expect(dateKey(ms, 'UTC')).toBe('2025-06-01');\n    expect(formatClock(ms, TZ)).toBe('00:30');\n    expect(hourOfDay(ms, TZ)).toBeCloseTo(0.5);\n  });\n\n  it('round-trips local wall-clock times', () => {\n    const ms = localTimeToMs('2025-03-15', '07:15', TZ);\n    expect(formatClock(ms, TZ)).toBe('07:15');\n    expect(dateKey(ms, TZ)).toBe('2025-03-15');\n  });\n\n  it('handles date key arithmetic', () => {\n    expect(addDaysToKey('2025-02-28', 1)).toBe('2025-03-01');\n    expect(addDaysToKey('2024-02-28', 1)).toBe('2024-02-29');\n    expect(addDaysToKey('2025-01-01', -1)).toBe('2024-12-31');\n    expect(dayOfWeekOfKey('2025-06-01')).toBe(0);\n  });\n\n  it('formats clock hours and durations', () => {\n    expect(formatHHmm(7.5)).toBe('07:30');\n    expect(formatHHmm(25)).toBe('01:00');\n    expect(formatHHmm(-1)).toBe('23:00');\n    expect(parseHHmm('06:45')).toBeCloseTo(6.75);\n    expect(parseHHmm('7')).toBe(7);\n    expect(formatDuration(45)).toBe('45 min');\n    expect(formatDuration(120)).toBe('2 h');\n    expect(formatDuration(400)).toBe('6 h 40 min');\n  });\n\n  it('wraps minute differences', () => {\n    expect(wrapMin(0)).toBe(0);\n    expect(wrapMin(1430)).toBe(-10);\n    expect(wrapMin(-1430)).toBe(10);\n    expect(wrapMin(720)).toBe(720);\n  });\n\n  it('computes statistics', () => {\n    expect(median([3, 1, 2])).toBe(2);\n    expect(median([1, 2, 3, 4])).toBe(2.5);\n    expect(median([])).toBeNaN();\n    expect(percentile([1, 2, 3, 4, 5], 0.8)).toBeCloseTo(4.2);\n    expect(percentile([], 0.5)).toBeNaN();\n    expect(mean([2, 4])).toBe(3);\n    expect(stddev([1])).toBe(0);\n    expect(stddev([2, 4, 4, 4, 5, 5, 7, 9])).toBeCloseTo(2);\n    expect(circularMeanHours([23, 1])).toBeCloseTo(0, 5);\n    expect(circularMeanHours([3, 5])).toBeCloseTo(4);\n  });\n\n  it('knows the UTC offset including daylight saving time', () => {\n    expect(tzOffsetMin(Date.UTC(2025, 0, 15), TZ)).toBe(60);\n    expect(tzOffsetMin(Date.UTC(2025, 6, 15), TZ)).toBe(120);\n  });\n\n  it('local clock stays correct across the spring DST change in Europe/Berlin', () => {\n    const clock = makeClock(TZ);\n    const before = Date.UTC(2025, 2, 30, 0, 30); // 01:30 CET\n    const after = Date.UTC(2025, 2, 30, 1, 30); // 03:30 CEST\n    expect(clock(before)).toBeCloseTo(1.5);\n    expect(clock(after)).toBeCloseTo(3.5);\n  });\n});\n"},{"path":"src/engine/__tests__/twoProcess.test.ts","content":"import { C_RANGE, PressureModel, circadianPosition, computeCircadianOffset, debtFactor, debtMalus, energyRaw, inertia, processC, semidian } from '../twoProcess';\nimport { HOUR } from '../constants';\nimport { addDaysToKey, localTimeToMs, tzOffsetMin } from '../time';\nimport { constantNights, makeProfile, night, TZ } from './fixtures';\n\nfunction argExtremes(offsetMin: number) {\n  let min = Infinity, max = -Infinity, tMin = 0, tMax = 0;\n  for (let h = 0; h \u003c 24; h += 0.01) {\n    const c = processC(h, offsetMin);\n    if (c \u003c min) { min = c; tMin = h; }\n    if (c > max) { max = c; tMax = h; }\n  }\n  return { tMin, tMax };\n}\n\ndescribe('process C', () => {\n  it('has its minimum around 04:00-05:00 and maximum around 18:00-20:00 (reference type)', () => {\n    const { tMin, tMax } = argExtremes(0);\n    expect(tMin).toBeGreaterThanOrEqual(3.5);\n    expect(tMin).toBeLessThanOrEqual(5);\n    expect(tMax).toBeGreaterThanOrEqual(18);\n    expect(tMax).toBeLessThanOrEqual(20.5);\n  });\n\n  it.each([\n    ['early', -120],\n    ['intermediate', 0],\n    ['late', 120],\n  ])('shifts with the %s chronotype offset', (_n, offset) => {\n    const { tMin, tMax } = argExtremes(offset);\n    const ref = argExtremes(0);\n    expect(tMin).toBeCloseTo(ref.tMin + offset / 60, 1);\n    expect(tMax).toBeCloseTo(ref.tMax + offset / 60, 1);\n  });\n\n  it('is periodic over 24 h and stays within its range', () => {\n    expect(processC(3, 0)).toBeCloseTo(processC(27, 0), 10);\n    for (let h = 0; h \u003c 24; h += 0.5) {\n      expect(processC(h)).toBeGreaterThanOrEqual(C_RANGE.min - 1e-9);\n      expect(processC(h)).toBeLessThanOrEqual(C_RANGE.max + 1e-9);\n    }\n    expect(circadianPosition(4.0)).toBeLessThan(0.05);\n    expect(circadianPosition(20)).toBeGreaterThan(0.95);\n  });\n\n  it('adds a post-lunch dip through the semidian component', () => {\n    expect(semidian(14.5, 0)).toBeLessThan(semidian(9, 0));\n    expect(semidian(14.5, 0)).toBeLessThan(semidian(20, 0));\n  });\n});\n\ndescribe('process S', () => {\n  const t0 = Date.UTC(2025, 4, 1, 0, 0);\n  it('rises while awake and decays during sleep', () => {\n    const m = new PressureModel([{ startAt: t0 + 16 * HOUR, endAt: t0 + 24 * HOUR }], t0, 0.3);\n    expect(m.at(t0)).toBeCloseTo(0.3);\n    expect(m.at(t0 + 8 * HOUR)).toBeGreaterThan(m.at(t0 + 1 * HOUR));\n    expect(m.at(t0 + 16 * HOUR)).toBeCloseTo(1 - 0.7 * Math.exp(-16 / 18.2), 10);\n    expect(m.at(t0 + 24 * HOUR)).toBeLessThan(m.at(t0 + 16 * HOUR) * 0.2);\n    expect(m.at(t0 + 30 * HOUR)).toBeGreaterThan(m.at(t0 + 24 * HOUR));\n  });\n\n  it('is continuous at the boundaries and bounded in 0..1', () => {\n    const m = new PressureModel([{ startAt: t0 + 16 * HOUR, endAt: t0 + 24 * HOUR }], t0);\n    expect(Math.abs(m.at(t0 + 16 * HOUR - 1) - m.at(t0 + 16 * HOUR + 1))).toBeLessThan(1e-6);\n    for (let h = 0; h \u003c 80; h += 0.5) {\n      const v = m.at(t0 + h * HOUR);\n      expect(v).toBeGreaterThanOrEqual(0);\n      expect(v).toBeLessThanOrEqual(1);\n    }\n  });\n\n  it('works without any sleep and before the first segment', () => {\n    const m = new PressureModel([], t0, 0.2);\n    expect(m.at(t0)).toBeCloseTo(0.2);\n    expect(m.at(t0 + 10 * HOUR)).toBeGreaterThan(0.2);\n    const m2 = new PressureModel([{ startAt: t0 + 5 * HOUR, endAt: t0 + 6 * HOUR }], t0, 0.2);\n    expect(m2.at(t0 - HOUR)).toBeCloseTo(0.2);\n  });\n\n  it('reflects a short night: higher pressure after short sleep', () => {\n    const long = new PressureModel([{ startAt: t0 + 16 * HOUR, endAt: t0 + 24 * HOUR }], t0);\n    const short = new PressureModel([{ startAt: t0 + 16 * HOUR, endAt: t0 + 20 * HOUR }], t0);\n    expect(short.at(t0 + 20 * HOUR)).toBeGreaterThan(long.at(t0 + 24 * HOUR));\n  });\n\n  it('merges overlapping sleep intervals gracefully', () => {\n    const m = new PressureModel(\n      [\n        { startAt: t0 + 5 * HOUR, endAt: t0 + 9 * HOUR },\n        { startAt: t0 + 8 * HOUR, endAt: t0 + 10 * HOUR },\n      ],\n      t0,\n    );\n    expect(m.at(t0 + 9.5 * HOUR)).toBeLessThan(m.at(t0 + 5 * HOUR));\n  });\n});\n\ndescribe('inertia, debt malus and energy', () => {\n  it('decays with a 0.6 h time constant', () => {\n    expect(inertia(0, 0, 0)).toBeCloseTo(0.25);\n    expect(inertia(0.6, 0, 0)).toBeCloseTo(0.25 / Math.E, 6);\n    expect(inertia(-1, 0, 0)).toBe(0);\n  });\n\n  it('is stronger with sleep debt and near the circadian minimum', () => {\n    expect(inertia(0, 600, 0)).toBeCloseTo(0.25 * 1.5, 6);\n    expect(inertia(0, 0, 1)).toBeGreaterThan(inertia(0, 0, 0));\n    expect(debtFactor(1200)).toBe(1);\n  });\n\n  it('debt malus scales to 1.5 x 0.08', () => {\n    expect(debtMalus(0)).toBe(0);\n    expect(debtMalus(600)).toBeCloseTo(0.08);\n    expect(debtMalus(6000)).toBeCloseTo(0.12);\n  });\n\n  it('more debt means lower raw energy', () => {\n    const base = { hour: 12, offsetMin: 0, s: 0.4, hoursSinceWake: 5, circLowAtWake: 0 };\n    expect(energyRaw({ ...base, debtMinutes: 600 })).toBeLessThan(energyRaw({ ...base, debtMinutes: 0 }));\n  });\n});\n\ndescribe('circadian phase (shift mode and jetlag)', () => {\n  const shiftProfile = (over = {}) =>\n    makeProfile({\n      workSchedule: { workDays: [1, 2, 3, 4, 5], workStart: '09:00', workEnd: '17:00', shiftMode: true },\n      ...over,\n    });\n\n  it('stays at the stored offset without shift mode', () => {\n    const now = localTimeToMs('2025-05-14', '12:00', TZ);\n    const r = computeCircadianOffset(constantNights('2025-05-14', 14, 480), makeProfile({ circadianPhaseOffsetMin: 90 }), now);\n    expect(r.offsetMin).toBe(90);\n    expect(r.adapting).toBe(false);\n    expect(r.adaptDaysLeft).toBe(0);\n  });\n\n  it('moves at most one hour per day when the sleep phase flips', () => {\n    // 8 days of night sleep 23:00-07:00, then day sleep 09:00-17:00\n    const profile = shiftProfile();\n    const sessions = [];\n    for (let i = 0; i \u003c 8; i++) sessions.push(night(addDaysToKey('2025-05-01', i), '23:00', '07:00'));\n    for (let i = 8; i \u003c 14; i++) sessions.push(night(addDaysToKey('2025-05-01', i), '09:00', '17:00'));\n    let prev = computeCircadianOffset(sessions, profile, localTimeToMs('2025-05-08', '18:00', TZ));\n    expect(prev.adapting).toBe(false);\n    let moved = false;\n    for (let d = 9; d \u003c= 14; d++) {\n      const key = addDaysToKey('2025-05-01', d - 1);\n      const cur = computeCircadianOffset(sessions, profile, localTimeToMs(key, '18:00', TZ));\n      expect(Math.abs(cur.offsetMin - prev.offsetMin)).toBeLessThanOrEqual(60.0001);\n      if (cur.offsetMin !== prev.offsetMin) moved = true;\n      prev = cur;\n    }\n    expect(moved).toBe(true);\n    expect(prev.adapting).toBe(true);\n    expect(prev.adaptDaysLeft).toBeGreaterThan(0);\n  });\n\n  it('shift mode adopts a stable late sleep phase', () => {\n    const sessions = constantNights('2025-05-14', 14, 480, '11:00');\n    const r = computeCircadianOffset(sessions, shiftProfile(), localTimeToMs('2025-05-14', '12:00', TZ));\n    // mid-sleep at 07:00 -> +180 min over the 04:00 reference\n    expect(r.offsetMin).toBeCloseTo(180, 0);\n    expect(r.adapting).toBe(false);\n  });\n\n  it('adapts gradually after a time zone change (jetlag)', () => {\n    const NY = 'America/New_York';\n    const sessions = [\n      ...constantNights('2025-05-10', 11, 480),\n      night('2025-05-11', '23:00', '07:00', {}, NY),\n      night('2025-05-12', '23:00', '07:00', {}, NY),\n    ];\n    // fix the first of the new-zone nights to be on NY dates\n    const profile = makeProfile({ timezone: NY });\n    const now = localTimeToMs('2025-05-12', '12:00', NY);\n    const r = computeCircadianOffset(sessions.filter((s) => s.timezone === TZ || s.endAt \u003c now), profile, now);\n    const delta = tzOffsetMin(localTimeToMs('2025-05-11', '12:00', NY), NY) - tzOffsetMin(localTimeToMs('2025-05-11', '12:00', NY), TZ);\n    expect(delta).toBe(-360);\n    expect(r.adapting).toBe(true);\n    expect(r.offsetMin).toBeLessThan(0);\n    expect(r.offsetMin).toBeGreaterThanOrEqual(-360);\n    // 6 h shift, moved 60 min per elapsed day\n    expect(r.adaptDaysLeft).toBeGreaterThanOrEqual(3);\n  });\n\n  it('uses the device zone for days after the last recorded night', () => {\n    const NY = 'America/New_York';\n    const sessions = constantNights('2025-05-10', 14, 480);\n    const profile = makeProfile({ timezone: NY });\n    const r = computeCircadianOffset(sessions, profile, localTimeToMs('2025-05-14', '12:00', NY));\n    expect(r.adapting).toBe(true);\n  });\n\n  it('copes with no data at all', () => {\n    const r = computeCircadianOffset([], shiftProfile({ circadianPhaseOffsetMin: 30 }), localTimeToMs('2025-05-14', '12:00', TZ));\n    expect(r.offsetMin).toBe(30);\n    expect(r.adapting).toBe(false);\n  });\n});\n"},{"path":"src/engine/alarm.ts","content":"import { MIN } from './constants';\n\nexport const SLEEP_CYCLE_MIN = 90;\n\nexport interface WakeSuggestion {\n  wakeAt: number;\n  /** completed 90-minute cycles at that time */\n  cycles: number;\n  /** true if the time lies inside the requested span and ends a cycle */\n  aligned: boolean;\n}\n\n/**\n * Pick the wake time inside [spanStart, spanEnd] that ends a 90-minute sleep cycle counted from\n * the expected sleep onset (7.8). The latest matching cycle end wins. If the span contains no\n * cycle end, the end of the span is returned with `aligned: false`.\n */\nexport function suggestWakeTime(sleepOnset: number, spanStart: number, spanEnd: number): WakeSuggestion {\n  const cycleMs = SLEEP_CYCLE_MIN * MIN;\n  const first = Math.max(1, Math.ceil((spanStart - sleepOnset) / cycleMs));\n  const last = Math.floor((spanEnd - sleepOnset) / cycleMs);\n  if (last >= first) {\n    return { wakeAt: sleepOnset + last * cycleMs, cycles: last, aligned: true };\n  }\n  const cycles = Math.max(0, Math.round((spanEnd - sleepOnset) / cycleMs));\n  return { wakeAt: spanEnd, cycles, aligned: false };\n}\n"},{"path":"src/engine/chronotype.ts","content":"import {\n  CHRONO_MIN_NIGHTS,\n  MSF_EARLY_MAX_H,\n  MSF_LATE_MIN_H,\n  OFFSET_LIMIT_MIN,\n  OFFSET_MAX_WEEKLY_CHANGE_MIN,\n  REF_MIDSLEEP_H,\n  DAY,\n} from './constants';\nimport { buildSleepDays } from './sleepDetection';\nimport { circularMeanHours, dayOfWeekOfKey, hourOfDay, mean, parseHHmm } from './time';\nimport type { Chronotype, Profile, SleepSession } from './types';\n\nexport type PeakTime = 'morning' | 'midday' | 'evening' | 'night';\n\nexport interface ChronotypeAnswers {\n  freeSleepStart: string;\n  freeWake: string;\n  workBed: string;\n  workWake: string;\n  peak?: PeakTime;\n  /** number of work days per week, default 5 */\n  workDaysPerWeek?: number;\n}\n\nexport interface ChronotypeResult {\n  /** mid-sleep on free days, clock hours */\n  msf: number;\n  msfsc: number;\n  chronotype: Chronotype;\n  /** -1 (very early) … 1 (very late) */\n  score: number;\n  offsetMin: number;\n  socialJetlagHours: number;\n}\n\n/** Sleep duration in hours between two clock times, crossing midnight if needed. */\nexport function sleepDurationH(start: string, end: string): number {\n  let d = parseHHmm(end) - parseHHmm(start);\n  if (d \u003c= 0) d += 24;\n  return d;\n}\n\n/** Mid-sleep as a clock hour in [-6, 18) so that 23:30-start sleeps compare sanely. */\nexport function midSleepHours(start: string, end: string): number {\n  const mid = (parseHHmm(start) + sleepDurationH(start, end) / 2) % 24;\n  return mid >= 18 ? mid - 24 : mid;\n}\n\nexport function classify(msfsc: number): Chronotype {\n  if (msfsc \u003c MSF_EARLY_MAX_H) return 'early';\n  if (msfsc > MSF_LATE_MIN_H) return 'late';\n  return 'intermediate';\n}\n\nconst clamp = (v: number, lo: number, hi: number) => Math.min(hi, Math.max(lo, v));\nconst PEAK_NUDGE: Record\u003cPeakTime, number> = { morning: -0.25, midday: 0, evening: 0.25, night: 0.5 };\n\n/** Chronotype from the onboarding questionnaire (MSF / MSFsc logic, 5.6). */\nexport function chronotypeFromAnswers(a: ChronotypeAnswers): ChronotypeResult {\n  const sdFree = sleepDurationH(a.freeSleepStart, a.freeWake);\n  const sdWork = sleepDurationH(a.workBed, a.workWake);\n  const wd = a.workDaysPerWeek ?? 5;\n  const sdWeek = (sdWork * wd + sdFree * (7 - wd)) / 7;\n  const msf = midSleepHours(a.freeSleepStart, a.freeWake);\n  const correction = sdFree > sdWeek ? (sdFree - sdWeek) / 2 : 0;\n  const msfsc = msf - correction + (a.peak ? PEAK_NUDGE[a.peak] : 0);\n  const msfWork = midSleepHours(a.workBed, a.workWake);\n  return {\n    msf,\n    msfsc,\n    chronotype: classify(msfsc),\n    score: clamp((msfsc - REF_MIDSLEEP_H) / 3, -1, 1),\n    offsetMin: clamp(Math.round((msfsc - REF_MIDSLEEP_H) * 60), -OFFSET_LIMIT_MIN, OFFSET_LIMIT_MIN),\n    socialJetlagHours: Math.abs(msf - msfWork),\n  };\n}\n\nexport interface LearnedChronotype extends ChronotypeResult {\n  offsetMin: number;\n  nights: number;\n  freeNights: number;\n  changed: boolean;\n}\n\n/**\n * Re-estimate MSFsc from real free days (>= 21 nights) and move the stored offset slowly,\n * at most 15 minutes per week (5.6).\n */\nexport function learnChronotype(\n  sessions: SleepSession[],\n  profile: Profile,\n  now: number,\n  lastUpdatedAt?: number,\n): LearnedChronotype | null {\n  const tz = profile.timezone;\n  const ws = profile.workSchedule;\n  if (ws.shiftMode) return null;\n  const days = [...buildSleepDays(sessions, tz, false).values()].filter(\n    (d) => d.main.length > 0 && d.bedAt != null && d.wakeAt != null,\n  );\n  if (days.length \u003c CHRONO_MIN_NIGHTS) return null;\n  const free = days.filter((d) => !ws.workDays.includes(dayOfWeekOfKey(d.date)));\n  const work = days.filter((d) => ws.workDays.includes(dayOfWeekOfKey(d.date)));\n  if (free.length \u003c 3) return null;\n  const mid = (d: (typeof days)[number]) =>\n    hourOfDay(((d.bedAt as number) + (d.wakeAt as number)) / 2, tz);\n  const msfRaw = circularMeanHours(free.map(mid));\n  const msf = msfRaw >= 18 ? msfRaw - 24 : msfRaw;\n  const sdFree = mean(free.map((d) => d.mainMinutes / 60));\n  const sdWork = work.length ? mean(work.map((d) => d.mainMinutes / 60)) : sdFree;\n  const wd = ws.workDays.length;\n  const sdWeek = (sdWork * wd + sdFree * (7 - wd)) / 7;\n  const msfsc = msf - (sdFree > sdWeek ? (sdFree - sdWeek) / 2 : 0);\n  const target = clamp((msfsc - REF_MIDSLEEP_H) * 60, -OFFSET_LIMIT_MIN, OFFSET_LIMIT_MIN);\n  const weeks = lastUpdatedAt == null ? 1 : Math.max(0, (now - lastUpdatedAt) / (7 * DAY));\n  const maxStep = OFFSET_MAX_WEEKLY_CHANGE_MIN * weeks;\n  const cur = profile.circadianPhaseOffsetMin;\n  const next = cur + clamp(target - cur, -maxStep, maxStep);\n  const workMid = work.length ? circularMeanHours(work.map(mid)) : msfRaw;\n  const workMidN = workMid >= 18 ? workMid - 24 : workMid;\n  return {\n    msf,\n    msfsc,\n    chronotype: classify(msfsc),\n    score: clamp((msfsc - REF_MIDSLEEP_H) / 3, -1, 1),\n    offsetMin: next,\n    socialJetlagHours: Math.abs(msf - workMidN),\n    nights: days.length,\n    freeNights: free.length,\n    changed: Math.abs(next - cur) > 0.01,\n  };\n}\n"},{"path":"src/engine/constants.ts","content":"/**\n * All tunable engine constants live here. Bump ENGINE_VERSION whenever a\n * calculation changes so cached daily summaries are recomputed.\n */\nexport const ENGINE_VERSION = 1;\n\nexport const MIN = 60_000;\nexport const HOUR = 3_600_000;\nexport const DAY = 86_400_000;\n\n// ---- Sleep need (5.2) ----\nexport const NEED_DEFAULT_ADULT = 480;\nexport const NEED_DEFAULT_UNDER_18 = 540;\nexport const NEED_DEFAULT_18_25 = 495;\nexport const NEED_MIN = 360;\nexport const NEED_MAX = 630;\nexport const NEED_MIN_NIGHTS = 14;\nexport const NEED_RECOVERY_MIN_NIGHTS = 5;\nexport const NEED_LOOKBACK_DAYS = 90;\nexport const NEED_RECOVERY_MAX_DEBT_MIN = 180;\nexport const NEED_SMOOTH_OLD = 0.8;\nexport const NEED_SMOOTH_NEW = 0.2;\nexport const NEED_LATE_WAKE_HOUR = 9.5;\n\n// ---- Sleep debt (5.3) ----\nexport const DEBT_DAYS = 14;\nexport const DEBT_W_MIN = 0.15;\nexport const NAP_WEIGHT = 0.75;\nexport const SURPLUS_FACTOR = 0.5;\nexport const DEBT_MAX_MISSING = 5;\nexport const DEBT_LOW_MAX = 300;\nexport const DEBT_MID_MAX = 600;\nexport const DEBT_GAUGE_MAX = 1200;\n\n// ---- Sessions (5.1) ----\nexport const MERGE_GAP_MIN = 45;\nexport const NAP_MAX_MIN = 180;\nexport const NAP_START_HOUR = 9;\nexport const NAP_END_HOUR = 20;\n\n// ---- Two-process model (5.4) ----\nexport const TAU_R_H = 18.2;\nexport const TAU_D_H = 4.2;\nexport const S_START = 0.3;\nexport const C_AMPLITUDE = 0.12;\n/** Harmonic weights of process C. */\nexport const C_HARMONICS = [0.97, 0.22, 0.07, 0.03, 0.001];\n/**\n * Reference phase. With x = PHI_REF - t the waveform rises slowly over ~16 h\n * and falls fast over ~8 h: minimum ~04:00, maximum ~20:00 (see DECISIONS.md).\n */\nexport const PHI_REF_H = 0;\nexport const REF_MIDSLEEP_H = 4;\n/** Circadian gain and circasemidian (post-lunch dip) amplitude, calibrated numerically. */\nexport const C_GAIN = 2.5;\nexport const SEMIDIAN_AMP = 0.07;\nexport const SEMIDIAN_DIP_AFTER_MIN_H = 11.5;\nexport const I0 = 0.25;\nexport const TAU_I_H = 0.6;\nexport const INERTIA_DONE = 0.03;\nexport const DEBT_MALUS = 0.08;\nexport const DEBT_FACTOR_HOURS = 10;\n\n// ---- Energy curve (5.5) ----\nexport const CURVE_STEP_MIN = 5;\n/** Fixed normalisation range taken from a well rested reference day (see calibrate test). */\nexport const E_MIN_REF = -0.46;\nexport const E_MAX_REF = -0.17;\nexport const SMOOTH_MIN = 30;\nexport const WINDOW_TOLERANCE = 5;\nexport const WINDOW_MIN_MIN = 45;\nexport const WINDOW_MAX_MIN = 150;\n\n// ---- Chronotype (5.6) ----\nexport const MSF_EARLY_MAX_H = 3;\nexport const MSF_LATE_MIN_H = 5;\nexport const OFFSET_LIMIT_MIN = 240;\nexport const OFFSET_MAX_WEEKLY_CHANGE_MIN = 15;\nexport const CHRONO_MIN_NIGHTS = 21;\n\n// ---- Shift / jetlag (5.7) ----\nexport const ADAPT_MAX_PER_DAY_MIN = 60;\n\n// ---- Windows (5.8) ----\nexport const SLEEP_ONSET_MIN = 15;\nexport const DEBT_PAYBACK_FRACTION = 0.15;\nexport const DEBT_PAYBACK_MAX_MIN = 60;\nexport const MELATONIN_LENGTH_MIN = 60;\nexport const DLMO_BEFORE_SLEEP_H = 2;\nexport const MELATONIN_AFTER_DLMO_H = 2;\nexport const MORNING_LIGHT_MIN = 60;\nexport const LAST_MEAL_BEFORE_BED_H = 3;\nexport const DIM_LIGHT_BEFORE_MELATONIN_MIN = 90;\nexport const WIND_DOWN_BEFORE_MELATONIN_MIN = 60;\nexport const NAP_SHORT_MIN = 20;\nexport const NAP_LONG_MIN = 90;\nexport const NAP_LATEST_BEFORE_BED_H = 7;\nexport const SPORT_LENGTH_MIN = 60;\nexport const SPORT_BEFORE_WIND_DOWN_H = 2;\nexport const BEDTIME_EARLY_LIMIT_MIN = 60;\nexport const DEFAULT_CAFFEINE_CUTOFF_H = 8;\n\n/** Reference sleep onset (clock hour) of the reference chronotype; melatonin window starts here. */\nexport const HABITUAL_ONSET_REF_H = 22.5;\nexport const DEFAULT_WAKE_BEFORE_START_H = 8;\n"},{"path":"src/engine/dayPlan.ts","content":"import {\n  DAY,\n  DEBT_DAYS,\n  DEFAULT_WAKE_BEFORE_START_H,\n  ENGINE_VERSION,\n  HABITUAL_ONSET_REF_H,\n  HOUR,\n  MIN,\n  SLEEP_ONSET_MIN,\n} from './constants';\nimport { buildCurve, energyAt, findFeatures, type CurveResult } from './energyCurve';\nimport { computeDebt, forecastDebt, type DebtForecast, type DebtResult } from './sleepDebt';\nimport { buildSleepDays, sleepIntervals } from './sleepDetection';\nimport { defaultNeedMinutes } from './sleepNeed';\nimport { computeCircadianOffset, type PhaseResult } from './twoProcess';\nimport { dateKey, parseHHmm } from './time';\nimport type { CurveFeatures, DayWindow, Profile, SleepSession, WindowKind } from './types';\nimport {\n  buildWindows,\n  melatoninWindow,\n  nextClockTime,\n  recommendBedtime,\n  type BedtimeResult,\n  type MelatoninWindow,\n} from './windows';\n\nexport type DayPhase =\n  | 'grogginess'\n  | 'morning_peak'\n  | 'afternoon_dip'\n  | 'evening_peak'\n  | 'wind_down'\n  | 'melatonin'\n  | 'neutral';\n\nexport interface DayPlan {\n  engineVersion: number;\n  /** local date of waking, YYYY-MM-DD */\n  date: string;\n  now: number;\n  wakeAt: number;\n  /** false when the wake time was estimated from the profile */\n  hasWakeData: boolean;\n  needMinutes: number;\n  debt: DebtResult;\n  phase: PhaseResult;\n  curve: CurveResult;\n  features: CurveFeatures;\n  windows: DayWindow[];\n  melatonin: MelatoninWindow;\n  bedtime: BedtimeResult;\n  forecast: DebtForecast;\n  currentEnergy: number;\n  currentPhase: DayPhase;\n  nextEvent: { kind: WindowKind; at: number } | null;\n}\n\nexport interface DayPlanInput {\n  sessions: SleepSession[];\n  profile: Profile;\n  now: number;\n  /** precomputed need; defaults to manual > stored estimate > age default */\n  needMinutes?: number;\n}\n\nconst PHASE_KINDS: [WindowKind, DayPhase][] = [\n  ['grogginess', 'grogginess'],\n  ['morning_peak', 'morning_peak'],\n  ['afternoon_dip', 'afternoon_dip'],\n  ['evening_peak', 'evening_peak'],\n  ['melatonin', 'melatonin'],\n  ['wind_down', 'wind_down'],\n];\n\nexport function resolveNeed(profile: Profile, now: number): number {\n  return (\n    profile.sleepNeedMinutesManual ??\n    profile.sleepNeedMinutesEstimated ??\n    defaultNeedMinutes(profile.birthYear, now)\n  );\n}\n\n/** Compute everything the app shows for one waking day. */\nexport function computeDayPlan(input: DayPlanInput): DayPlan {\n  const { profile, now } = input;\n  const tz = profile.timezone;\n  const shift = profile.workSchedule.shiftMode;\n  const need = input.needMinutes ?? resolveNeed(profile, now);\n  const recent = input.sessions.filter((s) => s.endAt > now - (DEBT_DAYS + 7) * DAY);\n\n  const phase = computeCircadianOffset(recent, profile, now);\n\n  // Anchor: the most recent main-sleep wake-up that is less than 22 h ago.\n  const days = [...buildSleepDays(recent, tz, shift).values()].filter(\n    (d) => d.wakeAt != null && d.wakeAt \u003c= now,\n  );\n  const lastWake = days.length ? Math.max(...days.map((d) => d.wakeAt as number)) : null;\n  let wakeAt: number;\n  let hasWakeData = false;\n  if (lastWake != null && now - lastWake \u003c 22 * HOUR) {\n    wakeAt = lastWake;\n    hasWakeData = true;\n  } else {\n    const clock = profile.targetWakeTime\n      ? parseHHmm(profile.targetWakeTime)\n      : HABITUAL_ONSET_REF_H + phase.offsetMin / 60 + need / 60 + 0;\n    const nowNorm = now + 1; // last occurrence at or before now\n    wakeAt = nextClockTime(nowNorm - DAY, clock, tz);\n    if (wakeAt > now) wakeAt = nextClockTime(nowNorm - 2 * DAY, clock, tz);\n  }\n\n  const date = dateKey(wakeAt, tz);\n  const debt = computeDebt(recent, need, tz, wakeAt, { refDate: date, shiftMode: shift });\n  const melatonin = melatoninWindow(wakeAt, phase.offsetMin, tz);\n  const bedtime = recommendBedtime({\n    wakeAt,\n    profile,\n    needMinutes: need,\n    debtMinutes: debt.debtMinutes,\n    melatonin,\n  });\n\n  const intervals = sleepIntervals(recent, tz, shift);\n  const curve = buildCurve({\n    intervals,\n    wakeAt,\n    from: wakeAt - DEBT_DAYS * DAY,\n    tz,\n    offsetMin: phase.offsetMin,\n    debtMinutes: debt.debtMinutes,\n  });\n  const features = findFeatures({\n    curve,\n    debtMinutes: debt.debtMinutes,\n    awakeEnd: bedtime.bedtime,\n    melatoninStart: melatonin.start,\n  });\n  const windows = buildWindows({\n    wakeAt,\n    features,\n    bedtime: bedtime.bedtime,\n    melatonin,\n    caffeineCutoffHours: profile.caffeineCutoffHours,\n    debtMinutes: debt.debtMinutes,\n  });\n  const forecast = forecastDebt(recent, need, tz, now, bedtime.bedtime, bedtime.wakeAt);\n\n  let currentPhase: DayPhase = 'neutral';\n  for (const [kind, ph] of PHASE_KINDS) {\n    const w = windows.find((x) => x.kind === kind);\n    if (w && now >= w.start && now \u003c w.end) {\n      currentPhase = ph;\n      break;\n    }\n  }\n  const upcoming = windows\n    .filter((w) => w.kind !== 'grogginess' && w.start > now)\n    .sort((a, b) => a.start - b.start)[0];\n\n  return {\n    engineVersion: ENGINE_VERSION,\n    date,\n    now,\n    wakeAt,\n    hasWakeData,\n    needMinutes: need,\n    debt,\n    phase,\n    curve,\n    features,\n    windows,\n    melatonin,\n    bedtime,\n    forecast,\n    currentEnergy: energyAt(curve.points, Math.min(Math.max(now, wakeAt), bedtime.bedtime)),\n    currentPhase,\n    nextEvent: upcoming ? { kind: upcoming.kind, at: upcoming.start } : null,\n  };\n}\n\n/** Preview of tomorrow, assuming a full night starting at the recommended bedtime. */\nexport function computeTomorrowPlan(input: DayPlanInput, today?: DayPlan): DayPlan {\n  const plan = today ?? computeDayPlan(input);\n  const tz = input.profile.timezone;\n  const sim: SleepSession = {\n    id: 'simulated-night',\n    startAt: plan.bedtime.bedtime + SLEEP_ONSET_MIN * MIN,\n    endAt: plan.bedtime.wakeAt,\n    asleepMinutes: null,\n    source: 'manual',\n    confidence: 1,\n    isNap: false,\n    timezone: tz,\n    userEdited: true,\n  };\n  return computeDayPlan({\n    ...input,\n    sessions: [...input.sessions, sim],\n    now: plan.bedtime.wakeAt + 5 * MIN,\n  });\n}\n\nexport const DEFAULT_WAKE_OFFSET_H = DEFAULT_WAKE_BEFORE_START_H;\n\n/** Which phase the day is in at time `t` (used for scrubbing and labels). */\nexport function phaseAt(plan: DayPlan, t: number): DayPhase {\n  for (const [kind, ph] of PHASE_KINDS) {\n    const w = plan.windows.find((x) => x.kind === kind);\n    if (w && t >= w.start && t \u003c w.end) return ph;\n  }\n  return 'neutral';\n}\n"},{"path":"src/engine/energyCurve.ts","content":"import {\n  CURVE_STEP_MIN,\n  DAY,\n  E_MAX_REF,\n  E_MIN_REF,\n  HOUR,\n  INERTIA_DONE,\n  MIN,\n  SMOOTH_MIN,\n  WINDOW_MAX_MIN,\n  WINDOW_MIN_MIN,\n  WINDOW_TOLERANCE,\n} from './constants';\nimport { circadianPosition, energyRaw, inertia, PressureModel, type SleepWindow } from './twoProcess';\nimport { makeClock } from './time';\nimport type { CurveFeatures, CurvePoint, Interval } from './types';\n\nexport function normalizeEnergy(raw: number): number {\n  const v = (100 * (raw - E_MIN_REF)) / (E_MAX_REF - E_MIN_REF);\n  return Math.min(100, Math.max(0, v));\n}\n\nexport interface CurveInput {\n  intervals: SleepWindow[];\n  wakeAt: number;\n  /** start of simulation (usually wakeAt - 14 days) */\n  from: number;\n  tz: string;\n  offsetMin: number;\n  debtMinutes: number;\n  /** length of the curve, default 24 h after waking */\n  spanMs?: number;\n}\n\nexport interface CurveResult {\n  points: CurvePoint[];\n  wakeAt: number;\n  circLowAtWake: number;\n}\n\n/** Hours after waking until inertia drops below the threshold (5.5). */\nexport function grogginessEndAfter(debtMinutes: number, circLow: number): number {\n  let lo = 0;\n  let hi = 8;\n  for (let i = 0; i \u003c 40; i++) {\n    const mid = (lo + hi) / 2;\n    if (inertia(mid, debtMinutes, circLow) \u003c INERTIA_DONE) hi = mid;\n    else lo = mid;\n  }\n  return hi;\n}\n\n/** Energy curve on a fixed 0-100 scale in 5-minute steps (5.5). */\nexport function buildCurve(input: CurveInput): CurveResult {\n  const { intervals, wakeAt, from, tz, offsetMin, debtMinutes } = input;\n  const span = input.spanMs ?? DAY;\n  const clock = makeClock(tz);\n  const model = new PressureModel(intervals, from);\n  const circLowAtWake = 1 - circadianPosition(clock(wakeAt), offsetMin);\n  const step = CURVE_STEP_MIN * MIN;\n  const points: CurvePoint[] = [];\n  for (let t = wakeAt; t \u003c= wakeAt + span; t += step) {\n    const raw = energyRaw({\n      hour: clock(t),\n      offsetMin,\n      s: model.at(t),\n      hoursSinceWake: (t - wakeAt) / HOUR,\n      debtMinutes,\n      circLowAtWake,\n    });\n    points.push({ t, energy: normalizeEnergy(raw) });\n  }\n  return { points, wakeAt, circLowAtWake };\n}\n\nfunction smooth(values: number[], windowPoints: number): number[] {\n  const half = Math.floor(windowPoints / 2);\n  return values.map((_, i) => {\n    let s = 0;\n    let n = 0;\n    for (let k = Math.max(0, i - half); k \u003c= Math.min(values.length - 1, i + half); k++) {\n      s += values[k];\n      n++;\n    }\n    return s / n;\n  });\n}\n\n/** Expand around an extremum to the region within ±tolerance, clamped to 45..150 minutes. */\nexport function extremumWindow(\n  pts: CurvePoint[],\n  idx: number,\n  kind: 'max' | 'min',\n  lowT: number,\n  highT: number,\n): Interval {\n  const ref = pts[idx].energy;\n  const ok = (e: number) => (kind === 'max' ? e >= ref - WINDOW_TOLERANCE : e \u003c= ref + WINDOW_TOLERANCE);\n  let a = idx;\n  let b = idx;\n  while (a > 0 && pts[a - 1].t >= lowT && ok(pts[a - 1].energy)) a--;\n  while (b \u003c pts.length - 1 && pts[b + 1].t \u003c= highT && ok(pts[b + 1].energy)) b++;\n  const center = pts[idx].t;\n  let start = pts[a].t;\n  let end = pts[b].t;\n  if (end - start \u003c WINDOW_MIN_MIN * MIN) {\n    start = center - (WINDOW_MIN_MIN * MIN) / 2;\n    end = center + (WINDOW_MIN_MIN * MIN) / 2;\n  }\n  if (end - start > WINDOW_MAX_MIN * MIN) {\n    start = Math.max(start, center - (WINDOW_MAX_MIN * MIN) / 2);\n    end = Math.min(end, center + (WINDOW_MAX_MIN * MIN) / 2);\n    if (end - start > WINDOW_MAX_MIN * MIN) end = start + WINDOW_MAX_MIN * MIN;\n  }\n  start = Math.max(start, lowT);\n  end = Math.min(end, highT);\n  return { start, end };\n}\n\nconst around = (t: number, minutes: number): Interval => ({\n  start: t - (minutes * MIN) / 2,\n  end: t + (minutes * MIN) / 2,\n});\n\nexport interface FeatureInput {\n  curve: CurveResult;\n  debtMinutes: number;\n  /** end of the awake day (bedtime) */\n  awakeEnd: number;\n  /** start of melatonin window, used for the evening-peak fallback */\n  melatoninStart: number;\n}\n\n/** Find grogginess end, morning peak, afternoon dip and evening peak (5.5). */\nexport function findFeatures(input: FeatureInput): CurveFeatures {\n  const { curve, debtMinutes, awakeEnd, melatoninStart } = input;\n  const wake = curve.wakeAt;\n  const gEnd = wake + grogginessEndAfter(debtMinutes, curve.circLowAtWake) * HOUR;\n  const pts = curve.points.filter((p) => p.t \u003c= awakeEnd);\n  const sm = smooth(pts.map((p) => p.energy), SMOOTH_MIN / CURVE_STEP_MIN + 1);\n  const view = pts.map((p, i) => ({ t: p.t, energy: sm[i] }));\n  const start = Math.max(0, view.findIndex((p) => p.t >= gEnd));\n\n  const maxima: number[] = [];\n  const minima: number[] = [];\n  let lastDir = 0;\n  for (let i = start; i \u003c view.length - 1; i++) {\n    const d = view[i + 1].energy - view[i].energy;\n    const dir = Math.abs(d) \u003c 1e-9 ? 0 : Math.sign(d);\n    if (dir === 0) continue;\n    if (lastDir > 0 && dir \u003c 0) maxima.push(i);\n    if (lastDir \u003c 0 && dir > 0) minima.push(i);\n    lastDir = dir;\n  }\n\n  let heuristic = false;\n  let morningIdx: number | null = maxima.length ? maxima[0] : null;\n  let eveningIdx: number | null = null;\n  let dipIdx: number | null = null;\n  if (morningIdx !== null) {\n    const later = maxima.filter((m) => m > morningIdx!);\n    for (const ev of later) {\n      const between = minima.filter((m) => m > morningIdx! && m \u003c ev);\n      if (between.length) {\n        const dip = between.reduce((a, b) => (view[b].energy \u003c view[a].energy ? b : a));\n        if (view[morningIdx].energy - view[dip].energy >= 1 && view[ev].energy - view[dip].energy >= 1) {\n          if (eveningIdx === null || view[ev].energy > view[eveningIdx].energy) {\n            eveningIdx = ev;\n            dipIdx = dip;\n          }\n        }\n      }\n    }\n  }\n\n  const lowT = wake;\n  const highT = awakeEnd;\n  let morningPeak: Interval;\n  let afternoonDip: Interval;\n  let eveningPeak: Interval;\n  if (morningIdx !== null && dipIdx !== null && eveningIdx !== null) {\n    morningPeak = extremumWindow(view, morningIdx, 'max', gEnd, highT);\n    afternoonDip = extremumWindow(view, dipIdx, 'min', lowT, highT);\n    eveningPeak = extremumWindow(view, eveningIdx, 'max', lowT, highT);\n  } else {\n    heuristic = true;\n    morningPeak = around(wake + 3 * HOUR, 120);\n    afternoonDip = around(wake + 8 * HOUR, 90);\n    eveningPeak = around(Math.min(melatoninStart - 3 * HOUR, awakeEnd - 3 * HOUR), 120);\n  }\n  return { grogginessEnd: gEnd, morningPeak, afternoonDip, eveningPeak, heuristic };\n}\n\n/** Energy value at an instant (linear interpolation). */\nexport function energyAt(points: CurvePoint[], t: number): number {\n  if (points.length === 0) return 0;\n  if (t \u003c= points[0].t) return points[0].energy;\n  const last = points[points.length - 1];\n  if (t >= last.t) return last.energy;\n  const step = CURVE_STEP_MIN * MIN;\n  const i = Math.min(points.length - 2, Math.floor((t - points[0].t) / step));\n  const a = points[i];\n  const b = points[i + 1];\n  return a.energy + ((b.energy - a.energy) * (t - a.t)) / (b.t - a.t);\n}\n"},{"path":"src/engine/index.ts","content":"export * from './constants';\nexport * from './types';\nexport * from './time';\nexport * from './sleepDetection';\nexport * from './sleepNeed';\nexport * from './sleepDebt';\nexport * from './twoProcess';\nexport * from './energyCurve';\nexport * from './chronotype';\nexport * from './windows';\nexport * from './dayPlan';\nexport * from './recommendations';\n"},{"path":"src/engine/recommendations.ts","content":"import { HOUR, MIN } from './constants';\nimport type { DayPlan } from './dayPlan';\nimport { addDaysToKey, hourOfDay, stddev } from './time';\nimport type { Profile, SleepSession } from './types';\nimport { buildSleepDays } from './sleepDetection';\n\nexport interface Tip {\n  id: string;\n  title: string;\n  body: string;\n  ctaHabitKey?: string;\n  librarySlug?: string;\n}\n\nexport interface TipContext {\n  plan: DayPlan;\n  sessions: SleepSession[];\n  profile: Profile;\n  /** YYYY-MM-DD of today */\n  today: string;\n  /** tip ids shown on earlier dates */\n  history: Record\u003cstring, string[]>;\n  /** days in the last two weeks on which the caffeine habit was ticked after the cut-off */\n  caffeineLateDays?: number;\n  socialJetlagHours?: number;\n}\n\nconst TIPS: Record\u003cstring, Tip> = {\n  debt_high: {\n    id: 'debt_high',\n    title: 'Heute früher ins Bett',\n    body: 'Deine Schlafschuld ist hoch. Geh heute 30–60 Minuten früher schlafen. Ein kurzer Powernap am Nachmittag hilft zusätzlich, aber nicht zu spät.',\n    ctaHabitKey: 'bedtime',\n    librarySlug: 'was-ist-schlafschuld',\n  },\n  debt_mid: {\n    id: 'debt_mid',\n    title: 'Etwas aufholen',\n    body: 'Deine Schlafschuld ist spürbar. Schon 20–30 Minuten mehr Schlaf an mehreren Abenden bauen sie Schritt für Schritt ab.',\n    ctaHabitKey: 'bedtime',\n    librarySlug: 'was-ist-schlafschuld',\n  },\n  groggy_long: {\n    id: 'groggy_long',\n    title: 'Schneller wach werden',\n    body: 'Du bist morgens lange benommen. Geh in der ersten Stunde ans Tageslicht, trink ein Glas Wasser und beweg dich ein paar Minuten.',\n    ctaHabitKey: 'morning_light',\n    librarySlug: 'schlaftraegheit',\n  },\n  regularity: {\n    id: 'regularity',\n    title: 'Regelmäßigkeit ist dein größter Hebel',\n    body: 'Deine Schlafenszeit schwankt stark. Versuch, sie an den nächsten Tagen innerhalb von 30 Minuten zu halten.',\n    ctaHabitKey: 'bedtime',\n    librarySlug: 'wie-die-innere-uhr-funktioniert',\n  },\n  caffeine_halflife: {\n    id: 'caffeine_halflife',\n    title: 'Koffein hält länger, als man denkt',\n    body: 'Koffein braucht etwa fünf bis sechs Stunden, bis die Hälfte abgebaut ist. Der Koffein-Stopp hilft dir beim Einschlafen.',\n    ctaHabitKey: 'caffeine_cutoff',\n    librarySlug: 'koffein-und-halbwertszeit',\n  },\n  social_jetlag: {\n    id: 'social_jetlag',\n    title: 'Dein Wochenende verschiebt deine Uhr',\n    body: 'Du schläfst an freien Tagen deutlich später als an Arbeitstagen. Verschiebe deine freien Tage schrittweise, 15 Minuten alle paar Tage.',\n    librarySlug: 'social-jetlag',\n  },\n  clock_adapting: {\n    id: 'clock_adapting',\n    title: 'Deine innere Uhr stellt sich um',\n    body: 'Sie passt sich gerade an neue Zeiten an, höchstens eine Stunde pro Tag. Morgenlicht und feste Zeiten beschleunigen das.',\n    ctaHabitKey: 'morning_light',\n    librarySlug: 'schichtarbeit',\n  },\n  morning_light: {\n    id: 'morning_light',\n    title: 'Raus ans Licht',\n    body: 'Zehn bis dreißig Minuten Tageslicht am Morgen stellen deine innere Uhr und machen dich schneller wach.',\n    ctaHabitKey: 'morning_light',\n    librarySlug: 'licht-am-morgen',\n  },\n  nap: {\n    id: 'nap',\n    title: 'Der richtige Powernap',\n    body: 'Im Nachmittagstief hilft ein Nap von höchstens 20 Minuten. Stell dir einen Wecker und schlaf nicht zu spät.',\n    ctaHabitKey: 'powernap',\n    librarySlug: 'powernaps-richtig',\n  },\n  wind_down: {\n    id: 'wind_down',\n    title: 'Abends runterfahren',\n    body: 'Dimm eine Stunde vor dem Melatonin-Fenster das Licht und leg Bildschirme weg. So fällt das Einschlafen leichter.',\n    ctaHabitKey: 'wind_down',\n    librarySlug: 'einschlafen-wenns-nicht-klappt',\n  },\n};\n\nexport const ALL_TIP_IDS = Object.keys(TIPS);\n\nfunction bedtimeSpread(sessions: SleepSession[], profile: Profile, today: string): number {\n  const days = buildSleepDays(sessions, profile.timezone, profile.workSchedule.shiftMode);\n  const hours: number[] = [];\n  for (let i = 0; i \u003c 7; i++) {\n    const d = days.get(addDaysToKey(today, -i));\n    if (d?.bedAt != null) {\n      const h = hourOfDay(d.bedAt, profile.timezone);\n      hours.push(h \u003c 12 ? h + 24 : h);\n    }\n  }\n  return hours.length >= 4 ? stddev(hours) * 60 : 0;\n}\n\n/** True when the tip was shown on each of the previous two days. */\nfunction repeatedTooLong(id: string, today: string, history: Record\u003cstring, string[]>): boolean {\n  return [1, 2].every((n) => (history[addDaysToKey(today, -n)] ?? []).includes(id));\n}\n\n/** Rule-based selection of 1-3 tips (5.9). */\nexport function selectTips(ctx: TipContext): Tip[] {\n  const { plan, sessions, profile, today, history } = ctx;\n  const ordered: string[] = [];\n  const debt = plan.debt.debtMinutes;\n  if (debt > 600) ordered.push('debt_high');\n  if ((plan.features.grogginessEnd - plan.wakeAt) / MIN > 90) ordered.push('groggy_long');\n  if (plan.phase.adapting) ordered.push('clock_adapting');\n  if (bedtimeSpread(sessions, profile, today) > 90) ordered.push('regularity');\n  if ((ctx.caffeineLateDays ?? 0) >= 3) ordered.push('caffeine_halflife');\n  if ((ctx.socialJetlagHours ?? 0) > 2) ordered.push('social_jetlag');\n  if (debt >= 300 && debt \u003c= 600) ordered.push('debt_mid');\n  ordered.push('morning_light', 'nap', 'wind_down');\n\n  const picked: Tip[] = [];\n  for (const id of ordered) {\n    if (picked.length >= 3) break;\n    if (!repeatedTooLong(id, today, history)) picked.push(TIPS[id]);\n  }\n  if (picked.length === 0) picked.push(TIPS.morning_light);\n  return picked;\n}\n\nexport const hoursOf = (ms: number) => ms / HOUR;\n"},{"path":"src/engine/sleepDebt.ts","content":"import {\n  DEBT_DAYS,\n  DEBT_LOW_MAX,\n  DEBT_MAX_MISSING,\n  DEBT_MID_MAX,\n  DEBT_W_MIN,\n  NAP_WEIGHT,\n  SLEEP_ONSET_MIN,\n  SURPLUS_FACTOR,\n  MIN,\n} from './constants';\nimport { buildSleepDays } from './sleepDetection';\nimport { addDaysToKey, dateKey, median } from './time';\nimport type { DebtLevel, SleepSession } from './types';\n\nexport interface DebtNight {\n  date: string;\n  /** index 0 = most recent night */\n  index: number;\n  sleptMinutes: number;\n  /** true if the night had no data and was filled with the median */\n  estimated: boolean;\n  deltaMinutes: number;\n  weight: number;\n  contributionMinutes: number;\n}\n\nexport interface DebtResult {\n  debtMinutes: number;\n  level: DebtLevel;\n  nights: DebtNight[];\n  missingCount: number;\n  insufficientData: boolean;\n  /** only when insufficientData: plausible range in minutes */\n  range: [number, number] | null;\n}\n\nexport const weightFor = (i: number): number => 1 - i * ((1 - DEBT_W_MIN) / (DEBT_DAYS - 1));\n\nexport function debtLevel(minutes: number): DebtLevel {\n  if (minutes \u003c DEBT_LOW_MAX) return 'low';\n  if (minutes \u003c DEBT_MID_MAX) return 'medium';\n  return 'high';\n}\n\nfunction sumContributions(slept: number[], need: number): { total: number; items: { delta: number; w: number; c: number }[] } {\n  const items = slept.map((s, i) => {\n    const delta = need - s;\n    const w = weightFor(i);\n    const c = delta > 0 ? w * delta : w * delta * SURPLUS_FACTOR;\n    return { delta, w, c };\n  });\n  return { total: items.reduce((a, b) => a + b.c, 0), items };\n}\n\nexport interface DebtOptions {\n  /** wake date (YYYY-MM-DD) of the most recent night; defaults to the local date of `now` */\n  refDate?: string;\n  shiftMode?: boolean;\n}\n\n/** Weighted 14-night sleep debt (5.3). */\nexport function computeDebt(\n  sessions: SleepSession[],\n  need: number,\n  tz: string,\n  now: number,\n  opts: DebtOptions = {},\n): DebtResult {\n  const ref = opts.refDate ?? dateKey(now, tz);\n  const days = buildSleepDays(sessions, tz, opts.shiftMode ?? false);\n  const dates = Array.from({ length: DEBT_DAYS }, (_, i) => addDaysToKey(ref, -i));\n  const observed: (number | null)[] = dates.map((d) => {\n    const day = days.get(d);\n    if (!day || day.main.length === 0) return null;\n    return day.mainMinutes + NAP_WEIGHT * day.napMinutes;\n  });\n  const known = observed.filter((v): v is number => v !== null);\n  const missingCount = DEBT_DAYS - known.length;\n  const fill = known.length ? median(known) : need;\n  const slept = observed.map((v) => (v === null ? fill : v));\n  const { total, items } = sumContributions(slept, need);\n  const nights: DebtNight[] = dates.map((date, i) => ({\n    date,\n    index: i,\n    sleptMinutes: slept[i],\n    estimated: observed[i] === null,\n    deltaMinutes: items[i].delta,\n    weight: items[i].w,\n    contributionMinutes: items[i].c,\n  }));\n  const debtMinutes = Math.max(0, total);\n  const insufficientData = missingCount > DEBT_MAX_MISSING;\n  let range: [number, number] | null = null;\n  if (insufficientData && known.length > 0) {\n    const lo = Math.max(...known, need);\n    const hi = Math.min(...known);\n    const a = Math.max(0, sumContributions(observed.map((v) => (v === null ? lo : v)), need).total);\n    const b = Math.max(0, sumContributions(observed.map((v) => (v === null ? hi : v)), need).total);\n    range = [Math.min(a, b), Math.max(a, b)];\n  }\n  return { debtMinutes, level: debtLevel(debtMinutes), nights, missingCount, insufficientData, range };\n}\n\nexport interface DebtForecast {\n  /** projected debt on the morning after the simulated night */\n  debtMinutes: number;\n  reductionMinutes: number;\n}\n\n/**\n * Simulate the coming night: go to bed at `bedtime`, fall asleep after the onset delay and\n * wake at `wakeAt`. Returns projected debt the next morning.\n */\nexport function forecastDebt(\n  sessions: SleepSession[],\n  need: number,\n  tz: string,\n  now: number,\n  bedtime: number,\n  wakeAt: number,\n): DebtForecast {\n  const current = computeDebt(sessions, need, tz, now).debtMinutes;\n  const sim: SleepSession = {\n    id: 'forecast',\n    startAt: bedtime + SLEEP_ONSET_MIN * MIN,\n    endAt: wakeAt,\n    asleepMinutes: null,\n    source: 'manual',\n    confidence: 1,\n    isNap: false,\n    timezone: tz,\n    userEdited: true,\n  };\n  const refDate = dateKey(wakeAt, tz);\n  const next = computeDebt([...sessions, sim], need, tz, wakeAt, { refDate }).debtMinutes;\n  return { debtMinutes: next, reductionMinutes: current - next };\n}\n"},{"path":"src/engine/sleepDetection.ts","content":"import { HOUR, MERGE_GAP_MIN, MIN, NAP_END_HOUR, NAP_MAX_MIN, NAP_START_HOUR } from './constants';\nimport { dateKey, hourOfDay } from './time';\nimport type { SleepSession } from './types';\n\n/** Source priority (5.1): userEdited > wearable > phone estimate > manual quick entry. */\nexport function sourcePriority(s: SleepSession): number {\n  if (s.userEdited) return 4;\n  if (s.source === 'healthkit' || s.source === 'healthconnect') {\n    return /iphone|phone|handy|smartphone/i.test(s.sourceDetail ?? '') ? 2 : 3;\n  }\n  if (s.source === 'demo') return 3;\n  if (s.source === 'phone_inferred') return 2;\n  return 1;\n}\n\nconst durMin = (s: { startAt: number; endAt: number }) => (s.endAt - s.startAt) / MIN;\n\nfunction overlapMs(a: SleepSession, b: SleepSession): number {\n  return Math.max(0, Math.min(a.endAt, b.endAt) - Math.max(a.startAt, b.startAt));\n}\n\n/** Drop sessions that are mostly covered by a higher-priority source. */\nexport function dedupeBySource(sessions: SleepSession[]): SleepSession[] {\n  const valid = sessions.filter((s) => s.endAt > s.startAt);\n  return valid.filter((s) => {\n    const own = s.endAt - s.startAt;\n    return !valid.some(\n      (o) => o !== s && sourcePriority(o) > sourcePriority(s) && overlapMs(s, o) >= own * 0.5,\n    );\n  });\n}\n\nfunction unionMs(parts: SleepSession[]): number {\n  const sorted = [...parts].sort((a, b) => a.startAt - b.startAt);\n  let total = 0;\n  let curStart = sorted[0].startAt;\n  let curEnd = sorted[0].endAt;\n  for (let i = 1; i \u003c sorted.length; i++) {\n    const p = sorted[i];\n    if (p.startAt \u003c= curEnd) curEnd = Math.max(curEnd, p.endAt);\n    else {\n      total += curEnd - curStart;\n      curStart = p.startAt;\n      curEnd = p.endAt;\n    }\n  }\n  return total + (curEnd - curStart);\n}\n\nfunction combine(parts: SleepSession[]): SleepSession {\n  if (parts.length === 1) return parts[0];\n  const best = parts.reduce((a, b) => (sourcePriority(b) > sourcePriority(a) ? b : a));\n  const union = unionMs(parts) / MIN;\n  let knownAsleep = 0;\n  let knownDur = 0;\n  for (const p of parts) {\n    if (p.asleepMinutes != null) {\n      knownAsleep += p.asleepMinutes;\n      knownDur += durMin(p);\n    }\n  }\n  const ratio = knownDur > 0 ? Math.min(1, knownAsleep / knownDur) : 1;\n  return {\n    ...best,\n    id: parts[0].id,\n    startAt: Math.min(...parts.map((p) => p.startAt)),\n    endAt: Math.max(...parts.map((p) => p.endAt)),\n    asleepMinutes: Math.round(union * ratio),\n    confidence: Math.min(...parts.map((p) => p.confidence)),\n    userEdited: parts.some((p) => p.userEdited),\n    isNap: best.isNap,\n  };\n}\n\n/** Merge overlapping sessions or ones separated by at most `gapMin` minutes awake. */\nexport function mergeSessions(sessions: SleepSession[], gapMin = MERGE_GAP_MIN): SleepSession[] {\n  const sorted = [...sessions].filter((s) => s.endAt > s.startAt).sort((a, b) => a.startAt - b.startAt);\n  const groups: SleepSession[][] = [];\n  let curEnd = -Infinity;\n  for (const s of sorted) {\n    if (groups.length && s.startAt \u003c= curEnd + gapMin * MIN) {\n      groups[groups.length - 1].push(s);\n      curEnd = Math.max(curEnd, s.endAt);\n    } else {\n      groups.push([s]);\n      curEnd = s.endAt;\n    }\n  }\n  return groups.map(combine);\n}\n\n/** Nap = \u003c 3 h and starting between 09:00 and 20:00 local (shift mode: relative to main sleep). */\nexport function classifyNaps(\n  merged: SleepSession[],\n  tz: string,\n  shiftMode = false,\n): SleepSession[] {\n  const longOnes = merged.filter((s) => durMin(s) >= NAP_MAX_MIN);\n  return merged.map((s) => {\n    if (s.userEdited) return s;\n    const dur = durMin(s);\n    let nap = false;\n    if (dur \u003c NAP_MAX_MIN) {\n      if (shiftMode) {\n        const prev = [...longOnes].reverse().find((l) => l.endAt \u003c= s.startAt);\n        const next = longOnes.find((l) => l.startAt >= s.endAt);\n        const afterPrev = prev ? s.startAt - prev.endAt >= 2 * HOUR : false;\n        const beforeNext = next ? next.startAt - s.endAt >= 3 * HOUR : prev ? s.startAt - prev.endAt >= 4 * HOUR : false;\n        nap = afterPrev && beforeNext;\n      } else {\n        const h = hourOfDay(s.startAt, s.timezone || tz);\n        nap = h >= NAP_START_HOUR && h \u003c NAP_END_HOUR;\n      }\n    }\n    return { ...s, isNap: nap };\n  });\n}\n\nexport interface SleepDay {\n  /** Local date of waking, YYYY-MM-DD */\n  date: string;\n  mainMinutes: number;\n  napMinutes: number;\n  main: SleepSession[];\n  naps: SleepSession[];\n  /** earliest start of main sleep and latest end (UTC ms) */\n  bedAt: number | null;\n  wakeAt: number | null;\n}\n\nexport const asleepOf = (s: SleepSession): number =>\n  s.asleepMinutes != null ? s.asleepMinutes : durMin(s);\n\n/** Full pipeline: dedupe -> merge -> nap classification -> grouping by wake date. */\nexport function buildSleepDays(\n  raw: SleepSession[],\n  tz: string,\n  shiftMode = false,\n): Map\u003cstring, SleepDay> {\n  const merged = classifyNaps(mergeSessions(dedupeBySource(raw)), tz, shiftMode);\n  const days = new Map\u003cstring, SleepDay>();\n  for (const s of merged) {\n    const key = dateKey(s.endAt, tz);\n    let d = days.get(key);\n    if (!d) {\n      d = { date: key, mainMinutes: 0, napMinutes: 0, main: [], naps: [], bedAt: null, wakeAt: null };\n      days.set(key, d);\n    }\n    if (s.isNap) {\n      d.naps.push(s);\n      d.napMinutes += asleepOf(s);\n    } else {\n      d.main.push(s);\n      d.mainMinutes += asleepOf(s);\n      d.bedAt = d.bedAt == null ? s.startAt : Math.min(d.bedAt, s.startAt);\n      d.wakeAt = d.wakeAt == null ? s.endAt : Math.max(d.wakeAt, s.endAt);\n    }\n  }\n  return days;\n}\n\n/** All merged main-sleep and nap intervals, for sleep-pressure simulation. */\nexport function sleepIntervals(raw: SleepSession[], tz: string, shiftMode = false): SleepSession[] {\n  return classifyNaps(mergeSessions(dedupeBySource(raw)), tz, shiftMode);\n}\n"},{"path":"src/engine/sleepNeed.ts","content":"import {\n  NEED_DEFAULT_18_25,\n  NEED_DEFAULT_ADULT,\n  NEED_DEFAULT_UNDER_18,\n  NEED_LATE_WAKE_HOUR,\n  NEED_LOOKBACK_DAYS,\n  NEED_MAX,\n  NEED_MIN,\n  NEED_MIN_NIGHTS,\n  NEED_RECOVERY_MAX_DEBT_MIN,\n  NEED_RECOVERY_MIN_NIGHTS,\n  NEED_SMOOTH_NEW,\n  NEED_SMOOTH_OLD,\n} from './constants';\nimport { computeDebt } from './sleepDebt';\nimport { buildSleepDays } from './sleepDetection';\nimport { addDaysToKey, dateKey, dayOfWeekOfKey, hourOfDay, median, percentile } from './time';\nimport type { Profile, SleepSession } from './types';\n\nexport function defaultNeedMinutes(birthYear: number | null | undefined, now: number): number {\n  if (!birthYear) return NEED_DEFAULT_ADULT;\n  const age = new Date(now).getUTCFullYear() - birthYear;\n  if (age \u003c 18) return NEED_DEFAULT_UNDER_18;\n  if (age \u003c= 25) return NEED_DEFAULT_18_25;\n  return NEED_DEFAULT_ADULT;\n}\n\nexport interface SleepNeedResult {\n  minutes: number;\n  /** 'manual' | 'estimated' | 'default' */\n  basis: 'manual' | 'estimated' | 'default';\n  /** nights the estimate is based on */\n  nights: number;\n  recoveryNights: number;\n  /** raw measurement before smoothing, if any */\n  measured: number | null;\n}\n\nconst clampNeed = (m: number) => Math.min(NEED_MAX, Math.max(NEED_MIN, m));\n\n/**\n * Estimate individual sleep need (5.2). Manual override always wins; with fewer than\n * 14 nights the default applies.\n */\nexport function estimateSleepNeed(\n  sessions: SleepSession[],\n  profile: Profile,\n  now: number,\n): SleepNeedResult {\n  const tz = profile.timezone;\n  const dflt = defaultNeedMinutes(profile.birthYear, now);\n  if (profile.sleepNeedMinutesManual != null) {\n    return { minutes: clampNeed(profile.sleepNeedMinutesManual), basis: 'manual', nights: 0, recoveryNights: 0, measured: null };\n  }\n  const prev = profile.sleepNeedMinutesEstimated ?? dflt;\n  const today = dateKey(now, tz);\n  const oldest = addDaysToKey(today, -NEED_LOOKBACK_DAYS);\n  const days = [...buildSleepDays(sessions, tz, profile.workSchedule.shiftMode).values()]\n    .filter((d) => d.main.length > 0 && d.date > oldest && d.date \u003c= today)\n    .sort((a, b) => a.date.localeCompare(b.date));\n  if (days.length \u003c NEED_MIN_NIGHTS) {\n    return { minutes: clampNeed(prev), basis: 'default', nights: days.length, recoveryNights: 0, measured: null };\n  }\n\n  const ws = profile.workSchedule;\n  const recovery: number[] = [];\n  for (const d of days) {\n    // Debt before that night, using the previous need estimate and only earlier data.\n    const refNow = new Date(`${d.date}T00:00:00Z`).getTime();\n    const before = sessions.filter((s) => s.endAt \u003c (d.bedAt ?? refNow));\n    const debt = computeDebt(before, prev, tz, (d.bedAt ?? refNow), { refDate: addDaysToKey(d.date, -1) });\n    if (debt.insufficientData || debt.debtMinutes >= NEED_RECOVERY_MAX_DEBT_MIN) continue;\n    const dow = dayOfWeekOfKey(d.date);\n    const freeDay = !ws.workDays.includes(dow) && !ws.shiftMode;\n    const wakeHour = d.wakeAt != null ? hourOfDay(d.wakeAt, tz) : 0;\n    if (freeDay || wakeHour >= NEED_LATE_WAKE_HOUR + 0.5) recovery.push(d.mainMinutes);\n  }\n  const last30 = days.filter((d) => d.date > addDaysToKey(today, -30)).map((d) => d.mainMinutes);\n  const measured =\n    recovery.length >= NEED_RECOVERY_MIN_NIGHTS ? median(recovery) : percentile(last30, 0.8);\n  // The very first estimate has nothing to smooth against.\n  const smoothed =\n    profile.sleepNeedMinutesEstimated == null\n      ? clampNeed(measured)\n      : NEED_SMOOTH_OLD * prev + NEED_SMOOTH_NEW * clampNeed(measured);\n  return {\n    minutes: clampNeed(smoothed),\n    basis: 'estimated',\n    nights: days.length,\n    recoveryNights: recovery.length,\n    measured: clampNeed(measured),\n  };\n}\n"},{"path":"src/engine/time.ts","content":"import { fromZonedTime } from 'date-fns-tz';\nimport { HOUR, MIN } from './constants';\n\nconst fmtCache = new Map\u003cstring, Intl.DateTimeFormat>();\nfunction fmt(tz: string): Intl.DateTimeFormat {\n  let f = fmtCache.get(tz);\n  if (!f) {\n    f = new Intl.DateTimeFormat('en-CA', {\n      timeZone: tz,\n      hourCycle: 'h23',\n      year: 'numeric',\n      month: '2-digit',\n      day: '2-digit',\n      hour: '2-digit',\n      minute: '2-digit',\n      second: '2-digit',\n    });\n    fmtCache.set(tz, f);\n  }\n  return f;\n}\n\nexport interface LocalParts {\n  year: number;\n  month: number;\n  day: number;\n  hour: number;\n  minute: number;\n  second: number;\n}\n\nexport function localParts(ms: number, tz: string): LocalParts {\n  const out: Record\u003cstring, number> = {};\n  for (const p of fmt(tz).formatToParts(new Date(ms))) {\n    if (p.type !== 'literal') out[p.type] = parseInt(p.value, 10);\n  }\n  return out as unknown as LocalParts;\n}\n\nconst pad = (n: number, w = 2) => String(n).padStart(w, '0');\n\n/** YYYY-MM-DD in the given zone. */\nexport function dateKey(ms: number, tz: string): string {\n  const p = localParts(ms, tz);\n  return `${pad(p.year, 4)}-${pad(p.month)}-${pad(p.day)}`;\n}\n\n/** Local clock hour of day as a fraction (e.g. 7.5 = 07:30). */\nexport function hourOfDay(ms: number, tz: string): number {\n  const p = localParts(ms, tz);\n  return p.hour + p.minute / 60 + p.second / 3600;\n}\n\nexport function addDaysToKey(key: string, days: number): string {\n  const [y, m, d] = key.split('-').map(Number);\n  const dt = new Date(Date.UTC(y, m - 1, d + days));\n  return `${pad(dt.getUTCFullYear(), 4)}-${pad(dt.getUTCMonth() + 1)}-${pad(dt.getUTCDate())}`;\n}\n\nexport function dayOfWeekOfKey(key: string): number {\n  const [y, m, d] = key.split('-').map(Number);\n  return new Date(Date.UTC(y, m - 1, d)).getUTCDay();\n}\n\n/** UTC ms of a local wall-clock time (\"HH:mm\") on a local date key. */\nexport function localTimeToMs(key: string, hhmm: string, tz: string): number {\n  return fromZonedTime(`${key}T${hhmm.length === 5 ? hhmm : `0${hhmm}`}:00`, tz).getTime();\n}\n\nexport function parseHHmm(hhmm: string): number {\n  const [h, m] = hhmm.split(':').map(Number);\n  return h + (m || 0) / 60;\n}\n\nexport function formatHHmm(hours: number): string {\n  const total = Math.round((((hours % 24) + 24) % 24) * 60) % 1440;\n  return `${pad(Math.floor(total / 60))}:${pad(total % 60)}`;\n}\n\nexport function formatClock(ms: number, tz: string): string {\n  const p = localParts(ms, tz);\n  return `${pad(p.hour)}:${pad(p.minute)}`;\n}\n\nexport function formatDuration(minutes: number): string {\n  const total = Math.round(Math.abs(minutes));\n  const h = Math.floor(total / 60);\n  const m = total % 60;\n  if (h === 0) return `${m} min`;\n  if (m === 0) return `${h} h`;\n  return `${h} h ${pad(m)} min`;\n}\n\n/** UTC offset of a zone at an instant, in minutes. */\nexport function tzOffsetMin(ms: number, tz: string): number {\n  const p = localParts(ms, tz);\n  const asUtc = Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute, p.second);\n  return Math.round((asUtc - Math.floor(ms / 1000) * 1000) / MIN);\n}\n\n/** Cached local-clock helper: hour-of-day for many nearby timestamps cheaply. */\nexport function makeClock(tz: string): (ms: number) => number {\n  const cache = new Map\u003cnumber, number>();\n  return (ms: number) => {\n    const bucket = Math.floor(ms / HOUR);\n    let off = cache.get(bucket);\n    if (off === undefined) {\n      off = tzOffsetMin(bucket * HOUR + 30 * MIN, tz);\n      cache.set(bucket, off);\n    }\n    const local = ms + off * MIN;\n    const h = (((local / HOUR) % 24) + 24) % 24;\n    return h;\n  };\n}\n\n/** Wrap a minute difference into (-720, 720]. */\nexport function wrapMin(d: number): number {\n  let x = ((d % 1440) + 1440) % 1440;\n  if (x > 720) x -= 1440;\n  return x;\n}\n\nexport function median(values: number[]): number {\n  if (values.length === 0) return NaN;\n  const s = [...values].sort((a, b) => a - b);\n  const mid = Math.floor(s.length / 2);\n  return s.length % 2 ? s[mid] : (s[mid - 1] + s[mid]) / 2;\n}\n\nexport function percentile(values: number[], p: number): number {\n  if (values.length === 0) return NaN;\n  const s = [...values].sort((a, b) => a - b);\n  const idx = (s.length - 1) * p;\n  const lo = Math.floor(idx);\n  const hi = Math.ceil(idx);\n  return s[lo] + (s[hi] - s[lo]) * (idx - lo);\n}\n\nexport function mean(values: number[]): number {\n  return values.reduce((a, b) => a + b, 0) / values.length;\n}\n\nexport function stddev(values: number[]): number {\n  if (values.length \u003c 2) return 0;\n  const m = mean(values);\n  return Math.sqrt(mean(values.map((v) => (v - m) ** 2)));\n}\n\n/** Circular mean of clock hours (0..24). */\nexport function circularMeanHours(hours: number[]): number {\n  let sx = 0;\n  let sy = 0;\n  for (const h of hours) {\n    const a = (h / 24) * 2 * Math.PI;\n    sx += Math.cos(a);\n    sy += Math.sin(a);\n  }\n  const ang = Math.atan2(sy, sx);\n  return ((((ang / (2 * Math.PI)) * 24) % 24) + 24) % 24;\n}\n"},{"path":"src/engine/twoProcess.ts","content":"import {\n  ADAPT_MAX_PER_DAY_MIN,\n  C_AMPLITUDE,\n  C_GAIN,\n  C_HARMONICS,\n  DAY,\n  DEBT_DAYS,\n  DEBT_FACTOR_HOURS,\n  DEBT_MALUS,\n  HOUR,\n  I0,\n  PHI_REF_H,\n  REF_MIDSLEEP_H,\n  SEMIDIAN_AMP,\n  SEMIDIAN_DIP_AFTER_MIN_H,\n  S_START,\n  TAU_D_H,\n  TAU_I_H,\n  TAU_R_H,\n} from './constants';\nimport { buildSleepDays } from './sleepDetection';\nimport {\n  addDaysToKey,\n  circularMeanHours,\n  dateKey,\n  hourOfDay,\n  localTimeToMs,\n  tzOffsetMin,\n  wrapMin,\n} from './time';\nimport type { Profile, SleepSession } from './types';\n\nconst OMEGA = (2 * Math.PI) / 24;\n\n/** Raw process C (without gain). `offsetMin` shifts the phase later (positive = night owl). */\nexport function processC(hour: number, offsetMin = 0): number {\n  const x = PHI_REF_H + offsetMin / 60 - hour;\n  let sum = 0;\n  for (let k = 0; k \u003c C_HARMONICS.length; k++) sum += C_HARMONICS[k] * Math.sin((k + 1) * OMEGA * x);\n  return C_AMPLITUDE * sum;\n}\n\n/** Circasemidian component that produces the post-lunch dip. */\nexport function semidian(hour: number, offsetMin = 0): number {\n  const tmin = REF_MIDSLEEP_H + offsetMin / 60;\n  return -SEMIDIAN_AMP * Math.cos((2 * Math.PI * (hour - (tmin + SEMIDIAN_DIP_AFTER_MIN_H))) / 12);\n}\n\n/** Position of process C within its range, 0 = minimum, 1 = maximum. */\nexport function circadianPosition(hour: number, offsetMin = 0): number {\n  return Math.min(1, Math.max(0, (processC(hour, offsetMin) - C_RANGE.min) / (C_RANGE.max - C_RANGE.min)));\n}\n\n/** Numerical range of process C over one period. */\nexport const C_RANGE = (() => {\n  let min = Infinity;\n  let max = -Infinity;\n  for (let h = 0; h \u003c 24; h += 0.05) {\n    const c = processC(h, 0);\n    if (c \u003c min) min = c;\n    if (c > max) max = c;\n  }\n  return { min, max };\n})();\n\nexport interface SleepWindow {\n  startAt: number;\n  endAt: number;\n}\n\n/** Homeostatic sleep pressure S, simulated exactly (closed form per segment). */\nexport class PressureModel {\n  private segs: { start: number; end: number; asleep: boolean; s0: number }[] = [];\n  private lastEnd: number;\n  private lastS: number;\n\n  constructor(intervals: SleepWindow[], from: number, s0 = S_START) {\n    const sorted = intervals.filter((i) => i.endAt > from).sort((a, b) => a.startAt - b.startAt);\n    let t = from;\n    let s = s0;\n    for (const iv of sorted) {\n      const start = Math.max(iv.startAt, t);\n      const end = Math.max(iv.endAt, start);\n      if (start > t) {\n        this.segs.push({ start: t, end: start, asleep: false, s0: s });\n        s = 1 - (1 - s) * Math.exp(-(start - t) / HOUR / TAU_R_H);\n      }\n      if (end > start) {\n        this.segs.push({ start, end, asleep: true, s0: s });\n        s = s * Math.exp(-(end - start) / HOUR / TAU_D_H);\n      }\n      t = end;\n    }\n    this.lastEnd = t;\n    this.lastS = s;\n  }\n\n  at(t: number): number {\n    const segs = this.segs;\n    if (segs.length === 0 || t >= this.lastEnd) {\n      const dt = Math.max(0, t - this.lastEnd) / HOUR;\n      return 1 - (1 - this.lastS) * Math.exp(-dt / TAU_R_H);\n    }\n    if (t \u003c segs[0].start) return segs[0].s0;\n    let lo = 0;\n    let hi = segs.length - 1;\n    while (lo \u003c hi) {\n      const mid = (lo + hi + 1) >> 1;\n      if (segs[mid].start \u003c= t) lo = mid;\n      else hi = mid - 1;\n    }\n    const sg = segs[lo];\n    const dt = (t - sg.start) / HOUR;\n    return sg.asleep\n      ? sg.s0 * Math.exp(-dt / TAU_D_H)\n      : 1 - (1 - sg.s0) * Math.exp(-dt / TAU_R_H);\n  }\n}\n\nexport const debtFactor = (debtMinutes: number): number =>\n  Math.min(debtMinutes / 60 / DEBT_FACTOR_HOURS, 1);\n\n/** Sleep inertia I(t). Stronger with sleep debt and when waking near the circadian minimum. */\nexport function inertia(hoursSinceWake: number, debtMinutes: number, circLow = 0): number {\n  if (hoursSinceWake \u003c 0) return 0;\n  const i0 = I0 * (1 + 0.5 * debtFactor(debtMinutes)) * (1 + 0.5 * circLow);\n  return i0 * Math.exp(-hoursSinceWake / TAU_I_H);\n}\n\n/** Debt malus D. */\nexport const debtMalus = (debtMinutes: number): number =>\n  DEBT_MALUS * Math.min(debtMinutes / 60 / DEBT_FACTOR_HOURS, 1.5);\n\n/** E_raw(t) = gain*C + semidian - S - I - D. */\nexport function energyRaw(args: {\n  hour: number;\n  offsetMin: number;\n  s: number;\n  hoursSinceWake: number;\n  debtMinutes: number;\n  circLowAtWake: number;\n}): number {\n  const { hour, offsetMin, s, hoursSinceWake, debtMinutes, circLowAtWake } = args;\n  return (\n    C_GAIN * processC(hour, offsetMin) +\n    semidian(hour, offsetMin) -\n    s -\n    inertia(hoursSinceWake, debtMinutes, circLowAtWake) -\n    debtMalus(debtMinutes)\n  );\n}\n\nexport interface PhaseResult {\n  /** effective phase offset in minutes relative to the 04:00 reference */\n  offsetMin: number;\n  targetMin: number;\n  /** days until the internal clock has caught up (0 = adapted) */\n  adaptDaysLeft: number;\n  adapting: boolean;\n}\n\nconst moveToward = (cur: number, target: number, maxStep: number) => {\n  const d = wrapMin(target - cur);\n  return Math.abs(d) \u003c= maxStep ? target : cur + Math.sign(d) * maxStep;\n};\n\n/**\n * Effective circadian phase (5.7). In shift mode the clock follows the actual main sleep of the\n * last 1-3 days; after a time-zone change it shifts toward the new local time. Either way it\n * moves at most 1 h per day.\n */\nexport function computeCircadianOffset(\n  sessions: SleepSession[],\n  profile: Profile,\n  now: number,\n): PhaseResult {\n  const tz = profile.timezone;\n  const base = profile.circadianPhaseOffsetMin;\n  const shift = profile.workSchedule.shiftMode;\n  const today = dateKey(now, tz);\n  const days = buildSleepDays(sessions, tz, shift);\n  const dates = Array.from({ length: DEBT_DAYS }, (_, i) => addDaysToKey(today, -(DEBT_DAYS - 1 - i)));\n\n  interface Info { mid: number | null; tz: string }\n  let lastTz: string | null = null;\n  const infos: Info[] = dates.map((d) => {\n    const day = days.get(d);\n    if (day && day.bedAt != null && day.wakeAt != null) {\n      const stz = day.main[0].timezone || tz;\n      lastTz = stz;\n      return { mid: hourOfDay((day.bedAt + day.wakeAt) / 2, stz), tz: stz };\n    }\n    return { mid: null, tz: lastTz ?? tz };\n  });\n  // Days after the last recorded night run in the device zone.\n  let lastData = -1;\n  infos.forEach((v, i) => { if (v.mid !== null) lastData = i; });\n  for (let i = lastData + 1; i \u003c infos.length; i++) infos[i].tz = tz;\n  // Leading days without data take the zone of the first known day.\n  const firstData = infos.findIndex((v) => v.mid !== null);\n  if (firstData > 0) for (let i = 0; i \u003c firstData; i++) infos[i].tz = infos[firstData].tz;\n\n  const targetAt = (i: number): number => {\n    if (!shift) return base;\n    const mids: number[] = [];\n    for (let k = Math.max(0, i - 2); k \u003c= i; k++) if (infos[k].mid !== null) mids.push(infos[k].mid as number);\n    if (mids.length === 0) return NaN;\n    return wrapMin((circularMeanHours(mids) - REF_MIDSLEEP_H) * 60);\n  };\n\n  let target = shift ? NaN : base;\n  let offset = base;\n  if (shift) {\n    for (let i = 0; i \u003c infos.length && Number.isNaN(target); i++) target = targetAt(i);\n    offset = Number.isNaN(target) ? base : target;\n    if (Number.isNaN(target)) target = base;\n  }\n  for (let i = 0; i \u003c infos.length; i++) {\n    if (i > 0 && infos[i].tz !== infos[i - 1].tz) {\n      const inst = localTimeToMs(dates[i], '12:00', infos[i].tz);\n      const delta = tzOffsetMin(inst, infos[i].tz) - tzOffsetMin(inst, infos[i - 1].tz);\n      offset = wrapMin(offset + delta);\n    }\n    const t = targetAt(i);\n    if (!Number.isNaN(t)) target = t;\n    offset = moveToward(offset, target, ADAPT_MAX_PER_DAY_MIN);\n  }\n  const remaining = Math.abs(wrapMin(target - offset));\n  const adaptDaysLeft = Math.max(0, Math.ceil(remaining / ADAPT_MAX_PER_DAY_MIN - 1e-9));\n  return { offsetMin: offset, targetMin: target, adaptDaysLeft, adapting: adaptDaysLeft > 0 };\n}\n\n/** Convenience for tests and the curve: day boundaries. */\nexport const startOfWindow = (now: number): number => now - DEBT_DAYS * DAY;\n"},{"path":"src/engine/types.ts","content":"export type SleepSource = 'healthkit' | 'healthconnect' | 'manual' | 'phone_inferred' | 'demo';\nexport type Chronotype = 'early' | 'intermediate' | 'late';\n\nexport interface SleepSession {\n  id: string;\n  /** UTC ms */\n  startAt: number;\n  endAt: number;\n  /** Minutes actually asleep, if known. */\n  asleepMinutes?: number | null;\n  source: SleepSource;\n  sourceDetail?: string | null;\n  confidence: number;\n  isNap: boolean;\n  timezone: string;\n  userEdited: boolean;\n}\n\nexport interface WorkSchedule {\n  /** 0 = Sunday … 6 = Saturday */\n  workDays: number[];\n  /** \"HH:mm\" */\n  workStart: string;\n  workEnd: string;\n  shiftMode: boolean;\n}\n\nexport interface Profile {\n  name?: string | null;\n  birthYear?: number | null;\n  sleepNeedMinutesManual?: number | null;\n  sleepNeedMinutesEstimated?: number | null;\n  chronotype: Chronotype;\n  chronotypeScore: number;\n  circadianPhaseOffsetMin: number;\n  /** \"HH:mm\" */\n  targetWakeTime?: string | null;\n  workSchedule: WorkSchedule;\n  caffeineCutoffHours: number;\n  timezone: string;\n}\n\nexport type DebtLevel = 'low' | 'medium' | 'high';\n\nexport interface Interval {\n  start: number;\n  end: number;\n}\n\nexport type WindowKind =\n  | 'grogginess'\n  | 'morning_light'\n  | 'morning_peak'\n  | 'caffeine_stop'\n  | 'afternoon_dip'\n  | 'nap'\n  | 'evening_peak'\n  | 'sport'\n  | 'last_meal'\n  | 'dim_light'\n  | 'wind_down'\n  | 'melatonin'\n  | 'bedtime';\n\nexport interface DayWindow extends Interval {\n  kind: WindowKind;\n  /** point-in-time events have start === end */\n  point: boolean;\n}\n\nexport interface CurvePoint {\n  t: number;\n  /** 0..100 */\n  energy: number;\n}\n\nexport interface CurveFeatures {\n  grogginessEnd: number;\n  morningPeak: Interval;\n  afternoonDip: Interval;\n  eveningPeak: Interval;\n  /** true when features came from heuristics instead of curve extrema */\n  heuristic: boolean;\n}\n"},{"path":"src/engine/windows.ts","content":"import {\n  BEDTIME_EARLY_LIMIT_MIN,\n  DEBT_PAYBACK_FRACTION,\n  DEBT_PAYBACK_MAX_MIN,\n  DIM_LIGHT_BEFORE_MELATONIN_MIN,\n  HABITUAL_ONSET_REF_H,\n  HOUR,\n  LAST_MEAL_BEFORE_BED_H,\n  MELATONIN_LENGTH_MIN,\n  MIN,\n  MORNING_LIGHT_MIN,\n  NAP_LATEST_BEFORE_BED_H,\n  NAP_LONG_MIN,\n  NAP_SHORT_MIN,\n  SLEEP_ONSET_MIN,\n  SPORT_BEFORE_WIND_DOWN_H,\n  SPORT_LENGTH_MIN,\n  WIND_DOWN_BEFORE_MELATONIN_MIN,\n} from './constants';\nimport { addDaysToKey, dateKey, formatHHmm, localTimeToMs, parseHHmm } from './time';\nimport type { CurveFeatures, DayWindow, Interval, Profile } from './types';\n\n/** First instant strictly after `after` whose local clock reads `hour` (fractional hours). */\nexport function nextClockTime(after: number, hour: number, tz: string): number {\n  const key = dateKey(after, tz);\n  for (let i = -1; i \u003c= 2; i++) {\n    const ms = localTimeToMs(addDaysToKey(key, i), formatHHmm(hour), tz);\n    if (ms > after) return ms;\n  }\n  return after + 24 * HOUR;\n}\n\nexport interface MelatoninWindow extends Interval {\n  dlmo: number;\n}\n\n/** Melatonin window starts ~2 h after DLMO, DLMO ≈ habitual onset - 2 h (5.8). */\nexport function melatoninWindow(wakeAt: number, offsetMin: number, tz: string): MelatoninWindow {\n  const startClock = HABITUAL_ONSET_REF_H + offsetMin / 60;\n  const start = nextClockTime(wakeAt + 6 * HOUR, startClock, tz);\n  return { start, end: start + MELATONIN_LENGTH_MIN * MIN, dlmo: start - 2 * HOUR };\n}\n\nexport interface BedtimeResult {\n  bedtime: number;\n  /** projected wake-up time */\n  wakeAt: number;\n  hint: 'too_early' | null;\n  debtPaybackMinutes: number;\n}\n\n/** Recommended bedtime (5.8). */\nexport function recommendBedtime(args: {\n  wakeAt: number;\n  profile: Profile;\n  needMinutes: number;\n  debtMinutes: number;\n  melatonin: MelatoninWindow;\n}): BedtimeResult {\n  const { wakeAt, profile, needMinutes, debtMinutes, melatonin } = args;\n  const tz = profile.timezone;\n  const payback = Math.min(DEBT_PAYBACK_MAX_MIN, debtMinutes * DEBT_PAYBACK_FRACTION);\n  let bedtime: number;\n  let hint: BedtimeResult['hint'] = null;\n  let wake: number;\n  if (profile.targetWakeTime) {\n    wake = nextClockTime(wakeAt + 8 * HOUR, parseHHmm(profile.targetWakeTime), tz);\n    bedtime = wake - (needMinutes + payback + SLEEP_ONSET_MIN) * MIN;\n    const floor = melatonin.start - BEDTIME_EARLY_LIMIT_MIN * MIN;\n    if (bedtime \u003c floor) {\n      bedtime = floor;\n      hint = 'too_early';\n    }\n  } else {\n    bedtime = melatonin.start + ((melatonin.end - melatonin.start) / 2);\n    wake = bedtime + (needMinutes + payback + SLEEP_ONSET_MIN) * MIN;\n  }\n  // wake follows the bedtime actually chosen\n  const projectedWake = hint ? bedtime + (needMinutes + payback + SLEEP_ONSET_MIN) * MIN : wake;\n  return { bedtime, wakeAt: projectedWake, hint, debtPaybackMinutes: payback };\n}\n\nexport interface WindowsInput {\n  wakeAt: number;\n  features: CurveFeatures;\n  bedtime: number;\n  melatonin: MelatoninWindow;\n  caffeineCutoffHours: number;\n  debtMinutes: number;\n}\n\nconst win = (kind: DayWindow['kind'], start: number, end: number, point = false): DayWindow => ({\n  kind,\n  start,\n  end,\n  point,\n});\n\n/** All day windows for the timeline, sorted by start (5.8). */\nexport function buildWindows(input: WindowsInput): DayWindow[] {\n  const { wakeAt, features, bedtime, melatonin, caffeineCutoffHours } = input;\n  const windDownStart = melatonin.start - WIND_DOWN_BEFORE_MELATONIN_MIN * MIN;\n  const out: DayWindow[] = [];\n\n  out.push(win('grogginess', wakeAt, features.grogginessEnd));\n  out.push(win('morning_light', wakeAt, wakeAt + MORNING_LIGHT_MIN * MIN));\n  out.push(win('morning_peak', features.morningPeak.start, features.morningPeak.end));\n\n  const caffeine = bedtime - caffeineCutoffHours * HOUR;\n  out.push(win('caffeine_stop', caffeine, caffeine, true));\n\n  out.push(win('afternoon_dip', features.afternoonDip.start, features.afternoonDip.end));\n  // Nap inside the dip, but not later than 7 h before bedtime.\n  const dipMid = (features.afternoonDip.start + features.afternoonDip.end) / 2;\n  const latestNapStart = bedtime - NAP_LATEST_BEFORE_BED_H * HOUR;\n  const napStart = Math.min(dipMid - (NAP_SHORT_MIN * MIN) / 2, latestNapStart);\n  if (napStart > wakeAt + 3 * HOUR) out.push(win('nap', napStart, napStart + NAP_SHORT_MIN * MIN));\n\n  out.push(win('evening_peak', features.eveningPeak.start, features.eveningPeak.end));\n\n  // Sport: preferably in the evening peak, finished 2 h before wind-down at the latest.\n  const sportLatestEnd = windDownStart - SPORT_BEFORE_WIND_DOWN_H * HOUR;\n  const sportEnd = Math.min(features.eveningPeak.end, sportLatestEnd);\n  const sportStart = Math.max(features.afternoonDip.end, sportEnd - SPORT_LENGTH_MIN * MIN);\n  if (sportEnd - sportStart >= 30 * MIN) out.push(win('sport', sportStart, sportEnd));\n\n  const lastMeal = bedtime - LAST_MEAL_BEFORE_BED_H * HOUR;\n  out.push(win('last_meal', lastMeal, lastMeal, true));\n  const dim = melatonin.start - DIM_LIGHT_BEFORE_MELATONIN_MIN * MIN;\n  out.push(win('dim_light', dim, dim, true));\n  out.push(win('wind_down', windDownStart, melatonin.start));\n  out.push(win('melatonin', melatonin.start, melatonin.end));\n  out.push(win('bedtime', bedtime, bedtime, true));\n\n  return out.sort((a, b) => a.start - b.start || a.end - b.end);\n}\n\n/** Nap suggestion text helper: long nap only makes sense with a lot of debt. */\nexport function napLengthMinutes(debtMinutes: number): number {\n  return debtMinutes > 600 ? NAP_LONG_MIN : NAP_SHORT_MIN;\n}\n\n"},{"path":"src/i18n/de.ts","content":"export const de = {\n  app: { name: 'Tagwerk', tagline: 'Schlafschuld runter, Energie rauf.' },\n  tabs: { today: 'Heute', sleep: 'Schlaf', schedule: 'Tagesplan', habits: 'Gewohnheiten', more: 'Mehr' },\n  common: {\n    save: 'Speichern',\n    cancel: 'Abbrechen',\n    delete: 'Löschen',\n    edit: 'Bearbeiten',\n    next: 'Weiter',\n    back: 'Zurück',\n    done: 'Fertig',\n    close: 'Schließen',\n    yes: 'Ja',\n    no: 'Nein',\n    hours: 'h',\n    minutes: 'min',\n    loading: 'Lädt …',\n    version: 'Version',\n  },\n  disclaimer:\n    'Die Werte in Tagwerk sind Schätzungen auf Basis wissenschaftlicher Modelle. Sie ersetzen keine Diagnose. Wenn du anhaltend schlecht schläfst oder tagsüber extrem müde bist, spri l back to German. */\nexport const en = {\n  app: { name: 'Tagwerk', tagline: 'Less sleep debt, more energy.' },\n  tabs: { today: 'Today', sleep: 'Sleep', schedule: 'Plan', habits: 'Habits', more: 'More' },\n  common: {\n    save: 'Save',\n    cancel: 'Cancel',\n    delete: 'Delete',\n    edit: 'Edit',\n    next: 'Next',\n    back: 'Back',\n    done: 'Done',\n    close: 'Close',\n    yes: 'Yes',\n    no: 'No',\n    hours: 'h',\n    minutes: 'min',\n    loading: 'Loading …',\n    version: 'Version',\n  },\n  disclaimer:\n    'Values in Tagwerk are estimates based on scientific models. They are not a diagnosis. If you sleep badly for a long time or feel extremely tired during the day, please see a doctor.',\n  privacy:\n    'All health data stays on your device. Tagwerk has no account, no server and no analytics or tracking. You can export your data at any time.',\n  today: {\n    goodMorning: 'Good morning',\n    goodDay: 'Good day',\n    goodEvening: 'Good evening',\n    goodNight: 'Good night',\n    energyNow: 'Energy now',\n    debtTitle: 'Sleep debt',\n    debtNoData: 'Not enough data',\n    next: 'Next event',\n    tips: 'Tips of the day',\n    lastNight: 'Last night',\n    noNights: 'No nights yet. Connect Health or add your last night.',\n    addNight: 'Add night',\n  },\n  debt: {\n    low: 'You are well rested.',\n    medium: 'Noticeable. Catch up a little over the next nights.',\n    high: 'Your energy is clearly suffering.',\n  },\n  windows: {\n    grogginess: 'Grogginess',\n    morning_light: 'Morning light',\n    morning_peak: 'Morning peak',\n    caffeine_stop: 'Caffeine stop',\n    afternoon_dip: 'Afternoon dip',\n    nap: 'Power nap',\n    evening_peak: 'Evening peak',\n    sport: 'Workout window',\n    last_meal: 'Last big meal',\n    dim_light: 'Dim the lights',\n    wind_down: 'Wind down',\n    melatonin: 'Melatonin window',\n    bedtime: 'Ideal bedtime',\n  },\n};\n"},{"path":"src/i18n/index.ts","content":"import { de } from './de';\nimport { en
