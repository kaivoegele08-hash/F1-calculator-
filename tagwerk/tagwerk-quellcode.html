lendar';\nimport { useApp } from '@/state/app';\nimport { AppText, Card, Notice, Row, Screen } from '@/ui/components/primitives';\nimport { useTheme } from '@/ui/theme';\n\nexport default function CalendarSettings() {\n  const { colors } = useTheme();\n  const optIn = useApp((s) => s.settings.calendarOptIn);\n  const setSetting = useApp((s) => s.setSetting);\n  const toggle = async (v: boolean) => {\n    if (v && Platform.OS !== 'web') {\n      const ok = await requestCalendarAccess();\n      if (!ok) return;\n    }\n    await setSetting('calendarOptIn', v);\n  };\n  return (\n    \u003c>\n      \u003cStack.Screen options={{ title: t('settings.calendar') }} />\n      \u003cScreen>\n        {Platform.OS === 'web' && \u003cNotice>Kalenderzugriff gibt es nur in der App.\u003c/Notice>}\n        \u003cCard style={{ paddingVertical: 4 }}>\n          \u003cRow\n            title=\"Termine im Tagesplan anzeigen\"\n            subtitle=\"Wir warnen, wenn ein Termin in dein Nachmittagstief fällt. Termine bleiben auf dem Gerät.\"\n            right={\u003cSwitch accessibilityLabel=\"Kalender verwenden\" value={optIn} onValueChange={toggle} trackColor={{ true: colors.accent, false: colors.surface2 }} />}\n            last\n          />\n        \u003c/Card>\n        \u003cAppText variant=\"caption\" muted>\n          Über den Tagesplan kannst du deine Energiefenster in einen eigenen Kalender „Tagwerk“ eintragen.\n        \u003c/AppText>\n      \u003c/Screen>\n    \u003c/>\n  );\n}\n"},{"path":"app/settings/chronotype.tsx","content":"import { Stack, useRouter } from 'expo-router';\nimport React, { useState } from 'react';\nimport { chronotypeFromAnswers, type ChronotypeAnswers } from '@/engine/chronotype';\nimport { t } from '@/i18n';\nimport { useApp } from '@/state/app';\nimport { AppText, Button, Card, Screen } from '@/ui/components/primitives';\nimport { ChronotypeForm, DEFAULT_ANSWERS } from '@/ui/forms';\n\nexport default function ChronotypeSettings() {\n  const router = useRouter();\n  const profile = useApp((s) => s.profile);\n  const saveProfile = useApp((s) => s.saveProfile);\n  const [answers, setAnswers] = useState\u003cChronotypeAnswers>({ ...DEFAULT_ANSWERS, workDaysPerWeek: profile?.workSchedule.workDays.length ?? 5 });\n  const res = chronotypeFromAnswers(answers);\n  return (\n    \u003c>\n      \u003cStack.Screen options={{ title: t('settings.chronotype') }} />\n      \u003cScreen>\n        \u003cChronotypeForm value={answers} onChange={setAnswers} />\n        \u003cCard>\n          \u003cAppText variant=\"h3\">{t(`sleep.${res.chronotype}`)}\u003c/AppText>\n          \u003cAppText variant=\"caption\" muted>\n            {t('sleep.socialJetlag')}: {res.socialJetlagHours.toFixed(1)} h\n          \u003c/AppText>\n        \u003c/Card>\n        \u003cButton\n          label={t('common.save')}\n          onPress={async () => {\n            await saveProfile({ chronotype: res.chronotype, chronotypeScore: res.score, circadianPhaseOffsetMin: res.offsetMin, chronotypeUpdatedAt: Date.now() });\n            router.back();\n          }}\n        />\n      \u003c/Screen>\n    \u003c/>\n  );\n}\n"},{"path":"app/settings/data.tsx","content":"import { Stack, useRouter } from 'expo-router';\nimport React, { useState } from 'react';\nimport { Alert, Platform, View } from 'react-native';\nimport { DEMO_SCENARIOS, type DemoScenarioId } from '@/data/demo/generator';\nimport { parseBundle, previewImport } from '@/data/exchange';\nimport { dataStore, useApp } from '@/state/app';\nimport { pickJson, shareJson } from '@/integrations/files';\nimport { t } from '@/i18n';\nimport { AppText, Button, Card, Chip, Notice, Screen, SectionTitle } from '@/ui/components/primitives';\nimport { spacing } from '@/ui/theme';\nimport { dateKey } from '@/engine/time';\n\nfunction confirm(title: string, message: string): Promise\u003cboolean> {\n  if (Platform.OS === 'web') {\n    return Promise.resolve(typeof window !== 'undefined' && window.confirm(`${title}\\n\\n${message}`));\n  }\n  return new Promise((resolve) =>\n    Alert.alert(title, message, [\n      { text: t('common.cancel'), style: 'cancel', onPress: () => resolve(false) },\n      { text: t('common.delete'), style: 'destructive', onPress: () => resolve(true) },\n    ]),\n  );\n}\n\nexport default function DataSettings() {\n  const router = useRouter();\n  const importBundle = useApp((s) => s.importBundle);\n  const wipeAll = useApp((s) => s.wipeAll);\n  const loadDemo = useApp((s) => s.loadDemo);\n  const syncNow = useApp((s) => s.syncNow);\n  const scenario = useApp((s) => s.settings.demoScenario);\n  const lastSync = useApp((s) => s.settings.lastSync);\n  const tz = useApp((s) => s.profile?.timezone ?? 'Europe/Berlin');\n  const [message, setMessage] = useState\u003cstring | null>(null);\n  const [pending, setPending] = useState\u003c{ bundle: ReturnType\u003ctypeof parseBundle> & { ok: true }; text: string } | null>(null);\n\n  const doExport = async () => {\n    const bundle = await dataStore.exportAll();\n    const res = await shareJson(`tagwerk-${dateKey(Date.now(), tz)}.json`, JSON.stringify(bundle, null, 2));\n    setMessage(res === 'unavailable' ? 'Teilen ist auf diesem Gerät nicht verfügbar.' : t('settings.exportDone'));\n  };\n\n  const startImport = async () => {\n    setMessage(null);\n    const text = await pickJson();\n    if (text == null) return;\n    const parsed = parseBundle(text);\n    if (!parsed.ok) return setMessage(parsed.error);\n    const preview = previewImport(parsed.bundle, await dataStore.listSessions());\n    setPending({ bundle: parsed as ReturnType\u003ctypeof parseBundle> & { ok: true }, text: t('settings.importPreview', { n: preview.nightsFound, d: preview.duplicatesSkipped }) });\n  };\n\n  const applyImport = async () => {\n    if (!pending) return;\n    await importBundle(pending.bundle);\n    setPending(null);\n    setMessage(t('settings.importDone'));\n  };\n\n  const deleteAll = async () => {\n    if (!(await confirm(t('settings.deleteConfirm1'), ''))) return;\n    if (!(await confirm(t('settings.deleteConfirm1'), t('settings.deleteConfirm2')))) return;\n    await wipeAll();\n    router.replace('/onboarding');\n  };\n\n  const sync = async () => {\n    const r = await syncNow();\n    setMessage(r.status === 'ok' ? t('settings.syncDone', { n: r.imported }) : r.status === 'denied' ? 'Kein Zugriff auf Gesundheitsdaten.' : 'Keine Datenquelle verfügbar.');\n  };\n\n  return (\n    \u003c>\n      \u003cStack.Screen options={{ title: t('settings.data') }} />\n      \u003cScreen>\n        {message && \u003cNotice>{message}\u003c/Notice>}\n        \u003cSectionTitle>{t('settings.sources')}\u003c/SectionTitle>\n        \u003cCard style={{ gap: spacing(3) }}>\n          \u003cAppText variant=\"caption\" muted>\n            {Platform.OS === 'web' ? 'Browser: Demo-Daten' : Platform.OS === 'ios' ? 'Apple Health' : 'Health Connect'}\n            {lastSync ? ` · zuletzt ${new Date(lastSync).toLocaleString('de-DE')}` : ''}\n          \u003c/AppText>\n          \u003cButton label={t('settings.sync')} variant=\"secondary\" onPress={sync} />\n        \u003c/Card>\n        \u003cSectionTitle>{t('settings.demo')}\u003c/SectionTitle>\n        \u003cCard style={{ gap: spacing(3) }}>\n          \u003cAppText variant=\"caption\" muted>Lade realistische Beispieldaten, um die App auszuprobieren. Echte Nächte bleiben erhalten.\u003c/AppText>\n          \u003cView style={{ flexDirection: 'row', flexWrap: 'wrap', gap: spacing(2) }}>\n            {DEMO_SCENARIOS.map((s) => (\n              \u003cChip key={s.id} label={s.label} active={scenario === s.id} onPress={() => loadDemo(s.id as DemoScenarioId)} />\n            ))}\n          \u003c/View>\n        \u003c/Card>\n        \u003cSectionTitle>{t('settings.data')}\u003c/SectionTitle>\n        \u003cButton label={t('settings.export')} variant=\"secondary\" onPress={doExport} />\n        \u003cButton label={t('settings.import')} variant=\"secondary\" onPress={startImport} />\n        {pending && (\n          \u003cCard style={{ gap: spacing(3) }}>\n            \u003cAppText variant=\"h3\">{pending.text}\u003c/AppText>\n            \u003cView style={{ flexDirection: 'row', gap: spacing(2) }}>\n              \u003cButton style={{ flex: 1 }} label=\"Importieren\" onPress={applyImport} />\n              \u003cButton style={{ flex: 1 }} label={t('common.cancel')} variant=\"secondary\" onPress={() => setPending(null)} />\n            \u003c/View>\n          \u003c/Card>\n        )}\n        \u003cButton label={t('settings.deleteAll')} variant=\"danger\" onPress={deleteAll} />\n      \u003c/Screen>\n    \u003c/>\n  );\n}\n"},{"path":"app/settings/index.tsx","content":"import { Stack, useRouter } from 'expo-router';\nimport React from 'react';\nimport { ENGINE_VERSION } from '@/engine/constants';\nimport { t } from '@/i18n';\nimport { useApp } from '@/state/app';\nimport { AppText, Card, Row, Screen, Segmented, SectionTitle } from '@/ui/components/primitives';\nimport type { ThemePref } from '@/ui/theme';\nimport type { Lang } from '@/i18n';\n\nexport default function SettingsIndex() {\n  const router = useRouter();\n  const settings = useApp((s) => s.settings);\n  const setSetting = useApp((s) => s.setSetting);\n  return (\n    \u003c>\n      \u003cStack.Screen options={{ headerShown: true, title: t('settings.title') }} />\n      \u003cScreen>\n        \u003cCard style={{ paddingVertical: 4 }}>\n          \u003cRow title={t('settings.profile')} onPress={() => router.push('/settings/profile')} />\n          \u003cRow title={t('settings.sleepNeed')} onPress={() => router.push('/settings/sleep-need')} />\n          \u003cRow title={t('settings.chronotype')} onPress={() => router.push('/settings/chronotype')} />\n          \u003cRow title={t('settings.schedule')} onPress={() => router.push('/settings/schedule')} />\n          \u003cRow title={t('settings.notifications')} onPress={() => router.push('/settings/notifications')} />\n          \u003cRow title=\"Sanfter Wecker\" onPress={() => router.push('/settings/alarm')} />\n          \u003cRow title={t('settings.calendar')} onPress={() => router.push('/settings/calendar')} />\n          \u003cRow title={t('settings.data')} subtitle={`${t('settings.sources')}, Export, Import, Demo`} onPress={() => router.push('/settings/data')} />\n          \u003cRow title={t('settings.about')} onPress={() => router.push('/settings/about')} last />\n        \u003c/Card>\n        \u003cSectionTitle>{t('settings.appearance')}\u003c/SectionTitle>\n        \u003cSegmented\u003cThemePref>\n          value={settings.theme}\n          onChange={(v) => setSetting('theme', v)}\n          options={[\n            { value: 'system', label: t('settings.themeSystem') },\n            { value: 'dark', label: t('settings.themeDark') },\n            { value: 'light', label: t('settings.themeLight') },\n          ]}\n        />\n        \u003cSectionTitle>{t('settings.language')}\u003c/SectionTitle>\n        \u003cSegmented\u003cLang>\n          value={settings.lang}\n          onChange={(v) => setSetting('lang', v)}\n          options={[\n            { value: 'de', label: 'Deutsch' },\n            { value: 'en', label: 'English' },\n          ]}\n        />\n        \u003cAppText variant=\"caption\" muted style={{ textAlign: 'center' }}>\n          {t('common.version')} 1.0.0 · Engine {ENGINE_VERSION}\n        \u003c/AppText>\n      \u003c/Screen>\n    \u003c/>\n  );\n}\n"},{"path":"app/settings/notifications.tsx","content":"import { Stack } from 'expo-router';\nimport React, { useEffect, useMemo, useState } from 'react';\nimport { Platform, Switch } from 'react-native';\nimport { HABITS } from '@/content/habits';\nimport { formatClock } from '@/engine/time';\nimport { t } from '@/i18n';\nimport { planReminders } from '@/services/notificationPlan';\nimport { listScheduled, requestNotificationPermission, scheduleReminders } from '@/services/notifications';\nimport { useApp } from '@/state/app';\nimport { useNow } from '@/state/hooks';\nimport { AppText, Button, Card, Notice, Row, Screen, SectionTitle } from '@/ui/components/primitives';\nimport { useTheme } from '@/ui/theme';\n\nexport default function NotificationSettings() {\n  const { colors } = useTheme();\n  const profile = useApp((s) => s.profile);\n  const sessions = useApp((s) => s.sessions);\n  const habits = useApp((s) => s.habits);\n  const saveHabit = useApp((s) => s.saveHabit);\n  const morningCheck = useApp((s) => s.settings.morningCheck);\n  const setSetting = useApp((s) => s.setSetting);\n  const [granted, setGranted] = useState\u003cboolean | null>(null);\n  const [scheduled, setScheduled] = useState\u003cnumber | null>(null);\n  const [nativeList, setNativeList] = useState\u003c{ id: string; title: string; at: number | null }[]>([]);\n  const tz = profile?.timezone ?? 'Europe/Berlin';\n  const now = useNow(300_000);\n\n  const planned = useMemo(\n    () => (profile ? planReminders({ profile, sessions, habits, now, morningCheck }) : []),\n    [profile, sessions, habits, morningCheck, now],\n  );\n\n  useEffect(() => {\n    listScheduled().then(setNativeList);\n  }, [scheduled]);\n\n  const enable = async () => {\n    const ok = await requestNotificationPermission();\n    setGranted(ok);\n    if (ok) setScheduled(await scheduleReminders(planned));\n  };\n\n  return (\n    \u003c>\n      \u003cStack.Screen options={{ title: t('settings.notifications') }} />\n      \u003cScreen>\n        {Platform.OS === 'web' && \u003cNotice>Im Browser werden keine Erinnerungen versendet. Die geplanten Zeiten siehst du unten.\u003c/Notice>}\n        {granted === false && \u003cNotice tone=\"warn\">Benachrichtigungen sind nicht erlaubt. Du kannst das in den System-Einstellungen ändern.\u003c/Notice>}\n        \u003cButton label=\"Benachrichtigungen erlauben und planen\" onPress={enable} />\n        {scheduled != null && \u003cAppText muted>{scheduled} Erinnerungen geplant.\u003c/AppText>}\n        \u003cCard style={{ paddingVertical: 4 }}>\n          {HABITS.map((meta, i) => {\n            const h = habits.find((x) => x.key === meta.key);\n            if (!h) return null;\n            return (\n              \u003cRow\n                key={meta.key}\n                title={meta.title}\n                right={\n                  \u003cSwitch\n                    accessibilityLabel={`${meta.title} Erinnerung`}\n                    value={h.enabled && h.reminderEnabled}\n                    onValueChange={(v) => saveHabit({ ...h, enabled: h.enabled || v, reminderEnabled: v })}\n                    trackColor={{ true: colors.accent, false: colors.surface2 }}\n                  />\n                }\n                last={i === HABITS.length - 1}\n              />\n            );\n          })}\n        \u003c/Card>\n        \u003cCard style={{ paddingVertical: 4 }}>\n          \u003cRow\n            title=\"Morgendliche Schnellabfrage\"\n            subtitle=\"Eine halbe Stunde nach dem Aufwachen: Wann bist du eingeschlafen?\"\n            right={\u003cSwitch accessibilityLabel=\"Morgendliche Schnellabfrage\" value={morningCheck} onValueChange={(v) => setSetting('morningCheck', v)} trackColor={{ true: colors.accent, false: colors.surface2 }} />}\n            last\n          />\n        \u003c/Card>\n        \u003cSectionTitle>{t('settings.debugReminders')}\u003c/SectionTitle>\n        \u003cCard style={{ gap: 6 }}>\n          {planned.length === 0 ? (\n            \u003cAppText muted>{t('settings.noReminders')}\u003c/AppText>\n          ) : (\n            planned.map((r) => (\n              \u003cAppText key={r.id} variant=\"caption\">\n                {r.date} {formatClock(r.at, tz)} · {r.title}\n              \u003c/AppText>\n            ))\n          )}\n        \u003c/Card>\n        {nativeList.length > 0 && (\n          \u003c>\n            \u003cAppText variant=\"caption\" muted>Im System eingetragen: {nativeList.length}\u003c/AppText>\n          \u003c/>\n        )}\n      \u003c/Screen>\n    \u003c/>\n  );\n}\n"},{"path":"app/settings/profile.tsx","content":"import { Stack, useRouter } from 'expo-router';\nimport React, { useState } from 'react';\nimport { View } from 'react-native';\nimport { t } from '@/i18n';\nimport { useApp } from '@/state/app';\nimport { AppText, Button, Card, Chip, Screen } from '@/ui/components/primitives';\nimport { CAFFEINE_OPTIONS, TargetWakeForm, TextField } from '@/ui/forms';\nimport { spacing } from '@/ui/theme';\n\nexport default function ProfileSettings() {\n  const router = useRouter();\n  const profile = useApp((s) => s.profile);\n  const saveProfile = useApp((s) => s.saveProfile);\n  const [name, setName] = useState(profile?.name ?? '');\n  const [year, setYear] = useState(profile?.birthYear ? String(profile.birthYear) : '');\n  const [wake, setWake] = useState\u003cstring | null>(profile?.targetWakeTime ?? null);\n  const [cutoff, setCutoff] = useState(profile?.caffeineCutoffHours ?? 8);\n  const [noCaffeine, setNoCaffeine] = useState(false);\n  const y = parseInt(year, 10);\n  const yearOk = year === '' || (y >= 1900 && y \u003c= new Date().getFullYear());\n  return (\n    \u003c>\n      \u003cStack.Screen options={{ title: t('settings.profile') }} />\n      \u003cScreen>\n        \u003cCard style={{ gap: spacing(4) }}>\n          \u003cTextField label={t('onboarding.name')} value={name} onChangeText={setName} maxLength={30} />\n          \u003cTextField label={t('onboarding.birthYear')} value={year} onChangeText={(v) => setYear(v.replace(/\\D/g, ''))} keyboardType=\"number-pad\" maxLength={4} />\n        \u003c/Card>\n        \u003cTargetWakeForm value={wake} onChange={setWake} />\n        \u003cCard style={{ gap: spacing(3) }}>\n          \u003cAppText variant=\"h3\">{t('settings.caffeine')}\u003c/AppText>\n          \u003cView style={{ flexDirection: 'row', gap: spacing(2), flexWrap: 'wrap' }}>\n            {CAFFEINE_OPTIONS.map((h) => (\n              \u003cChip key={h} label={`${h} h`} active={!noCaffeine && cutoff === h} onPress={() => { setNoCaffeine(false); setCutoff(h); }} />\n            ))}\n          \u003c/View>\n        \u003c/Card>\n        \u003cButton\n          label={t('common.save')}\n          disabled={!yearOk}\n          onPress={async () => {\n            await saveProfile({ name: name.trim() || null, birthYear: year ? y : null, targetWakeTime: wake, caffeineCutoffHours: cutoff });\n            router.back();\n          }}\n        />\n      \u003c/Screen>\n    \u003c/>\n  );\n}\n"},{"path":"app/settings/schedule.tsx","content":"import { Stack, useRouter } from 'expo-router';\nimport React, { useState } from 'react';\nimport { t } from '@/i18n';\nimport { useApp } from '@/state/app';\nimport { Button, Screen } from '@/ui/components/primitives';\nimport { WorkForm } from '@/ui/forms';\n\nexport default function ScheduleSettings() {\n  const router = useRouter();\n  const profile = useApp((s) => s.profile);\n  const saveProfile = useApp((s) => s.saveProfile);\n  const [work, setWork] = useState(profile?.workSchedule ?? { workDays: [1, 2, 3, 4, 5], workStart: '09:00', workEnd: '17:00', shiftMode: false });\n  return (\n    \u003c>\n      \u003cStack.Screen options={{ title: t('settings.schedule') }} />\n      \u003cScreen>\n        \u003cWorkForm value={work} onChange={setWork} />\n        \u003cButton label={t('common.save')} onPress={async () => { await saveProfile({ workSchedule: work }); router.back(); }} />\n      \u003c/Screen>\n    \u003c/>\n  );\n}\n"},{"path":"app/settings/sleep-need.tsx","content":"import { Stack, useRouter } from 'expo-router';\nimport React, { useMemo, useState } from 'react';\nimport { View } from 'react-native';\nimport { estimateSleepNeed } from '@/engine/sleepNeed';\nimport { formatDuration } from '@/engine/time';\nimport { t } from '@/i18n';\nimport { useApp } from '@/state/app';\nimport { useNow } from '@/state/hooks';\nimport { AppText, Button, Card, Screen } from '@/ui/components/primitives';\nimport { spacing } from '@/ui/theme';\n\nexport default function SleepNeedSettings() {\n  const router = useRouter();\n  const profile = useApp((s) => s.profile);\n  const sessions = useApp((s) => s.sessions);\n  const saveProfile = useApp((s) => s.saveProfile);\n  const now = useNow(300_000);\n  const info = useMemo(() => (profile ? estimateSleepNeed(sessions, profile, now) : null), [profile, sessions, now]);\n  const [minutes, setMinutes] = useState(profile?.sleepNeedMinutesManual ?? Math.round(info?.minutes ?? 480));\n  if (!profile || !info) return \u003cScreen>\u003cAppText>{t('common.loading')}\u003c/AppText>\u003c/Screen>;\n  const step = (d: number) => setMinutes((m) => Math.min(630, Math.max(360, m + d)));\n  return (\n    \u003c>\n      \u003cStack.Screen options={{ title: t('settings.sleepNeed') }} />\n      \u003cScreen>\n        \u003cCard>\n          \u003cAppText variant=\"caption\" muted>\n            Aktuell {info.basis === 'manual' ? '(manuell)' : info.basis === 'estimated' ? '(geschätzt)' : '(Richtwert)'}\n          \u003c/AppText>\n          \u003cAppText variant=\"number\">{formatDuration(info.minutes)}\u003c/AppText>\n          {info.nights > 0 && \u003cAppText variant=\"caption\" muted>{t('sleep.needBasedOn', { n: info.nights })}\u003c/AppText>}\n        \u003c/Card>\n        \u003cCard style={{ alignItems: 'center', gap: spacing(3) }}>\n          \u003cAppText variant=\"h3\">{t('sleep.needSetManual')}\u003c/AppText>\n          \u003cView style={{ flexDirection: 'row', alignItems: 'center', gap: spacing(4) }}>\n            \u003cButton label=\"−\" variant=\"secondary\" onPress={() => step(-15)} style={{ minWidth: 56 }} />\n            \u003cAppText variant=\"number\" style={{ minWidth: 150, textAlign: 'center' }}>{formatDuration(minutes)}\u003c/AppText>\n            \u003cButton label=\"+\" variant=\"secondary\" onPress={() => step(15)} style={{ minWidth: 56 }} />\n          \u003c/View>\n          \u003cAppText variant=\"caption\" muted>Zwischen 6 h und 10 h 30 min\u003c/AppText>\n        \u003c/Card>\n        \u003cButton label={t('common.save')} onPress={async () => { await saveProfile({ sleepNeedMinutesManual: minutes }); router.back(); }} />\n        {profile.sleepNeedMinutesManual != null && (\n          \u003cButton label={t('sleep.needReset')} variant=\"secondary\" onPress={async () => { await saveProfile({ sleepNeedMinutesManual: null }); router.back(); }} />\n        )}\n      \u003c/Screen>\n    \u003c/>\n  );\n}\n"},{"path":"app/tools/breathing.tsx","content":"import { Stack } from 'expo-router';\nimport React, { useEffect, useState } from 'react';\nimport { View } from 'react-native';\nimport { useReducedMotion } from 'react-native-reanimated';\nimport { breathState, BREATH } from '@/lib/noise';\nimport { t } from '@/i18n';\nimport { AppText, Button, Card, Screen } from '@/ui/components/primitives';\nimport { useTheme } from '@/ui/theme';\n\nconst LABEL = { inhale: 'Einatmen', hold: 'Halten', exhale: 'Ausatmen' } as const;\nconst SIZE = 240;\n\nexport default function BreathingScreen() {\n  const { colors } = useTheme();\n  const reduce = useReducedMotion();\n  const [running, setRunning] = useState(false);\n  const [elapsed, setElapsed] = useState(0);\n\n  useEffect(() => {\n    if (!running) return;\n    const start = Date.now();\n    const id = setInterval(() => setElapsed(Date.now() - start), 100);\n    return () => clearInterval(id);\n  }, [running]);\n\n  const st = breathState(running ? elapsed : 0);\n  const scale = running && !reduce ? st.scale : 0.75;\n  return (\n    \u003c>\n      \u003cStack.Screen options={{ title: t('more.breathing') }} />\n      \u003cScreen>\n        \u003cCard style={{ alignItems: 'center', gap: 16 }}>\n          \u003cAppText muted style={{ textAlign: 'center' }}>\n            Atme {BREATH.inhale} Sekunden ein, halte {BREATH.hold} Sekunden und atme {BREATH.exhale} Sekunden aus.\n          \u003c/AppText>\n          \u003cView style={{ height: SIZE + 20, width: SIZE + 20, alignItems: 'center', justifyContent: 'center' }}>\n            \u003cView\n              accessible\n              accessibilityLabel={running ? `${LABEL[st.phase]}, noch ${Math.ceil(st.remaining)} Sekunden` : 'Atemübung bereit'}\n              style={{\n                width: SIZE,\n                height: SIZE,\n                borderRadius: SIZE / 2,\n                backgroundColor: colors.accent2,\n                opacity: 0.35 + 0.5 * scale,\n                transform: [{ scale }],\n              }}\n            />\n            \u003cView style={{ position: 'absolute', alignItems: 'center' }}>\n              \u003cAppText variant=\"h2\">{running ? LABEL[st.phase] : 'Bereit'}\u003c/AppText>\n              {running && \u003cAppText variant=\"number\">{Math.ceil(st.remaining)}\u003c/AppText>}\n            \u003c/View>\n          \u003c/View>\n          {running && \u003cAppText variant=\"caption\" muted>Runde {st.cycle + 1}\u003c/AppText>}\n        \u003c/Card>\n        \u003cButton\n          label={running ? 'Stopp' : 'Start'}\n          onPress={() => {\n            setElapsed(0);\n            setRunning((r) => !r);\n          }}\n        />\n      \u003c/Screen>\n    \u003c/>\n  );\n}\n"},{"path":"app/tools/cant-sleep.tsx","content":"import { Stack, useRouter } from 'expo-router';\nimport React from 'react';\nimport { t } from '@/i18n';\nimport { AppText, Button, Card, Screen } from '@/ui/components/primitives';\n\nconst STEPS = [\n  ['Nicht auf die Uhr schauen', 'Das erhöht nur den Druck. Dreh den Wecker weg.'],\n  ['Atmen', 'Probier die Atemübung 4-7-8 für ein paar Runden.'],\n  ['Gedanken ablegen', 'Schreib kreisende Gedanken oder To-dos auf einen Zettel. Was aufgeschrieben ist, musst du nicht mehr merken.'],\n  ['Nach etwa 20 Minuten aufstehen', 'Setz dich bei schwachem Licht hin und mach etwas Ruhiges, zum Beispiel lesen. Geh zurück ins Bett, wenn du müde wirst.'],\n  ['Kein Alkohol, kein Handy', 'Beides hält dich wacher, auch wenn es sich kurz anders anfühlt.'],\n  ['Morgen gelassen bleiben', 'Eine schlechte Nacht ist kein Drama. Steh zur gewohnten Zeit auf, geh ans Licht und schlaf am Abend wieder normal.'],\n] as const;\n\nexport default function CantSleep() {\n  const router = useRouter();\n  return (\n    \u003c>\n      \u003cStack.Screen options={{ title: t('more.cantSleep') }} />\n      \u003cScreen>\n        \u003cAppText muted>Kein Stress, das passiert jedem. Das hilft jetzt:\u003c/AppText>\n        {STEPS.map(([title, text], i) => (\n          \u003cCard key={title}>\n            \u003cAppText variant=\"h3\">{i + 1}. {title}\u003c/AppText>\n            \u003cAppText variant=\"caption\" muted style={{ marginTop: 4 }}>{text}\u003c/AppText>\n          \u003c/Card>\n        ))}\n        \u003cButton label={t('more.breathing')} onPress={() => router.push('/tools/breathing')} />\n        \u003cButton label={t('more.sounds')} variant=\"secondary\" onPress={() => router.push('/tools/sounds')} />\n        \u003cAppText variant=\"caption\" muted>{t('disclaimer')}\u003c/AppText>\n      \u003c/Screen>\n    \u003c/>\n  );\n}\n"},{"path":"app/tools/sounds.tsx","content":"import { Stack } from 'expo-router';\nimport type { AudioPlayer } from 'expo-audio';\nimport React, { useCallback, useEffect, useRef, useState } from 'react';\nimport { View } from 'react-native';\nimport { fadeVolume, NOISE_LABELS, type NoiseKind } from '@/lib/noise';\nimport { startSound } from '@/services/sounds';\nimport { t } from '@/i18n';\nimport { AppText, Button, Card, Chip, Notice, Screen } from '@/ui/components/primitives';\nimport { spacing } from '@/ui/theme';\n\nconst KINDS = Object.keys(NOISE_LABELS) as NoiseKind[];\nconst TIMERS = [15, 30, 60];\n\nexport default function SoundsScreen() {\n  const [kind, setKind] = useState\u003cNoiseKind>('rain');\n  const [minutes, setMinutes] = useState(30);\n  const [playing, setPlaying] = useState(false);\n  const [left, setLeft] = useState(0);\n  const [error, setError] = useState(false);\n  const player = useRef\u003cAudioPlayer | null>(null);\n  const timer = useRef\u003cReturnType\u003ctypeof setInterval> | null>(null);\n\n  const stop = useCallback(() => {\n    if (timer.current) clearInterval(timer.current);\n    timer.current = null;\n    try {\n      player.current?.pause();\n      player.current?.remove();\n    } catch {\n      /* already released */\n    }\n    player.current = null;\n    setPlaying(false);\n    setLeft(0);\n  }, []);\n\n  useEffect(() => stop, [stop]);\n\n  const start = async () => {\n    stop();\n    setError(false);\n    try {\n      const p = await startSound(kind);\n      player.current = p;\n      setPlaying(true);\n      const endAt = Date.now() + minutes * 60_000;\n      timer.current = setInterval(() => {\n        const rem = (endAt - Date.now()) / 1000;\n        setLeft(Math.max(0, Math.round(rem)));\n        if (player.current) player.current.volume = fadeVolume(rem);\n        if (rem \u003c= 0) stop();\n      }, 1000);\n    } catch {\n      setError(true);\n      stop();\n    }\n  };\n\n  return (\n    \u003c>\n      \u003cStack.Screen options={{ title: t('more.sounds') }} />\n      \u003cScreen>\n        \u003cCard>\n          \u003cAppText variant=\"h3\">Geräusch\u003c/AppText>\n          \u003cView style={{ flexDirection: 'row', flexWrap: 'wrap', gap: spacing(2), marginTop: spacing(2) }}>\n            {KINDS.map((k) => (\n              \u003cChip key={k} label={NOISE_LABELS[k]} active={kind === k} onPress={() => setKind(k)} />\n            ))}\n          \u003c/View>\n        \u003c/Card>\n        \u003cCard>\n          \u003cAppText variant=\"h3\">Timer\u003c/AppText>\n          \u003cView style={{ flexDirection: 'row', gap: spacing(2), marginTop: spacing(2) }}>\n            {TIMERS.map((m) => (\n              \u003cChip key={m} label={`${m} min`} active={minutes === m} onPress={() => setMinutes(m)} />\n            ))}\n          \u003c/View>\n          \u003cAppText variant=\"caption\" muted style={{ marginTop: spacing(2) }}>\n            Die Lautstärke blendet in den letzten 20 Sekunden aus.\n          \u003c/AppText>\n        \u003c/Card>\n        {playing ? (\n          \u003c>\n            \u003cAppText variant=\"number\" style={{ textAlign: 'center' }}>\n              {String(Math.floor(left / 60)).padStart(2, '0')}:{String(left % 60).padStart(2, '0')}\n            \u003c/AppText>\n            \u003cButton label=\"Stopp\" variant=\"secondary\" onPress={stop} />\n          \u003c/>\n        ) : (\n          \u003cButton label=\"Abspielen\" onPress={start} />\n        )}\n        {error && \u003cNotice tone=\"warn\">Das Geräusch konnte nicht abgespielt werden.\u003c/Notice>}\n        \u003cAppText variant=\"caption\" muted>\n          Die Geräusche werden auf deinem Gerät erzeugt, es wird nichts geladen.\n        \u003c/AppText>\n      \u003c/Screen>\n    \u003c/>\n  );\n}\n"},{"path":"assets/src/foreground.svg","content":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"1024\" height=\"1024\" viewBox=\"0 0 1024 1024\">\n  \u003cdefs>\n    \u003clinearGradient id=\"wave\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"0\">\n      \u003cstop offset=\"0\" stop-color=\"#7C8CFF\"/>\n      \u003cstop offset=\"1\" stop-color=\"#FFB547\"/>\n    \u003c/linearGradient>\n  \u003c/defs>\n  \u003ccircle cx=\"512\" cy=\"450\" r=\"120\" fill=\"#FFB547\"/>\n  \u003cpath d=\"M250 600 C 340 510, 420 510, 512 600 S 684 690, 774 600\" fill=\"none\" stroke=\"url(#wave)\" stroke-width=\"36\" stroke-linecap=\"round\"/>\n  \u003cpath d=\"M290 700 C 370 640, 440 640, 512 700 S 654 760, 734 700\" fill=\"none\" stroke=\"url(#wave)\" stroke-width=\"22\" stroke-linecap=\"round\" opacity=\"0.55\"/>\n\u003c/svg>\n"},{"path":"assets/src/icon.svg","content":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"1024\" height=\"1024\" viewBox=\"0 0 1024 1024\">\n  \u003cdefs>\n    \u003clinearGradient id=\"sky\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n      \u003cstop offset=\"0\" stop-color=\"#0B0E1A\"/>\n      \u003cstop offset=\"1\" stop-color=\"#1C2340\"/>\n    \u003c/linearGradient>\n    \u003clinearGradient id=\"wave\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"0\">\n      \u003cstop offset=\"0\" stop-color=\"#7C8CFF\"/>\n      \u003cstop offset=\"1\" stop-color=\"#FFB547\"/>\n    \u003c/linearGradient>\n  \u003c/defs>\n  \u003crect width=\"1024\" height=\"1024\" fill=\"url(#sky)\"/>\n  \u003ccircle cx=\"512\" cy=\"470\" r=\"150\" fill=\"#FFB547\" opacity=\"0.95\"/>\n  \u003crect x=\"0\" y=\"560\" width=\"1024\" height=\"464\" fill=\"#0B0E1A\"/>\n  \u003cpath d=\"M120 640 C 260 500, 380 500, 512 640 S 764 780, 904 640\" fill=\"none\" stroke=\"url(#wave)\" stroke-width=\"44\" stroke-linecap=\"round\"/>\n  \u003cpath d=\"M170 780 C 290 690, 400 690, 512 780 S 734 870, 854 780\" fill=\"none\" stroke=\"url(#wave)\" stroke-width=\"26\" stroke-linecap=\"round\" opacity=\"0.55\"/>\n\u003c/svg>\n"},{"path":"assets/src/mono.svg","content":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"1024\" height=\"1024\" viewBox=\"0 0 1024 1024\">\n  \u003ccircle cx=\"512\" cy=\"450\" r=\"120\" fill=\"#000\"/>\n  \u003cpath d=\"M250 600 C 340 510, 420 510, 512 600 S 684 690, 774 600\" fill=\"none\" stroke=\"#000\" stroke-width=\"36\" stroke-linecap=\"round\"/>\n  \u003cpath d=\"M290 700 C 370 640, 440 640, 512 700 S 654 760, 734 700\" fill=\"none\" stroke=\"#000\" stroke-width=\"22\" stroke-linecap=\"round\"/>\n\u003c/svg>\n"},{"path":"assets/src/render.js","content":"const { chromium } = require('playwright');\nconst fs = require('fs');\nconst path = require('path');\n(async () => {\n  const dir = __dirname;\n  const out = path.join(dir, '..');\n  const jobs = [\n    ['icon.svg', 'icon.png', 1024, false],\n    ['foreground.svg', 'android-icon-foreground.png', 1024, true],\n    ['mono.svg', 'android-icon-monochrome.png', 1024, true],\n    ['foreground.svg', 'splash-icon.png', 512, true],\n    ['icon.svg', 'favicon.png', 64, false],\n  ];\n  const browser = await chromium.launch();\n  for (const [src, dest, size, transparent] of jobs) {\n    const page = await browser.newPage({ viewport: { width: size, height: size } });\n    const svg = fs.readFileSync(path.join(dir, src), 'utf8');\n    await page.setContent(`\u003chtml>\u003cbody style=\"margin:0;background:transparent\">${svg.replace(/width=\"1024\" height=\"1024\"/, `width=\"${size}\" height=\"${size}\"`)}\u003c/body>\u003c/html>`);\n    await page.screenshot({ path: path.join(out, dest), omitBackground: transparent });\n    await page.close();\n  }\n  // solid background layer for adaptive icons\n  const page = await browser.newPage({ viewport: { width: 1024, height: 1024 } });\n  await page.setContent('\u003chtml>\u003cbody style=\"margin:0;background:#0B0E1A\">\u003c/body>\u003c/html>');\n  await page.screenshot({ path: path.join(out, 'android-icon-background.png') });\n  await browser.close();\n})();\n"},{"path":"eslint.config.js","content":"const expoConfig = require('eslint-config-expo/flat');\nmodule.exports = [\n  ...expoConfig,\n  { ignores: ['node_modules/*', '.expo/*', 'dist/*', 'coverage/*', 'assets/src/*'] },\n  { files: ['jest.setup.js'], languageOptions: { globals: { jest: 'readonly' } } },\n];\n"},{"path":"jest.setup.js","content":"// Reanimated needs native modules. Components only use a small API surface, so tests use a light mock.\njest.mock('react-native-reanimated', () => {\n  const RN = require('react-native');\n  const easing = (f) => f;\n  return {\n    __esModule: true,\n    default: { createAnimatedComponent: (c) => c, View: RN.View, Text: RN.Text },\n    useSharedValue: (v) => ({ value: v }),\n    useAnimatedProps: (fn) => fn(),\n    useReducedMotion: () => false,\n    withTiming: (v) => v,\n    withSpring: (v) => v,\n    withRepeat: (v) => v,\n    Easing: { out: easing, cubic: (x) => x, quad: (x) => x },\n  };\n});\n"},{"path":"package.json","content":"{\n  \"name\": \"tagwerk\",\n  \"version\": \"1.0.0\",\n  \"main\": \"expo-router/entry\",\n  \"dependencies\": {\n    \"@expo-google-fonts/manrope\": \"^0.4.3\",\n    \"@expo/metro-runtime\": \"~58.0.17\",\n    \"d3-scale\": \"^4.0.3\",\n    \"d3-shape\": \"^3.2.1\",\n    \"date-fns\": \"^4.4.0\",\n    \"date-fns-tz\": \"^3.2.0\",\n    \"drizzle-orm\": \"^0.45.4\",\n    \"expo\": \"~58.0.26\",\n    \"expo-audio\": \"~58.0.12\",\n    \"expo-background-task\": \"~58.0.13\",\n    \"expo-build-properties\": \"^58.0.12\",\n    \"expo-calendar\": \"~58.0.8\",\n    \"expo-constants\": \"~58.0.16\",\n    \"expo-dev-client\": \"~58.0.21\",\n    \"expo-file-system\": \"~58.0.14\",\n    \"expo-font\": \"~58.0.12\",\n    \"expo-haptics\": \"~58.0.8\",\n    \"expo-linking\": \"~58.0.17\",\n    \"expo-notifications\": \"~58.1.9\",\n    \"expo-router\": \"~58.0.32\",\n    \"expo-sharing\": \"~58.0.23\",\n    \"expo-sqlite\": \"~58.0.18\",\n    \"expo-status-bar\": \"~58.0.5\",\n    \"expo-system-ui\": \"~58.0.7\",\n    \"expo-task-manager\": \"~58.0.14\",\n    \"lucide-react-native\": \"^1.77.0\",\n    \"react\": \"19.3.0\",\n    \"react-dom\": \"19.3.0\",\n    \"react-native\": \"0.88.1\",\n    \"react-native-gesture-handler\": \"~3.3.0\",\n    \"react-native-health\": \"^1.19.0\",\n    \"react-native-health-connect\": \"^4.1.3\",\n    \"react-native-reanimated\": \"4.7.1\",\n    \"react-native-safe-area-context\": \"~5.11.1\",\n    \"react-native-screens\": \"~4.30.1\",\n    \"react-native-svg\": \"15.16.0\",\n    \"react-native-web\": \"~0.21.4\",\n    \"react-native-worklets\": \"0.13.0\",\n    \"zod\": \"^4.6.7\",\n    \"zustand\": \"^5.1.0\"\n  },\n  \"devDependencies\": {\n    \"@react-native/jest-preset\": \"^0.88.1\",\n    \"@testing-library/react-native\": \"^14.1.0\",\n    \"@types/better-sqlite3\": \"^9.6.0\",\n    \"@types/d3-scale\": \"^4.0.9\",\n    \"@types/d3-shape\": \"^3.2.0\",\n    \"@types/jest\": \"^30.0.0\",\n    \"@types/react\": \"~19.3.0\",\n    \"@types/react-test-renderer\": \"^19.3.1\",\n    \"better-sqlite3\": \"^13.2.0\",\n    \"drizzle-kit\": \"^0.31.11\",\n    \"eslint\": \"^9.39.5\",\n    \"eslint-config-expo\": \"^58.0.4\",\n    \"jest\": \"^30.5.2\",\n    \"jest-expo\": \"^58.0.15\",\n    \"prettier\": \"^3.10.1\",\n    \"react-test-renderer\": \"^19.3.0\",\n    \"typescript\": \"~6.0.3\"\n  },\n  \"scripts\": {\n    \"start\": \"expo start\",\n    \"android\": \"expo run:android\",\n    \"ios\": \"expo run:ios\",\n    \"web\": \"expo start --web\",\n    \"lint\": \"eslint . --max-warnings=0\",\n    \"typecheck\": \"tsc --noEmit\",\n    \"test\": \"tsc --noEmit && jest\",\n    \"test:engine\": \"jest src/engine --coverage\",\n    \"format\": \"prettier --write .\"\n  },\n  \"private\": true,\n  \"jest\": {\n    \"preset\": \"jest-expo\",\n    \"testPathIgnorePatterns\": [\n      \"/node_modules/\"\n    ],\n    \"collectCoverageFrom\": [\n      \"src/engine/**/*.ts\",\n      \"!src/engine/__tests__/**\"\n    ],\n    \"coverageThreshold\": {\n      \"./src/engine/\": {\n        \"lines\": 90\n      }\n    },\n    \"testMatch\": [\n      \"**/__tests__/**/*.test.ts\",\n      \"**/__tests__/**/*.test.tsx\"\n    ],\n    \"setupFiles\": [\n      \"\u003crootDir>/jest.setup.js\"\n    ],\n    \"transformIgnorePatterns\": [\n      \"/node_modules/(?!(.pnpm|react-native|@react-native|@react-native-community|expo|@expo|@expo-google-fonts|react-navigation|@react-navigation|d3-.*|internmap|lucide-react-native))\"\n    ],\n    \"moduleNameMapper\": {\n      \"^(d3-[a-z-]+)$\": \"\u003crootDir>/node_modules/$1/dist/$1.min.js\",\n      \"^internmap$\": \"\u003crootDir>/node_modules/internmap/dist/internmap.min.js\",\n      \"^@/(.*)$\": \"\u003crootDir>/src/$1\",\n      \"^lucide-react-native$\": \"\u003crootDir>/node_modules/lucide-react-native/dist/cjs/lucide-react-native.js\"\n    }\n  }\n}\n"},{"path":"src/content/habits.ts","content":"import type { Habit, HabitKey } from '@/data/types';\nimport type { WindowKind } from '@/engine/types';\n\nexport interface HabitMeta {\n  key: HabitKey;\n  title: string;\n  short: string;\n  /** which window the reminder is anchored to */\n  anchor: WindowKind | 'wake' | 'bedtime_minus_alcohol';\n  /** default reminder offset in minutes relative to the anchor */\n  defaultOffsetMin: number;\n  defaultEnabled: boolean;\n  defaultReminder: boolean;\n  notification: { title: string; body: string };\n  why: string;\n  librarySlug?: string;\n}\n\nexport const HABITS: HabitMeta[] = [\n  {\n    key: 'morning_light',\n    title: 'Morgenlicht',\n    short: '10–30 Minuten ins Tageslicht',\n    anchor: 'wake',\n    defaultOffsetMin: 20,\n    defaultEnabled: true,\n    defaultReminder: true,\n    notification: {\n      title: '☀️ Raus ans Licht',\n      body: '10 Minuten Tageslicht machen dich schneller wach.',\n    },\n    why: 'Helles Licht am Morgen sagt deiner inneren Uhr: Der Tag beginnt. Du wirst schneller klar im Kopf und abends zur richtigen Zeit müde. Auch ein bewölkter Himmel ist draußen deutlich heller als jede Lampe drinnen.',\n    librarySlug: 'licht-am-morgen',\n  },\n  {\n    key: 'caffeine_cutoff',\n    title: 'Koffein-Stopp',\n    short: 'Letzter Kaffee für heute',\n    anchor: 'caffeine_stop',\n    defaultOffsetMin: -30,\n    defaultEnabled: true,\n    defaultReminder: true,\n    notification: {\n      title: '☕ Letzter Kaffee für heute',\n      body: 'Danach schläfst du besser ein.',\n    },\n    why: 'Koffein braucht fünf bis sechs Stunden, bis die Hälfte abgebaut ist. Ein später Kaffee blockiert den Schlafdruck noch am Abend, auch wenn du dich müde fühlst.',\n    librarySlug: 'koffein-und-halbwertszeit',\n  },\n  {\n    key: 'no_alcohol',\n    title: 'Kein Alkohol vor dem Schlafen',\n    short: '3 Stunden vor dem Schlafen nichts mehr trinken',\n    anchor: 'last_meal',\n    defaultOffsetMin: 0,\n    defaultEnabled: false,\n    defaultReminder: false,\n    notification: { title: '🍷 Letzter Drink', body: 'Alkohol kurz vor dem Schlafen macht die zweite Nachthälfte unruhig.' },\n    why: 'Alkohol macht schneller müde, stört aber den Schlaf in der zweiten Nachthälfte. Du wachst häufiger auf und erholst dich weniger. Drei Stunden Abstand reichen oft schon.',\n    librarySlug: 'alkohol-und-schlaf',\n  },\n  {\n    key: 'last_meal',\n    title: 'Letzte große Mahlzeit',\n    short: '3 Stunden vor der Schlafenszeit',\n    anchor: 'last_meal',\n    defaultOffsetMin: 0,\n    defaultEnabled: false,\n    defaultReminder: false,\n    notification: { title: '🍽️ Letzte große Mahlzeit', body: 'Danach nur noch leichte Snacks.' },\n    why: 'Ein voller Magen hält deinen Körper beim Verdauen auf Trab und stört das Einschlafen. Plan die letzte große Mahlzeit etwa drei Stunden vor dem Schlafen.',\n  },\n  {\n    key: 'dim_light',\n    title: 'Licht dimmen',\n    short: 'Weniger Licht, Bildschirme weglegen',\n    anchor: 'dim_light',\n    defaultOffsetMin: 0,\n    defaultEnabled: false,\n    defaultReminder: false,\n    notification: { title: '💡 Licht dimmen', body: 'Warmes, schwaches Licht hilft Melatonin beim Steigen.' },\n    why: 'Helles, kaltes Licht am Abend verschiebt dein Melatonin nach hinten. Gedimmtes, warmes Licht lässt deine innere Uhr rechtzeitig auf Nacht umschalten.',\n  },\n  {\n    key: 'wind_down',\n    title: 'Wind-down-Routine',\n    short: 'Eine Stunde vor dem Melatonin-Fenster runterfahren',\n    anchor: 'wind_down',\n    defaultOffsetMin: 0,\n    defaultEnabled: true,\n    defaultReminder: true,\n    notification: {\n      title: '🌙 Zeit runterzufahren',\n      body: 'Dein Melatonin-Fenster öffnet sich in einer Stunde.',\n    },\n    why: 'Eine feste, ruhige Routine vor dem Schlafen senkt deine Anspannung. Lesen, Dehnen oder die Atemübung zeigen deinem Körper: Gleich ist Schlafenszeit.',\n    librarySlug: 'einschlafen-wenns-nicht-klappt',\n  },\n  {\n    key: 'bedtime',\n    title: 'Schlafenszeit',\n    short: 'Zur empfohlenen Zeit ins Bett',\n    anchor: 'bedtime',\n    defaultOffsetMin: -10,\n    defaultEnabled: true,\n    defaultReminder: true,\n    notification: { title: '🛏️ Zeit fürs Bett', body: 'Jetzt geht Schlafschuld am schnellsten runter.' },\n    why: 'Regelmäßige Schlafenszeiten sind der größte Hebel für guten Schlaf. Deine innere Uhr lernt, zur gleichen Zeit müde zu werden.',\n    librarySlug: 'was-ist-schlafschuld',\n  },\n  {\n    key: 'bedroom_check',\n    title: 'Schlafzimmer kühl & dunkel',\n    short: 'Abend-Check fürs Schlafzimmer',\n    anchor: 'wind_down',\n    defaultOffsetMin: 15,\n    defaultEnabled: false,\n    defaultReminder: false,\n    notification: { title: '🌡️ Schlafzimmer-Check', body: 'Kühl lüften, abdunkeln, Handy außer Reichweite.' },\n    why: 'Dein Körper braucht zum Einschlafen eine sinkende Körpertemperatur. Etwa 16–19 Grad und Dunkelheit helfen dabei und verhindern frühes Aufwachen.',\n  },\n  {\n    key: 'powernap',\n    title: 'Powernap',\n    short: 'Höchstens 20 Minuten im Nachmittagstief',\n    anchor: 'nap',\n    defaultOffsetMin: 0,\n    defaultEnabled: false,\n    defaultReminder: false,\n    notification: { title: '😴 Powernap-Zeit', body: 'Höchstens 20 Minuten, mit Wecker.' },\n    why: 'Ein kurzer Nap im Nachmittagstief bringt Energie zurück, ohne den Nachtschlaf zu stören. Bleib unter 20 Minuten, sonst wachst du benommen auf.',\n    librarySlug: 'powernaps-richtig',\n  },\n];\n\nexport const HABIT_BY_KEY: Record\u003cHabitKey, HabitMeta> = Object.fromEntries(\n  HABITS.map((h) => [h.key, h]),\n) as Record\u003cHabitKey, HabitMeta>;\n\nexport function defaultHabits(): Habit[] {\n  return HABITS.map((h) => ({\n    key: h.key,\n    enabled: h.defaultEnabled,\n    reminderEnabled: h.defaultReminder,\n    reminderOffsetMin: h.defaultOffsetMin,\n  }));\n}\n"},{"path":"src/content/library.ts","content":"export interface Article {\n  slug: string;\n  title: string;\n  teaser: string;\n  minutes: number;\n  /** Markdown-light: paragraphs separated by blank lines, \"## \" headings, \"- \" bullets. */\n  body: string;\n  sources: string;\n}\n\nexport const ARTICLES: Article[] = [\n  {\n    slug: 'was-ist-schlafschuld',\n    title: 'Was ist Schlafschuld?',\n    teaser: 'Warum sich kurze Nächte aufsummieren und was dagegen hilft.',\n    minutes: 4,\n    body: `Stell dir vor, dein Körper führt ein Schlafkonto. Jeder Mensch hat einen persönlichen Schlafbedarf, bei den meisten Erwachsenen zwischen sieben und neun Stunden. Schläfst du weniger, entsteht ein Minus. Dieses Minus nennen wir Schlafschuld.\n\n## Wie sie entsteht\n\nEine Nacht mit sechs statt acht Stunden fühlt sich oft noch machbar an. Das Problem: Die fehlenden zwei Stunden verschwinden nicht. Wiederholst du das fünf Nächte lang, hast du am Ende deutlich mehr als eine Nacht Schlaf angespart, die du nicht hattest. Genau das zeigt Tagwerk als Schlafschuld.\n\n## Warum neuere Nächte mehr zählen\n\nTagwerk schaut auf die letzten 14 Nächte. Die letzte Nacht zählt am stärksten, eine Nacht vor zwei Wochen nur noch gering. So bildet die Zahl ab, wie du dich heute fühlst, und nicht, wie du dich im letzten Monat gefühlt hast.\n\n## Was dagegen hilft\n\n- Geh an mehreren Abenden 20 bis 40 Minuten früher ins Bett.\n- Halte deine Aufstehzeit stabil, damit die innere Uhr nicht aus dem Takt kommt.\n- Nimm bei Bedarf einen kurzen Nap am frühen Nachmittag.\n- Mehr Schlaf als nötig baut Schuld nur halb so schnell ab, ein einzelner Marathon-Schlaf wirkt also weniger als regelmäßige Nächte.\n\n## Wie viel ist okay?\n\nUnter fünf Stunden Schuld gilt als niedrig. Zwischen fünf und zehn Stunden merkst du es meist deutlich. Darüber leiden Konzentration, Stimmung und Reaktionsvermögen spürbar. Wenn du trotz genug Schlaf dauerhaft erschöpft bist, sprich mit einer Ärztin oder einem Arzt.`,\n    sources:\n      'Allgemeine Forschungsgrundlagen: Zwei-Prozess-Modell (Borbély, 1982); kumulative Effekte von Schlafmangel (Van Dongen et al., 2003).',\n  },\n  {\n    slug: 'wie-die-innere-uhr-funktioniert',\n    title: 'Wie die innere Uhr funktioniert',\n    teaser: 'Zwei Systeme steuern, wann du wach und wann du müde bist.',\n    minutes: 4,\n    body: `Dein Wachsein wird von zwei Systemen gesteuert, die zusammenspielen.\n\n## System 1: der Schlafdruck\n\nJe länger du wach bist, desto mehr Schlafdruck baut sich auf, ein bisschen wie Wasser in einem Gefäß. Schläfst du, läuft das Gefäß wieder leer. Nach einer kurzen Nacht startest du mit mehr Druck in den Tag.\n\n## System 2: die innere Uhr\n\nEin Taktgeber im Gehirn folgt einem Rhythmus von etwa 24 Stunden. Er sorgt dafür, dass du am Morgen Fahrt aufnimmst, am Nachmittag ein Tief hast und am frühen Abend noch einmal wach wirst. Kurz danach steigt Melatonin und bereitet den Schlaf vor.\n\n## Warum es mittags ein Tief gibt\n\nSchlafdruck und innere Uhr addieren sich nicht gleichmäßig. Am Nachmittag ist der Druck schon deutlich gestiegen, während die Uhr noch keinen Schub liefert. Das Ergebnis ist das bekannte Nachmittagstief, unabhängig davon, was du gegessen hast.\n\n## Was die innere Uhr beeinflusst\n\n- Licht, vor allem am Morgen, ist der stärkste Taktgeber.\n- Regelmäßige Zeiten für Schlaf, Essen und Bewegung.\n- Spätes helles Licht verschiebt die Uhr nach hinten.\n\nTagwerk berechnet beide Systeme und zeigt dir daraus deine Energiekurve für den Tag.`,\n    sources: 'Allgemeine Forschungsgrundlagen: Zwei-Prozess-Modell (Borbély, 1982); Timing of human sleep (Daan, Beersma & Borbély, 1984).',\n  },\n  {\n    slug: 'chronotypen',\n    title: 'Chronotypen: Lerche, Taube, Eule',\n    teaser: 'Warum manche früh fit sind und andere erst abends.',\n    minutes: 3,\n    body: `Menschen unterscheiden sich darin, wann ihre innere Uhr den Tag beginnen lässt. Das nennt man Chronotyp. Er ist zum Teil erblich und ändert sich mit dem Alter: Jugendliche werden später, ältere Menschen wieder früher.\n\n## Wie man ihn bestimmt\n\nEin guter Hinweis ist die Mitte deines Schlafs an freien Tagen, wenn du ohne Wecker schläfst. Liegt sie vor drei Uhr, bist du eher ein Frühtyp. Zwischen drei und fünf Uhr liegt die Mitte. Nach fünf Uhr bist du ein Spättyp. Hast du unter der Woche Schlaf aufgeholt, rechnen wir das heraus.\n\n## Kein richtig oder falsch\n\nEin später Chronotyp ist keine Faulheit. Deine Energiehochs, dein Melatonin und deine ideale Schlafenszeit liegen einfach später. Tagwerk verschiebt deshalb die ganze Kurve mit. Schwierig wird es erst, wenn der Alltag früh startet und die Uhr spät läuft.\n\n## Was Spättypen helfen kann\n\n- Morgenlicht, so früh es geht.\n- Abends gedimmtes Licht und weniger Bildschirmzeit.\n- Aufstehzeit schrittweise vorziehen, etwa 15 Minuten alle paar Tage.`,\n    sources: 'Allgemeine Forschungsgrundlagen: Chronotyp, Mitte des Schlafs an freien Tagen (Roenneberg et al.).',\n  },\n  {\n    slug: 'schlaftraegheit',\n    title: 'Schlafträgheit: Warum du morgens neben dir stehst',\n    teaser: 'Die Benommenheit nach dem Aufwachen ist normal und hat Gründe.',\n    minutes: 3,\n    body: `Kurz nach dem Aufwachen bist du noch nicht ganz da: Denken fällt schwer, Bewegungen sind träge. Dieser Zustand heißt Schlafträgheit und dauert meist 30 bis 90 Minuten.\n\n## Wovon sie abhängt\n\n- Wie viel Schlaf dir fehlt: Mit hoher Schlafschuld ist die Trägheit stärker und dauert länger.\n- Wann du aufwachst: Nahe am Tiefpunkt deiner inneren Uhr, also sehr früh, ist sie besonders ausgeprägt.\n- In welcher Schlafphase du geweckt wirst: Aus dem Tiefschlaf gerissen zu werden fühlt sich am schlimmsten an.\n\n## Was hilft\n\n- Gehe in der ersten Stunde ans Tageslicht.\n- Trink ein Glas Wasser und beweg dich ein paar Minuten.\n- Plane in der ersten Stunde keine schwierigen Entscheidungen.\n- Ein Wecker, der in einer leichten Schlafphase klingelt, kann helfen. Ein Spielraum von 30 Minuten ist oft besser als eine feste Minute.\n\nTagwerk zeigt dir auf der Energiekurve, wie lange deine Benommenheit voraussichtlich dauert.`,\n    sources: 'Allgemeine Forschungsgrundlagen: Schlafträgheit (Tassi & Muzet, 2000).',\n  },\n  {\n    slug: 'koffein-und-halbwertszeit',\n    title: 'Koffein und seine Halbwertszeit',\n    teaser: 'Warum der Kaffee um 16 Uhr noch um Mitternacht wirkt.',\n    minutes: 3,\n    body: `Koffein macht wach, weil es die Wirkung des Schlafdrucks im Gehirn dämpft. Der Schlafdruck ist trotzdem da, du spürst ihn nur nicht.\n\n## Die Halbwertszeit\n\nIm Durchschnitt braucht der Körper etwa fünf bis sechs Stunden, um die Hälfte des Koffeins abzubauen. Das variiert stark: Rauchen beschleunigt den Abbau, die Pille, Schwangerschaft und manche Gene verlangsamen ihn. Ein Kaffee um 16 Uhr bedeutet also, dass um 22 Uhr noch ein halber im Blut ist.\n\n## Der Koffein-Stopp\n\nTagwerk empfiehlt, ungefähr acht Stunden vor der Schlafenszeit auf Koffein zu verzichten. Du kannst den Wert in den Einstellungen ändern. Wer empfindlich ist, wählt zehn Stunden.\n\n## Praktische Tipps\n\n- Denk an versteckte Quellen: Cola, Energy-Drinks, Schwarztee, Matcha, Schokolade.\n- Wenn du morgens sehr müde bist, trink den ersten Kaffee eine Stunde nach dem Aufstehen, nach dem Morgenlicht.\n- Verschieb Koffein nicht ins Nachmittagstief, sondern gönn dir lieber einen kurzen Spaziergang.`,\n    sources: 'Allgemeine Forschungsgrundlagen: Koffein-Pharmakokinetik und Schlafdruck (Adenosin-Rezeptoren).',\n  },\n  {\n    slug: 'licht-am-morgen',\n    title: 'Licht am Morgen',\n    teaser: 'Der einfachste Hebel für Wachheit und besseren Schlaf.',\n    minutes: 3,\n    body: `Deine innere Uhr wird vor allem durch Licht eingestellt. Besonders wirksam ist helles Licht in der ersten Stunde nach dem Aufwachen.\n\n## Warum Draußen besser ist\n\nEin normal beleuchtetes Zimmer hat etwa 100 bis 500 Lux. Draußen sind es auch an einem grauen Tag mehrere Tausend, an einem sonnigen Tag über 50.000. Deine Augen und deine innere Uhr registrieren diesen Unterschied deutlich.\n\n## Wie viel?\n\nZehn bis dreißig Minuten reichen meist. Bei bedecktem Himmel eher länger. Du musst nicht in die Sonne schauen, es genügt, draußen zu sein: beim Frühstück auf dem Balkon, auf dem Weg zur Arbeit oder bei einem kurzen Spaziergang.\n\n## Was du davon hast\n\n- Du wirst schneller klar im Kopf.\n- Deine Uhr wird früher eingestellt, du wirst abends eher müde.\n- Der Tag-Nacht-Kontrast wird größer, das stabilisiert den Schlaf.\n\nAbends gilt das Gegenteil: Gedimmtes, warmes Licht lässt Melatonin steigen.`,\n    sources: 'Allgemeine Forschungsgrundlagen: Lichtabhängige Phasenverschiebung der zirkadianen Uhr.',\n  },\n  {\n    slug: 'powernaps-richtig',\n    title: 'Powernaps richtig',\n    teaser: 'Kurz, früh und mit Wecker: So hilft das Nickerchen.',\n    minutes: 3,\n    body: `Ein Nap kann Energie zurückbringen, wenn du ihn richtig machst.\n\n## Die Regeln\n\n- Kurz: höchstens 20 Minuten. Danach rutschst du in den Tiefschlaf und wachst benommen auf.\n- Früh: Am besten im Nachmittagstief, spätestens sieben Stunden vor der Schlafenszeit. Ein später Nap nimmt dir den Schlafdruck für die Nacht.\n- Mit Wecker: Stell dir einen Alarm, damit du nicht länger schläfst als geplant.\n\n## Der lange Nap\n\nWenn du viel Schlafschuld hast oder nachts gearbeitet hast, kann ein Nap von 90 Minuten sinnvoll sein. Das ist ein voller Schlafzyklus, du wachst meist in einer leichten Phase auf. Plan dafür aber genug Zeit ein.\n\n## Wenn du nicht einschlafen kannst\n\nDas ist normal. Auch Ausruhen mit geschlossenen Augen hilft. Wenn Naps dein Einschlafen am Abend erschweren, lass sie weg oder kürze sie.\n\nIn Tagwerk siehst du den besten Zeitpunkt im Tagesplan, direkt im Nachmittagstief.`,\n    sources: 'Allgemeine Forschungsgrundlagen: Tagesschlaf, Schlafdruck und Schlafträgheit (Tassi & Muzet, 2000).',\n  },\n  {\n    slug: 'social-jetlag',\n    title: 'Social Jetlag',\n    teaser: 'Wenn das Wochenende deine innere Uhr verstellt.',\n    minutes: 3,\n    body: `Wer unter der Woche früh aufsteht und am Wochenende lange schläft, verschiebt jede Woche seine innere Uhr, als würde er nach Westen fliegen und am Montag wieder zurück. Das nennt man Social Jetlag.\n\n## Woran du ihn erkennst\n\nDer Unterschied zwischen der Mitte deines Schlafs an freien Tagen und an Arbeitstagen ist der Social Jetlag. Mehr als zwei Stunden gelten als deutlich. Typische Folgen sind Müdigkeit am Montag, schlechtes Einschlafen am Sonntagabend und mehr Schlafschuld.\n\n## Was du tun kannst\n\n- Steh am Wochenende höchstens eine Stunde später auf als sonst.\n- Hol Schlaf lieber mit einem Nap oder einer etwas früheren Schlafenszeit auf.\n- Geh morgens am Wochenende kurz ans Licht, auch wenn du länger schläfst.\n- Verschieb deinen Rhythmus schrittweise, etwa 15 Minuten alle zwei bis drei Tage.\n\nSpättypen haben es besonders schwer, weil frühe Termine gegen die innere Uhr laufen. Tagwerk zeigt dir den Wert unter „Dein Chronotyp“.`,\n    sources: 'Allgemeine Forschungsgrundlagen: Social Jetlag (Roenneberg et al.).',\n  },\n  {\n    slug: 'alkohol-und-schlaf',\n    title: 'Alkohol und Schlaf',\n    teaser: 'Schneller eingeschlafen, schlechter erholt.',\n    minutes: 3,\n    body: `Ein Glas Wein am Abend macht müde. Viele nutzen Alkohol deshalb als Einschlafhilfe. Für die Qualität des Schlafs ist das aber keine gute Idee.\n\n## Was passiert\n\nIn der ersten Nachthälfte schläfst du oft tiefer. Wenn der Körper den Alkohol abbaut, wird der Schlaf in der zweiten Hälfte flacher, unruhiger und kürzer. Du wachst häufiger auf und die Traumschlafphasen werden unterdrückt.\n\n## Was du merkst\n\n- Du wachst früh auf und kannst nicht wieder einschlafen.\n- Du fühlst dich trotz langer Nacht nicht erholt.\n- Das Herz schlägt in der Nacht schneller, die Erholung ist geringer.\n\n## Praktische Regeln\n\n- Lass zwischen dem letzten Drink und der Schlafenszeit mindestens drei Stunden Abstand.\n- Trink dazu Wasser.\n- Nutze Alkohol nicht als Schlafmittel. Wenn du schlecht einschläfst, helfen eine Abendroutine und die Atemübung 4-7-8 besser.`,\n    sources: 'Allgemeine Forschungsgrundlagen: Alkohol und Schlafarchitektur.',\n  },\n  {\n    slug: 'einschlafen-wenns-nicht-klappt',\n    title: 'Einschlafen, wenn’s nicht klappt',\n    teaser: 'Was du tun kannst, wenn du im Bett wach liegst.',\n    minutes: 4,\n    body: `Jeder liegt manchmal wach. Wichtig ist, wie du damit umgehst, damit daraus kein Dauerproblem wird.\n\n## Vor dem Schlafen\n\n- Dimm eine Stunde vor der Schlafenszeit das Licht und leg Bildschirme weg.\n- Mach etwas Ruhiges: lesen, dehnen, leise Musik, die Atemübung.\n- Halte das Schlafzimmer kühl, dunkel und ruhig.\n\n## Wenn du im Bett wach liegst\n\n- Schau nicht auf die Uhr. Das erhöht den Druck.\n- Wenn du länger als etwa 20 Minuten wach bist, steh auf, setz dich bei schwachem Licht hin und mach etwas Ruhiges. Geh erst zurück, wenn du müde bist.\n- Schreib kreisende Gedanken auf einen Zettel. Was aufgeschrieben ist, muss nicht gemerkt werden.\n- Probier die Atemübung 4-7-8: vier Sekunden einatmen, sieben halten, acht ausatmen.\n\n## Was du vermeiden solltest\n\n- Tagsüber lange schlafen, um Verlorenes aufzuholen.\n- Alkohol und spätes Koffein.\n- Im Bett arbeiten oder scrollen.\n\nWenn du mehrere Wochen lang schlecht schläfst und dich tagsüber stark beeinträchtigt fühlst, sprich mit einer Ärztin oder einem Arzt.`,\n    sources: 'Allgemeine Forschungsgrundlagen: Schlafhygiene und kognitive Verhaltenstherapie bei Schlafstörungen (CBT-I).',\n  },\n  {\n    slug: 'schichtarbeit',\n    title: 'Schichtarbeit und wechselnde Zeiten',\n    teaser: 'Wie du deine innere Uhr unterstützt, wenn nichts regelmäßig ist.',\n    minutes: 4,\n    body: `Wer nachts oder in wechselnden Schichten arbeitet, arbeitet gegen die innere Uhr. Perfekt wird das nie, aber du kannst es leichter machen.\n\n## Wie schnell sich die Uhr anpasst\n\nDie innere Uhr verschiebt sich pro Tag nur um etwa eine Stunde. Ein plötzlicher Wechsel von Früh- auf Nachtschicht lässt sich also nicht in einer Nacht ausgleichen. Tagwerk berücksichtigt das und zeigt dir an, wie lange deine Uhr noch zum Anpassen braucht.\n\n## Tipps\n\n- Nutze Licht gezielt: hell vor und während der Schicht, abends nach der Schicht Sonnenbrille und dunkles Schlafzimmer.\n- Plane Schlaf in festen Blöcken und verdunkle das Zimmer.\n- Ein Nap vor der Nachtschicht senkt die Müdigkeit.\n- Koffein in der ersten Schichthälfte, nicht kurz vor dem Schlafengehen.\n- Versuch, die Schlafzeit nach Schichtwechsel schrittweise zu verschieben.\n\n## Im Schichtmodus\n\nSchalte in den Einstellungen den Schichtmodus ein. Tagwerk richtet dann deinen Tagesplan an deinem tatsächlichen Schlaf der letzten Tage aus statt an der Uhrzeit.`,\n    sources: 'Allgemeine Forschungsgrundlagen: Anpassungsrate der zirkadianen Uhr, Schichtarbeit und Schlaf.',\n  },\n  {\n    slug: 'wochenende-ausschlafen',\n    title: 'Wochenende ausschlafen: Hilft das?',\n    teaser: 'Ein bisschen schon, aber nicht so, wie man denkt.',\n    minutes: 3,\n    body: `Der Wunsch ist verständlich: Unter der Woche zu kurz, am Wochenende nachholen. Funktioniert das?\n\n## Was Ausschlafen kann\n\nEine lange Nacht baut Schlafschuld ab, aber nur zum Teil. In Tagwerk zählt Mehrschlaf nur halb so stark wie ein Defizit. Das spiegelt die Erfahrung wider, dass sich eine Woche kurzen Schlafs nicht in einer Nacht ausgleichen lässt.\n\n## Der Preis\n\nWer sehr lange schläft, verschiebt seine innere Uhr nach hinten und bekommt am Sonntagabend Probleme beim Einschlafen. Der Montag beginnt dann schwer.\n\n## Besser\n\n- Steh am Wochenende höchstens ein bis zwei Stunden später auf.\n- Ergänze mit einem Nap am Nachmittag, höchstens 20 bis 30 Minuten.\n- Verteile das Aufholen: Geh jeden Abend 20 bis 30 Minuten früher ins Bett.\n- Hol dir am Samstag und Sonntag trotzdem Morgenlicht.\n\nDas Ziel ist nicht, die Schuld auf einmal loszuwerden, sondern sie gar nicht erst entstehen zu lassen.`,\n    sources: 'Allgemeine Forschungsgrundlagen: Erholungsschlaf nach Schlafrestriktion, Social Jetlag.',\n  },\n  {\n    slug: 'schlafzimmer-und-umgebung',\n    title: 'Das Schlafzimmer als Schlafort',\n    teaser: 'Temperatur, Licht und Geräusche in Reihenfolge ihrer Wirkung.',\n    minutes: 3,\n    body: `Dein Schlafzimmer entscheidet mit, wie schnell du einschläfst und wie gut du durchschläfst.\n\n## Temperatur\n\nZum Einschlafen sinkt die Körpertemperatur. Ein kühler Raum, etwa 16 bis 19 Grad, unterstützt das. Eine zu warme Wohnung ist einer der häufigsten Gründe für unruhige Nächte im Sommer.\n\n## Licht\n\nSchon wenig Licht stört den Schlaf. Verdunkle den Raum so gut es geht, nutze eine Schlafmaske oder dicke Vorhänge und decke leuchtende Geräte ab. Für den Weg zur Toilette reicht ein schwaches, warmes Nachtlicht.\n\n## Geräusche\n\nGleichmäßige Geräusche wie Rauschen oder Regen können Störgeräusche überdecken. Einige Menschen schlafen damit besser, andere lieber in Stille. Probier es aus. In Tagwerk findest du unter Tools verschiedene Geräusche mit Timer.\n\n## Das Bett\n\nNutze das Bett nach Möglichkeit nur zum Schlafen. So lernt dein Gehirn, dass Bett und Schlaf zusammengehören.`,\n    sources: 'Allgemeine Forschungsgrundlagen: Schlafumgebung, Thermoregulation und Schlaf.',\n  },\n];\n\nexport const ARTICLE_BY_SLUG: Record\u003cstring, Article> = Object.fromEntries(ARTICLES.map((a) => [a.slug, a]));\n\nexport type Block = { type: 'h' | 'p' | 'li'; text: string };\n\n/** Parse the tiny markdown subset used by the articles. */\nexport function parseBody(body: string): Block[] {\n  const out: Block[] = [];\n  for (const chunk of body.split(/\\n\\s*\\n/)) {\n    const lines = chunk.split('\\n').map((l) => l.trim()).filter(Boolean);\n    if (lines.length === 0) continue;\n    if (lines.every((l) => l.startsWith('- '))) {\n      for (const l of lines) out.push({ type: 'li', text: l.slice(2) });\n    } else if (lines[0].startsWith('## ')) {\n      out.push({ type: 'h', text: lines[0].slice(3) });\n      const rest = lines.slice(1);\n      if (rest.length) out.push({ type: 'p', text: rest.join(' ') });\n    } else {\n      out.push({ type: 'p', text: lines.join(' ') });\n    }\n  }\n  return out;\n}\n"},{"path":"src/content/windows.ts","content":"import type { WindowKind } from '@/engine/types';\nimport type { Colors } from '@/ui/theme';\n\nexport type IconName =\n  | 'Brain'\n  | 'Sun'\n  | 'Zap'\n  | 'Coffee'\n  | 'BatteryLow'\n  | 'Dumbbell'\n  | 'Utensils'\n  | 'Lightbulb'\n  | 'Wind'\n  | 'Moon'\n  | 'BedDouble'\n  | 'AlarmClock';\n\nexport const WINDOW_ICON: Record\u003cWindowKind, IconName> = {\n  grogginess: 'Brain',\n  morning_light: 'Sun',\n  morning_peak: 'Zap',\n  caffeine_stop: 'Coffee',\n  afternoon_dip: 'BatteryLow',\n  nap: 'AlarmClock',\n  evening_peak: 'Zap',\n  sport: 'Dumbbell',\n  last_meal: 'Utensils',\n  dim_light: 'Lightbulb',\n  wind_down: 'Wind',\n  melatonin: 'Moon',\n  bedtime: 'BedDouble',\n};\n\nexport function windowColor(kind: WindowKind, c: Colors): string {\n  switch (kind) {\n    case 'grogginess':\n      return c.groggy;\n    case 'morning_peak':\n    case 'evening_peak':\n    case 'morning_light':\n      return c.peak;\n    case 'afternoon_dip':\n    case 'nap':\n      return c.dip;\n    case 'melatonin':\n    case 'wind_down':\n    case 'dim_light':\n    case 'bedtime':\n      return c.melatonin;\n    case 'sport':\n      return c.good;\n    default:\n      return c.textMuted;\n  }\n}\n"},{"path":"src/data/__tests__/demo.test.ts","content":"import { DEMO_SCENARIOS, demoProfile, generateDemoSessions, mulberry32 } from '../demo/generator';\nimport { computeDayPlan } from '@/engine/dayPlan';\nimport { buildSleepDays } from '@/engine/sleepDetection';\nimport { formatClock, hourOfDay, localTimeToMs } from '@/engine/time';\n\nconst TZ = 'Europe/Berlin';\nconst LAST = '2025-05-14';\nconst NOW = localTimeToMs(LAST, '12:00', TZ);\n\ndescribe('demo generator', () => {\n  it('is deterministic', () => {\n    const a = mulberry32(1);\n    const b = mulberry32(1);\n    expect([a(), a(), a()]).toEqual([b(), b(), b()]);\n    const x = generateDemoSessions({ scenario: 'rested', lastWakeKey: LAST, tz: TZ });\n    const y = generateDemoSessions({ scenario: 'rested', lastWakeKey: LAST, tz: TZ });\n    expect(x).toEqual(y);\n  });\n\n  it.each(DEMO_SCENARIOS.map((s) => s.id))('creates a plausible record for %s', (id) => {\n    const sessions = generateDemoSessions({ scenario: id, lastWakeKey: LAST, tz: TZ, nights: 60 });\n    expect(sessions.length).toBeGreaterThanOrEqual(55);\n    const days = buildSleepDays(sessions, TZ, id === 'shift_worker');\n    expect(days.size).toBeGreaterThanOrEqual(55);\n    for (const d of days.values()) {\n      expect(d.mainMinutes).toBeGreaterThan(180);\n      expect(d.mainMinutes).toBeLessThan(11 * 60);\n    }\n    for (const s of sessions) {\n      expect(s.endAt).toBeGreaterThan(s.startAt);\n      expect(s.source).toBe('demo');\n    }\n    const profile = demoProfile(id, TZ, NOW);\n    const plan = computeDayPlan({ sessions, profile, now: NOW });\n    expect(Number.isFinite(plan.currentEnergy)).toBe(true);\n    expect(plan.windows.length).toBeGreaterThan(8);\n  });\n\n  it('exam week creates much more debt than the rested scenario', () => {\n    const debt = (id: (typeof DEMO_SCENARIOS)[number]['id']) =>\n      computeDayPlan({\n        sessions: generateDemoSessions({ scenario: id, lastWakeKey: LAST, tz: TZ }),\n        profile: demoProfile(id, TZ, NOW),\n        now: NOW,\n      }).debt.debtMinutes;\n    expect(debt('exam_week')).toBeGreaterThan(debt('rested') + 120);\n    expect(debt('weekend_catchup')).toBeGreaterThan(debt('rested'));\n  });\n\n  it('the late type has a later bedtime and curve than the rested type (not treated as wrong)', () => {\n    const run = (id: 'rested' | 'late_early_shift') =>\n      computeDayPlan({\n        sessions: generateDemoSessions({ scenario: id, lastWakeKey: LAST, tz: TZ }),\n        profile: { ...demoProfile(id, TZ, NOW), targetWakeTime: null },\n        now: NOW,\n      });\n    const late = run('late_early_shift');\n    const rested = run('rested');\n    const h = (ms: number) => ((hourOfDay(ms, TZ) + 12) % 24) - 12; // around midnight\n    expect(h(late.bedtime.bedtime)).toBeGreaterThan(h(rested.bedtime.bedtime) + 1);\n    expect(late.melatonin.start).toBeGreaterThan(rested.melatonin.start);\n    expect(formatClock(late.bedtime.bedtime, TZ)).toMatch(/^\\d\\d:\\d\\d$/);\n  });\n});\n"},{"path":"src/data/__tests__/stores.test.ts","content":"import Database from 'better-sqlite3';\nimport { drizzle } from 'drizzle-orm/better-sqlite3';\nimport { MemoryStore } from '../memoryStore';\nimport { SqliteStore } from '../sqliteStore';\nimport { applyImport, parseBundle, previewImport } from '../exchange';\nimport type { AppProfile, DataStore } from '../types';\nimport { constantNights, makeProfile } from '@/engine/__tests__/fixtures';\n\nconst appProfile = (): AppProfile => ({\n  ...makeProfile({ name: 'Zelda', targetWakeTime: '07:00', sleepNeedMinutesEstimated: 492.5 }),\n  createdAt: 1000,\n  onboardingCompletedAt: 2000,\n  chronotypeUpdatedAt: null,\n});\n\nconst factories: [string, () => DataStore][] = [\n  ['MemoryStore', () => new MemoryStore()],\n  ['SqliteStore (drizzle + better-sqlite3)', () => new SqliteStore(drizzle(new Database(':memory:')))],\n];\n\ndescribe.each(factories)('%s', (_name, make) => {\n  let store: DataStore;\n  beforeEach(() => {\n    store = make();\n  });\n\n  it('starts empty', async () => {\n    expect(await store.getProfile()).toBeNull();\n    expect(await store.listSessions()).toEqual([]);\n    expect(await store.getSetting('x')).toBeNull();\n    expect(await store.getSession('nope')).toBeNull();\n  });\n\n  it('saves and updates the profile singleton', async () => {\n    await store.saveProfile(appProfile());\n    const p = await store.getProfile();\n    expect(p?.name).toBe('Zelda');\n    expect(p?.sleepNeedMinutesEstimated).toBe(492.5);\n    expect(p?.workSchedule.workDays).toEqual([1, 2, 3, 4, 5]);\n    await store.saveProfile({ ...appProfile(), name: 'Link', targetWakeTime: null });\n    const q = await store.getProfile();\n    expect(q?.name).toBe('Link');\n    expect(q?.targetWakeTime).toBeNull();\n  });\n\n  it('upserts, edits, lists in order and deletes sessions', async () => {\n    const [a, b] = constantNights('2025-05-14', 2, 480);\n    await store.upsertSessions([a, b]);\n    let list = await store.listSessions();\n    expect(list).toHaveLength(2);\n    expect(list[0].startAt).toBeLessThan(list[1].startAt);\n    await store.upsertSessions([{ ...a, endAt: a.endAt + 60_000, userEdited: true, isNap: true }]);\n    const edited = await store.getSession(a.id);\n    expect(edited?.userEdited).toBe(true);\n    expect(edited?.isNap).toBe(true);\n    expect(edited?.endAt).toBe(a.endAt + 60_000);\n    await store.deleteSession(a.id);\n    list = await store.listSessions();\n    expect(list.map((s) => s.id)).toEqual([b.id]);\n  });\n\n  it('clears sessions by source or entirely', async () => {\n    const [a, b] = constantNights('2025-05-14', 2, 480);\n    await store.upsertSessions([a, { ...b, source: 'manual' }]);\n    await store.clearSessions('demo');\n    expect((await store.listSessions()).map((s) => s.source)).toEqual(['manual']);\n    await store.clearSessions();\n    expect(await store.listSessions()).toEqual([]);\n  });\n\n  it('stores habits and habit logs with upsert semantics', async () => {\n    await store.saveHabit({ key: 'morning_light', enabled: true, reminderEnabled: true, reminderOffsetMin: 5 });\n    await store.saveHabit({ key: 'morning_light', enabled: true, reminderEnabled: false, reminderOffsetMin: 10 });\n    expect(await store.listHabits()).toEqual([{ key: 'morning_light', enabled: true, reminderEnabled: false, reminderOffsetMin: 10 }]);\n    await store.setHabitLog({ habitKey: 'morning_light', date: '2025-05-14', status: 'done', at: 1 });\n    await store.setHabitLog({ habitKey: 'morning_light', date: '2025-05-14', status: 'skipped', at: 2 });\n    await store.setHabitLog({ habitKey: 'wind_down', date: '2025-05-10', status: 'done', at: 3 });\n    expect(await store.listHabitLogs()).toHaveLength(2);\n    expect(await store.listHabitLogs('2025-05-12')).toEqual([{ habitKey: 'morning_light', date: '2025-05-14', status: 'skipped', at: 2 }]);\n    await store.removeHabitLog('morning_light', '2025-05-14');\n    expect(await store.listHabitLogs('2025-05-12')).toEqual([]);\n  });\n\n  it('stores check-ins and ignores duplicates', async () => {\n    await store.addCheckin({ id: 'c1', at: 5, rating: 4, note: 'gut' });\n    await store.addCheckin({ id: 'c1', at: 5, rating: 1 });\n    await store.addCheckin({ id: 'c0', at: 1, rating: 3 });\n    const list = await store.listCheckins();\n    expect(list.map((c) => c.id)).toEqual(['c0', 'c1']);\n    expect(list[1].rating).toBe(4);\n  });\n\n  it('caches daily summaries', async () => {\n    const s = {\n      date: '2025-05-14',\n      totalSleepMinutes: 450,\n      napMinutes: 20,\n      sleepDebtMinutes: 120,\n      sleepNeedMinutes: 480,\n      energyCurveJson: '[]',\n      windowsJson: '[]',\n      computedAt: 9,\n      engineVersion: 1,\n    };\n    await store.saveSummary(s);\n    expect(await store.getSummary('2025-05-14')).toEqual(s);\n    await store.saveSummary({ ...s, sleepDebtMinutes: 60 });\n    expect((await store.getSummary('2025-05-14'))?.sleepDebtMinutes).toBe(60);\n    await store.clearSummaries();\n    expect(await store.getSummary('2025-05-14')).toBeNull();\n  });\n\n  it('stores settings', async () => {\n    await store.setSetting('k', 'v1');\n    await store.setSetting('k', 'v2');\n    expect(await store.getSetting('k')).toBe('v2');\n  });\n\n  it('exports everything and wipes all data', async () => {\n    await store.saveProfile(appProfile());\n    await store.upsertSessions(constantNights('2025-05-14', 3, 480));\n    await store.saveHabit({ key: 'bedtime', enabled: true, reminderEnabled: true, reminderOffsetMin: 0 });\n    await store.setHabitLog({ habitKey: 'bedtime', date: '2025-05-14', status: 'done', at: 1 });\n    await store.addCheckin({ id: 'c', at: 1, rating: 5 });\n    await store.setSetting('a', 'b');\n    const bundle = await store.exportAll();\n    expect(bundle.schemaVersion).toBe(1);\n    expect(bundle.sessions).toHaveLength(3);\n    expect(bundle.profile?.name).toBe('Zelda');\n    await store.wipe();\n    expect(await store.getProfile()).toBeNull();\n    expect(await store.listSessions()).toEqual([]);\n    expect(await store.listHabits()).toEqual([]);\n    expect(await store.listHabitLogs()).toEqual([]);\n    expect(await store.listCheckins()).toEqual([]);\n    expect(await store.getSetting('a')).toBeNull();\n  });\n\n  it('round-trips an export through validation and import, skipping duplicates', async () => {\n    await store.saveProfile(appProfile());\n    await store.upsertSessions(constantNights('2025-05-14', 5, 480));\n    await store.saveHabit({ key: 'bedtime', enabled: true, reminderEnabled: true, reminderOffsetMin: 0 });\n    const json = JSON.stringify(await store.exportAll());\n    const parsed = parseBundle(json);\n    expect(parsed.ok).toBe(true);\n    if (!parsed.ok) return;\n    const preview = previewImport(parsed.bundle, await store.listSessions());\n    expect(preview.nightsFound).toBe(5);\n    expect(preview.duplicatesSkipped).toBe(5);\n    const other = make();\n    const res = await applyImport(other, parsed.bundle);\n    expect(res.newSessions).toHaveLength(5);\n    expect((await other.listSessions())).toHaveLength(5);\n    expect((await other.getProfile())?.name).toBe('Zelda');\n    expect(await other.listHabits()).toHaveLength(1);\n    const again = await applyImport(other, parsed.bundle);\n    expect(again.duplicatesSkipped).toBe(5);\n    expect(await other.listSessions()).toHaveLength(5);\n  });\n});\n\ndescribe('import validation', () => {\n  it('rejects broken JSON and wrong shapes with a readable message', () => {\n    const a = parseBundle('{nope');\n    expect(a.ok).toBe(false);\n    const b = parseBundle(JSON.stringify({ schemaVersion: 1 }));\n    expect(b.ok).toBe(false);\n    if (!b.ok) expect(b.error).toContain('Ungültige Datei');\n    const c = parseBundle(JSON.stringify({ schemaVersion: 99, exportedAt: 1, profile: null, sessions: [], habits: [], habitLogs: [], checkins: [] }));\n    expect(c.ok).toBe(false);\n  });\n\n  it('accepts an empty but valid bundle', () => {\n    const r = parseBundle(JSON.stringify({ schemaVersion: 1, exportedAt: 1, profile: null, sessions: [], habits: [], habitLogs: [], checkins: [] }));\n    expect(r.ok).toBe(true);\n  });\n\n  it('treats sessions with nearly identical times as duplicates', () => {\n    const [s] = constantNights('2025-05-14', 1, 480);\n    const bundle = { schemaVersion: 1, exportedAt: 0, profile: null, sessions: [{ ...s, id: 'other', startAt: s.startAt + 1000 }], habits: [], habitLogs: [], checkins: [] };\n    const p = previewImport(bundle, [s]);\n    expect(p.duplicatesSkipped).toBe(1);\n    const dupInside = previewImport({ ...bundle, sessions: [s, { ...s }] }, []);\n    expect(dupInside.newSessions).toHaveLength(1);\n  });\n});\n"},{"path":"src/data/db.native.ts","content":"import { drizzle } from 'drizzle-orm/expo-sqlite';\nimport { openDatabaseSync } from 'expo-sqlite';\nimport { SqliteStore, type SyncDb } from './sqliteStore';\nimport type { DataStore } from './types';\n\n/** iOS / Android: SQLite through expo-sqlite and Drizzle ORM. */\nexport function createStore(): DataStore {\n  const sqlite = openDatabaseSync('tagwerk.db');\n  return new SqliteStore(drizzle(sqlite) as unknown as SyncDb);\n}\n"},{"path":"src/data/db.ts","content":"import { MemoryStore } from './memoryStore';\nimport type { DataStore } from './types';\n\nconst KEY = 'tagwerk.web.v1';\n\nclass WebStore extends MemoryStore {\n  protected changed(): void {\n    try {\n      if (typeof localStorage !== 'undefined') localStorage.setItem(KEY, this.serialize());\n    } catch {\n      /* storage may be full or blocked, the app keeps working in memory */\n    }\n  }\n}\n\n/** Web / default: in-memory store persisted to localStorage. */\nexport function createStore(): DataStore {\n  const store = new WebStore();\n  try {\n    if (typeof localStorage !== 'undefined') {\n      const raw = localStorage.getItem(KEY);\n      if (raw) store.restore(raw);\n    }\n  } catch {\n    /* ignore corrupt data */\n  }\n  return store;\n}\n"},{"path":"src/data/demo/generator.ts","content":"import type { Profile, SleepSession, WorkSchedule } from '@/engine/types';\nimport { addDaysToKey, dateKey, dayOfWeekOfKey, localTimeToMs, formatHHmm } from '@/engine/time';\n\n/** Small deterministic PRNG so demo data is stable between runs. */\nexport function mulberry32(seed: number): () => number {\n  let a = seed >>> 0;\n  return () => {\n    a |= 0;\n    a = (a + 0x6d2b79f5) | 0;\n    let t = Math.imul(a ^ (a >>> 15), 1 | a);\n    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;\n    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n  };\n}\n\nexport type DemoScenarioId = 'rested' | 'exam_week' | 'late_early_shift' | 'weekend_catchup' | 'shift_worker';\n\nexport interface DemoScenario {\n  id: DemoScenarioId;\n  label: string;\n  description: string;\n  profile: Partial\u003cProfile>;\n}\n\nconst WORK: WorkSchedule = { workDays: [1, 2, 3, 4, 5], workStart: '09:00', workEnd: '17:00', shiftMode: false };\n\nexport const DEMO_SCENARIOS: DemoScenario[] = [\n  {\n    id: 'rested',\n    label: 'Gut ausgeschlafen',\n    description: 'Regelmäßiger Schlaf von etwa 8 Stunden.',\n    profile: { chronotype: 'intermediate', circadianPhaseOffsetMin: 0, workSchedule: WORK },\n  },\n  {\n    id: 'exam_week',\n    label: 'Prüfungswoche',\n    description: 'Mehrere kurze Nächte in Folge.',\n    profile: { chronotype: 'intermediate', circadianPhaseOffsetMin: 30, workSchedule: WORK },\n  },\n  {\n    id: 'late_early_shift',\n    label: 'Spättyp mit Frühschicht',\n    description: 'Später Rhythmus, aber früh aufstehen unter der Woche.',\n    profile: { chronotype: 'late', chronotypeScore: 0.8, circadianPhaseOffsetMin: 150, workSchedule: WORK },\n  },\n  {\n    id: 'weekend_catchup',\n    label: 'Wochenend-Nachholer',\n    description: 'Unter der Woche zu wenig,
