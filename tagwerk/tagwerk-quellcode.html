 } from './en';\n\nexport type Lang = 'de' | 'en';\n\nlet current: Lang = 'de';\nexport const setLang = (l: Lang) => {\n  current = l;\n};\nexport const getLang = (): Lang => current;\n\ntype Tree = { [k: string]: string | Tree };\n\nfunction lookup(tree: Tree, path: string[]): string | undefined {\n  let node: string | Tree | undefined = tree;\n  for (const p of path) {\n    if (node === undefined || typeof node === 'string') return undefined;\n    node = node[p];\n  }\n  return typeof node === 'string' ? node : undefined;\n}\n\n/** t('today.debtTitle', { n: 3 }). Falls back to German and finally to the key. */\nexport function t(key: string, params?: Record\u003cstring, string | number>): string {\n  const path = key.split('.');\n  const raw =\n    (current === 'en' ? lookup(en as Tree, path) : undefined) ?? lookup(de as unknown as Tree, path) ?? key;\n  if (!params) return raw;\n  return raw.replace(/\\{(\\w+)\\}/g, (_, k: string) => (params[k] !== undefined ? String(params[k]) : `{${k}}`));\n}\n"},{"path":"src/integrations/files.ts","content":"import * as Sharing from 'expo-sharing';\nimport { File, Paths } from 'expo-file-system';\nimport { Platform } from 'react-native';\n\n/** Hand a JSON file to the share dialog (native) or download it (web). */\nexport async function shareJson(filename: string, content: string): Promise\u003c'shared' | 'downloaded' | 'unavailable'> {\n  try {\n    if (Platform.OS === 'web') {\n      const blob = new Blob([content], { type: 'application/json' });\n      const url = URL.createObjectURL(blob);\n      const a = document.createElement('a');\n      a.href = url;\n      a.download = filename;\n      a.click();\n      URL.revokeObjectURL(url);\n      return 'downloaded';\n    }\n    const file = new File(Paths.cache, filename);\n    if (file.exists) file.delete();\n    file.create();\n    file.write(content);\n    if (!(await Sharing.isAvailableAsync())) return 'unavailable';\n    await Sharing.shareAsync(file.uri, { mimeType: 'application/json', dialogTitle: 'Tagwerk-Daten exportieren', UTI: 'public.json' });\n    return 'shared';\n  } catch {\n    return 'unavailable';\n  }\n}\n\n/** Let the user pick a JSON file and return its text, or null if cancelled. */\nexport async function pickJson(): Promise\u003cstring | null> {\n  try {\n    if (Platform.OS === 'web') {\n      return await new Promise\u003cstring | null>((resolve) => {\n        const input = document.createElement('input');\n        input.type = 'file';\n        input.accept = 'application/json,.json';\n        input.onchange = async () => {\n          const f = input.files?.[0];\n          resolve(f ? await f.text() : null);\n        };\n        input.oncancel = () => resolve(null);\n        input.click();\n      });\n    }\n    const res = await File.pickFileAsync();\n    if (res.canceled) return null;\n    return await res.result.text();\n  } catch {\n    return null;\n  }\n}\n"},{"path":"src/integrations/health/__tests__/health.test.ts","content":"import { healthConnectToSessions, samplesToSessions } from '../convert';\nimport { MockHealthProvider } from '../mock';\nimport { getHealthProvider } from '..';\nimport { syncHealth } from '@/services/sync';\nimport { MemoryStore } from '@/data/memoryStore';\nimport { localTimeToMs } from '@/engine/time';\nimport { buildSleepDays } from '@/engine/sleepDetection';\n\nconst TZ = 'Europe/Berlin';\nconst iso = (key: string, hhmm: string) => new Date(localTimeToMs(key, hhmm, TZ)).toISOString();\nconst NOW = localTimeToMs('2025-05-14', '12:00', TZ);\n\ndescribe('HealthKit sample conversion', () => {\n  it('combines asleep stages into one session framed by in-bed', () => {\n    const raw = [\n      { startDate: iso('2025-05-13', '22:50'), endDate: iso('2025-05-14', '07:10'), value: 'INBED' as const, sourceName: 'Apple Watch' },\n      { startDate: iso('2025-05-13', '23:05'), endDate: iso('2025-05-14', '03:00'), value: 'ASLEEP' as const, sourceName: 'Apple Watch' },\n      { startDate: iso('2025-05-14', '03:00'), endDate: iso('2025-05-14', '03:20'), value: 'AWAKE' as const, sourceName: 'Apple Watch' },\n      { startDate: iso('2025-05-14', '03:20'), endDate: iso('2025-05-14', '06:50'), value: 'ASLEEP' as const, sourceName: 'Apple Watch' },\n    ];\n    const s = samplesToSessions(raw, { source: 'healthkit', timezone: TZ, now: NOW });\n    expect(s).toHaveLength(1);\n    expect(s[0].startAt).toBe(Date.parse(raw[0].startDate));\n    expect(s[0].endAt).toBe(Date.parse(raw[0].endDate));\n    expect(s[0].asleepMinutes).toBe(3 * 60 + 55 + 3 * 60 + 30);\n    expect(s[0].sourceDetail).toBe('Apple Watch');\n    expect(s[0].source).toBe('healthkit');\n    expect(s[0].confidence).toBe(0.9);\n  });\n\n  it('splits separate nights and keeps sources apart', () => {\n    const raw = [\n      { startDate: iso('2025-05-12', '23:00'), endDate: iso('2025-05-13', '07:00'), value: 'ASLEEP' as const, sourceName: 'iPhone' },\n      { startDate: iso('2025-05-13', '23:00'), endDate: iso('2025-05-14', '07:00'), value: 'ASLEEP' as const, sourceName: 'iPhone' },\n      { startDate: iso('2025-05-13', '23:10'), endDate: iso('2025-05-14', '06:50'), value: 'ASLEEP' as const, sourceName: 'Oura' },\n    ];\n    const s = samplesToSessions(raw, { source: 'healthkit', timezone: TZ, now: NOW });\n    expect(s).toHaveLength(3);\n    expect(new Set(s.map((x) => x.id)).size).toBe(3);\n    // the ring has higher priority than the phone, so only one of the two duplicates counts\n    const days = buildSleepDays(s, TZ);\n    expect(days.get('2025-05-14')?.main).toHaveLength(1);\n    expect(days.get('2025-05-14')?.main[0].sourceDetail).toBe('Oura');\n  });\n\n  it('falls back to in-bed only data with lower confidence and ignores broken samples', () => {\n    const raw = [\n      { startDate: iso('2025-05-13', '23:00'), endDate: iso('2025-05-14', '07:00'), value: 'INBED' as const },\n      { startDate: 'garbage', endDate: 'garbage', value: 'ASLEEP' as const },\n      { startDate: iso('2025-05-14', '07:00'), endDate: iso('2025-05-14', '06:00'), value: 'ASLEEP' as const },\n    ];\n    const s = samplesToSessions(raw, { source: 'healthkit', timezone: TZ, now: NOW });\n    expect(s).toHaveLength(1);\n    expect(s[0].confidence).toBe(0.5);\n    expect(s[0].asleepMinutes).toBe(480);\n    expect(s[0].sourceDetail).toBeNull();\n  });\n\n  it('drops sessions that end in the future and handles empty input', () => {\n    const raw = [{ startDate: iso('2025-05-14', '11:00'), endDate: iso('2025-05-14', '20:00'), value: 'ASLEEP' as const }];\n    expect(samplesToSessions(raw, { source: 'healthkit', timezone: TZ, now: NOW })).toEqual([]);\n    expect(samplesToSessions([], { source: 'healthkit', timezone: TZ })).toEqual([]);\n  });\n});\n\ndescribe('Health Connect conversion', () => {\n  it('sums asleep stages and ignores awake stages', () => {\n    const rec = {\n      startTime: iso('2025-05-13', '23:00'),\n      endTime: iso('2025-05-14', '07:00'),\n      metadata: { dataOrigin: 'com.fitbit' },\n      stages: [\n        { startTime: iso('2025-05-13', '23:00'), endTime: iso('2025-05-14', '03:00'), stage: 4 },\n        { startTime: iso('2025-05-14', '03:00'), endTime: iso('2025-05-14', '03:30'), stage: 1 },\n        { startTime: iso('2025-05-14', '03:30'), endTime: iso('2025-05-14', '07:00'), stage: 5 },\n      ],\n    };\n    const [s] = healthConnectToSessions([rec], TZ);\n    expect(s.asleepMinutes).toBe(7.5 * 60);\n    expect(s.source).toBe('healthconnect');\n    expect(s.sourceDetail).toBe('com.fitbit');\n    expect(s.confidence).toBe(0.9);\n  });\n\n  it('uses the full duration without stages and skips invalid records', () => {\n    const recs = [\n      { startTime: iso('2025-05-13', '23:00'), endTime: iso('2025-05-14', '07:00') },\n      { startTime: 'x', endTime: 'y' },\n    ];\n    const s = healthConnectToSessions(recs, TZ);\n    expect(s).toHaveLength(1);\n    expect(s[0].asleepMinutes).toBe(480);\n    expect(s[0].confidence).toBe(0.7);\n    expect(s[0].sourceDetail).toBeNull();\n  });\n});\n\ndescribe('sync', () => {\n  it('imports 90 days from the mock provider and never overwrites edited nights', async () => {\n    const store = new MemoryStore();\n    const provider = new MockHealthProvider(TZ, 'rested');\n    expect(await provider.isAvailable()).toBe(true);\n    expect(await provider.requestPermissions()).toBe('granted');\n    const res = await syncHealth(store, provider, TZ, NOW);\n    expect(res.status).toBe('ok');\n    expect(res.imported).toBeGreaterThan(70);\n    const list = await store.listSessions();\n    expect(list.every((s) => s.source === 'demo')).toBe(true);\n    const first = list[list.length - 1];\n    await store.upsertSessions([{ ...first, userEdited: true, endAt: first.endAt + 1 }]);\n    await syncHealth(store, provider, TZ, NOW);\n    expect((await store.getSession(first.id))?.endAt).toBe(first.endAt + 1);\n  });\n\n  it('reports unavailable and error states without throwing', async () => {\n    const store = new MemoryStore();\n    const unavailable = { id: 'mock' as const, isAvailable: async () => false, requestPermissions: async () => 'unavailable' as const, fetchSleep: async () => [] };\n    expect((await syncHealth(store, unavailable, TZ, NOW)).status).toBe('unavailable');\n    const broken = { ...unavailable, isAvailable: async () => true, fetchSleep: async () => { throw new Error('boom'); } };\n    expect((await syncHealth(store, broken, TZ, NOW)).status).toBe('error');\n  });\n\n  it('syncs Health Connect style providers through their record API', async () => {\n    const store = new MemoryStore();\n    const hc = {\n      id: 'healthconnect' as const,\n      isAvailable: async () => true,\n      requestPermissions: async () => 'granted' as const,\n      fetchSleep: async () => [],\n      fetchSleepRecords: async () => [{ startTime: iso('2025-05-13', '23:00'), endTime: iso('2025-05-14', '07:00') }],\n    };\n    const res = await syncHealth(store, hc, TZ, NOW);\n    expect(res.imported).toBe(1);\n  });\n\n  it('syncs HealthKit style samples', async () => {\n    const store = new MemoryStore();\n    const kit = {\n      id: 'healthkit' as const,\n      isAvailable: async () => true,\n      requestPermissions: async () => 'granted' as const,\n      fetchSleep: async () => [{ startDate: iso('2025-05-13', '23:00'), endDate: iso('2025-05-14', '07:00'), value: 'ASLEEP' as const, sourceName: 'Watch' }],\n    };\n    expect((await syncHealth(store, kit, TZ, NOW)).imported).toBe(1);\n    expect((await store.listSessions())[0].source).toBe('healthkit');\n  });\n\n  it('picks the demo provider on web/jest and handles denied permissions', async () => {\n    const p = getHealthProvider(TZ);\n    expect(['mock', 'healthkit', 'healthconnect']).toContain(p.id);\n    const denied = new MockHealthProvider(TZ, 'rested', 'denied');\n    expect(await denied.requestPermissions()).toBe('denied');\n  });\n});\n"},{"path":"src/integrations/health/android.ts","content":"import { Platform } from 'react-native';\nimport type { HealthConnectSleepRecord } from './convert';\nimport type { HealthProvider, PermissionResult, RawSleepSample } from './types';\n\nfunction loadHC(): any | null {\n  if (Platform.OS !== 'android') return null;\n  try {\n    // eslint-disable-next-line @typescript-eslint/no-require-imports\n    return require('react-native-health-connect');\n  } catch {\n    return null;\n  }\n}\n\n/** Health Connect provider. Returns raw records through `fetchSleepRecords`. */\nexport class HealthConnectProvider implements HealthProvider {\n  readonly id = 'healthconnect' as const;\n  private hc = loadHC();\n\n  async isAvailable(): Promise\u003cboolean> {\n    if (!this.hc) return false;\n    try {\n      const status = await this.hc.getSdkStatus();\n      return status === this.hc.SdkAvailabilityStatus.SDK_AVAILABLE;\n    } catch {\n      return false;\n    }\n  }\n\n  async requestPermissions(): Promise\u003cPermissionResult> {\n    if (!this.hc) return 'unavailable';\n    try {\n      await this.hc.initialize();\n      const granted = await this.hc.requestPermission([{ accessType: 'read', recordType: 'SleepSession' }]);\n      return Array.isArray(granted) && granted.length > 0 ? 'granted' : 'denied';\n    } catch {\n      return 'unavailable';\n    }\n  }\n\n  async fetchSleepRecords(from: Date, to: Date): Promise\u003cHealthConnectSleepRecord[]> {\n    if (!this.hc) return [];\n    try {\n      const res = await this.hc.readRecords('SleepSession', {\n        timeRangeFilter: { operator: 'between', startTime: from.toISOString(), endTime: to.toISOString() },\n      });\n      return (res?.records ?? []) as HealthConnectSleepRecord[];\n    } catch {\n      return [];\n    }\n  }\n\n  /** Interface method: Health Connect sessions are converted separately, so samples are empty. */\n  async fetchSleep(): Promise\u003cRawSleepSample[]> {\n    return [];\n  }\n}\n"},{"path":"src/integrations/health/convert.ts","content":"import type { SleepSession } from '@/engine/types';\nimport { MERGE_GAP_MIN, MIN } from '@/engine/constants';\nimport type { RawSleepSample } from './types';\n\ntype Source = 'healthkit' | 'healthconnect';\n\ninterface Interval {\n  start: number;\n  end: number;\n}\n\nfunction mergeIntervals(list: Interval[], gap: number): Interval[] {\n  const sorted = [...list].sort((a, b) => a.start - b.start);\n  const out: Interval[] = [];\n  for (const iv of sorted) {\n    const last = out[out.length - 1];\n    if (last && iv.start \u003c= last.end + gap) last.end = Math.max(last.end, iv.end);\n    else out.push({ ...iv });\n  }\n  return out;\n}\n\nconst length = (list: Interval[]) => list.reduce((a, b) => a + (b.end - b.start), 0);\n\n/**\n * Turn raw health samples into sleep sessions (6).\n * \"asleep\" samples form sessions (merged across gaps of at most 45 min), \"inBed\" samples\n * frame them, and \"awake\" samples are ignored (wakefulness stays out of asleepMinutes).\n * Samples are grouped by source so that duplicates from several apps can be resolved later.\n */\nexport function samplesToSessions(\n  samples: RawSleepSample[],\n  opts: { source: Source; timezone: string; now?: number },\n): SleepSession[] {\n  const bySource = new Map\u003cstring, RawSleepSample[]>();\n  for (const s of samples) {\n    const key = s.sourceName ?? 'unknown';\n    const arr = bySource.get(key) ?? [];\n    arr.push(s);\n    bySource.set(key, arr);\n  }\n  const out: SleepSession[] = [];\n  const now = opts.now ?? Date.now();\n  for (const [name, list] of bySource) {\n    const asleep: Interval[] = [];\n    const inBed: Interval[] = [];\n    for (const s of list) {\n      const start = Date.parse(s.startDate);\n      const end = Date.parse(s.endDate);\n      if (!Number.isFinite(start) || !Number.isFinite(end) || end \u003c= start) continue;\n      if (s.value === 'ASLEEP') asleep.push({ start, end });\n      else if (s.value === 'INBED') inBed.push({ start, end });\n    }\n    const frames = mergeIntervals(inBed, MERGE_GAP_MIN * MIN);\n    // If a source only reports \"in bed\", treat it as sleep (with lower confidence).\n    const onlyInBed = asleep.length === 0;\n    const basis = mergeIntervals(onlyInBed ? inBed : asleep, MERGE_GAP_MIN * MIN);\n    for (const group of basis) {\n      const parts = (onlyInBed ? inBed : asleep).filter((p) => p.start >= group.start && p.end \u003c= group.end);\n      const asleepMs = onlyInBed ? group.end - group.start : length(mergeIntervals(parts, 0));\n      const frame = onlyInBed ? undefined : frames.find((f) => f.start \u003c= group.end && f.end >= group.start);\n      const start = frame ? Math.min(frame.start, group.start) : group.start;\n      const end = frame ? Math.max(frame.end, group.end) : group.end;\n      if (end > now + MIN) continue;\n      out.push({\n        id: `${opts.source === 'healthkit' ? 'hk' : 'hc'}-${name}-${group.start}`,\n        startAt: start,\n        endAt: end,\n        asleepMinutes: Math.round(asleepMs / MIN),\n        source: opts.source,\n        sourceDetail: name === 'unknown' ? null : name,\n        confidence: onlyInBed ? 0.5 : 0.9,\n        isNap: false,\n        timezone: opts.timezone,\n        userEdited: false,\n      });\n    }\n  }\n  return out.sort((a, b) => a.startAt - b.startAt);\n}\n\n/** Health Connect sleep stage codes that count as asleep. */\nconst HC_ASLEEP_STAGES = new Set([2, 4, 5, 6]);\n\nexport interface HealthConnectSleepRecord {\n  startTime: string;\n  endTime: string;\n  stages?: { startTime: string; endTime: string; stage: number }[];\n  metadata?: { dataOrigin?: string };\n}\n\nexport function healthConnectToSessions(\n  records: HealthConnectSleepRecord[],\n  timezone: string,\n): SleepSession[] {\n  const out: SleepSession[] = [];\n  for (const r of records) {\n    const start = Date.parse(r.startTime);\n    const end = Date.parse(r.endTime);\n    if (!Number.isFinite(start) || !Number.isFinite(end) || end \u003c= start) continue;\n    let asleepMs = end - start;\n    if (r.stages && r.stages.length) {\n      asleepMs = r.stages\n        .filter((s) => HC_ASLEEP_STAGES.has(s.stage))\n        .reduce((a, s) => a + Math.max(0, Date.parse(s.endTime) - Date.parse(s.startTime)), 0);\n    }\n    out.push({\n      id: `hc-${r.metadata?.dataOrigin ?? 'unknown'}-${start}`,\n      startAt: start,\n      endAt: end,\n      asleepMinutes: Math.round(asleepMs / MIN),\n      source: 'healthconnect',\n      sourceDetail: r.metadata?.dataOrigin ?? null,\n      confidence: r.stages && r.stages.length ? 0.9 : 0.7,\n      isNap: false,\n      timezone,\n      userEdited: false,\n    });\n  }\n  return out.sort((a, b) => a.startAt - b.startAt);\n}\n"},{"path":"src/integrations/health/index.ts","content":"import { Platform } from 'react-native';\nimport type { DemoScenarioId } from '@/data/demo/generator';\nimport { HealthConnectProvider } from './android';\nimport { HealthKitProvider } from './ios';\nimport { MockHealthProvider } from './mock';\nimport type { HealthProvider } from './types';\n\nexport * from './types';\nexport { samplesToSessions, healthConnectToSessions } from './convert';\n\n/** Pick the provider for this platform. Web and unsupported devices use the demo provider. */\nexport function getHealthProvider(timezone: string, scenario: DemoScenarioId = 'rested'): HealthProvider {\n  if (Platform.OS === 'ios') return new HealthKitProvider();\n  if (Platform.OS === 'android') return new HealthConnectProvider();\n  return new MockHealthProvider(timezone, scenario);\n}\n"},{"path":"src/integrations/health/ios.ts","content":"import { Platform } from 'react-native';\nimport type { HealthProvider, PermissionResult, RawSleepSample, RawStepSample } from './types';\n\nfunction loadKit(): any | null {\n  if (Platform.OS !== 'ios') return null;\n  try {\n    // Loaded lazily so Expo Go / web never touch the native module.\n    // eslint-disable-next-line @typescript-eslint/no-require-imports\n    const mod = require('react-native-health');\n    return mod?.default ?? mod ?? null;\n  } catch {\n    return null;\n  }\n}\n\nconst SLEEP_VALUE: Record\u003cstring, RawSleepSample['value']> = {\n  INBED: 'INBED',\n  ASLEEP: 'ASLEEP',\n  AWAKE: 'AWAKE',\n  CORE: 'ASLEEP',\n  DEEP: 'ASLEEP',\n  REM: 'ASLEEP',\n  UNSPECIFIED: 'ASLEEP',\n};\n\n/** HealthKit provider via react-native-health (requires a development build). */\nexport class HealthKitProvider implements HealthProvider {\n  readonly id = 'healthkit' as const;\n  private kit = loadKit();\n\n  async isAvailable(): Promise\u003cboolean> {\n    if (!this.kit) return false;\n    return new Promise((resolve) => {\n      try {\n        this.kit.isAvailable((err: unknown, ok: boolean) => resolve(!err && !!ok));\n      } catch {\n        resolve(false);\n      }\n    });\n  }\n\n  async requestPermissions(): Promise\u003cPermissionResult> {\n    if (!this.kit) return 'unavailable';\n    return new Promise((resolve) => {\n      try {\n        const P = this.kit.Constants.Permissions;\n        this.kit.initHealthKit(\n          { permissions: { read: [P.SleepAnalysis, P.StepCount], write: [] } },\n          (err: unknown) => resolve(err ? 'denied' : 'granted'),\n        );\n      } catch {\n        resolve('unavailable');\n      }\n    });\n  }\n\n  async fetchSleep(from: Date, to: Date): Promise\u003cRawSleepSample[]> {\n    if (!this.kit) return [];\n    return new Promise((resolve) => {\n      try {\n        this.kit.getSleepSamples(\n          { startDate: from.toISOString(), endDate: to.toISOString(), limit: 10000, ascending: true },\n          (err: unknown, results: any[]) => {\n            if (err || !Array.isArray(results)) return resolve([]);\n            const out: RawSleepSample[] = [];\n            for (const r of results) {\n              const value = SLEEP_VALUE[String(r.value).toUpperCase()];\n              if (!value) continue;\n              out.push({\n                startDate: r.startDate,\n                endDate: r.endDate,\n                value,\n                sourceName: r.sourceName ?? undefined,\n              });\n            }\n            resolve(out);\n          },\n        );\n      } catch {\n        resolve([]);\n      }\n    });\n  }\n\n  async fetchSteps(from: Date, to: Date): Promise\u003cRawStepSample[]> {\n    if (!this.kit) return [];\n    return new Promise((resolve) => {\n      try {\n        this.kit.getDailyStepCountSamples(\n          { startDate: from.toISOString(), endDate: to.toISOString() },\n          (err: unknown, results: any[]) =>\n            resolve(\n              err || !Array.isArray(results)\n                ? []\n                : results.map((r) => ({ startDate: r.startDate, endDate: r.endDate, steps: r.value })),\n            ),\n        );\n      } catch {\n        resolve([]);\n      }\n    });\n  }\n}\n"},{"path":"src/integrations/health/mock.ts","content":"import { dateKey } from '@/engine/time';\nimport { generateDemoSessions, type DemoScenarioId } from '@/data/demo/generator';\nimport type { HealthProvider, PermissionResult, RawSleepSample } from './types';\n\n/** Mock provider backed by the demo generator (web preview, tests, declined permissions). */\nexport class MockHealthProvider implements HealthProvider {\n  readonly id = 'mock' as const;\n  constructor(\n    private timezone: string,\n    private scenario: DemoScenarioId = 'rested',\n    private grant: PermissionResult = 'granted',\n  ) {}\n  async isAvailable() {\n    return true;\n  }\n  async requestPermissions(): Promise\u003cPermissionResult> {\n    return this.grant;\n  }\n  async fetchSleep(from: Date, to: Date): Promise\u003cRawSleepSample[]> {\n    const lastKey = dateKey(to.getTime(), this.timezone);\n    const sessions = generateDemoSessions({\n      scenario: this.scenario,\n      lastWakeKey: lastKey,\n      tz: this.timezone,\n      nights: Math.max(1, Math.ceil((to.getTime() - from.getTime()) / 86_400_000)),\n    });\n    const out: RawSleepSample[] = [];\n    for (const s of sessions) {\n      if (s.endAt > to.getTime() || s.startAt \u003c from.getTime()) continue;\n      out.push({\n        startDate: new Date(s.startAt).toISOString(),\n        endDate: new Date(s.endAt).toISOString(),\n        value: 'INBED',\n        sourceName: 'Demo',\n      });\n      out.push({\n        startDate: new Date(s.startAt + 12 * 60_000).toISOString(),\n        endDate: new Date(s.endAt - 5 * 60_000).toISOString(),\n        value: 'ASLEEP',\n        sourceName: 'Demo',\n      });\n    }\n    return out;\n  }\n}\n\n"},{"path":"src/integrations/health/types.ts","content":"export type RawSleepValue = 'INBED' | 'ASLEEP' | 'AWAKE';\n\nexport interface RawSleepSample {\n  /** ISO date strings */\n  startDate: string;\n  endDate: string;\n  value: RawSleepValue;\n  sourceName?: string;\n}\n\nexport interface RawStepSample {\n  startDate: string;\n  endDate: string;\n  steps: number;\n}\n\nexport type PermissionResult = 'granted' | 'denied' | 'unavailable';\n\nexport interface HealthProvider {\n  readonly id: 'healthkit' | 'healthconnect' | 'mock';\n  isAvailable(): Promise\u003cboolean>;\n  requestPermissions(): Promise\u003cPermissionResult>;\n  fetchSleep(from: Date, to: Date): Promise\u003cRawSleepSample[]>;\n  fetchSteps?(from: Date, to: Date): Promise\u003cRawStepSample[]>;\n}\n"},{"path":"src/lib/format.ts","content":"import { formatClock, formatDuration } from '@/engine/time';\nimport { t } from '@/i18n';\nimport type { DayPhase, DayPlan } from '@/engine/dayPlan';\nimport type { DebtLevel } from '@/engine/types';\n\nexport { formatClock, formatDuration };\n\nexport function greeting(hour: number, name?: string | null): string {\n  const base =\n    hour \u003c 5 ? t('today.goodNight') : hour \u003c 11 ? t('today.goodMorning') : hour \u003c 18 ? t('today.goodDay') : hour \u003c 23 ? t('today.goodEvening') : t('today.goodNight');\n  return name ? `${base}, ${name}` : base;\n}\n\nexport function phaseEnd(plan: DayPlan, phase: DayPhase): number | null {\n  switch (phase) {\n    case 'grogginess':\n      return plan.features.grogginessEnd;\n    case 'morning_peak':\n      return plan.features.morningPeak.end;\n    case 'afternoon_dip':\n      return plan.features.afternoonDip.end;\n    case 'evening_peak':\n      return plan.features.eveningPeak.end;\n    default:\n      return null;\n  }\n}\n\nexport function phaseSentence(plan: DayPlan, phase: DayPhase, tz: string): string {\n  const end = phaseEnd(plan, phase);\n  return t(`phaseText.${phase}`, { end: end ? formatClock(end, tz) : '' });\n}\n\nexport function debtText(level: DebtLevel): string {\n  return t(`debt.${level}`);\n}\n\nexport const levelColorKey = (level: DebtLevel): 'good' | 'warn' | 'bad' =>\n  level === 'low' ? 'good' : level === 'medium' ? 'warn' : 'bad';\n\nexport function relativeIn(ms: number): string {\n  const min = Math.max(0, Math.round(ms / 60_000));\n  if (min \u003c 1) return 'jetzt';\n  return `In ${formatDuration(min)}`;\n}\n"},{"path":"src/lib/noise.ts","content":"export type NoiseKind = 'rain' | 'noise' | 'waves' | 'fan';\n\nexport const NOISE_LABELS: Record\u003cNoiseKind, string> = {\n  rain: 'Regen',\n  noise: 'Rauschen',\n  waves: 'Wellen',\n  fan: 'Ventilator',\n};\n\n/** Small deterministic PRNG. */\nfunction rng(seed: number) {\n  let a = seed >>> 0;\n  return () => {\n    a = (a + 0x6d2b79f5) | 0;\n    let t = Math.imul(a ^ (a >>> 15), 1 | a);\n    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;\n    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n  };\n}\n\n/** Generate seamlessly looping noise samples in [-1, 1]. */\nexport function generateNoise(kind: NoiseKind, seconds = 10, sampleRate = 16000): Float32Array {\n  const n = Math.floor(seconds * sampleRate);\n  const pad = Math.floor(sampleRate * 0.5); // crossfade length\n  const total = n + pad;\n  const r = rng(kind.length * 977 + 13);\n  const raw = new Float32Array(total);\n  let lp = 0;\n  let lp2 = 0;\n  let brown = 0;\n  let b0 = 0;\n  let b1 = 0;\n  let b2 = 0;\n  for (let i = 0; i \u003c total; i++) {\n    const white = r() * 2 - 1;\n    let v = 0;\n    switch (kind) {\n      case 'noise': {\n        // pink noise (Paul Kellet's filter)\n        b0 = 0.99765 * b0 + white * 0.099046;\n        b1 = 0.963 * b1 + white * 0.2965164;\n        b2 = 0.57 * b2 + white * 1.0526913;\n        v = (b0 + b1 + b2 + white * 0.1848) * 0.2;\n        break;\n      }\n      case 'rain': {\n        lp += 0.35 * (white - lp);\n        const drop = r() \u003c 0.0008 ? (r() * 2 - 1) * 1.2 : 0;\n        v = (white - lp) * 0.45 + drop;\n        break;\n      }\n      case 'waves': {\n        brown = (brown + 0.02 * white) / 1.02;\n        lp += 0.05 * (brown * 6 - lp);\n        const swell = 0.55 + 0.45 * Math.sin((2 * Math.PI * i) / (sampleRate * (seconds / 2)));\n        v = lp * swell * 1.6;\n        break;\n      }\n      case 'fan': {\n        lp += 0.08 * (white - lp);\n        lp2 += 0.01 * (white - lp2);\n        v = lp * 0.5 + lp2 * 1.2 + 0.08 * Math.sin((2 * Math.PI * 110 * i) / sampleRate);\n        break;\n      }\n    }\n    raw[i] = v;\n  }\n  // Crossfade the tail into the head so the loop has no click.\n  const out = new Float32Array(n);\n  for (let i = 0; i \u003c n; i++) out[i] = raw[i];\n  for (let i = 0; i \u003c pad; i++) {\n    const w = i / pad;\n    out[i] = raw[i] * w + raw[n + i] * (1 - w);\n  }\n  // Normalise to a comfortable peak.\n  let peak = 0;\n  for (let i = 0; i \u003c n; i++) peak = Math.max(peak, Math.abs(out[i]));\n  const gain = peak > 0 ? 0.6 / peak : 1;\n  for (let i = 0; i \u003c n; i++) out[i] *= gain;\n  return out;\n}\n\n/** Encode samples as a 16-bit mono PCM WAV file. */\nexport function encodeWav(samples: Float32Array, sampleRate = 16000): Uint8Array {\n  const bytes = new Uint8Array(44 + samples.length * 2);\n  const view = new DataView(bytes.buffer);\n  const write = (o: number, s: string) => {\n    for (let i = 0; i \u003c s.length; i++) view.setUint8(o + i, s.charCodeAt(i));\n  };\n  write(0, 'RIFF');\n  view.setUint32(4, 36 + samples.length * 2, true);\n  write(8, 'WAVE');\n  write(12, 'fmt ');\n  view.setUint32(16, 16, true);\n  view.setUint16(20, 1, true);\n  view.setUint16(22, 1, true);\n  view.setUint32(24, sampleRate, true);\n  view.setUint32(28, sampleRate * 2, true);\n  view.setUint16(32, 2, true);\n  view.setUint16(34, 16, true);\n  write(36, 'data');\n  view.setUint32(40, samples.length * 2, true);\n  for (let i = 0; i \u003c samples.length; i++) {\n    const s = Math.max(-1, Math.min(1, samples[i]));\n    view.setInt16(44 + i * 2, Math.round(s * 32767), true);\n  }\n  return bytes;\n}\n\nexport function makeNoiseWav(kind: NoiseKind, seconds = 10, sampleRate = 16000): Uint8Array {\n  return encodeWav(generateNoise(kind, seconds, sampleRate), sampleRate);\n}\n\nexport type BreathPhase = 'inhale' | 'hold' | 'exhale';\nexport const BREATH = { inhale: 4, hold: 7, exhale: 8 } as const;\nexport const BREATH_CYCLE_S = BREATH.inhale + BREATH.hold + BREATH.exhale;\n\n/** Phase, seconds left in the phase, circle scale (0.5..1) and cycle count for an elapsed time. */\nexport function breathState(elapsedMs: number): { phase: BreathPhase; remaining: number; scale: number; cycle: number } {\n  const s = elapsedMs / 1000;\n  const cycle = Math.floor(s / BREATH_CYCLE_S);\n  const c = s - cycle * BREATH_CYCLE_S;\n  if (c \u003c BREATH.inhale) return { phase: 'inhale', remaining: BREATH.inhale - c, scale: 0.5 + 0.5 * (c / BREATH.inhale), cycle };\n  if (c \u003c BREATH.inhale + BREATH.hold) return { phase: 'hold', remaining: BREATH.inhale + BREATH.hold - c, scale: 1, cycle };\n  const e = c - BREATH.inhale - BREATH.hold;\n  return { phase: 'exhale', remaining: BREATH_CYCLE_S - c, scale: 1 - 0.5 * (e / BREATH.exhale), cycle };\n}\n\n/** Volume multiplier for a sleep timer fade during the last `fadeS` seconds. */\nexport function fadeVolume(remainingS: number, fadeS = 20): number {\n  if (remainingS \u003c= 0) return 0;\n  return Math.min(1, remainingS / fadeS);\n}\n"},{"path":"src/services/__tests__/calendarLogic.test.ts","content":"import { findConflicts, type CalendarItem } from '../calendarLogic';\nimport { localTimeToMs } from '@/engine/time';\nimport type { DayWindow } from '@/engine/types';\n\nconst TZ = 'Europe/Berlin';\nconst at = (h: string) => localTimeToMs('2025-05-14', h, TZ);\nconst dip: DayWindow = { kind: 'afternoon_dip', start: at('14:00'), end: at('15:30'), point: false };\nconst peak: DayWindow = { kind: 'morning_peak', start: at('09:30'), end: at('11:00'), point: false };\nconst stop: DayWindow = { kind: 'caffeine_stop', start: at('14:30'), end: at('14:30'), point: true };\nconst ev = (id: string, s: string, e: string, extra: Partial\u003cCalendarItem> = {}): CalendarItem => ({ id, title: id, start: at(s), end: at(e), ...extra });\n\ndescribe('calendar conflicts', () => {\n  it('flags a meeting inside the afternoon dip', () => {\n    const c = findConflicts([ev('m', '14:30', '15:30')], [peak, dip], TZ);\n    expect(c).toHaveLength(1);\n    expect(c[0].message).toBe('Dein Termin um 14:30 liegt im Nachmittagstief.');\n  });\n\n  it('ignores meetings in a peak, all-day events, point windows and small overlaps', () => {\n    expect(findConflicts([ev('a', '09:45', '10:30')], [peak, dip], TZ)).toEqual([]);\n    expect(findConflicts([ev('b', '00:00', '23:59', { allDay: true })], [dip], TZ)).toEqual([]);\n    expect(findConflicts([ev('c', '14:20', '14:40')], [stop], TZ)).toEqual([]);\n    expect(findConflicts([ev('d', '15:25', '17:00')], [dip], TZ)).toEqual([]);\n  });\n\n  it('flags the groggy phase as well and reports each event once', () => {\n    const groggy: DayWindow = { kind: 'grogginess', start: at('07:00'), end: at('08:15'), point: false };\n    const c = findConflicts([ev('e', '07:30', '08:00')], [groggy, dip], TZ);\n    expect(c).toHaveLength(1);\n    expect(c[0].message).toContain('Benommenheit');\n  });\n});\n"},{"path":"src/services/__tests__/notificationPlan.test.ts","content":"import { defaultHabits } from '@/content/habits';\nimport { constantNights, makeProfile, TZ } from '@/engine/__tests__/fixtures';\nimport { localTimeToMs, formatClock } from '@/engine/time';\nimport { MAX_SCHEDULED, planReminders } from '../notificationPlan';\nimport { computeDayPlan } from '@/engine/dayPlan';\n\nconst TODAY = '2025-05-14';\nconst profile = makeProfile();\nconst sessions = constantNights(TODAY, 20, 480);\nconst now = localTimeToMs(TODAY, '08:00', TZ);\n\ndescribe('planReminders', () => {\n  it('plans today and the following days within the iOS limit', () => {\n    const r = planReminders({ profile, sessions, habits: defaultHabits(), now });\n    expect(r.length).toBeGreaterThan(10);\n    expect(r.length).toBeLessThanOrEqual(MAX_SCHEDULED);\n    const sorted = [...r].sort((a, b) => a.at - b.at);\n    expect(r).toEqual(sorted);\n    for (const x of r) expect(x.at).toBeGreaterThan(now);\n    const dates = new Set(r.map((x) => x.date));\n    expect(dates.size).toBeGreaterThanOrEqual(6);\n  });\n\n  it('only includes habits that are enabled with reminders and anchors them to the windows', () => {\n    const habits = defaultHabits().map((h) => ({ ...h, enabled: h.key === 'caffeine_cutoff', reminderEnabled: true }));\n    const r = planReminders({ profile, sessions, habits, now, days: 1 });\n    expect(r.every((x) => x.kind === 'caffeine_cutoff')).toBe(true);\n    const plan = computeDayPlan({ sessions, profile, now });\n    const stop = plan.windows.find((w) => w.kind === 'caffeine_stop')!;\n    expect(r[0].at).toBe(stop.start - 30 * 60_000);\n    expect(formatClock(r[0].at, TZ)).toMatch(/^\\d\\d:\\d\\d$/);\n  });\n\n  it('plans nothing after bedtime (quiet hours) on the same day', () => {\n    const late = localTimeToMs(TODAY, '23:30', TZ);\n    const habits = defaultHabits().map((h) => ({ ...h, enabled: true, reminderEnabled: true }));\n    const r = planReminders({ profile, sessions, habits, now: late, days: 1 });\n    expect(r.filter((x) => x.date === TODAY)).toEqual([]);\n  });\n\n  it('adds a morning quick check when enabled', () => {\n    const habits = defaultHabits().map((h) => ({ ...h, reminderEnabled: false }));\n    const r = planReminders({ profile, sessions, habits, now, days: 3, morningCheck: true });\n    expect(r.filter((x) => x.kind === 'sleep_check').length).toBeGreaterThanOrEqual(2);\n  });\n\n  it('caps the plan at seven days and 60 notifications', () => {\n    const habits = defaultHabits().map((h) => ({ ...h, enabled: true, reminderEnabled: true }));\n    const r = planReminders({ profile, sessions, habits, now, days: 30, morningCheck: true });\n    expect(r.length).toBeLessThanOrEqual(MAX_SCHEDULED);\n    expect(new Set(r.map((x) => x.date)).size).toBeLessThanOrEqual(8);\n  });\n\n  it('skips reminders whose window is missing and ignores disabled habits', () => {\n    const habits = defaultHabits().map((h) => ({ ...h, enabled: false }));\n    expect(planReminders({ profile, sessions, habits, now, days: 2 })).toEqual([]);\n  });\n});\n"},{"path":"src/services/__tests__/summaryCache.test.ts","content":"import { MemoryStore } from '@/data/memoryStore';\nimport { computeDayPlan } from '@/engine/dayPlan';\nimport { ENGINE_VERSION } from '@/engine/constants';\nimport { constantNights, makeProfile, nap, TZ } from '@/engine/__tests__/fixtures';\nimport { localTimeToMs } from '@/engine/time';\nimport { cacheSummary, toSummary } from '../summaryCache';\n\nconst now = localTimeToMs('2025-05-14', '15:00', TZ);\nconst profile = makeProfile();\nconst sessions = [...constantNights('2025-05-14', 20, 450), nap('2025-05-14', '14:00', '14:30')];\nconst plan = computeDayPlan({ sessions, profile, now });\n\ndescribe('daily summary cache', () => {\n  it('summarises the day', () => {\n    const s = toSummary(plan, sessions, profile, now);\n    expect(s.date).toBe('2025-05-14');\n    expect(s.totalSleepMinutes).toBe(450);\n    expect(s.napMinutes).toBe(30);\n    expect(s.engineVersion).toBe(ENGINE_VERSION);\n    expect(JSON.parse(s.energyCurveJson).length).toBeGreaterThan(200);\n    expect(JSON.parse(s.windowsJson).length).toBeGreaterThan(8);\n  });\n\n  it('writes once, reuses a fresh row and recomputes after an engine version change', async () => {\n    const store = new MemoryStore();\n    expect(await cacheSummary(store, plan, sessions, profile, now)).toBe('written');\n    expect(await cacheSummary(store, plan, sessions, profile, now)).toBe('fresh');\n    const row = await store.getSummary('2025-05-14');\n    await store.saveSummary({ ...row!, engineVersion: ENGINE_VERSION - 1 });\n    expect(await cacheSummary(store, plan, sessions, profile, now)).toBe('written');\n    expect((await store.getSummary('2025-05-14'))?.engineVersion).toBe(ENGINE_VERSION);\n    await store.clearSummaries();\n    expect(await cacheSummary(store, plan, sessions, profile, now)).toBe('written');\n  });\n\n  it('handles days without sleep data', () => {\n    const empty = computeDayPlan({ sessions: [], profile, now });\n    const s = toSummary(empty, [], profile, now);\n    expect(s.totalSleepMinutes).toBe(0);\n  });\n});\n"},{"path":"src/services/__tests__/widgetSnapshot.test.ts","content":"import { computeDayPlan } from '@/engine/dayPlan';\nimport { constantNights, makeProfile, TZ } from '@/engine/__tests__/fixtures';\nimport { localTimeToMs } from '@/engine/time';\nimport { buildWidgetSnapshot } from '../widgetSnapshot';\n\ndescribe('widget snapshot', () => {\n  it('summarises the day for a widget', () => {\n    const now = localTimeToMs('2025-05-14', '10:00', TZ);\n    const plan = computeDayPlan({ sessions: constantNights('2025-05-14', 20, 450), profile: makeProfile(), now });\n    const snap = buildWidgetSnapshot(plan, now);\n    expect(snap.version).toBe(1);\n    expect(snap.curve.length).toBeGreaterThanOrEqual(20);\n    expect(snap.curve.length).toBeLessThanOrEqual(30);\n    expect(snap.debtMinutes).toBe(Math.round(plan.debt.debtMinutes));\n    expect(snap.next?.at).toBeGreaterThan(now);\n    expect(JSON.parse(JSON.stringify(snap))).toEqual(snap);\n  });\n});\n"},{"path":"src/services/background.ts","content":"import * as BackgroundTask from 'expo-background-task';\nimport * as TaskManager from 'expo-task-manager';\nimport { Platform } from 'react-native';\nimport { dataStore, deviceTimezone } from '@/state/app';\nimport { getHealthProvider } from '@/integrations/health';\nimport { planReminders } from './notificationPlan';\nimport { hasNotificationPermission, scheduleReminders } from './notifications';\nimport { syncHealth } from './sync';\n\nexport const BACKGROUND_TASK = 'tagwerk-background-sync';\n\n/** Best effort: sync sleep data and re-plan the reminders while the app is closed. */\nTaskManager.defineTask(BACKGROUND_TASK, async () => {\n  try {\n    const profile = await dataStore.getProfile();\n    if (!profile) return BackgroundTask.BackgroundTaskResult.Success;\n    const tz = profile.timezone || deviceTimezone();\n    await syncHealth(dataStore, getHealthProvider(tz), tz);\n    if (await hasNotificationPermission()) {\n      const [sessions, habits, morning] = await Promise.all([\n        dataStore.listSessions(),\n        dataStore.listHabits(),\n        dataStore.getSetting('morning_check'),\n      ]);\n      await scheduleReminders(planReminders({ profile, sessions, habits, now: Date.now(), morningCheck: morning === '1' }));\n    }\n    return BackgroundTask.BackgroundTaskResult.Success;\n  } catch {\n    return BackgroundTask.BackgroundTaskResult.Failed;\n  }\n});\n\nexport async function registerBackgroundSync(): Promise\u003cvoid> {\n  if (Platform.OS === 'web') return;\n  try {\n    const status = await BackgroundTask.getStatusAsync();\n    if (status !== BackgroundTask.BackgroundTaskStatus.Available) return;\n    if (await TaskManager.isTaskRegisteredAsync(BACKGROUND_TASK)) return;\n    await BackgroundTask.registerTaskAsync(BACKGROUND_TASK, { minimumInterval: 12 * 60 });\n  } catch {\n    /* background work is optional */\n  }\n}\n\n"},{"path":"src/services/calendar.ts","content":"import * as Calendar from 'expo-calendar';\nimport { Platform } from 'react-native';\nimport { t } from '@/i18n';\nimport type { DayPlan } from '@/engine/dayPlan';\nimport { EXPORT_KINDS, type CalendarItem } from './calendarLogic';\n\nconst supported = () => Platform.OS === 'ios' || Platform.OS === 'android';\nconst OWN_CALENDAR = 'Tagwerk';\n\nexport async function requestCalendarAccess(): Promise\u003cboolean> {\n  if (!supported()) return false;\n  try {\n    return (await Calendar.requestCalendarPermissions()).granted;\n  } catch {\n    return false;\n  }\n}\n\nexport async function hasCalendarAccess(): Promise\u003cboolean> {\n  if (!supported()) return false;\n  try {\n    return (await Calendar.getCalendarPermissions()).granted;\n  } catch {\n    return false;\n  }\n}\n\n/** Events of the user's calendars (without the Tagwerk calendar) in a time range. */\nexport async function loadEvents(from: number, to: number): Promise\u003cCalendarItem[]> {\n  if (!(await hasCalendarAccess())) return [];\n  try {\n    const cals = (await Calendar.getCalendars(Calendar.EntityTypes.EVENT)).filter((c) => c.title !== OWN_CALENDAR);\n    const out: CalendarItem[] = [];\n    for (const c of cals) {\n      const events = await c.listEvents(new Date(from), new Date(to));\n      for (const e of events) {\n        out.push({\n          id: e.id,\n          title: e.title,\n          start: new Date(e.startDate).getTime(),\n          end: new Date(e.endDate).getTime(),\n          allDay: e.allDay,\n        });\n      }\n    }\n    return out.sort((a, b) => a.start - b.start);\n  } catch {\n    return [];\n  }\n}\n\nasync function getOrCreateOwnCalendar() {\n  const cals = await Calendar.getCalendars(Calendar.EntityTypes.EVENT);\n  const existing = cals.find((c) => c.title === OWN_CALENDAR);\n  if (existing) return existing;\n  const details = {\n    title: OWN_CALENDAR,\n    name: OWN_CALENDAR,\n    color: '#FFB547',\n    entityType: Calendar.EntityTypes.EVENT,\n    accessLevel: Calendar.CalendarAccessLevel.OWNER,\n    ownerAccount: 'local',\n  };\n  if (Platform.OS === 'ios') {\n    const def = Calendar.getDefaultCalendarSync();\n    Object.assign(details, { source: def.source, sourceId: def.source?.id });\n  } else {\n    Object.assign(details, { source: { isLocalAccount: true, name: OWN_CALENDAR, type: 'LOCAL' } });\n  }\n  return Calendar.createCalendar(details);\n}\n\n/** Write the day's energy windows into a dedicated \"Tagwerk\" calendar (opt-in). Returns the event count. */\nexport async function exportWindowsToCalendar(plan: DayPlan): Promise\u003cnumber> {\n  if (!(await requestCalendarAccess())) return 0;\n  try {\n    const cal = await getOrCreateOwnCalendar();\n    const existing = await cal.listEvents(new Date(plan.wakeAt - 3_600_000), new Date(plan.bedtime.bedtime + 3 * 3_600_000));\n    const taken = new Set(existing.map((e) => `${e.title}|${new Date(e.startDate).getTime()}`));\n    let n = 0;\n    for (const w of plan.windows) {\n      if (!EXPORT_KINDS.includes(w.kind)) continue;\n      const title = t(`windows.${w.kind}`);\n      if (taken.has(`${title}|${w.start}`)) continue;\n      await cal.createEvent({\n        title,\n        startDate: new Date(w.start),\n        endDate: new Date(w.end),\n        notes: t(`windowText.${w.kind}`),\n        allDay: false,\n      });\n      n++;\n    }\n    return n;\n  } catch {\n    return 0;\n  }\n}\n"},{"path":"src/services/calendarLogic.ts","content":"import type { DayWindow, WindowKind } from '@/engine/types';\nimport { formatClock } from '@/engine/time';\nimport { t } from '@/i18n';\n\nexport interface CalendarItem {\n  id: string;\n  title: string;\n  start: number;\n  end: number;\n  allDay?: boolean;\n}\n\nexport interface Conflict {\n  event: CalendarItem;\n  window: DayWindow;\n  message: string;\n}\n\nconst CONFLICT_KINDS: WindowKind[] = ['afternoon_dip', 'grogginess'];\n\n/** Meetings that fall into the afternoon dip or the groggy phase deserve a warning. */\nexport function findConflicts(events: CalendarItem[], windows: DayWindow[], tz: string): Conflict[] {\n  const out: Conflict[] = [];\n  for (const ev of events) {\n    if (ev.allDay) continue;\n    for (const w of windows) {\n      if (!CONFLICT_KINDS.includes(w.kind) || w.point) continue;\n      const overlap = Math.min(ev.end, w.end) - Math.max(ev.start, w.start);\n      if (overlap > 0 && overlap >= Math.min(ev.end - ev.start, w.end - w.start) * 0.5) {\n        out.push({\n          event: ev,\n          window: w,\n          message: t('schedule.conflict', { time: formatClock(ev.start, tz), window: t(`windows.${w.kind}`) }),\n        });\n        break;\n      }\n    }\n  }\n  return out;\n}\n\n/** Windows worth putting into a calendar. */\nexport const EXPORT_KINDS: WindowKind[] = ['morning_peak', 'afternoon_dip', 'evening_peak', 'melatonin'];\n"},{"path":"src/services/notificationPlan.ts","content":"import type { Habit } from '@/data/types';\nimport { HABIT_BY_KEY, type HabitMeta } from '@/content/habits';\nimport { computeDayPlan, computeTomorrowPlan, type DayPlan } from '@/engine/dayPlan';\nimport { MIN } from '@/engine/constants';\nimport type { Profile, SleepSession } from '@/engine/types';\n\nexport interface PlannedReminder {\n  id: string;\n  /** habit key or 'sleep_check' */\n  kind: string;\n  at: number;\n  /** local date of the plan day (for habit logs) */\n  date: string;\n  title: string;\n  body: string;\n}\n\nexport const MAX_SCHEDULED = 60; // iOS keeps at most 64 pending local notifications\nexport const PLAN_DAYS = 7;\n\nfunction anchorTime(meta: HabitMeta, plan: DayPlan): number | null {\n  if (meta.anchor === 'wake') return plan.wakeAt;\n  const w = plan.windows.find((x) => x.kind === meta.anchor);\n  return w ? w.start : null;\n}\n\nexport interface PlanOptions {\n  profile: Profile;\n  sessions: SleepSession[];\n  habits: Habit[];\n  now: number;\n  days?: number;\n  morningCheck?: boolean;\n}\n\n/**\n * Plan reminders for the next days. Each following day is computed assuming a full night at\n * the recommended bedtime. Nothing is scheduled between bedtime and waking up (quiet hours).\n */\nexport function planReminders(opts: PlanOptions): PlannedReminder[] {\n  const days = Math.min(opts.days ?? PLAN_DAYS, PLAN_DAYS);\n  const tz = opts.profile.timezone;\n  const out: PlannedReminder[] = [];\n  const enabled = opts.habits.filter((h) => h.enabled && h.reminderEnabled);\n  let sessions = opts.sessions;\n  let now = opts.now;\n  let plan = computeDayPlan({ sessions, profile: opts.profile, now });\n\n  for (let d = 0; d \u003c days; d++) {\n    const quietStart = plan.bedtime.bedtime;\n    for (const h of enabled) {\n      const meta = HABIT_BY_KEY[h.key];\n      const anchor = anchorTime(meta, plan);\n      if (anchor == null) continue;\n      const at = anchor + h.reminderOffsetMin * MIN;\n      if (at \u003c= opts.now + MIN || at > quietStart + 5 * MIN) continue;\n      out.push({\n        id: `${h.key}-${plan.date}`,\n        kind: h.key,\n        at,\n        date: plan.date,\n        title: meta.notification.title,\n        body: meta.notification.body,\n      });\n    }\n    if (opts.morningCheck) {\n      const at = plan.wakeAt + 30 * MIN;\n      if (at > opts.now + MIN)\n        out.push({\n          id: `sleep_check-${plan.date}`,\n          kind: 'sleep_check',\n          at,\n          date: plan.date,\n          title: '🌅 Guten Morgen',\n          body: 'Wann bist du eingeschlafen und aufgewacht? Tippe, um die Nacht zu bestätigen.',\n        });\n    }\n    if (d === days - 1) break;\n    const next = computeTomorrowPlan({ sessions, profile: opts.profile, now }, plan);\n    // chain: tomorrow becomes today for the following iteration\n    const simulated: SleepSession = {\n      id: `sim-${d}`,\n      startAt: plan.bedtime.bedtime + 15 * MIN,\n      endAt: plan.bedtime.wakeAt,\n      asleepMinutes: null,\n      source: 'manual',\n      confidence: 1,\n      isNap: false,\n      timezone: tz,\n      userEdited: true,\n    };\n    sessions = [...sessions, simulated];\n    now = plan.bedtime.wakeAt + 5 * MIN;\n    plan = next;\n  }\n  return out.sort((a, b) => a.at - b.at).slice(0, MAX_SCHEDULED);\n}\n"},{"path":"src/services/notifications.ts","content":"import * as Notifications from 'expo-notifications';\nimport { Platform } from 'react-native';\nimport type { PlannedReminder } from './notificationPlan';\n\nconst CATEGORY = 'habit';\nconst CHANNEL = 'reminders';\n\nconst supported = () => Platform.OS === 'ios' || Platform.OS === 'android';\n\nexport type ReminderAction = 'done' | 'skip' | 'later';\n\n/** Configure handler, action category and Android channel. Safe to call repeatedly. */\nexport async function setupNotifications(): Promise\u003cvoid> {\n  if (!supported()) return;\n  try {\n    Notifications.setNotificationHandler({\n      handleNotification: async () => ({\n        shouldPlaySound: false,\n        shouldSetBadge: false,\n        shouldShowBanner: true,\n        shouldShowList: true,\n      }),\n    });\n    await Notifications.setNotificationCategoryAsync(CATEGORY, [\n      { identifier: 'done', buttonTitle: 'Erledigt', options: { opensAppToForeground: false } },\n      { identifier: 'skip', buttonTitle: 'Heute nicht', options: { opensAppToForeground: false } },\n      { identifier: 'later', buttonTitle: 'Später', options: { opensAppToForeground: false } },\n    ]);\n    if (Platform.OS === 'android') {\n      await Notifications.setNotificationChannelAsync(CHANNEL, {\n        name: 'Erinnerungen',\n        // eslint-disable-next-line import/namespace\n        importance: Notifications.AndroidImportance.DEFAULT,\n      });\n    }\n  } catch {\n    /* notifications are optional, never crash the app */\n  }\n}\n\nexport async function requestNotificationPermission(): Promise\u003cboolean> {\n  if (!supported()) return false;\n  try {\n    const cur = await Notifications.getPermissionsAsync();\n    if (cur.granted) return true;\n    const res = await Notifications.requestPermissionsAsync();\n    return res.granted;\n  } catch {\n    return false;\n  }\n}\n\nexport async function hasNotificationPermission(): Promise\u003cboolean> {\n  if (!supported()) return false;\n  try {\n    return (await Notifications.getPermissionsAsync()).granted;\n  } catch {\n    return false;\n  }\n}\n\n/** Replace all pending local notifications with the given plan. Returns how many were scheduled. */\nexport async function scheduleReminders(reminders: PlannedReminder[]): Promise\u003cnumber> {\n  if (!supported()) return 0;\n  try {\n    await Notifications.cancelAllScheduledNotificationsAsync();\n    let n = 0;\n    for (const r of reminders) {\n      await Notifications.scheduleNotificationAsync({\n        identifier: r.id,\n        content: {\n          title: r.title,\n          body: r.body,\n          categoryIdentifier: r.kind === 'sleep_check' ? undefined : CATEGORY,\n          data: { kind: r.kind, date: r.date },\n        },\n        trigger: {\n          type: Notifications.SchedulableTriggerInputTypes.DATE,\n          date: new Date(r.at),\n          channelId: CHANNEL,\n        },\n      });\n      n++;\n    }\n    return n;\n  } catch {\n    return 0;\n  }\n}\n\nexport async function listScheduled(): Promise\u003c{ id: string; title: string; at: number | null }[]> {\n  if (!supported()) return [];\n  try {\n    const list = await Notifications.getAllScheduledNotificationsAsync();\n    return list\n      .map((n) => {\n        const trig = n.trigger as { value?: number | string; date?: number | string } | null;\n        const raw = trig?.value ?? trig?.date;\n        return { id: n.identifier, title: n.content.title ?? '', at: raw != null ? new Date(raw as number).getTime() : null };\n      })\n      .sort((a, b) => (a.at ?? 0) - (b.at ?? 0));\n  } catch {\n    return [];\n  }\n}\n\nexport interface ReminderResponse {\n  action: ReminderAction | 'open';\n  kind: string;\n  date: string;\n  title: string;\n  body: string;\n}\n\n/** Listen for taps on notification actions. Returns an unsubscribe function. */\nexport function attachResponseHandler(cb: (r: ReminderResponse) => void): () => void {\n  if (!supported()) return () => undefined;\n  try {\n    const sub = Notifications.addNotificationResponseReceivedListener((resp) => {\n      const content = resp.notification.request.content;\n      const data = (content.data ?? {}) as { kind?: string; date?: string };\n      const id = resp.actionIdentifier;\n      cb({\n        action: id === 'done' || id === 'skip' || id === 'later' ? id : 'open',\n        kind: data.kind ?? '',\n        date: data.date ?? '',\n        title: content.title ?? '',\n        body: content.body ?? '',\n      });\n    });\n    return () => sub.remove();\n  } catch {\n    return () => undefined;\n  }\n}\n\n/** Snooze: show the same reminder again in `minutes`. */\nexport async function snooze(r: { title: string; body: string; kind: string; date: string }, minutes = 30) {\n  if (!supported()) return;\n  try {\n    await Notifications.scheduleNotificationAsync({\n      content: { title: r.title, body: r.body, categoryIdentifier: CATEGORY, data: { kind: r.kind, date: r.date } },\n      trigger: { type: Notifications.SchedulableTriggerInputTypes.TIME_INTERVAL, seconds: minutes * 60, channelId: CHANNEL },\n    });\n  } catch {\n    /* ignore */\n  }\n}\n"},{"path":"src/services/sounds.ts","content":"import { createAudioPlayer, setAudioModeAsync, type AudioPlayer } from 'expo-audio';\nimport { File, Paths } from 'expo-file-system';\nimport { Platform } from 'react-native';\nimport { makeNoiseWav, type NoiseKind } from '@/lib/noise';\n\nconst cache = new Map\u003cNoiseKind, string>();\n\n/** Generate the noise file once and return a URI the audio player can use. */\nexport async function prepareSound(kind: NoiseKind): Promise\u003cstring> {\n  const hit = cache.get(kind);\n  if (hit) return hit;\n  const bytes = makeNoiseWav(kind, 10);\n  let uri: string;\n  if (Platform.OS === 'web') {\n    uri = URL.createObjectURL(new Blob([bytes.buffer as ArrayBuffer], { type: 'audio/wav' }));\n  } else {\n    const file = new File(Paths.cache, `tagwerk-${kind}.wav`);\n    if (!file.exists) {\n      file.create();\n      file.write(bytes);\n    }\n    uri = file.uri;\n  }\n  cache.set(kind, uri);\n  return uri;\n}\n\nexport async function startSound(kind: NoiseKind): Promise\u003cAudioPlayer> {\n  try {\n    await setAudioModeAsync({ playsInSilentMode: true, shouldPlayInBackground: true });\n  } catch {\n    /* audio mode is best effort */\n  }\n  const uri = await prepareSound(kind);\n  const player = createAudioPlayer({ uri });\n  player.loop = true;\n  player.volume = 1;\n  player.play();\n  return player;\n}\n"},{"path":"src/services/summaryCache.ts","content":"import type { DataStore, DailySummary } from '@/data/types';\nimport { buildSleepDays } from '@/engine/sleepDetection';\nimport { ENGINE_VERSION } from '@/engine/constants';\nimport type { DayPlan } from '@/engine/dayPlan';\nimport type { Profile, SleepSession } from '@/engine/types';\n\n/** Build the cache row for one waking day. */\nexport function toSummary(plan: DayPlan, sessions: SleepSession[], profile: Profile, now: number): DailySummary {\n  const day = buildSleepDays(sessions, profile.timezone, profile.workSchedule.shiftMode).get(plan.date);\n  return {\n    date: plan.date,\n    totalSleepMinutes: day?.mainMinutes ?? 0,\n    napMinutes: day?.napMinutes ?? 0,\n    sleepDebtMinutes: plan.debt.debtMinutes,\n    sleepNeedMinutes: plan.needMinutes,\n    energyCurveJson: JSON.stringify(plan.curve.points.map((p) => [p.t, Math.round(p.energy * 10) / 10])),\n    windowsJson: JSON.stringify(plan.windows),\n    computedAt: now,\n    engineVersion: ENGINE_VERSION,\n  };\n}\n\n/**\n * Write the summary only if there is none for that day or it was computed with another engine\n * version. Data changes clear the cache (see the store), so a hit is always current.\n */\nexport async function cacheSummary(\n  store: DataStore,\n  plan: DayPlan,\n  sessions: SleepSession[],\n  profile: Profile,\n  now: number,\n): Promise\u003c'written' | 'fresh'> {\n  const existing = await store.getSummary(plan.date);\n  if (existing && existing.engineVersion === ENGINE_VERSION) return 'fresh';\n  await store.saveSummary(toSummary(plan, sessions, profile, now));\n  return 'written';\n}\n"},{"path":"src/services/sync.ts","content":"import type { DataStore } from '@/data/types';\nimport { DAY } from '@/engine/constants';\nimport type { SleepSession } from '@/engine/types';\nimport { healthConnectToSessions, samplesToSessions } from '@/integrations/health/convert';\nimport type { HealthConnectProvider } from '@/integrations/health/android';\nimport type { HealthProvider } from '@/integrations/health/types';\n\nexport const IMPORT_DAYS = 90;\n\nexport interface SyncResult {\n  imported: number;\n  status: 'ok' | 'denied' | 'unavailable' | 'error';\n}\n\n/** Fetch up to 90 days of sleep from a provider and merge it into the store. */\nexport async function syncHealth(\n  store: DataStore,\n  provider: HealthProvider,\n  tz: string,\n  now = Date.now(),\n  days = IMPORT_DAYS,\n): Promise\u003cSyncResult> {\n  try {\n    if (!(await provider.isAvailable())) return { imported: 0, status: 'unavailable' };\n    const from = new Date(now - days * DAY);\n    const to = new Date(now);\n    let sessions: SleepSession[];\n    if (provider.id === 'healthconnect') {\n      const records = await (provider as HealthConnectProvider).fetchSleepRecords(from, to);\n      sessions = healthConnectToSessions(records, tz);\n    } else {\n      const raw = await provider.fetchSleep(from, to);\n      sessions = samplesToSessions(raw, {\n        source: 'healthkit',\n        timezone: tz,\n        now,\n      }).map((s) => (provider.id === 'mock' ? { ...s, source: 'demo' as const } : s));\n    }\n    // Never overwrite nights the user has edited.\n    const existing = await store.listSessions();\n    const edited = new Set(existing.filter((s) => s.userEdited).map((s) => s.id));\n    const fresh = sessions.filter((s) => !edited.has(s.id));\n    await store.upsertSessions(fresh);\n    return { imported: fresh.length, status: 'ok' };\n  } catch {\n    return { imported: 0, status: 'error' };\n  }\n}\n"},{"path":"src/services/widgetSnapshot.ts","content":"import type { DayPlan } from '@/engine/dayPlan';\n\nexport interface WidgetSnapshot {\n  version: 1;\n  updatedAt: number;\n  debtMinutes: number;\n  debtLevel: 'low' | 'medium' | 'high';\n  insufficientData: boolean;\n  energyNow: number;\n  bedtime: number;\n  next: { kind: string; at: number } | null;\n  /** about 24 points from waking up to bedtime, values 0..100 */\n  curve: number[];\n}\n\n/**\n * JSON snapshot for home-screen widgets. A native widget (WidgetKit via an App Group, or\n * react-native-android-widget) reads this file, see DECISIONS.md for the status.\n */\nexport function buildWidgetSnapshot(plan: DayPlan, now: number): WidgetSnapshot {\n  const pts = plan.curve.points.filter((p) => p.t \u003c= plan.bedtime.bedtime);\n  const stride = Math.max(1, Math.floor(pts.length / 24));\n  return {\n    version: 1,\n    updatedAt: now,\n    debtMinutes: Math.round(plan.debt.debtMinutes),\n    debtLevel: plan.debt.level,\n    insufficientData: plan.debt.insufficientData,\n    energyNow: Math.round(plan.currentEnergy),\n    bedtime: plan.bedtime.bedtime,\n    next: plan.nextEvent,\n    curve: pts.filter((_, i) => i % stride === 0).map((p) => Math.round(p.energy)),\n  };\n}\n\n"},{"path":"src/state/__tests__/app.test.ts","content":"import { parseBundle } from '@/data/exchange';\nimport { MemoryStore } from '@/data/memoryStore';\nimport { localTimeToMs } from '@/engine/time';\nimport { t } from '@/i18n';\nimport { dataStore, useApp, newProfile } from '../app';\n\njest.mock('@/data/db', () => {\n  // eslint-disable-next-line @typescript-eslint/no-require-imports\n  const { MemoryStore: Store } = require('@/data/memoryStore');\n  return { createStore: () => new Store() };\n});\njest.mock('@/integrations/health', () => {\n  // eslint-disable-next-line @typescript-eslint/no-require-imports\n  const { MockHealthProvider } = require('@/integrations/health/mock');\n  return { getHealthProvider: (tz: string) => new MockHealthProvider(tz, 'rested') };\n});\n\n\nconst TZ = 'Europe/Berlin';\nconst answers = { freeSleepStart: '00:30', freeWake: '08:30', workBed: '23:00', workWake: '07:00', peak: 'evening' as const, workDaysPerWeek: 5 };\n\nbeforeEach(async () => {\n  await dataStore.wipe();\n  useApp.setState({ ready: false, profile: null, sessions: [], habits: [], habitLogs: [] });\n});\n\ndescribe('app store', () => {\n  it('uses the in-memory store in tests', () => {\n    expect(dataStore).toBeInstanceOf(MemoryStore);\n  });\n\n  it('initialises with default habits and survives empty storage', async () => {\n    await useApp.getState().init();\n    const s = useApp.getState();\n    expect(s.ready).toBe(true);\n    expect(s.habits.length).toBe(9);\n    expect(s.profile).toBeNull();\n    expect(s.settings.theme).toBe('system');\n  });\n\n  it('loads a demo scenario and creates a profile without finishing onboarding', async () => {\n    await useApp.getState().init();\n    await useApp.getState().loadDemo('exam_week');\n    const s = useApp.getState();\n    expect(s.sessions.length).toBeGreaterThan(60);\n    expect(s.settings.demoScenario).toBe('exam_week');\n    expect(s.profile?.onboardingCompletedAt).toBeNull();\n    await useApp.getState().loadDemo('rested');\n    expect(useApp.getState().settings.demoScenario).toBe('rested');\n  });\n\n  it('runs the onboarding flow: chronotype, habits and completion', async () => {\n    await useApp.getState().init();\n    await useApp.getState().syncNow();\n    expect(useApp.getState().sessions.length).toBeGreaterThan(50);\n    await useApp.getState().applyOnboarding({\n      name: 'Zelda',\n      birthYear: 1995,\n      answers,\n      workSchedule: { workDays: [1, 2, 3, 4, 5], workStart: '09:00', workEnd: '17:00', shiftMode: false },\n      targetWakeTime: '07:00',\n      caffeineCutoffHours: 10,\n      habitReminders: { morning_light: true, powernap: false },\n      morningCheck: true,\n    });\n    let p = useApp.getState().profile!;\n    expect(p.name).toBe('Zelda');\n    expect(p.caffeineCutoffHours).toBe(10);\n    expect(p.chronotype).toBe('intermediate');\n    expect(useApp.getState().settings.morningCheck).toBe(true);\n    expect(useApp.getState().habits.find((h) => h.key === 'powernap')?.reminderEnabled).toBe(false);\n    expect(p.onboardingCompletedAt).toBeNull();\n    await useApp.getState().finishOnboarding();\n    p = useApp.getState().profile!;\n    expect(p.onboardingCompletedAt).not.toBeNull();\n    expect(p.sleepNeedMinutesEstimated).not.toBeNull();\n  });\n\n  it('adds, edits and deletes a night and keeps edited nights flagged', async () => {\n    await useApp.getState().init();\n    await useApp.getState().saveProfile(newProfile());\n    const start = localTimeToMs('2025-05-13', '23:00', TZ);\n    const end = localTimeToMs('2025-05-14', '07:00', TZ);\n    const id = await useApp.getState().saveNight({ startAt: start, endAt: end, isNap: false });\n    let s = useApp.getState();\n    expect(s.sessions).toHaveLength(1);\n    expect(s.sessions[0].source).toBe('manual');\n    expect(s.sessions[0].userEdited).toBe(true);\n    await useApp.getState().saveNight({ id, startAt: start, endAt: end + 30 * 60_000, isNap: false });\n    s = useApp.getState();\n    expect(s.sessions).toHaveLength(1);\n    expect(s.sessions[0].endAt).toBe(end + 30 * 60_000);\n    await useApp.getState().deleteNight(id);\n    expect(useApp.getState().sessions).toHaveLength(0);\n  });\n\n  it('logs habits and can clear a log', async () => {\n    await useApp.getState().init();\n    await useApp.getState().logHabit('bedtime', '2025-05-14', 'done');\n    expect(useApp.getState().habitLogs).toHaveLength(1);\n    await useApp.getState().logHabit('bedtime', '2025-05-14', 'skipped');\n    expect(useApp.getState().habitLogs[0].status).toBe('skipped');\n    await useApp.getState().logHabit('bedtime', '2025-05-14', null);\n    expect(useApp.getState().habitLogs).toHaveLength(0);\n    const h = useApp.getState().habits[0];\n    await useApp.getState().saveHabit({ ...h, enabled: !h.enabled });\n    expect(useApp.getState().habits.find((x) => x.key === h.key)?.enabled).toBe(!h.enabled);\n  });\n\n  it('persists settings and switches language', async () => {\n    await useApp.getState().init();\n    await useApp.getState().setSetting('theme', 'dark');\n    await useApp.getState().setSetting('lang', 'en');\n    await useApp.getState().setSetting('calendarOptIn', true);\n    await useApp.getState().setSetting('tipHistory', { '2025-05-14': ['nap'] });\n    expect(await dataStore.getSetting('theme')).toBe('dark');\n    expect(await dataStore.getSetting('calendar_optin')).toBe('1');\n    expect(t('tabs.today')).toBe('Today');\n    await useApp.getState().setSetting('lang', 'de');\n    expect(t('tabs.today')).toBe('Heute');\n    useApp.setState({ ready: false });\n    await useApp.getState().init();\n    expect(useApp.getState().settings.theme).toBe('dark');\n    expect(useApp.getState().settings.tipHistory['2025-05-14']).toEqual(['nap']);\n  });\n\n  it('exports, wipes and imports data again', async () => {\n    await useApp.getState().init();\n    await useApp.getState().loadDemo('rested');\n    const json = JSON.stringify(await dataStore.exportAll());\n    await useApp.getState().wipeAll();\n    expect(useApp.getState().sessions).toHaveLength(0);\n    expect(useApp.getState().profile).toBeNull();\n    expect(useApp.getState().habits).toHaveLength(9);\n    const parsed = parseBundle(json);\n    if (!parsed.ok) throw new Error(parsed.error);\n    await useApp.getState().importBundle(parsed);\n    expect(useApp.getState().sessions.length).toBeGreaterThan(60);\n    expect(useApp.getState().profile).not.toBeNull();\n  });\n\n  it('updateEstimates only re-estimates once a day unless forced', async () => {\n    await useApp.getState().init();\n    await useApp.getState().loadDemo('rested');\n    await useApp.getState().updateEstimates(true);\n    const first = useApp.getState().profile!.sleepNeedMinutesEstimated;\n    await useApp.getState().updateEstimates();\n    expect(useApp.getState().profile!.sleepNeedMinutesEstimated).toBe(first);\n  });\n\n  it('does nothing when there is no profile', async () => {\n    await useApp.getState().init();\n    await useApp.getState().updateEstimates(true);\n    await useApp.getState().finishOnboarding();\n    expect(useApp.getState().profile).toBeNull();\n  });\n});\n"},{"path":"src/state/app.ts","content":"import { create } from 'zustand';\nimport { createStore } from '@/data/db';\nimport {\n  DEMO_SCENARIOS,\n  demoProfile,\n  generateDemoSessions,\n  type DemoScenarioId,\n} from '@/data/demo/generator';\nimport { applyImport, type ParseResult } from '@/data/exchange';\nimport type { AppProfile, DataStore, Habit, HabitKey, HabitLog, HabitStatus } from '@/data/types';\nimport { defaultHabits } from '@/content/habits';\nimport { learnChronotype, chronotypeFromAnswers, type ChronotypeAnswers } from '@/engine/chronotype';\nimport { estimateSleepNeed } from '@/engine/sleepNeed';\nimport { dateKey } from '@/engine/time';\nimport type { Profile, SleepSession, WorkSchedule } from '@/engine/types';\nimport { getHealthProvider } from '@/integrations/health';\nimport { syncHealth, type SyncResult } from '@/services/sync';\nimport { setLang, type Lang } from '@/i18n';\nimport type { ThemePref } from '@/ui/theme';\n\nexport const dataStore: DataStore = createStore();\n\nexport interface Settings {\n  theme: ThemePref;\n  lang: Lang;\n  demoScenario: DemoScenarioId | null;\n  morningCheck: boolean;\n  calendarOptIn: boolean;\n  tipHistory: Record\u003cstring, string[]>;\n  lastSync: number | null;\n}\n\nconst DEFAULT_SETTINGS: Settings = {\n  theme: 'system',\n  lang: 'de',\n  demoScenario: null,\n  morningCheck: false,\n  calendarOptIn: false,\n  tipHistory: {},\n  lastSync: null,\n};\n\nexport function deviceTimezone(): string {\n  try {\n    return Intl.DateTimeFormat().resolvedOptions().timeZone || 'Europe/Berlin';\n  } catch {\n    return 'Europe/Berlin';\n  }\n}\n\nexport const DEFAULT_WORK: WorkSchedule = {\n  workDays: [1, 2, 3, 4, 5],\n  workStart: '09:00',\n  workEnd: '17:00',\n  shiftMode: false,\n};\n\nexport function newProfile(over: Partial\u003cAppProfile> = {}): AppProfile {\n  return {\n    createdAt: Date.now(),\n    name: null,\n    birthYear: null,\n    sleepNeedMinutesManual: null,\n    sleepNeedMinutesEstimated: null,\n    chronotype: 'intermediate',\n    chronotypeScore: 0,\n    circadianPhaseOffsetMin: 0,\n    chronotypeUpdatedAt: null,\n    targetWakeTime: null,\n    workSchedule: DEFAULT_WORK,\n    caffeineCutoffHours: 8,\n    timezone: deviceTimezone(),\n    onboardingCompletedAt: null,\n    ...over,\n  };\n}\n\nexport interface OnboardingInput {\n  name: string | null;\n  birthYear: number | null;\n  answers: ChronotypeAnswers;\n  workSchedule: WorkSchedule;\n  targetWakeTime: string | null;\n  caffeineCutoffHours: number;\n  habitReminders: Partial\u003cRecord\u003cHabitKey, boolean>>;\n  morningCheck: boolean;\n}\n\ninterface AppState {\n  ready: boolean;\n  profile: AppProfile | null;\n  sessions: SleepSession[];\n  habits: Habit[];\n  habitLogs: HabitLog[];\n  settings: Settings;\n  syncing: boolean;\n\n  init: () => Promise\u003cvoid>;\n  reload: () => Promise\u003cvoid>;\n  setSetting: \u003cK extends keyof Settings>(key: K, value: Settings[K]) => Promise\u003cvoid>;\n  saveProfile: (patch: Partial\u003cAppProfile>) => Promise\u003cvoid>;\n  applyOnboarding: (input: OnboardingInput) => Promise\u003cvoid>;\n  finishOnboarding: () => Promise\u003cvoid>;\n  saveNight: (n: { id?: string; startAt: number; endAt: number; isNap: boolean }) => Promise\u003cstring>;\n  deleteNight: (id: string) => Promise\u003cvoid>;\n  saveHabit: (h: Habit) => Promise\u003cvoid>;\n  logHabit: (key: HabitKey, date: string, status: HabitStatus | null) => Promise\u003cvoid>;\n  loadDemo: (scenario: DemoScenarioId) => Promise\u003cvoid>;\n  syncNow: () => Promise\u003cSyncResult>;\n  updateEstimates: (force?: boolean) => Promise\u003cvoid>;\n  importBundle: (parsed: Extract\u003cParseResult, { ok: true }>) => Promise\u003cvoid>;\n  wipeAll: () => Promise\u003cvoid>;\n}\n\nconst parseJson = \u003cT,>(s: string | null, fallback: T): T => {\n  if (!s) return fallback;\n  try {\n    return JSON.parse(s) as T;\n  } catch {\n    return fallback;\n  }\n};\n\nasync function loadSettings(): Promise\u003cSettings> {\n  const g = dataStore.getSetting.bind(dataStore);\n  const theme = (await g('theme')) as ThemePref | null;\n  const lang = (await g('lang')) as Lang | null;\n  const demo = (await g('demo_scenario')) as DemoScenarioId | null;\n  return {\n    theme: theme ?? DEFAULT_SETTINGS.theme,\n    lang: lang ?? DEFAULT_SETTINGS.lang,\n    demoScenario: demo && DEMO_SCENARIOS.some((s) => s.id === demo) ? demo : null,\n    morningCheck: (await g('morning_check')) === '1',\n    calendarOptIn: (await g('calendar_optin')) === '1',\n    tipHistory: parseJson(await g('tip_history'), {}),\n    lastSync: parseJson\u003cnumber | null>(await g('last_sync'), null),\n  };\n}\n\nconst SETTING_KEYS: Record\u003ckeyof Settings, string> = {\n  theme: 'theme',\n  lang: 'lang',\n  demoScenario: 'demo_scenario',\n  morningCheck: 'morning_check',\n  calendarOptIn: 'calendar_optin',\n  tipHistory: 'tip_history',\n  lastSync: 'last_sync',\n};\n\nfunction serializeSetting(key: keyof Settings, value: unknown): string {\n  if (key === 'morningCheck' || key === 'calendarOptIn') return value ? '1' : '0';\n  if (key === 'tipHistory' || key === 'lastSync') return JSON.stringify(value);\n  return String(value ?? '');\n}\n\nexport const useApp = create\u003cAppState>((set, get) => ({\n  ready: false,\n  profile: null,\n  sessions: [],\n  habits: [],\n  habitLogs: [],\n  settings: DEFAULT_SETTINGS,\n  syncing: false,\n\n  async init() {\n    if (get().ready) return;\n    try {\n      let habits = await dataStore.listHabits();\n      if (habits.length === 0) {\n        for (const h of defaultHabits()) await dataStore.saveHabit(h);\n        habits = await dataStore.listHabits();\n      }\n      const settings = await loadSettings();\n      setLang(settings.lang);\n      set({\n        profile: await dataStore.getProfile(),\n        sessions: await dataStore.listSessions(),\n        habits,\n        habitLogs: await dataStore.listHabitLogs(),\n        settings,\n        ready: true,\n      });\n    } catch {\n      // The app must never crash because storage failed, start with an empty state.\n      set({ ready: true });\n    }\n  },\n\n  async reload() {\n    set({\n      profile: await dataStore.getProfile(),\n      sessions: await dataStore.listSessions(),\n      habits: await dataStore.listHabits(),\n      habitLogs: await dataStore.listHabitLogs(),\n    });\n  },\n\n  async setSetting(key, value) {\n    await dataStore.setSetting(SETTING_KEYS[key], serializeSetting(key, value));\n    if (key === 'lang') setLang(value as Lang);\n    set({ settings: { ...get().settings, [key]: value } });\n  },\n\n  async saveProfile(patch) {\n    const cur = get().profile ?? newProfile();\n    const next = { ...cur, ...patch };\n    await dataStore.saveProfile(next);\n    await dataStore.clearSummaries();\n    set({ profile: next });\n  },\n\n  async applyOnboarding(input) {\n    const res = chronotypeFromAnswers(input.answers);\n    const cur = get().profile ?? newProfile();\n    const profile: AppProfile = {\n      ...cur,\n      name: input.name,\n      birthYear: input.birthYear,\n      chronotype: res.chronotype,\n      chronotypeScore: res.score,\n      circadianPhaseOffsetMin: res.offsetMin,\n      chronotypeUpdatedAt: Date.now(),\n      workSchedule: input.workSchedule,\n      targetWakeTime: input.targetWakeTime,\n      caffeineCutoffHours: input.caffeineCutoffHours,\n      timezone: deviceTimezone(),\n    };\n    await dataStore.saveProfile(profile);\n    const habits = get().habits.length ? get().habits : defaultHabits();\n    for (const h of habits) {\n      const wanted = input.habitReminders[h.key];\n      const next: Habit =\n        wanted === undefined ? h : { ...h, enabled: wanted || h.enabled, reminderEnabled: wanted };\n      await dataStore.saveHabit(next);\n    }\n    await get().setSetting('morningCheck', input.morningCheck);\n    await dataStore.clearSummaries();\n    await get().reload();\n  },\n\n  async finishOnboarding() {\n    const p = get().profile;\n    if (!p) return;\n    await get().updateEstimates(true);\n    await get().saveProfile({ onboardingCompletedAt: Date.now() });\n  },\n\n  async saveNight(n) {\n    const existing = n.id ? await dataStore.getSession(n.id) : null;\n    const tz = get().profile?.timezone ?? deviceTimezone();\n    const session: SleepSession = existing\n      ? { ...existing, startAt: n.startAt, endAt: n.endAt, isNap: n.isNap, asleepMinutes: null, userEdited: true }\n      : {\n          id: `manual-${n.startAt}-${n.endAt}`,\n          startAt: n.startAt,\n          endAt: n.endAt,\n          asleepMinutes: null,\n          source: 'manual',\n          sourceDetail: null,\n          confidence: 1,\n          isNap: n.isNap,\n          timezone: tz,\n          userEdited: true,\n        };\n    await dataStore.upsertSessions([session]);\n    await dataStore.clearSummaries();\n    set({ sessions: await dataStore.listSessions() });\n    await get().updateEstimates();\n    return session.id;\n  },\n\n  async deleteNight(id) {\n    await dataStore.deleteSession(id);\n    await dataStore.clearSummaries();\n    set({ sessions: await dataStore.listSessions() });\n  },\n\n  async saveHabit(h) {\n    await dataStore.saveHabit(h);\n    set({ habits: await dataStore.listHabits() });\n  },\n\n  async logHabit(key, date, status) {\n    if (status === null) await dataStore.removeHabitLog(key, date);\n    else await dataStore.setHabitLog({ habitKey: key, date, status, at: Date.now() });\n    set({ habitLogs: await dataStore.listHabitLogs() });\n  },\n\n  async loadDemo(scenario) {\n    const tz = get().profile?.timezone ?? deviceTimezone();\n    const now = Date.now();\n    await dataStore.clearSessions('demo');\n    const sessions = generateDemoSessions({ scenario, lastWakeKey: dateKey(now, tz), tz, nights: 90 });\n    // Only keep nights that already ended.\n    await dataStore.upsertSessions(sessions.filter((s) => s.endAt \u003c= now));\n    const existing = get().profile;\n    const dp = demoProfile(scenario, tz, now) as Profile;\n    const base = existing ? { ...existing } : newProfile();\n    await dataStore.saveProfile({\n      ...base,\n      chronotype: dp.chronotype,\n      chronotypeScore: dp.chronotypeScore,\n      circadianPhaseOffsetMin: dp.circadianPhaseOffsetMin,\n      workSchedule: dp.workSchedule,\n      targetWakeTime: dp.targetWakeTime ?? null,\n      sleepNeedMinutesEstimated: dp.sleepNeedMinutesEstimated ?? null,\n      name: base.name ?? 'Demo',\n      onboardingCompletedAt: base.onboardingCompletedAt ?? null,\n    });\n    await dataStore.clearSummaries();\n    await get().setSetting('demoScenario', scenario);\n    await get().reload();\n  },\n\n  async syncNow() {\n    if (get().syncing) return { imported: 0, status: 'ok' };\n    set({ syncing: true });\n    try {\n      const tz = get().profile?.timezone ?? deviceTimezone();\n      const provider = getHealthProvider(tz, get().settings.demoScenario ?? 'rested');\n      const res = await syncHealth(dataStore, provider, tz);\n      if (res.status === 'ok') await get().setSetting('lastSync', Date.now());\n      await get().reload();\n      if (res.imported > 0) await get().updateEstimates();\n      return res;\n    } finally {\n      set({ syncing: false });\n    }\n  },\n\n  async updateEstimates(force = false) {\n    const { profile, sessions } = get();\n    if (!profile) return;\n    const now = Date.now();\n    const today = dateKey(now, profile.timezone);\n    const last = await dataStore.getSetting('need_updated_day');\n    let next: AppProfile = profile;\n    if (force || last !== today) {\n      const need = estimateSleepNeed(sessions, profile, now);\n      if (need.basis === 'estimated') next = { ...next, sleepNeedMinutesEstimated: need.minutes };\n      await dataStore.setSetting('need_updated_day', today);\n    }\n    const learned = learnChronotype(sessions, next, now, next.chronotypeUpdatedAt ?? undefined);\n    if (learned && learned.changed) {\n      next = {\n        ...next,\n        circadianPhaseOffsetMin: learned.offsetMin,\n        chronotype: learned.chronotype,\n        chronotypeScore: learned.score,\n        chronotypeUpdatedAt: now,\n      };\n    }\n    if (next !== profile) {\n      await dataStore.saveProfile
