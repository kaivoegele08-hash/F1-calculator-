am Wochenende viel Schlaf.',\n    profile: { chronotype: 'intermediate', circadianPhaseOffsetMin: 60, workSchedule: WORK },\n  },\n  {\n    id: 'shift_worker',\n    label: 'Schichtarbeiter',\n    description: 'Wechselnde Schlafzeiten mit Nachtschicht-Phase.',\n    profile: {\n      chronotype: 'intermediate',\n      circadianPhaseOffsetMin: 0,\n      workSchedule: { ...WORK, shiftMode: true },\n    },\n  },\n];\n\ninterface Plan {\n  bed: number; // clock hours, may be > 24 (next day)\n  durationMin: number;\n}\n\nfunction planFor(id: DemoScenarioId, dayIndex: number, wakeKey: string, rnd: () => number): Plan {\n  const dow = dayOfWeekOfKey(wakeKey);\n  const weekend = dow === 0 || dow === 6;\n  const j = (rng: number) => (rnd() - 0.5) * 2 * rng;\n  switch (id) {\n    case 'rested':\n      return { bed: 22.75 + j(0.4), durationMin: 480 + j(25) };\n    case 'exam_week':\n      return dayIndex \u003c 7\n        ? { bed: 25 + j(0.5), durationMin: 330 + j(40) }\n        : { bed: 23 + j(0.5), durationMin: 450 + j(30) };\n    case 'late_early_shift':\n      return weekend\n        ? { bed: 26 + j(0.6), durationMin: 540 + j(30) }\n        : { bed: 24.75 + j(0.5), durationMin: 395 + j(30) };\n    case 'weekend_catchup':\n      return weekend\n        ? { bed: 24.5 + j(0.6), durationMin: 570 + j(30) }\n        : { bed: 23.5 + j(0.4), durationMin: 400 + j(30) };\n    case 'shift_worker': {\n      const block = Math.floor(dayIndex / 5) % 3;\n      if (block === 0) return { bed: 23 + j(0.5), durationMin: 450 + j(30) };\n      if (block === 1) return { bed: 31.5 + j(0.5), durationMin: 420 + j(30) }; // 07:30 → day sleep\n      return { bed: 21.5 + j(0.5), durationMin: 400 + j(30) };\n    }\n  }\n}\n\nexport interface DemoOptions {\n  scenario: DemoScenarioId;\n  /** last wake date (YYYY-MM-DD) */\n  lastWakeKey: string;\n  nights?: number;\n  tz: string;\n  seed?: number;\n}\n\n/** Generate realistic demo nights (and occasional naps), newest last. */\nexport function generateDemoSessions(opts: DemoOptions): SleepSession[] {\n  const nights = opts.nights ?? 60;\n  const rnd = mulberry32((opts.seed ?? 42) + opts.scenario.length * 7919);\n  const out: SleepSession[] = [];\n  for (let i = nights - 1; i >= 0; i--) {\n    const wakeKey = addDaysToKey(opts.lastWakeKey, -i);\n    const plan = planFor(opts.scenario, nights - 1 - i, wakeKey, rnd);\n    const bedDayKey = plan.bed >= 24 ? addDaysToKey(wakeKey, -Math.ceil((48 - plan.bed) / 24) + 1) : addDaysToKey(wakeKey, -1);\n    const bedClock = formatHHmm(plan.bed % 24);\n    // bed day: bedtime clocks >= 24 belong to the date of waking (or the day before for day sleepers)\n    const bedKey = plan.bed >= 24 ? addDaysToKey(wakeKey, plan.bed >= 36 ? -1 : 0) : bedDayKey;\n    const startAt = localTimeToMs(bedKey, bedClock, opts.tz);\n    const endAt = startAt + Math.round(plan.durationMin) * 60_000;\n    const effKey = dateKey(endAt, opts.tz);\n    // keep the wake date consistent with the plan, even if jitter crossed midnight\n    if (effKey !== wakeKey) {\n      const shift = (localTimeToMs(wakeKey, '07:00', opts.tz) - endAt) / 60_000;\n      if (Math.abs(shift) > 24 * 60) continue;\n    }\n    out.push({\n      id: `demo-${opts.scenario}-${wakeKey}`,\n      startAt,\n      endAt,\n      asleepMinutes: Math.round(plan.durationMin * (0.9 + rnd() * 0.06)),\n      source: 'demo',\n      sourceDetail: 'Demo',\n      confidence: 0.9,\n      isNap: false,\n      timezone: opts.tz,\n      userEdited: false,\n    });\n    if (opts.scenario !== 'shift_worker' && rnd() \u003c 0.12) {\n      const napStart = localTimeToMs(dateKey(endAt, opts.tz), '14:10', opts.tz) + Math.round(rnd() * 45) * 60_000;\n      out.push({\n        id: `demo-${opts.scenario}-nap-${wakeKey}`,\n        startAt: napStart,\n        endAt: napStart + Math.round(20 + rnd() * 25) * 60_000,\n        asleepMinutes: null,\n        source: 'demo',\n        sourceDetail: 'Demo',\n        confidence: 0.8,\n        isNap: true,\n        timezone: opts.tz,\n        userEdited: false,\n      });\n    }\n  }\n  return out.sort((a, b) => a.startAt - b.startAt);\n}\n\nexport function demoProfile(scenario: DemoScenarioId, tz: string, now: number): Profile {\n  const sc = DEMO_SCENARIOS.find((s) => s.id === scenario)!;\n  return {\n    name: 'Demo',\n    birthYear: 1994,\n    sleepNeedMinutesManual: null,\n    sleepNeedMinutesEstimated: scenario === 'late_early_shift' ? 510 : 480,\n    chronotype: 'intermediate',\n    chronotypeScore: 0,\n    circadianPhaseOffsetMin: 0,\n    targetWakeTime: scenario === 'late_early_shift' ? '06:30' : null,\n    workSchedule: WORK,\n    caffeineCutoffHours: 8,\n    timezone: tz,\n    ...sc.profile,\n  } as Profile & { _now?: number };\n}\n"},{"path":"src/data/exchange.ts","content":"import { z } from 'zod';\nimport type { SleepSession } from '@/engine/types';\nimport { EXPORT_SCHEMA_VERSION, type DataStore, type ExportBundle, type ImportPreview } from './types';\n\nconst workSchedule = z.object({\n  workDays: z.array(z.number().int().min(0).max(6)),\n  workStart: z.string(),\n  workEnd: z.string(),\n  shiftMode: z.boolean(),\n});\n\nconst session = z.object({\n  id: z.string().min(1),\n  startAt: z.number(),\n  endAt: z.number(),\n  asleepMinutes: z.number().nullable().optional(),\n  source: z.enum(['healthkit', 'healthconnect', 'manual', 'phone_inferred', 'demo']),\n  sourceDetail: z.string().nullable().optional(),\n  confidence: z.number().min(0).max(1),\n  isNap: z.boolean(),\n  timezone: z.string(),\n  userEdited: z.boolean(),\n});\n\nconst profile = z.object({\n  createdAt: z.number(),\n  name: z.string().nullable().optional(),\n  birthYear: z.number().int().nullable().optional(),\n  sleepNeedMinutesManual: z.number().nullable().optional(),\n  sleepNeedMinutesEstimated: z.number().nullable().optional(),\n  chronotype: z.enum(['early', 'intermediate', 'late']),\n  chronotypeScore: z.number(),\n  circadianPhaseOffsetMin: z.number(),\n  chronotypeUpdatedAt: z.number().nullable(),\n  targetWakeTime: z.string().nullable().optional(),\n  workSchedule,\n  caffeineCutoffHours: z.number(),\n  timezone: z.string(),\n  onboardingCompletedAt: z.number().nullable(),\n});\n\nconst habitKey = z.enum([\n  'morning_light',\n  'caffeine_cutoff',\n  'no_alcohol',\n  'last_meal',\n  'dim_light',\n  'wind_down',\n  'bedtime',\n  'bedroom_check',\n  'powernap',\n]);\n\nexport const bundleSchema = z.object({\n  schemaVersion: z.number().int().min(1).max(EXPORT_SCHEMA_VERSION),\n  exportedAt: z.number(),\n  profile: profile.nullable(),\n  sessions: z.array(session),\n  habits: z.array(\n    z.object({ key: habitKey, enabled: z.boolean(), reminderEnabled: z.boolean(), reminderOffsetMin: z.number() }),\n  ),\n  habitLogs: z.array(\n    z.object({ habitKey, date: z.string().regex(/^\\d{4}-\\d{2}-\\d{2}$/), status: z.enum(['done', 'skipped']), at: z.number() }),\n  ),\n  checkins: z.array(\n    z.object({ id: z.string(), at: z.number(), rating: z.number().int().min(1).max(5), note: z.string().nullable().optional() }),\n  ),\n});\n\nexport type ParseResult = { ok: true; bundle: ExportBundle } | { ok: false; error: string };\n\n/** Validate a JSON string from an export file. */\nexport function parseBundle(json: string): ParseResult {\n  let raw: unknown;\n  try {\n    raw = JSON.parse(json);\n  } catch {\n    return { ok: false, error: 'Die Datei ist kein gültiges JSON.' };\n  }\n  const res = bundleSchema.safeParse(raw);\n  if (!res.success) {\n    const first = res.error.issues[0];\n    return { ok: false, error: `Ungültige Datei (${first.path.join('.') || 'Wurzel'}: ${first.message}).` };\n  }\n  return { ok: true, bundle: res.data as ExportBundle };\n}\n\nconst sameNight = (a: SleepSession, b: SleepSession) =>\n  a.id === b.id || (Math.abs(a.startAt - b.startAt) \u003c 60_000 && Math.abs(a.endAt - b.endAt) \u003c 60_000);\n\nexport function previewImport(bundle: ExportBundle, existing: SleepSession[]): ImportPreview {\n  const seen = [...existing];\n  const fresh: SleepSession[] = [];\n  let dupes = 0;\n  for (const s of bundle.sessions) {\n    if (seen.some((e) => sameNight(e, s))) {\n      dupes++;\n    } else {\n      fresh.push(s);\n      seen.push(s);\n    }\n  }\n  return { nightsFound: bundle.sessions.length, duplicatesSkipped: dupes, newSessions: fresh };\n}\n\n/** Apply an import. Existing nights win; the profile is only taken if none exists yet. */\nexport async function applyImport(store: DataStore, bundle: ExportBundle): Promise\u003cImportPreview> {\n  const preview = previewImport(bundle, await store.listSessions());\n  await store.upsertSessions(preview.newSessions);\n  if (bundle.profile && !(await store.getProfile())) await store.saveProfile(bundle.profile);\n  for (const h of bundle.habits) await store.saveHabit(h);\n  for (const l of bundle.habitLogs) await store.setHabitLog(l);\n  for (const c of bundle.checkins) await store.addCheckin(c);\n  await store.clearSummaries();\n  return preview;\n}\n"},{"path":"src/data/memoryStore.ts","content":"import type { SleepSession } from '@/engine/types';\nimport {\n  EXPORT_SCHEMA_VERSION,\n  type AppProfile,\n  type DailySummary,\n  type DataStore,\n  type EnergyCheckin,\n  type ExportBundle,\n  type Habit,\n  type HabitKey,\n  type HabitLog,\n} from './types';\n\n/** In-memory store used for the web preview and tests. */\nexport class MemoryStore implements DataStore {\n  /** Hook for subclasses that persist the data (called after each mutation). */\n  protected changed(): void {}\n\n  private profile: AppProfile | null = null;\n  private sessions = new Map\u003cstring, SleepSession>();\n  private habits = new Map\u003cstring, Habit>();\n  private logs = new Map\u003cstring, HabitLog>();\n  private checkins = new Map\u003cstring, EnergyCheckin>();\n  private summaries = new Map\u003cstring, DailySummary>();\n  private settings = new Map\u003cstring, string>();\n\n  async getProfile() {\n    return this.profile ? structuredClone(this.profile) : null;\n  }\n  async saveProfile(p: AppProfile) {\n    this.profile = structuredClone(p);\n    this.changed();\n  }\n  async listSessions() {\n    return [...this.sessions.values()].sort((a, b) => a.startAt - b.startAt).map((s) => ({ ...s }));\n  }\n  async getSession(id: string) {\n    const s = this.sessions.get(id);\n    return s ? { ...s } : null;\n  }\n  async upsertSessions(sessions: SleepSession[]) {\n    for (const s of sessions) this.sessions.set(s.id, { ...s });\n    this.changed();\n  }\n  async deleteSession(id: string) {\n    this.sessions.delete(id);\n    this.changed();\n  }\n  async clearSessions(source?: SleepSession['source']) {\n    for (const [id, s] of this.sessions) if (!source || s.source === source) this.sessions.delete(id);\n    this.changed();\n  }\n  async listHabits() {\n    return [...this.habits.values()].map((h) => ({ ...h }));\n  }\n  async saveHabit(h: Habit) {\n    this.habits.set(h.key, { ...h });\n    this.changed();\n  }\n  async listHabitLogs(sinceDate?: string) {\n    return [...this.logs.values()].filter((l) => !sinceDate || l.date >= sinceDate).map((l) => ({ ...l }));\n  }\n  async setHabitLog(log: HabitLog) {\n    this.logs.set(`${log.habitKey}|${log.date}`, { ...log });\n    this.changed();\n  }\n  async removeHabitLog(habitKey: HabitKey, date: string) {\n    this.logs.delete(`${habitKey}|${date}`);\n    this.changed();\n  }\n  async listCheckins() {\n    return [...this.checkins.values()].sort((a, b) => a.at - b.at).map((c) => ({ ...c }));\n  }\n  async addCheckin(c: EnergyCheckin) {\n    if (!this.checkins.has(c.id)) this.checkins.set(c.id, { ...c });\n    this.changed();\n  }\n  async getSummary(date: string) {\n    const s = this.summaries.get(date);\n    return s ? { ...s } : null;\n  }\n  async saveSummary(s: DailySummary) {\n    this.summaries.set(s.date, { ...s });\n    this.changed();\n  }\n  async clearSummaries() {\n    this.summaries.clear();\n    this.changed();\n  }\n  async getSetting(key: string) {\n    return this.settings.get(key) ?? null;\n  }\n  async setSetting(key: string, value: string) {\n    this.settings.set(key, value);\n    this.changed();\n  }\n  async exportAll(): Promise\u003cExportBundle> {\n    return {\n      schemaVersion: EXPORT_SCHEMA_VERSION,\n      exportedAt: Date.now(),\n      profile: await this.getProfile(),\n      sessions: await this.listSessions(),\n      habits: await this.listHabits(),\n      habitLogs: await this.listHabitLogs(),\n      checkins: await this.listCheckins(),\n    };\n  }\n  /** Everything, including settings, as JSON (for web persistence). */\n  serialize(): string {\n    return JSON.stringify({\n      profile: this.profile,\n      sessions: [...this.sessions.values()],\n      habits: [...this.habits.values()],\n      logs: [...this.logs.values()],\n      checkins: [...this.checkins.values()],\n      settings: [...this.settings.entries()],\n    });\n  }\n\n  restore(json: string): void {\n    const d = JSON.parse(json);\n    this.profile = d.profile ?? null;\n    this.sessions = new Map((d.sessions ?? []).map((x: SleepSession) => [x.id, x]));\n    this.habits = new Map((d.habits ?? []).map((x: Habit) => [x.key, x]));\n    this.logs = new Map((d.logs ?? []).map((x: HabitLog) => [`${x.habitKey}|${x.date}`, x]));\n    this.checkins = new Map((d.checkins ?? []).map((x: EnergyCheckin) => [x.id, x]));\n    this.settings = new Map(d.settings ?? []);\n  }\n\n  async wipe() {\n    this.profile = null;\n    this.sessions.clear();\n    this.habits.clear();\n    this.logs.clear();\n    this.checkins.clear();\n    this.summaries.clear();\n    this.settings.clear();\n    this.changed();\n  }\n}\n"},{"path":"src/data/migrations/index.ts","content":"/** Versioned SQL migrations. Never edit an applied migration, append a new one. */\nexport interface Migration {\n  version: number;\n  statements: string[];\n}\n\nexport const MIGRATIONS: Migration[] = [\n  {\n    version: 1,\n    statements: [\n      `CREATE TABLE IF NOT EXISTS profile (\n        id INTEGER PRIMARY KEY,\n        created_at INTEGER NOT NULL,\n        name TEXT,\n        birth_year INTEGER,\n        sleep_need_minutes_manual INTEGER,\n        sleep_need_minutes_estimated REAL,\n        chronotype TEXT NOT NULL,\n        chronotype_score REAL NOT NULL,\n        circadian_phase_offset_min REAL NOT NULL,\n        chronotype_updated_at INTEGER,\n        target_wake_time TEXT,\n        work_schedule TEXT NOT NULL,\n        caffeine_cutoff_hours REAL NOT NULL,\n        timezone TEXT NOT NULL,\n        onboarding_completed_at INTEGER\n      )`,\n      `CREATE TABLE IF NOT EXISTS sleep_session (\n        id TEXT PRIMARY KEY,\n        start_at INTEGER NOT NULL,\n        end_at INTEGER NOT NULL,\n        asleep_minutes REAL,\n        source TEXT NOT NULL,\n        source_detail TEXT,\n        confidence REAL NOT NULL,\n        is_nap INTEGER NOT NULL,\n        timezone TEXT NOT NULL,\n        user_edited INTEGER NOT NULL,\n        created_at INTEGER NOT NULL,\n        updated_at INTEGER NOT NULL\n      )`,\n      `CREATE INDEX IF NOT EXISTS idx_sleep_session_end ON sleep_session (end_at)`,\n      `CREATE TABLE IF NOT EXISTS daily_summary (\n        date TEXT PRIMARY KEY,\n        total_sleep_minutes REAL NOT NULL,\n        nap_minutes REAL NOT NULL,\n        sleep_debt_minutes REAL NOT NULL,\n        sleep_need_minutes REAL NOT NULL,\n        energy_curve_json TEXT NOT NULL,\n        windows_json TEXT NOT NULL,\n        computed_at INTEGER NOT NULL,\n        engine_version INTEGER NOT NULL\n      )`,\n      `CREATE TABLE IF NOT EXISTS habit (\n        key TEXT PRIMARY KEY,\n        enabled INTEGER NOT NULL,\n        reminder_enabled INTEGER NOT NULL,\n        reminder_offset_min INTEGER NOT NULL\n      )`,\n      `CREATE TABLE IF NOT EXISTS habit_log (\n        habit_key TEXT NOT NULL,\n        date TEXT NOT NULL,\n        status TEXT NOT NULL,\n        at INTEGER NOT NULL,\n        PRIMARY KEY (habit_key, date)\n      )`,\n      `CREATE TABLE IF NOT EXISTS energy_checkin (\n        id TEXT PRIMARY KEY,\n        at INTEGER NOT NULL,\n        rating INTEGER NOT NULL,\n        note TEXT\n      )`,\n      `CREATE TABLE IF NOT EXISTS setting (\n        key TEXT PRIMARY KEY,\n        value TEXT NOT NULL\n      )`,\n    ],\n  },\n];\n"},{"path":"src/data/schema.ts","content":"import { integer, real, sqliteTable, text } from 'drizzle-orm/sqlite-core';\n\nexport const profile = sqliteTable('profile', {\n  id: integer('id').primaryKey(),\n  createdAt: integer('created_at').notNull(),\n  name: text('name'),\n  birthYear: integer('birth_year'),\n  sleepNeedMinutesManual: integer('sleep_need_minutes_manual'),\n  sleepNeedMinutesEstimated: real('sleep_need_minutes_estimated'),\n  chronotype: text('chronotype').notNull(),\n  chronotypeScore: real('chronotype_score').notNull(),\n  circadianPhaseOffsetMin: real('circadian_phase_offset_min').notNull(),\n  chronotypeUpdatedAt: integer('chronotype_updated_at'),\n  targetWakeTime: text('target_wake_time'),\n  workSchedule: text('work_schedule').notNull(),\n  caffeineCutoffHours: real('caffeine_cutoff_hours').notNull(),\n  timezone: text('timezone').notNull(),\n  onboardingCompletedAt: integer('onboarding_completed_at'),\n});\n\nexport const sleepSession = sqliteTable('sleep_session', {\n  id: text('id').primaryKey(),\n  startAt: integer('start_at').notNull(),\n  endAt: integer('end_at').notNull(),\n  asleepMinutes: real('asleep_minutes'),\n  source: text('source').notNull(),\n  sourceDetail: text('source_detail'),\n  confidence: real('confidence').notNull(),\n  isNap: integer('is_nap', { mode: 'boolean' }).notNull(),\n  timezone: text('timezone').notNull(),\n  userEdited: integer('user_edited', { mode: 'boolean' }).notNull(),\n  createdAt: integer('created_at').notNull(),\n  updatedAt: integer('updated_at').notNull(),\n});\n\nexport const dailySummary = sqliteTable('daily_summary', {\n  date: text('date').primaryKey(),\n  totalSleepMinutes: real('total_sleep_minutes').notNull(),\n  napMinutes: real('nap_minutes').notNull(),\n  sleepDebtMinutes: real('sleep_debt_minutes').notNull(),\n  sleepNeedMinutes: real('sleep_need_minutes').notNull(),\n  energyCurveJson: text('energy_curve_json').notNull(),\n  windowsJson: text('windows_json').notNull(),\n  computedAt: integer('computed_at').notNull(),\n  engineVersion: integer('engine_version').notNull(),\n});\n\nexport const habit = sqliteTable('habit', {\n  key: text('key').primaryKey(),\n  enabled: integer('enabled', { mode: 'boolean' }).notNull(),\n  reminderEnabled: integer('reminder_enabled', { mode: 'boolean' }).notNull(),\n  reminderOffsetMin: integer('reminder_offset_min').notNull(),\n});\n\nexport const habitLog = sqliteTable('habit_log', {\n  habitKey: text('habit_key').notNull(),\n  date: text('date').notNull(),\n  status: text('status').notNull(),\n  at: integer('at').notNull(),\n});\n\nexport const energyCheckin = sqliteTable('energy_checkin', {\n  id: text('id').primaryKey(),\n  at: integer('at').notNull(),\n  rating: integer('rating').notNull(),\n  note: text('note'),\n});\n\nexport const setting = sqliteTable('setting', {\n  key: text('key').primaryKey(),\n  value: text('value').notNull(),\n});\n\nexport const migrationLog = sqliteTable('migration_log', {\n  version: integer('version').primaryKey(),\n  appliedAt: integer('applied_at').notNull(),\n});\n"},{"path":"src/data/sqliteStore.ts","content":"import { eq, gte, sql } from 'drizzle-orm';\nimport type { BaseSQLiteDatabase } from 'drizzle-orm/sqlite-core';\nimport type { SleepSession, WorkSchedule } from '@/engine/types';\nimport { MIGRATIONS } from './migrations';\nimport * as t from './schema';\nimport {\n  EXPORT_SCHEMA_VERSION,\n  type AppProfile,\n  type DailySummary,\n  type DataStore,\n  type EnergyCheckin,\n  type ExportBundle,\n  type Habit,\n  type HabitKey,\n  type HabitLog,\n} from './types';\n\n/** Any synchronous drizzle SQLite database (expo-sqlite or better-sqlite3). */\nexport type SyncDb = BaseSQLiteDatabase\u003c'sync', any, any>;\n\nexport function runMigrations(db: SyncDb): void {\n  db.run(sql`CREATE TABLE IF NOT EXISTS migration_log (version INTEGER PRIMARY KEY, applied_at INTEGER NOT NULL)`);\n  const applied = new Set(db.select().from(t.migrationLog).all().map((r) => r.version));\n  for (const m of MIGRATIONS) {\n    if (applied.has(m.version)) continue;\n    for (const stmt of m.statements) db.run(sql.raw(stmt));\n    db.insert(t.migrationLog).values({ version: m.version, appliedAt: Date.now() }).run();\n  }\n}\n\nconst rowToSession = (r: typeof t.sleepSession.$inferSelect): SleepSession => ({\n  id: r.id,\n  startAt: r.startAt,\n  endAt: r.endAt,\n  asleepMinutes: r.asleepMinutes,\n  source: r.source as SleepSession['source'],\n  sourceDetail: r.sourceDetail,\n  confidence: r.confidence,\n  isNap: r.isNap,\n  timezone: r.timezone,\n  userEdited: r.userEdited,\n});\n\nexport class SqliteStore implements DataStore {\n  constructor(private db: SyncDb) {\n    runMigrations(db);\n  }\n\n  async getProfile(): Promise\u003cAppProfile | null> {\n    const r = this.db.select().from(t.profile).where(eq(t.profile.id, 1)).get();\n    if (!r) return null;\n    return {\n      createdAt: r.createdAt,\n      name: r.name,\n      birthYear: r.birthYear,\n      sleepNeedMinutesManual: r.sleepNeedMinutesManual,\n      sleepNeedMinutesEstimated: r.sleepNeedMinutesEstimated,\n      chronotype: r.chronotype as AppProfile['chronotype'],\n      chronotypeScore: r.chronotypeScore,\n      circadianPhaseOffsetMin: r.circadianPhaseOffsetMin,\n      chronotypeUpdatedAt: r.chronotypeUpdatedAt,\n      targetWakeTime: r.targetWakeTime,\n      workSchedule: JSON.parse(r.workSchedule) as WorkSchedule,\n      caffeineCutoffHours: r.caffeineCutoffHours,\n      timezone: r.timezone,\n      onboardingCompletedAt: r.onboardingCompletedAt,\n    };\n  }\n\n  async saveProfile(p: AppProfile): Promise\u003cvoid> {\n    const values = {\n      id: 1,\n      createdAt: p.createdAt,\n      name: p.name ?? null,\n      birthYear: p.birthYear ?? null,\n      sleepNeedMinutesManual: p.sleepNeedMinutesManual ?? null,\n      sleepNeedMinutesEstimated: p.sleepNeedMinutesEstimated ?? null,\n      chronotype: p.chronotype,\n      chronotypeScore: p.chronotypeScore,\n      circadianPhaseOffsetMin: p.circadianPhaseOffsetMin,\n      chronotypeUpdatedAt: p.chronotypeUpdatedAt ?? null,\n      targetWakeTime: p.targetWakeTime ?? null,\n      workSchedule: JSON.stringify(p.workSchedule),\n      caffeineCutoffHours: p.caffeineCutoffHours,\n      timezone: p.timezone,\n      onboardingCompletedAt: p.onboardingCompletedAt ?? null,\n    };\n    this.db.insert(t.profile).values(values).onConflictDoUpdate({ target: t.profile.id, set: values }).run();\n  }\n\n  async listSessions(): Promise\u003cSleepSession[]> {\n    return this.db.select().from(t.sleepSession).orderBy(t.sleepSession.startAt).all().map(rowToSession);\n  }\n\n  async getSession(id: string): Promise\u003cSleepSession | null> {\n    const r = this.db.select().from(t.sleepSession).where(eq(t.sleepSession.id, id)).get();\n    return r ? rowToSession(r) : null;\n  }\n\n  async upsertSessions(sessions: SleepSession[]): Promise\u003cvoid> {\n    const now = Date.now();\n    this.db.transaction((tx) => {\n      for (const s of sessions) {\n        const values = {\n          id: s.id,\n          startAt: s.startAt,\n          endAt: s.endAt,\n          asleepMinutes: s.asleepMinutes ?? null,\n          source: s.source,\n          sourceDetail: s.sourceDetail ?? null,\n          confidence: s.confidence,\n          isNap: s.isNap,\n          timezone: s.timezone,\n          userEdited: s.userEdited,\n          createdAt: now,\n          updatedAt: now,\n        };\n        const { createdAt: _c, id: _i, ...update } = values;\n        void _c;\n        void _i;\n        tx.insert(t.sleepSession).values(values).onConflictDoUpdate({ target: t.sleepSession.id, set: update }).run();\n      }\n    });\n  }\n\n  async deleteSession(id: string): Promise\u003cvoid> {\n    this.db.delete(t.sleepSession).where(eq(t.sleepSession.id, id)).run();\n  }\n\n  async clearSessions(source?: SleepSession['source']): Promise\u003cvoid> {\n    if (source) this.db.delete(t.sleepSession).where(eq(t.sleepSession.source, source)).run();\n    else this.db.delete(t.sleepSession).run();\n  }\n\n  async listHabits(): Promise\u003cHabit[]> {\n    return this.db.select().from(t.habit).all().map((r) => ({\n      key: r.key as HabitKey,\n      enabled: r.enabled,\n      reminderEnabled: r.reminderEnabled,\n      reminderOffsetMin: r.reminderOffsetMin,\n    }));\n  }\n\n  async saveHabit(h: Habit): Promise\u003cvoid> {\n    this.db.insert(t.habit).values(h).onConflictDoUpdate({ target: t.habit.key, set: h }).run();\n  }\n\n  async listHabitLogs(sinceDate?: string): Promise\u003cHabitLog[]> {\n    const q = this.db.select().from(t.habitLog);\n    const rows = sinceDate ? q.where(gte(t.habitLog.date, sinceDate)).all() : q.all();\n    return rows.map((r) => ({\n      habitKey: r.habitKey as HabitKey,\n      date: r.date,\n      status: r.status as HabitLog['status'],\n      at: r.at,\n    }));\n  }\n\n  async setHabitLog(log: HabitLog): Promise\u003cvoid> {\n    this.db\n      .insert(t.habitLog)\n      .values(log)\n      .onConflictDoUpdate({ target: [t.habitLog.habitKey, t.habitLog.date], set: { status: log.status, at: log.at } })\n      .run();\n  }\n\n  async removeHabitLog(habitKey: HabitKey, date: string): Promise\u003cvoid> {\n    this.db.delete(t.habitLog).where(sql`${t.habitLog.habitKey} = ${habitKey} AND ${t.habitLog.date} = ${date}`).run();\n  }\n\n  async listCheckins(): Promise\u003cEnergyCheckin[]> {\n    return this.db.select().from(t.energyCheckin).orderBy(t.energyCheckin.at).all();\n  }\n\n  async addCheckin(c: EnergyCheckin): Promise\u003cvoid> {\n    this.db\n      .insert(t.energyCheckin)\n      .values({ id: c.id, at: c.at, rating: c.rating, note: c.note ?? null })\n      .onConflictDoNothing()\n      .run();\n  }\n\n  async getSummary(date: string): Promise\u003cDailySummary | null> {\n    return this.db.select().from(t.dailySummary).where(eq(t.dailySummary.date, date)).get() ?? null;\n  }\n\n  async saveSummary(s: DailySummary): Promise\u003cvoid> {\n    this.db.insert(t.dailySummary).values(s).onConflictDoUpdate({ target: t.dailySummary.date, set: s }).run();\n  }\n\n  async clearSummaries(): Promise\u003cvoid> {\n    this.db.delete(t.dailySummary).run();\n  }\n\n  async getSetting(key: string): Promise\u003cstring | null> {\n    return this.db.select().from(t.setting).where(eq(t.setting.key, key)).get()?.value ?? null;\n  }\n\n  async setSetting(key: string, value: string): Promise\u003cvoid> {\n    this.db.insert(t.setting).values({ key, value }).onConflictDoUpdate({ target: t.setting.key, set: { value } }).run();\n  }\n\n  async exportAll(): Promise\u003cExportBundle> {\n    return {\n      schemaVersion: EXPORT_SCHEMA_VERSION,\n      exportedAt: Date.now(),\n      profile: await this.getProfile(),\n      sessions: await this.listSessions(),\n      habits: await this.listHabits(),\n      habitLogs: await this.listHabitLogs(),\n      checkins: await this.listCheckins(),\n    };\n  }\n\n  async wipe(): Promise\u003cvoid> {\n    this.db.transaction((tx) => {\n      for (const table of [t.profile, t.sleepSession, t.dailySummary, t.habit, t.habitLog, t.energyCheckin, t.setting]) {\n        tx.delete(table).run();\n      }\n    });\n  }\n}\n"},{"path":"src/data/types.ts","content":"import type { Profile, SleepSession } from '@/engine/types';\n\nexport interface AppProfile extends Profile {\n  createdAt: number;\n  onboardingCompletedAt: number | null;\n  /** when the learned chronotype offset was last updated */\n  chronotypeUpdatedAt: number | null;\n}\n\nexport type HabitKey =\n  | 'morning_light'\n  | 'caffeine_cutoff'\n  | 'no_alcohol'\n  | 'last_meal'\n  | 'dim_light'\n  | 'wind_down'\n  | 'bedtime'\n  | 'bedroom_check'\n  | 'powernap';\n\nexport interface Habit {\n  key: HabitKey;\n  enabled: boolean;\n  reminderEnabled: boolean;\n  /** minutes relative to the habit's window start (negative = before) */\n  reminderOffsetMin: number;\n}\n\nexport type HabitStatus = 'done' | 'skipped';\n\nexport interface HabitLog {\n  habitKey: HabitKey;\n  /** YYYY-MM-DD */\n  date: string;\n  status: HabitStatus;\n  at: number;\n}\n\nexport interface EnergyCheckin {\n  id: string;\n  at: number;\n  rating: number;\n  note?: string | null;\n}\n\nexport interface DailySummary {\n  date: string;\n  totalSleepMinutes: number;\n  napMinutes: number;\n  sleepDebtMinutes: number;\n  sleepNeedMinutes: number;\n  energyCurveJson: string;\n  windowsJson: string;\n  computedAt: number;\n  engineVersion: number;\n}\n\nexport const EXPORT_SCHEMA_VERSION = 1;\n\nexport interface ExportBundle {\n  schemaVersion: number;\n  exportedAt: number;\n  profile: AppProfile | null;\n  sessions: SleepSession[];\n  habits: Habit[];\n  habitLogs: HabitLog[];\n  checkins: EnergyCheckin[];\n}\n\nexport interface ImportPreview {\n  nightsFound: number;\n  duplicatesSkipped: number;\n  newSessions: SleepSession[];\n}\n\nexport interface DataStore {\n  getProfile(): Promise\u003cAppProfile | null>;\n  saveProfile(p: AppProfile): Promise\u003cvoid>;\n\n  listSessions(): Promise\u003cSleepSession[]>;\n  getSession(id: string): Promise\u003cSleepSession | null>;\n  upsertSessions(sessions: SleepSession[]): Promise\u003cvoid>;\n  deleteSession(id: string): Promise\u003cvoid>;\n  /** delete all sessions from a source, or all if omitted */\n  clearSessions(source?: SleepSession['source']): Promise\u003cvoid>;\n\n  listHabits(): Promise\u003cHabit[]>;\n  saveHabit(h: Habit): Promise\u003cvoid>;\n  listHabitLogs(sinceDate?: string): Promise\u003cHabitLog[]>;\n  setHabitLog(log: HabitLog): Promise\u003cvoid>;\n  removeHabitLog(habitKey: HabitKey, date: string): Promise\u003cvoid>;\n\n  listCheckins(): Promise\u003cEnergyCheckin[]>;\n  addCheckin(c: EnergyCheckin): Promise\u003cvoid>;\n\n  getSummary(date: string): Promise\u003cDailySummary | null>;\n  saveSummary(s: DailySummary): Promise\u003cvoid>;\n  clearSummaries(): Promise\u003cvoid>;\n\n  getSetting(key: string): Promise\u003cstring | null>;\n  setSetting(key: string, value: string): Promise\u003cvoid>;\n\n  exportAll(): Promise\u003cExportBundle>;\n  wipe(): Promise\u003cvoid>;\n}\n"},{"path":"src/engine/__tests__/alarm.test.ts","content":"import { suggestWakeTime } from '../alarm';\nimport { MIN } from '../constants';\nimport { formatClock, localTimeToMs } from '../time';\nimport { TZ } from './fixtures';\n\nconst at = (h: string, key = '2025-05-14') => localTimeToMs(key, h, TZ);\n\ndescribe('gentle alarm', () => {\n  it('picks the last 90-minute cycle end inside the span', () => {\n    // onset 23:00 -> cycle ends 00:30, 02:00, 03:30, 05:00, 06:30, 08:00\n    const s = suggestWakeTime(at('23:00'), at('06:00', '2025-05-15'), at('07:00', '2025-05-15'));\n    expect(formatClock(s.wakeAt, TZ)).toBe('06:30');\n    expect(s.cycles).toBe(5);\n    expect(s.aligned).toBe(true);\n  });\n\n  it('prefers the latest cycle end when two fit into a long span', () => {\n    const s = suggestWakeTime(at('23:00'), at('05:00', '2025-05-15'), at('08:00', '2025-05-15'));\n    expect(formatClock(s.wakeAt, TZ)).toBe('08:00');\n    expect(s.cycles).toBe(6);\n  });\n\n  it('falls back to the end of the span when no cycle ends inside it', () => {\n    const s = suggestWakeTime(at('23:00'), at('06:40', '2025-05-15'), at('06:55', '2025-05-15'));\n    expect(s.aligned).toBe(false);\n    expect(formatClock(s.wakeAt, TZ)).toBe('06:55');\n    expect(s.cycles).toBe(5);\n  });\n\n  it('never suggests a time before the first cycle completes', () => {\n    const s = suggestWakeTime(at('23:00'), at('23:10'), at('23:40'));\n    expect(s.aligned).toBe(false);\n    expect(s.cycles).toBe(0);\n    expect(s.wakeAt).toBe(at('23:40'));\n    expect(s.wakeAt - at('23:00')).toBe(40 * MIN);\n  });\n});\n"},{"path":"src/engine/__tests__/chronotype.test.ts","content":"import { chronotypeFromAnswers, classify, learnChronotype, midSleepHours, sleepDurationH } from '../chronotype';\nimport { DAY } from '../constants';\nimport { addDaysToKey, dayOfWeekOfKey, localTimeToMs } from '../time';\nimport { makeProfile, night, TZ } from './fixtures';\nimport type { SleepSession } from '../types';\n\ndescribe('questionnaire', () => {\n  it('computes durations and mid-sleep across midnight', () => {\n    expect(sleepDurationH('23:00', '07:00')).toBe(8);\n    expect(sleepDurationH('07:00', '07:00')).toBe(24);\n    expect(midSleepHours('23:00', '07:00')).toBeCloseTo(3);\n    expect(midSleepHours('01:00', '09:00')).toBeCloseTo(5);\n    expect(midSleepHours('21:00', '05:00')).toBeCloseTo(1);\n    expect(midSleepHours('20:00', '04:00')).toBeCloseTo(0);\n    expect(midSleepHours('18:00', '02:00')).toBeCloseTo(-2);\n  });\n\n  it('classifies early, intermediate and late', () => {\n    expect(classify(2.5)).toBe('early');\n    expect(classify(4)).toBe('intermediate');\n    expect(classify(5.5)).toBe('late');\n  });\n\n  it('corrects MSF for oversleeping on free days (MSFsc)', () => {\n    const r = chronotypeFromAnswers({ freeSleepStart: '00:30', freeWake: '09:00', workBed: '23:30', workWake: '06:30' });\n    // free 8.5 h, work 7 h -> week avg (5*7+2*8.5)/7 = 7.43; correction (8.5-7.43)/2\n    expect(r.msf).toBeCloseTo(4.75);\n    expect(r.msfsc).toBeCloseTo(4.75 - (8.5 - (5 * 7 + 2 * 8.5) / 7) / 2, 6);\n    expect(r.msfsc).toBeLessThan(r.msf);\n    expect(r.chronotype).toBe('intermediate');\n    expect(r.socialJetlagHours).toBeCloseTo(4.75 - midSleepHours('23:30', '06:30'), 6);\n  });\n\n  it('detects an early bird and a night owl', () => {\n    const early = chronotypeFromAnswers({ freeSleepStart: '21:30', freeWake: '05:30', workBed: '21:30', workWake: '05:30' });\n    expect(early.chronotype).toBe('early');\n    expect(early.score).toBeLessThan(0);\n    expect(early.offsetMin).toBeLessThan(0);\n    const late = chronotypeFromAnswers({ freeSleepStart: '03:00', freeWake: '11:30', workBed: '01:00', workWake: '07:00' });\n    expect(late.chronotype).toBe('late');\n    expect(late.score).toBeGreaterThan(0);\n    expect(late.offsetMin).toBeGreaterThan(0);\n  });\n\n  it('limits the offset to +-240 min and the score to +-1', () => {\n    const r = chronotypeFromAnswers({ freeSleepStart: '08:00', freeWake: '16:00', workBed: '08:00', workWake: '16:00' });\n    expect(r.offsetMin).toBe(240);\n    expect(r.score).toBe(1);\n    const e = chronotypeFromAnswers({ freeSleepStart: '18:00', freeWake: '02:00', workBed: '18:00', workWake: '02:00' });\n    expect(e.offsetMin).toBe(-240);\n    expect(e.score).toBe(-1);\n  });\n\n  it('nudges slightly by the self-reported peak time', () => {\n    const base = { freeSleepStart: '00:00', freeWake: '08:00', workBed: '00:00', workWake: '08:00' };\n    const a = chronotypeFromAnswers({ ...base, peak: 'morning' }).msfsc;\n    const b = chronotypeFromAnswers({ ...base, peak: 'midday' }).msfsc;\n    const c = chronotypeFromAnswers({ ...base, peak: 'evening' }).msfsc;\n    const d = chronotypeFromAnswers({ ...base, peak: 'night' }).msfsc;\n    expect(a).toBeLessThan(b);\n    expect(b).toBeLessThan(c);\n    expect(c).toBeLessThan(d);\n  });\n});\n\nfunction twentyFiveNights(): SleepSession[] {\n  const out: SleepSession[] = [];\n  const last = '2025-05-14';\n  for (let i = 0; i \u003c 28; i++) {\n    const key = addDaysToKey(last, -i);\n    const free = [0, 6].includes(dayOfWeekOfKey(key));\n    out.push(free ? night(key, '01:30', '09:30') : night(key, '23:30', '06:30'));\n  }\n  return out;\n}\n\ndescribe('learning from data', () => {\n  const now = localTimeToMs('2025-05-14', '12:00', TZ);\n\n  it('returns null with too little data or in shift mode', () => {\n    expect(learnChronotype(twentyFiveNights().slice(0, 10), makeProfile(), now)).toBeNull();\n    const shift = makeProfile({ workSchedule: { workDays: [1], workStart: '', workEnd: '', shiftMode: true } });\n    expect(learnChronotype(twentyFiveNights(), shift, now)).toBeNull();\n    expect(learnChronotype([], makeProfile(), now)).toBeNull();\n  });\n\n  it('returns null without enough free days', () => {\n    const work = Array.from({ length: 25 }, (_, i) => night(addDaysToKey('2025-05-14', -i), '23:30', '06:30')).filter(\n      (s) => ![0, 6].includes(dayOfWeekOfKey(new Date(s.endAt).toISOString().slice(0, 10))),\n    );\n    const p = makeProfile({ workSchedule: { workDays: [0, 1, 2, 3, 4, 5, 6], workStart: '', workEnd: '', shiftMode: false } });\n    expect(learnChronotype(work, p, now)).toBeNull();\n  });\n\n  it('re-estimates MSFsc and moves the offset by at most 15 min per week', () => {\n    const r = learnChronotype(twentyFiveNights(), makeProfile({ circadianPhaseOffsetMin: 0 }), now, now - 7 * DAY);\n    expect(r).not.toBeNull();\n    expect(r!.freeNights).toBeGreaterThanOrEqual(6);\n    expect(r!.msfsc).toBeGreaterThan(4);\n    expect(r!.offsetMin).toBeGreaterThan(0);\n    expect(r!.offsetMin).toBeLessThanOrEqual(15 + 1e-9);\n    expect(r!.changed).toBe(true);\n    expect(r!.socialJetlagHours).toBeGreaterThan(1.5);\n    const two = learnChronotype(twentyFiveNights(), makeProfile({ circadianPhaseOffsetMin: 0 }), now, now - 14 * DAY);\n    expect(two!.offsetMin).toBeLessThanOrEqual(30 + 1e-9);\n    expect(two!.offsetMin).toBeGreaterThan(r!.offsetMin);\n    const none = learnChronotype(twentyFiveNights(), makeProfile({ circadianPhaseOffsetMin: 0 }), now, now);\n    expect(none!.changed).toBe(false);\n  });\n\n  it('assumes one week since the last update when unknown, and works without work days', () => {\n    const r = learnChronotype(twentyFiveNights(), makeProfile(), now);\n    expect(Math.abs(r!.offsetMin)).toBeLessThanOrEqual(15 + 1e-9);\n    const freeOnly = Array.from({ length: 25 }, (_, i) => night(addDaysToKey('2025-05-14', -i), '00:00', '08:00'));\n    const p = makeProfile({ workSchedule: { workDays: [], workStart: '', workEnd: '', shiftMode: false } });\n    expect(learnChronotype(freeOnly, p, now)).not.toBeNull();\n  });\n});\n"},{"path":"src/engine/__tests__/dayPlan.test.ts","content":"import { computeDayPlan, computeTomorrowPlan, resolveNeed } from '../dayPlan';\nimport { buildWindows, melatoninWindow, napLengthMinutes, nextClockTime, recommendBedtime } from '../windows';\nimport { DAY, HOUR, MIN } from '../constants';\nimport { addDaysToKey, formatClock, localTimeToMs } from '../time';\nimport { constantNights, makeProfile, night, nap, TZ } from './fixtures';\nimport type { SleepSession } from '../types';\n\nconst TODAY = '2025-05-14';\nconst at = (h: string, key = TODAY) => localTimeToMs(key, h, TZ);\nconst clock = (ms: number) => formatClock(ms, TZ);\n\ndescribe('windows', () => {\n  it('finds the next clock time strictly after an instant, also over midnight', () => {\n    expect(clock(nextClockTime(at('10:00'), 22.5, TZ))).toBe('22:30');\n    const n = nextClockTime(at('23:00'), 6.5, TZ);\n    expect(clock(n)).toBe('06:30');\n    expect(n).toBeGreaterThan(at('23:00'));\n  });\n\n  it('places the melatonin window around the habitual onset, shifted by the chronotype', () => {\n    const m = melatoninWindow(at('07:00'), 0, TZ);\n    expect(clock(m.start)).toBe('22:30');\n    expect(clock(m.end)).toBe('23:30');\n    expect(m.start - m.dlmo).toBe(2 * HOUR);\n    const late = melatoninWindow(at('09:00'), 120, TZ);\n    expect(clock(late.start)).toBe('00:30');\n    const early = melatoninWindow(at('05:00'), -120, TZ);\n    expect(clock(early.start)).toBe('20:30');\n  });\n\n  it('recommends the middle of the melatonin window without a target wake time', () => {\n    const profile = makeProfile();\n    const mel = melatoninWindow(at('07:00'), 0, TZ);\n    const b = recommendBedtime({ wakeAt: at('07:00'), profile, needMinutes: 480, debtMinutes: 0, melatonin: mel });\n    expect(clock(b.bedtime)).toBe('23:00');\n    expect(b.hint).toBeNull();\n    expect(b.wakeAt - b.bedtime).toBe((480 + 15) * MIN);\n  });\n\n  it('computes bedtime from the target wake time, need, debt payback and onset', () => {\n    const profile = makeProfile({ targetWakeTime: '07:00' });\n    const mel = melatoninWindow(at('07:00'), 0, TZ);\n    const noDebt = recommendBedtime({ wakeAt: at('07:00'), profile, needMinutes: 480, debtMinutes: 0, melatonin: mel });\n    expect(clock(noDebt.bedtime)).toBe('22:45');\n    const debt = recommendBedtime({ wakeAt: at('07:00'), profile, needMinutes: 480, debtMinutes: 240, melatonin: mel });\n    expect(debt.debtPaybackMinutes).toBe(36);\n    expect(clock(debt.bedtime)).toBe('22:09');\n    const huge = recommendBedtime({ wakeAt: at('07:00'), profile, needMinutes: 480, debtMinutes: 2000, melatonin: mel });\n    expect(huge.debtPaybackMinutes).toBe(60);\n  });\n\n  it('warns and clamps when the bedtime would be too early', () => {\n    const profile = makeProfile({ targetWakeTime: '05:00' });\n    const mel = melatoninWindow(at('05:00'), 0, TZ);\n    const b = recommendBedtime({ wakeAt: at('05:00'), profile, needMinutes: 480, debtMinutes: 0, melatonin: mel });\n    expect(b.hint).toBe('too_early');\n    expect(clock(b.bedtime)).toBe('21:30');\n    expect(b.wakeAt).toBeGreaterThan(at('05:00', addDaysToKey(TODAY, 1)));\n  });\n\n  it('suggests a long nap only with a lot of debt', () => {\n    expect(napLengthMinutes(0)).toBe(20);\n    expect(napLengthMinutes(700)).toBe(90);\n  });\n\n  it('keeps nap late enough before bed and drops it when it would not fit', () => {\n    const features = {\n      grogginessEnd: at('08:15'),\n      morningPeak: { start: at('09:30'), end: at('11:00') },\n      afternoonDip: { start: at('17:00'), end: at('18:00') },\n      eveningPeak: { start: at('20:00'), end: at('21:00') },\n      heuristic: false,\n    };\n    const mel = melatoninWindow(at('07:00'), 0, TZ);\n    const bedtime = at('23:00');\n    const w = buildWindows({ wakeAt: at('07:00'), features, bedtime, melatonin: mel, caffeineCutoffHours: 8, debtMinutes: 0 });\n    const napW = w.find((x) => x.kind === 'nap');\n    expect(napW).toBeDefined();\n    expect(napW!.start).toBeLessThanOrEqual(bedtime - 7 * HOUR);\n    const early = buildWindows({\n      wakeAt: at('07:00'),\n      features: { ...features, afternoonDip: { start: at('07:30'), end: at('08:00') } },\n      bedtime,\n      melatonin: mel,\n      caffeineCutoffHours: 8,\n      debtMinutes: 0,\n    });\n    expect(early.find((x) => x.kind === 'nap')).toBeUndefined();\n  });\n});\n\ndescribe('day plan', () => {\n  const profile = makeProfile();\n  const sessions = constantNights(TODAY, 20, 480, '07:00');\n  const now = at('10:00');\n\n  it('builds a sensible plan for a rested day', () => {\n    const p = computeDayPlan({ sessions, profile, now });\n    expect(clock(p.wakeAt)).toBe('07:00');\n    expect(p.hasWakeData).toBe(true);\n    expect(p.date).toBe(TODAY);\n    expect(p.debt.debtMinutes).toBeCloseTo(0, 3);\n    expect(p.needMinutes).toBe(480);\n    expect(clock(p.bedtime.bedtime)).toBe('23:00');\n    expect(p.currentEnergy).toBeGreaterThan(40);\n    expect(p.curve.points.length).toBe(289);\n  });\n\n  it('lists all 5.8 windows in a sensible order', () => {\n    const p = computeDayPlan({ sessions, profile, now });\n    const kinds = p.windows.map((w) => w.kind);\n    for (const k of ['grogginess', 'morning_light', 'morning_peak', 'caffeine_stop', 'afternoon_dip', 'nap', 'evening_peak', 'sport', 'last_meal', 'dim_light', 'wind_down', 'melatonin', 'bedtime'])\n      expect(kinds).toContain(k);\n    const starts = p.windows.map((w) => w.start);\n    expect([...starts].sort((a, b) => a - b)).toEqual(starts);\n    const get = (k: string) => p.windows.find((w) => w.kind === k)!;\n    expect(get('caffeine_stop').start).toBe(p.bedtime.bedtime - 8 * HOUR);\n    expect(get('last_meal').start).toBe(p.bedtime.bedtime - 3 * HOUR);\n    expect(get('dim_light').start).toBe(p.melatonin.start - 90 * MIN);\n    expect(get('wind_down').start).toBe(p.melatonin.start - 60 * MIN);\n    expect(get('morning_light').end - get('morning_light').start).toBe(60 * MIN);\n    expect(get('morning_peak').start).toBeLessThan(get('afternoon_dip').start);\n    expect(get('sport').end).toBeLessThanOrEqual(get('wind_down').start - 2 * HOUR);\n    expect(get('caffeine_stop').point).toBe(true);\n  });\n\n  it('honours the caffeine cut-off setting', () => {\n    const p = computeDayPlan({ sessions, profile: makeProfile({ caffeineCutoffHours: 10 }), now });\n    const c = p.windows.find((w) => w.kind === 'caffeine_stop')!;\n    expect(c.start).toBe(p.bedtime.bedtime - 10 * HOUR);\n  });\n\n  it('reports the current phase and the next event', () => {\n    const groggy = computeDayPlan({ sessions, profile, now: at('07:30') });\n    expect(groggy.currentPhase).toBe('grogginess');\n    expect(groggy.nextEvent).not.toBeNull();\n    expect(groggy.nextEvent!.at).toBeGreaterThan(at('07:30'));\n    const late = computeDayPlan({ sessions, profile, now: at('22:45') });\n    expect(['wind_down', 'melatonin']).toContain(late.currentPhase);\n    const very = computeDayPlan({ sessions, profile, now: at('23:30') });\n    expect(very.nextEvent).toBeNull();\n  });\n\n  it('uses the target wake time and estimates the wake-up when no data exists', () => {\n    const p = computeDayPlan({ sessions: [], profile: makeProfile({ targetWakeTime: '06:30' }), now: at('12:00') });\n    expect(p.hasWakeData).toBe(false);\n    expect(clock(p.wakeAt)).toBe('06:30');\n    expect(p.debt.insufficientData).toBe(true);\n    const q = computeDayPlan({ sessions: [], profile, now: at('12:00') });\n    expect(clock(q.wakeAt)).toBe('06:30');\n    const early = computeDayPlan({ sessions: [], profile, now: at('03:00') });\n    expect(early.wakeAt).toBeLessThan(at('03:00'));\n  });\n\n  it('a late chronotype has a visibly later curve and bedtime', () => {\n    const lateSessions = constantNights(TODAY, 20, 480, '09:00');\n    const late = computeDayPlan({ sessions: lateSessions, profile: makeProfile({ chronotype: 'late', circadianPhaseOffsetMin: 120 }), now: at('12:00') });\n    const norm = computeDayPlan({ sessions, profile, now: at('12:00') });\n    const hourOf = (ms: number) => (ms - localTimeToMs(TODAY, '00:00', TZ)) / HOUR;\n    expect(hourOf(late.bedtime.bedtime)).toBeGreaterThan(hourOf(norm.bedtime.bedtime) + 1.5);\n    expect(late.features.eveningPeak.start - late.wakeAt).toBeGreaterThan(norm.features.eveningPeak.start - norm.wakeAt - 1 * HOUR);\n    expect(clock(late.melatonin.start)).toBe('00:30');\n    const lateEveningHour = hourOf(late.features.eveningPeak.start);\n    expect(lateEveningHour).toBeGreaterThan(hourOf(norm.features.eveningPeak.start));\n    expect(late.phase.adapting).toBe(false);\n  });\n\n  it('works across the spring DST night in Europe/Berlin', () => {\n    const dst: SleepSession[] = [\n      ...constantNights('2025-03-29', 19, 480),\n      { ...night('2025-03-30', '23:00', '07:00'), startAt: at('23:00', '2025-03-29'), endAt: at('07:00', '2025-03-30') },\n    ];\n    const p = computeDayPlan({ sessions: dst, profile, now: at('12:00', '2025-03-30') });\n    expect(clock(p.wakeAt)).toBe('07:00');\n    expect(p.debt.nights[0].sleptMinutes).toBe(420);\n    expect(clock(p.bedtime.bedtime)).toBe('23:00');\n    const starts = p.windows.map((w) => w.start);\n    expect([...starts].sort((a, b) => a - b)).toEqual(starts);\n  });\n\n  it('works across the autumn DST night in Europe/Berlin', () => {\n    const dst: SleepSession[] = [\n      ...constantNights('2025-10-25', 19, 480),\n      { ...night('2025-10-26', '23:00', '07:00'), startAt: at('23:00', '2025-10-25'), endAt: at('07:00', '2025-10-26') },\n    ];\n    const p = computeDayPlan({ sessions: dst, profile, now: at('12:00', '2025-10-26') });\n    expect(p.debt.nights[0].sleptMinutes).toBe(540);\n    expect(clock(p.bedtime.bedtime)).toBe('23:00');\n  });\n\n  it('handles nights across midnight and naps', () => {\n    const s = [...constantNights(TODAY, 20, 480, '07:30').slice(1), night(TODAY, '00:15', '07:45'), nap(TODAY, '14:00', '14:25')];\n    const p = computeDayPlan({ sessions: s, profile, now: at('15:00') });\n    expect(clock(p.wakeAt)).toBe('07:45');\n    expect(p.debt.nights[0].sleptMinutes).toBeCloseTo(450 + 0.75 * 25, 3);\n  });\n\n  it('resolves need: manual > stored estimate > default', () => {\n    expect(resolveNeed(makeProfile({ sleepNeedMinutesManual: 450, sleepNeedMinutesEstimated: 500 }), now)).toBe(450);\n    expect(resolveNeed(makeProfile({ sleepNeedMinutesEstimated: 500 }), now)).toBe(500);\n    expect(resolveNeed(makeProfile(), now)).toBe(480);\n    const p = computeDayPlan({ sessions, profile, now, needMinutes: 510 });\n    expect(p.needMinutes).toBe(510);\n  });\n\n  it('preview for tomorrow assumes a full night at the recommended bedtime', () => {\n    const today = computeDayPlan({ sessions, profile: makeProfile({ targetWakeTime: '07:00' }), now });\n    const tomorrow = computeTomorrowPlan({ sessions, profile: makeProfile({ targetWakeTime: '07:00' }), now }, today);\n    expect(tomorrow.date).toBe(addDaysToKey(TODAY, 1));\n    expect(clock(tomorrow.wakeAt)).toBe('07:00');\n    expect(tomorrow.wakeAt).toBeGreaterThan(today.wakeAt + 20 * HOUR);\n    const direct = computeTomorrowPlan({ sessions, profile, now });\n    expect(direct.date).toBe(addDaysToKey(TODAY, 1));\n  });\n\n  it('computes in well under 50 ms for 90 days of data (benchmark)', () => {\n    const many = constantNights(TODAY, 90, 470);\n    computeDayPlan({ sessions: many, profile, now }); // warm up\n    const runs = 10;\n    const t0 = performance.now();\n    for (let i = 0; i \u003c runs; i++) computeDayPlan({ sessions: many, profile, now });\n    const avg = (performance.now() - t0) / runs;\n    expect(avg).toBeLessThan(50);\n  });\n\n  it('never produces NaN values', () => {\n    const p = computeDayPlan({ sessions, profile, now });\n    expect(Number.isNaN(p.currentEnergy)).toBe(false);\n    for (const pt of p.curve.points) expect(Number.isFinite(pt.energy)).toBe(true);\n    expect(DAY).toBeGreaterThan(0);\n  });\n});\n"},{"path":"src/engine/__tests__/energyCurve.test.ts","content":"import { buildCurve, energyAt, extremumWindow, findFeatures, grogginessEndAfter, normalizeEnergy } from '../energyCurve';\nimport { DAY, HOUR, MIN } from '../constants';\nimport { sleepIntervals } from '../sleepDetection';\nimport { formatClock, localTimeToMs } from '../time';\nimport { constantNights, TZ } from './fixtures';\n\nconst TODAY = '2025-05-14';\nconst wakeAt = localTimeToMs(TODAY, '07:00', TZ);\n\nfunction curveFor(opts: { debt?: number; offset?: number; sessions?: ReturnType\u003ctypeof constantNights> } = {}) {\n  const sessions = opts.sessions ?? constantNights(TODAY, 20, 480);\n  return buildCurve({\n    intervals: sleepIntervals(sessions, TZ),\n    wakeAt,\n    from: wakeAt - 14 * DAY,\n    tz: TZ,\n    offsetMin: opts.offset ?? 0,\n    debtMinutes: opts.debt ?? 0,\n  });\n}\n\nconst bed = localTimeToMs(TODAY, '23:00', TZ);\nconst mel = localTimeToMs(TODAY, '22:30', TZ);\n\ndescribe('energy curve', () => {\n  it('has 5-minute steps over 24 h and stays within 0..100', () => {\n    const c = curveFor();\n    expect(c.points).toHaveLength(289);\n    expect(c.points[1].t - c.points[0].t).toBe(5 * MIN);\n    for (const p of c.points) {\n      expect(p.energy).toBeGreaterThanOrEqual(0);\n      expect(p.energy).toBeLessThanOrEqual(100);\n    }\n  });\n\n  it('starts low (groggy) and recovers', () => {\n    const c = curveFor();\n    expect(c.points[0].energy).toBeLessThan(10);\n    expect(energyAt(c.points, wakeAt + 3 * HOUR)).toBeGreaterThan(55);\n  });\n\n  it('finds morning peak before afternoon dip before evening peak', () => {\n    const c = curveFor();\n    const f = findFeatures({ curve: c, debtMinutes: 0, awakeEnd: bed, melatoninStart: mel });\n    expect(f.heuristic).toBe(false);\n    const mp = (f.morningPeak.start + f.morningPeak.end) / 2;\n    const dip = (f.afternoonDip.start + f.afternoonDip.end) / 2;\n    const ev = (f.eveningPeak.start + f.eveningPeak.end) / 2;\n    expect(mp).toBeLessThan(dip);\n    expect(dip).toBeLessThan(ev);\n    expect((mp - wakeAt) / HOUR).toBeGreaterThanOrEqual(1.5);\n    expect((mp - wakeAt) / HOUR).toBeLessThanOrEqual(5);\n    expect((dip - wakeAt) / HOUR).toBeGreaterThanOrEqual(5.5);\n    expect((dip - wakeAt) / HOUR).toBeLessThanOrEqual(9.5);\n    expect((mel - ev) / HOUR).toBeGreaterThanOrEqual(1.5);\n    expect((mel - ev) / HOUR).toBeLessThanOrEqual(4.5);\n    expect(energyAt(c.points, mp)).toBeGreaterThan(energyAt(c.points, dip));\n    expect(energyAt(c.points, ev)).toBeGreaterThan(energyAt(c.points, dip));\n  });\n\n  it('windows last between 45 and 150 minutes and lie within the day', () => {\n    const c = curveFor();\n    const f = findFeatures({ curve: c, debtMinutes: 0, awakeEnd: bed, melatoninStart: mel });\n    for (const w of [f.morningPeak, f.afternoonDip, f.eveningPeak]) {\n      const len = (w.end - w.start) / MIN;\n      expect(len).toBeGreaterThanOrEqual(45 - 1e-6);\n      expect(len).toBeLessThanOrEqual(150 + 1e-6);\n      expect(w.start).toBeGreaterThanOrEqual(wakeAt);\n      expect(w.end).toBeLessThanOrEqual(bed);\n    }\n    expect(f.grogginessEnd - wakeAt).toBeGreaterThanOrEqual(60 * MIN);\n    expect(f.grogginessEnd - wakeAt).toBeLessThanOrEqual(95 * MIN);\n  });\n\n  it('grogginess lasts longer with sleep debt', () => {\n    expect(grogginessEndAfter(900, 0)).toBeGreaterThan(grogginessEndAfter(0, 0));\n    expect(grogginessEndAfter(0, 1)).toBeGreaterThan(grogginessEndAfter(0, 0));\n  });\n\n  it('a high debt day is lower than a rested day on the same fixed scale', () => {\n    const rested = curveFor({ debt: 0 });\n    const tired = curveFor({ debt: 900 });\n    const avg = (c: typeof rested) => c.points.slice(24, 180).reduce((a, p) => a + p.energy, 0) / 156;\n    expect(avg(tired)).toBeLessThan(avg(rested) - 3);\n  });\n\n  it('a short night lowers the day', () => {\n    const short = curveFor({ sessions: constantNights(TODAY, 20, 480).map((s, i) => (i === 0 ? { ...s, startAt: s.endAt - 4 * HOUR } : s)) });\n    const rested = curveFor();\n    expect(energyAt(short.points, wakeAt + 8 * HOUR)).toBeLessThan(energyAt(rested.points, wakeAt + 8 * HOUR));\n  });\n\n  it('a late chronotype shifts the evening peak later', () => {\n    const late = curveFor({ offset: 120 });\n    const norm = curveFor();\n    const fl = findFeatures({ curve: late, debtMinutes: 0, awakeEnd: bed + 2 * HOUR, melatoninStart: mel + 2 * HOUR });\n    const fn = findFeatures({ curve: norm, debtMinutes: 0, awakeEnd: bed + 2 * HOUR, melatoninStart: mel + 2 * HOUR });\n    expect(fl.eveningPeak.start).toBeGreaterThan(fn.eveningPeak.start);\n  });\n\n  it('falls back to heuristics when the curve has no clear shape', () => {\n    const c = curveFor();\n    const flat = { ...c, points: c.points.map((p) => ({ ...p, energy: 50 })) };\n    const f = findFeatures({ curve: flat, debtMinutes: 0, awakeEnd: bed, melatoninStart: mel });\n    expect(f.heuristic).toBe(true);\n    expect(f.morningPeak.start).toBeLessThan(f.afternoonDip.start);\n    expect(f.afternoonDip.start).toBeLessThan(f.eveningPeak.start);\n    expect(formatClock(f.eveningPeak.start, TZ)).toMatch(/^\\d\\d:\\d\\d$/);\n  });\n\n  it('expands very narrow extrema to 45 minutes and trims wide plateaus to 150', () => {\n    const pts = Array.from({ length: 100 }, (_, i) => ({ t: wakeAt + i * 5 * MIN, energy: i === 50 ? 80 : 40 }));\n    const w = extremumWindow(pts, 50, 'max', pts[0].t, pts[99].t);\n    expect((w.end - w.start) / MIN).toBe(45);\n    const flat = pts.map((p) => ({ ...p, energy: 60 }));\n    const w2 = extremumWindow(flat, 50, 'max', flat[0].t, flat[99].t);\n    expect((w2.end - w2.start) / MIN).toBeLessThanOrEqual(150);\n    const minW = extremumWindow(pts.map((p, i) => ({ ...p, energy: i === 50 ? 10 : 50 })), 50, 'min', pts[0].t, pts[99].t);\n    expect(minW.start).toBeLessThan(minW.end);\n  });\n\n  it('normalises on a fixed scale', () => {\n    expect(normalizeEnergy(-10)).toBe(0);\n    expect(normalizeEnergy(10)).toBe(100);\n    expect(normalizeEnergy(-0.3)).toBeGreaterThan(normalizeEnergy(-0.4));\n  });\n\n  it('interpolates energyAt and clamps outside the range', () => {\n    const pts = [\n      { t: 0, energy: 0 },\n      { t: 5 * MIN, energy: 10 },\n    ];\n    expect(energyAt(pts, 2.5 * MIN)).toBeCloseTo(5);\n    expect(energyAt(pts, -1)).toBe(0);\n    expect(energyAt(pts, 99 * MIN)).toBe(10);\n    expect(energyAt([], 0)).toBe(0);\n  });\n});\n"},{"path":"src/engine/__tests__/fixtures.ts","content":"import { addDaysToKey, localTimeToMs } from '../time';\nimport type { Profile, SleepSession } from '../types';\n\nexport const TZ = 'Europe/Berlin';\n\nexport function makeProfile(over: Partial\u003cProfile> = {}): Profile {\n  return {\n    name: 'Test',\n    birthYear: 1990,\n    sleepNeedMinutesManual: null,\n    sleepNeedMinutesEstimated: null,\n    chronotype: 'intermediate',\n    chronotypeScore: 0,\n    circadianPhaseOffsetMin: 0,\n    targetWakeTime: null,\n    workSchedule: { workDays: [1, 2, 3, 4, 5], workStart: '09:00', workEnd: '17:00', shiftMode: false },\n    caffeineCutoffHours: 8,\n    timezone: TZ,\n    ...over,\n  };\n}\n\nlet counter = 0;\n/** A night that starts on the evening of `bedDateKey` at `bed` and ends the next morning at `wake`. */\nexport function night(\n  wakeDateKey: string,\n  bed: string,\n  wake: string,\n  over: Partial\u003cSleepSession> = {},\n  tz = TZ,\n): SleepSession {\n  const [bh] = bed.split(':').map(Number);\n  const bedKey = bh >= 12 ? addDaysToKey(wakeDateKey, -1) : wakeDateKey;\n  return {\n    id: `n${counter++}`,\n    startAt: localTimeToMs(bedKey, bed, tz),\n    endAt: localTimeToMs(wakeDateKey, wake, tz),\n    asleepMinutes: null,\n    source: 'demo',\n    confidence: 1,\n    isNap: false,\n    timezone: tz,\n    userEdited: false,\n    ...over,\n  };\n}\n\n/** A session that starts and ends on the same local date. */\nexport function nap(dateKey: string, start: string, end: string, over: Partial\u003cSleepSession> = {}): SleepSession {\n  return {\n    id: `p${counter++}`,\n    startAt: localTimeToMs(dateKey, start, TZ),\n    endAt: localTimeToMs(dateKey, end, TZ),\n    asleepMinutes: null,\n    source: 'demo',\n    confidence: 1,\n    isNap: false,\n    timezone: TZ,\n    userEdited: false,\n    ...over,\n  };\n}\n\n/** Sleep of constant duration `minutes`, waking at `wake` on every one of the last `days` days. */\nexport function constantNights(lastWakeKey: string, days: number, minutes: number, wake = '07:00'): SleepSession[] {\n  const out: SleepSession[] = [];\n  for (let i = 0; i \u003c days; i++) {\n    const key = addDaysToKey(lastWakeKey, -i);\n    const endAt = localTimeToMs(key, wake, TZ);\n    out.push({\n      id: `c${counter++}`,\n      startAt: endAt - minutes * 60_000,\n      endAt,\n      asleepMinutes: null,\n      source: 'demo',\n      confidence: 1,\n      isNap: false,\n      timezone: TZ,\n      userEdited: false,\n    });\n  }\n  return out;\n}\n"},{"path":"src/engine/__tests__/recommendations.test.ts","content":"import { computeDayPlan } from '../dayPlan';\nimport { ALL_TIP_IDS, selectTips } from '../recommendations';\nimport { addDaysToKey, localTimeToMs } from '../time';\nimport { constantNights, makeProfile, night, TZ } from './fixtures';\n\nconst TODAY = '2025-05-14';\nconst now = localTimeToMs(TODAY, '10:00', TZ);\nconst profile = makeProfile();\n\nfunction ctx(sessions = constantNights(TODAY, 20, 480), extra = {}, history: Record\u003cstring, string[]> = {}, prof = profile) {\n  const plan = computeDayPlan({ sessions, profile: prof, now });\n  return { plan, sessions, profile: prof, today: TODAY, history, ...extra };\n}\n\ndescribe('recommendations', () => {\n  it('returns between 1 and 3 tips', () => {\n    const tips = selectTips(ctx());\n    expect(tips.length).toBeGreaterThanOrEqual(1);\n    expect(tips.length).toBeLessThanOrEqual(3);\n    for (const t of tips) {\n      expect(t.id).toBeTruthy();\n      expect(t.title).toBeTruthy();\n      expect(t.body).toBeTruthy();\n    }\n    expect(ALL_TIP_IDS.length).toBeGreaterThan(5);\n  });\n\n  it('recommends going to bed earlier with high sleep debt', () => {\n    const tips = selectTips(ctx(constantNights(TODAY, 20, 300)));\n    expect(tips[0].id).toBe('debt_high');\n    expect(tips[0].ctaHabitKey).toBe('bedtime');\n  });\n\n  it('recommends catching up with medium debt', () => {\n    const tips = selectTips(ctx(constantNights(TODAY, 20, 420)));\n    expect(tips.map((t) => t.id)).toContain('debt_mid');\n  });\n\n  it('flags irregular bedtimes', () => {\n    const s = Array.from({ length: 20 }, (_, i) =>\n      night(addDaysToKey(TODAY, -i), i % 2 ? '21:30' : '01:30', '07:30'),\n    );\n    expect(selectTips(ctx(s)).map((t) => t.id)).toContain('regularity');\n  });\n\n  it('suggests the caffeine tip after repeated late coffee and the social jetlag tip', () => {\n    const c = ctx(undefined, { caffeineLateDays: 4, socialJetlagHours: 2.5 });\n    const ids = selectTips(c).map((t) => t.id);\n    expect(ids).toContain('caffeine_halflife');\n    expect(ids).toContain('social_jetlag');\n  });\n\n  it('mentions the adapting clock when the phase is shifting', () => {\n    const shift = makeProfile({ workSchedule: { workDays: [1], workStart: '', workEnd: '', shiftMode: true } });\n    const s = [\n      ...constantNights(addDaysToKey(TODAY, -4), 10, 480),\n      ...constantNights(TODAY, 4, 480, '16:00'),\n    ];\n    const plan = computeDayPlan({ sessions: s, profile: shift, now });\n    expect(plan.phase.adapting).toBe(true);\n    const tips = selectTips({ plan, sessions: s, profile: shift, today: TODAY, history: {} });\n    expect(tips.map((t) => t.id)).toContain('clock_adapting');\n  });\n\n  it('flags long grogginess', () => {\n    const c = ctx(constantNights(TODAY, 20, 480));\n    c.plan = { ...c.plan, features: { ...c.plan.features, grogginessEnd: c.plan.wakeAt + 100 * 60_000 } };\n    expect(selectTips(c).map((t) => t.id)).toContain('groggy_long');\n  });\n\n  it('does not repeat a tip on more than two consecutive days', () => {\n    const base = ctx(constantNights(TODAY, 20, 300));\n    const first = selectTips(base)[0].id;\n    expect(first).toBe('debt_high');\n    const history = {\n      [addDaysToKey(TODAY, -1)]: ['debt_high'],\n      [addDaysToKey(TODAY, -2)]: ['debt_high'],\n    };\n    const again = selectTips({ ...base, history });\n    expect(again.map((t) => t.id)).not.toContain('debt_high');\n    const onlyOne = selectTips({ ...base, history: { [addDaysToKey(TODAY, -1)]: ['debt_high'] } });\n    expect(onlyOne.map((t) => t.id)).toContain('debt_high');\n  });\n\n  it('always falls back to at least one tip', () => {\n    const everything = Object.fromEntries(\n      [1, 2].map((n) => [addDaysToKey(TODAY, -n), ALL_TIP_IDS]),\n    );\n    const tips = selectTips({ ...ctx(), history: everything });\n    expect(tips.length).toBe(1);\n    expect(tips[0].id).toBe('morning_light');\n  });\n});\n"},{"path":"src/engine/__tests__/sleepDebt.test.ts","content":"import { computeDebt, debtLevel, forecastDebt, weightFor } from '../sleepDebt';\nimport { addDaysToKey, localTimeToMs } from '../time';\nimport { constantNights, makeProfile, nap, night, TZ } from './fixtures';\n\nconst TODAY = '2025-05-14';\nconst NOW = localTimeToMs(TODAY, '12:00', TZ);\nconst NEED = 480;\n\ndescribe('sleep debt', () => {\n  it('weights sum to about 8.05', () => {\n    let sum = 0;\n    for (let i = 0; i \u003c 14; i++) sum += weightFor(i);\n    expect(sum).toBeCloseTo(8.05, 2);\n    expect(weightFor(0)).toBe(1);\n    expect(weightFor(13)).toBeCloseTo(0.15);\n  });\n\n  it('is zero when sleeping exactly the need every night', () => {\n    const d = computeDebt(constantNights(TODAY, 14, NEED), NEED, TZ, NOW);\n    expect(d.debtMinutes).toBeCloseTo(0, 6);\n    expect(d.level).toBe('low');\n    expect(d.missingCount).toBe(0);\n    expect(d.nights).toHaveLength(14);\n  });\n\n  it('is about 8 h 03 min with one hour too little every night', () => {\n    const d = computeDebt(constantNights(TODAY, 14, NEED - 60), NEED, TZ, NOW);\n    expect(d.debtMinutes).toBeCloseTo(8.05 * 60, 0);\n    expect(Math.round(d.debtMinutes)).toBe(483);\n    expect(d.level).toBe('medium');\n  });\n\n  it('matches a manual hand calculation of the formula', () => {\n    const slept = [400, 480, 300, 540, 450, 480, 420, 480, 480, 360, 480, 480, 500, 480];\n    const sessions = slept.flatMap((m, i) => constantNights(addDaysToKey(TODAY, -i), 1, m));\n    let expected = 0;\n    slept.forEach((m, i) => {\n      const w = 1 - i * (0.85 / 13);\n      const delta = NEED - m;\n      expected += delta > 0 ? w * delta : w * delta * 0.5;\n    });\n    expect(computeDebt(sessions, NEED, TZ, NOW).debtMinutes).toBeCloseTo(expected, 6);\n  });\n\n  it('a single long night after a deficit week reduces debt by at most half the surplus x weight', () => {\n    const deficit = constantNights(addDaysToKey(TODAY, -1), 13, NEED - 60);\n    const before = computeDebt(\n      [...deficit, ...constantNights(TODAY, 1, NEED - 60)],\n      NEED,\n      TZ,\n      NOW,\n    ).debtMinutes;\n    const after = computeDebt([...deficit, ...constantNights(TODAY, 1, NEED + 120)], NEED, TZ, NOW).debtMinutes;\n    expect(after).toBeLessThan(before);\n    // night 0: contribution changes from +60*1 to -120*0.5 = -60 -> reduction 120\n    expect(before - after).toBeCloseTo(120, 6);\n    expect(before - after).toBeLessThanOrEqual(120 * 1.0001);\n  });\n\n  it('never goes negative', () => {\n    const d = computeDebt(constantNights(TODAY, 14, NEED + 180), NEED, TZ, NOW);\n    expect(d.debtMinutes).toBe(0);\n  });\n\n  it('counts naps with weight 0.75', () => {\n    const sessions = [\n      ...constantNights(addDaysToKey(TODAY, -1), 13, NEED),\n      night(TODAY, '23:00', '06:00'),\n      nap(TODAY, '14:00', '14:40'),\n    ];\n    const d = computeDebt(sessions, NEED, TZ, NOW);\n    expect(d.nights[0].sleptMinutes).toBeCloseTo(420 + 0.75 * 40, 6);\n  });\n\n  it('fills missing nights with the median instead of zero', () => {\n    const sessions = constantNights(TODAY, 10, NEED - 60);\n    const d = computeDebt(sessions, NEED, TZ, NOW);\n    expect(d.missingCount).toBe(4);\n    expect(d.insufficientData).toBe(false);\n    expect(d.nights.filter((n) => n.estimated)).toHaveLength(4);\n    expect(d.nights[13].sleptMinutes).toBe(NEED - 60);\n    // the same as a complete record: no artificial debt\n    const full = computeDebt(constantNights(TODAY, 14, NEED - 60), NEED, TZ, NOW);\n    expect(d.debtMinutes).toBeCloseTo(full.debtMinutes, 6);\n  });\n\n  it('reports insufficient data with a range when more than 5 nights are missing', () => {\n    const sessions = [...constantNights(TODAY, 3, NEED - 60), ...constantNights(addDaysToKey(TODAY, -3), 3, NEED - 120)];\n    const d = computeDebt(sessions, NEED, TZ, NOW);\n    expect(d.insufficientData).toBe(true);\n    expect(d.range).not.toBeNull();\n    const [lo, hi] = d.range as [number, number];\n    expect(lo).toBeLessThanOrEqual(hi);\n    expect(d.debtMinutes).toBeGreaterThanOrEqual(lo - 1e-6);\n    expect(d.debtMinutes).toBeLessThanOrEqual(hi + 1e-6);\n  });\n\n  it('has no range without any data', () => {\n    const d = computeDebt([], NEED, TZ, NOW);\n    expect(d.insufficientData).toBe(true);\n    expect(d.range).toBeNull();\n    expect(d.debtMinutes).toBe(0);\n  });\n\n  it('classifies levels at 5 h and 10 h', () => {\n    expect(debtLevel(0)).toBe('low');\n    expect(debtLevel(299)).toBe('low');\n    expect(debtLevel(300)).toBe('medium');\n    expect(debtLevel(599)).toBe('medium');\n    expect(debtLevel(600)).toBe('high');\n  });\n\n  it('respects an explicit reference date', () => {\n    const sessions = constantNights('2025-05-10', 14, NEED - 30);\n    const d = computeDebt(sessions, NEED, TZ, NOW, { refDate: '2025-05-10' });\n    expect(d.missingCount).toBe(0);\n  });\n});\n\ndescribe('forecast', () => {\n  it('predicts lower debt after a long night', () => {\n    const profile = makeProfile();\n    const sessions = constantNights(TODAY, 14, NEED - 60);\n    const bed = localTimeToMs(TODAY, '22:30', profile.timezone);\n    const wake = localTimeToMs(addDaysToKey(TODAY, 1), '07:00', profile.timezone);\n    const f = forecastDebt(sessions, NEED, TZ, NOW, bed, wake);\n    const now = computeDebt(sessions, NEED, TZ, NOW).debtMinutes;\n    expect(f.debtMinutes).toBeLessThan(now);\n    expect(f.reductionMinutes).toBeGreaterThan(0);\n  });\n\n  it('a short night raises the forecast', () => {\n    const sessions = constantNights(TODAY, 14, NEED);\n    const bed = localTimeToMs(TODAY, '02:30', TZ);\n    const wake = localTimeToMs(addDaysToKey(TODAY, 1), '07:00', TZ);\n    const f = forecastDebt(sessions, NEED, TZ, NOW, bed + 24 * 3600_000, wake);\n    expect(f.reductionMinutes).toBeLessThan(0);\n  });\n});\n"},{"path":"src/engine/__tests__/sleepDetection.test.ts","content":"import {\n  buildSleepDays,\n  classifyNaps,\n  dedupeBySource,\n  mergeSessions,\n  sleepIntervals,\n  sourcePriority,\n} from '../sleepDetection';\nimport { localTimeToMs } from '../time';\nimport { nap, night, TZ } from './fixtures';\n\ndescribe('source priority and deduplication', () => {\n  it('ranks userEdited > wearable > phone > manual', () => {\n    const base = night('2025-05-10', '23:00', '07:00');\n    expect(sourcePriority({ ...base, userEdited: true, source: 'manual' })).toBe(4);\n    expect(sourcePriority({ ...base, source: 'healthkit', sourceDetail: 'Apple Watch' })).toBe(3);\n    expect(sourcePriority({ ...base, source: 'healthkit', sourceDetail: 'iPhone' })).toBe(2);\n    expect(sourcePriority({ ...base, source: 'phone_inferred' })).toBe(2);\n    expect(sourcePriority({ ...base, source: 'healthconnect' })).toBe(3);\n    expect(sourcePriority({ ...base, source: 'demo' })).toBe(3);\n    expect(sourcePriority({ ...base, source: 'manual' })).toBe(1);\n  });\n\n  it('drops lower priority sessions that duplicate a better source', () => {\n    const watch = night('2025-05-10', '23:10', '06:50', { source: 'healthkit', sourceDetail: 'Apple Watch' });\n    const manual = night('2025-05-10', '23:00', '07:00', { source: 'manual' });\n    const edited = night('2025-05-10', '22:30', '07:30', { source: 'manual', userEdited: true });\n    expect(dedupeBySource([watch, manual])).toEqual([watch]);\n    expect(dedupeBySource([watch, manual, edited])).toEqual([edited]);\n    const other = night('2025-05-11', '23:00', '07:00', { source: 'manual' });\n    expect(dedupeBySource([watch, other])).toHaveLength(2);\n  });\n\n  it('ignores zero-length sessions', () => {\n    const s = night('2025-05-10', '23:00', '07:00');\n    expect(dedupeBySource([{ ...s, endAt: s.startAt }])).toHaveLength(0);\n  });\n});\n\ndescribe('merging', () => {\n  it('merges sessions separated by \u003c= 45 minutes of wakefulness', () => {\n    const a = night('2025-05-10', '23:00', '03:00', { asleepMinutes: 230 });\n    const b = night('2025-05-10', '03:30', '07:00', { asleepMinutes: 200 });\n    const merged = mergeSessions([b, a]);\n    expect(merged).toHaveLength(1);\n    expect(merged[0].startAt).toBe(a.startAt);\n    expect(merged[0].endAt).toBe(b.endAt);\n    // wake gap is not counted as sleep\n    expect(merged[0].asleepMinutes).toBeLessThan((b.endAt - a.startAt) / 60000);\n  });\n\n  it('keeps sessions apart when the gap is larger than 45 minutes', () => {\n    const a = night('2025-05-10', '23:00', '03:00');\n    const b = night('2025-05-10', '04:00', '07:00');\n    expect(mergeSessions([a, b])).toHaveLength(2);\n  });\n\n  it('merges overlapping sessions without double counting', () => {\n    const a = night('2025-05-10', '23:00', '06:00');\n    const b = night('2025-05-10', '01:00', '07:00');\n    const [m] = mergeSessions([a, b]);\n    expect(m.asleepMinutes).toBe(8 * 60);\n    expect(m.userEdited).toBe(false);\n  });\n\n  it('marks merged sessions as user edited if any part was', () => {\n    const a = night('2025-05-10', '23:00', '03:00', { userEdited: true });\n    const b = night('2025-05-10', '03:20', '07:00');\n    expect(mergeSessions([a, b])[0].userEdited).toBe(true);\n  });\n});\n\ndescribe('nap classification', () => {\n  it('classifies short daytime sessions as naps', () => {\n    const n = night('2025-05-10', '23:00', '07:00');\n    const p = nap('2025-05-10', '14:00', '14:30');\n    const early = nap('2025-05-10', '07:30', '08:30');\n    const [a, b, c] = classifyNaps([n, early, p].sort((x, y) => x.startAt - y.startAt), TZ).sort((x, y) => x.startAt - y.startAt);\n    expect(a.isNap).toBe(false);\n    expect(c.isNap).toBe(true);\n    expect(b.isNap).toBe(false);\n  });\n\n  it('does not call a 4 h session a nap', () => {\n    const s = nap('2025-05-10', '12:00', '16:00');\n    expect(classifyNaps([s], TZ)[0].isNap).toBe(false);\n  });\n\n  it('respects the user flag on edited sessions', () => {\n    const s = nap('2025-05-10', '12:00', '16:00', { userEdited: true, isNap: true });\n    expect(classifyNaps([s], TZ)[0].isNap).toBe(true);\n  });\n\n  it('shift mode classifies relative to the main sleep phase', () => {\n    // Night worker sleeps 08:00-15:00, naps 21:00-21:30 before the shift\n    const main1 = night('2025-05-10', '08:00', '15:00');\n    const short = nap('2025-05-10', '21:00', '21:30');\n    const main2 = night('2025-05-11', '08:00', '15:00');\n    const res = classifyNaps([main1, short, main2], TZ, true);\n    expect(res[1].isNap).toBe(true);\n    expect(classifyNaps([main1, short, main2], TZ, false)[1].isNap).toBe(false);\n    // a short session right after main sleep and with nothing after is not a nap\n    expect(classifyNaps([main1, nap('2025-05-10', '15:30', '16:00')], TZ, true)[1].isNap).toBe(false);\n    // with no previous main session nothing is a nap in shift mode\n    expect(classifyNaps([nap('2025-05-10', '21:00', '21:30')], TZ, true)[0].isNap).toBe(false);\n  });\n\n  it('shift mode with no later main session needs 4 h distance', () => {\n    const main = night('2025-05-10', '08:00', '15:00');\n    expect(classifyNaps([main, nap('2025-05-10', '20:30', '21:00')], TZ, true)[1].isNap).toBe(true);\n  });\n});\n\ndescribe('sleep days', () => {\n  it('assigns the main sleep to the wake date, also across midnight', () => {\n    const n = night('2025-05-10', '23:30', '07:30');\n    const days = buildSleepDays([n], TZ);\n    expect([...days.keys()]).toEqual(['2025-05-10']);\n    expect(days.get('2025-05-10')?.mainMinutes).toBe(480);\n    expect(days.get('2025-05-10')?.bedAt).toBe(n.startAt);\n  });\n\n  it('keeps naps separate from the main sleep', () => {\n    const days = buildSleepDays(\n      [night('2025-05-10', '23:00', '07:00'), nap('2025-05-10', '14:00', '14:20')],\n      TZ,\n    );\n    const d = days.get('2025-05-10');\n    expect(d?.mainMinutes).toBe(480);\n    expect(d?.napMinutes).toBe(20);\n    expect(d?.naps).toHaveLength(1);\n  });\n\n  it('adds up two long segments of one night', () => {\n    const days = buildSleepDays(\n      [night('2025-05-10', '22:00', '02:00'), night('2025-05-10', '03:30', '07:30')],\n      TZ,\n    );\n    expect(days.get('2025-05-10')?.mainMinutes).toBe(480);\n    expect(sleepIntervals([night('2025-05-10', '22:00', '02:00')], TZ)).toHaveLength(1);\n  });\n\n  it('handles the DST night in spring (one hour shorter)', () => {\n    // 29/30 March 2025: 02:00 -> 03:00 skipped in Europe/Berlin\n    const s = { ...night('2025-03-30', '23:00', '07:00'), startAt: localTimeToMs('2025-03-29', '23:00', TZ), endAt: localTimeToMs('2025-03-30', '07:00', TZ) };\n    const d = buildSleepDays([s], TZ).get('2025-03-30');\n    expect(d?.mainMinutes).toBe(7 * 60);\n  });\n\n  it('handles the DST night in autumn (one hour longer)', () => {\n    const s = { ...night('2025-10-26', '23:00', '07:00'), startAt: localTimeToMs('2025-10-25', '23:00', TZ), endAt: localTimeToMs('2025-10-26', '07:00', TZ) };\n    const d = buildSleepDays([s], TZ).get('2025-10-26');\n    expect(d?.mainMinutes).toBe(9 * 60);\n  });\n});\n"},{"path":"src/engine/__tests__/sleepNeed.test.ts","content":"import { defaultNeedMinutes, estimateSleepNeed } from '../sleepNeed';\nimport { addDaysToKey, dayOfWeekOfKey, localTimeToMs } from '../time';\nimport { constantNights, makeProfile, TZ } from './fixtures';\nimport type { SleepSession } from '../types';\n\nconst NOW = localTimeToMs('2025-05-14', '12:00', TZ); // Wednesday\nconst TODAY = '2025-05-14';\n\n/** 7 h on work days, 8.5 h on free days, for `days` days. */\nfunction weeklyPattern(days: number): SleepSession[] {\n  const out: SleepSession[] = [];\n  for (let i = 0; i \u003c days; i++) {\n    const key = addDaysToKey(TODAY, -i);\n    const free = [0, 6].includes(dayOfWeekOfKey(key));\n    const minutes = free ? 510 : 420;\n    const endAt = localTimeToMs(key, free ? '09:00' : '07:00', TZ);\n    out.push({ ...constantNights(key, 1, minutes)[0], endAt, startAt: endAt - minutes * 60_000 });\n  }\n  return out;\n}\n\ndescribe('defaults', () => {\n  it('uses age based defaults', () => {\n    expect(defaultNeedMinutes(null, NOW)).toBe(480);\n    expect(defaultNeedMinutes(1990, NOW)).toBe(480);\n    expect(defaultNeedMinutes(2010, NOW)).toBe(540);\n    expect(defaultNeedMinutes(2003, NOW)).toBe(495);\n  });\n\n  it('returns the default without data', () => {\n    const r = estimateSleepNeed([], makeProfile(), NOW);\n    expect(r.minutes).toBe(480);\n    expect(r.basis).toBe('default');\n    expect(r.nights).toBe(0);\n  });\n\n  it('stays at the default with fewer than 14 nights', () => {\n    const r = estimateSleepNeed(weeklyPattern(10), makeProfile(), NOW);\n    expect(r.basis).toBe('default');\n    expect(r.nights).toBe(10);\n  });\n});\n\ndescribe('estimation', () => {\n  it('7 h on work days and 8.5 h at weekends gives roughly 8:15-8:30', () => {\n    const r = estimateSleepNeed(weeklyPattern(30), makeProfile(), NOW);\n    expect(r.basis).toBe('estimated');\n    expect(r.minutes).toBeGreaterThanOrEqual(495);\n    expect(r.minutes).toBeLessThanOrEqual(510);\n    expect(r.nights).toBe(30);\n  });\n\n  it('uses recovery nights when enough low-debt free days exist', () => {\n    // 9 h every night -> no debt, free days qualify\n    const r = estimateSleepNeed(constantNights(TODAY, 60, 540), makeProfile(), NOW);\n    expect(r.recoveryNights).toBeGreaterThanOrEqual(5);\n    expect(r.minutes).toBeCloseTo(540, 0);\n  });\n\n  it('ignores free nights that follow a large debt', () => {\n    const r = estimateSleepNeed(weeklyPattern(60), makeProfile(), NOW);\n    expect(r.recoveryNights).toBeLessThan(5);\n  });\n\n  it('smooths against a previous estimate (0.8 old + 0.2 new)', () => {\n    const profile = makeProfile({ sleepNeedMinutesEstimated: 480 });\n    const r = estimateSleepNeed(constantNights(TODAY, 60, 540), profile, NOW);\n    expect(r.measured).toBeCloseTo(540, 0);\n    expect(r.minutes).toBeCloseTo(0.8 * 480 + 0.2 * 540, 0);\n  });\n\n  it('clamps to 6:00-10:30 h', () => {\n    const r = estimateSleepNeed(constantNights(TODAY, 40, 700), makeProfile(), NOW);\n    expect(r.minutes).toBeLessThanOrEqual(630);\n    const r2 = estimateSleepNeed(constantNights(TODAY, 40, 200), makeProfile(), NOW);\n    expect(r2.minutes).toBeGreaterThanOrEqual(360);\n  });\n\n  it('manual override always wins', () => {\n    const r = estimateSleepNeed(weeklyPattern(60), makeProfile({ sleepNeedMinutesManual: 450 }), NOW);\n    expect(r.minutes).toBe(450);\n    expect(r.basis).toBe('manual');\n    expect(estimateSleepNeed([], makeProfile({ sleepNeedMinutesManual: 900 }), NOW).minutes).toBe(630);\n  });\n\n  it('shift workers have no free days, late wake-ups count as recovery', () => {\n    const profile = makeProfile({\n      workSchedule: { workDays: [1, 2, 3, 4, 5], workStart: '09:00', workEnd: '17:00', shiftMode: true },\n    });\n    const r = estimateSleepNeed(constantNights(TODAY, 40, 480, '11:00'), profile, NOW);\n    expect(r.recoveryNights).toBeGreaterThan(0);\n    expect(r.minutes).toBeCloseTo(480, 0);\n  });\n});\n"},{"path
