(next);\n      await dataStore.clearSummaries();\n      set({ profile: next });\n    }\n  },\n\n  async importBundle(parsed) {\n    await applyImport(dataStore, parsed.bundle);\n    await get().reload();\n    await get().updateEstimates(true);\n  },\n\n  async wipeAll() {\n    await dataStore.wipe();\n    for (const h of defaultHabits()) await dataStore.saveHabit(h);\n    setLang('de');\n    set({\n      profile: null,\n      sessions: [],\n      habits: await dataStore.listHabits(),\n      habitLogs: [],\n      settings: DEFAULT_SETTINGS,\n    });\n  },\n}));\n"},{"path":"src/state/hooks.ts","content":"import { useEffect, useMemo, useState } from 'react';\nimport { computeDayPlan, computeTomorrowPlan, type DayPlan } from '@/engine/dayPlan';\nimport { selectTips, type Tip } from '@/engine/recommendations';\nimport { dateKey } from '@/engine/time';\nimport { useApp } from './app';\n\n/** Current time in ms, refreshed every `intervalMs`. */\nexport function useNow(intervalMs = 60_000): number {\n  const [now, setNow] = useState(() => Date.now());\n  useEffect(() => {\n    const id = setInterval(() => setNow(Date.now()), intervalMs);\n    return () => clearInterval(id);\n  }, [intervalMs]);\n  return now;\n}\n\nexport function useDayPlan(): { plan: DayPlan | null; now: number } {\n  const profile = useApp((s) => s.profile);\n  const sessions = useApp((s) => s.sessions);\n  const now = useNow();\n  const minute = Math.floor(now / 60_000);\n  const plan = useMemo(\n    () => (profile ? computeDayPlan({ sessions, profile, now: minute * 60_000 }) : null),\n    [profile, sessions, minute],\n  );\n  return { plan, now };\n}\n\nexport function useTomorrowPlan(): DayPlan | null {\n  const profile = useApp((s) => s.profile);\n  const sessions = useApp((s) => s.sessions);\n  const { plan, now } = useDayPlan();\n  return useMemo(\n    () => (profile && plan ? computeTomorrowPlan({ sessions, profile, now }, plan) : null),\n    [profile, sessions, plan, now],\n  );\n}\n\nexport function useTips(plan: DayPlan | null): Tip[] {\n  const profile = useApp((s) => s.profile);\n  const sessions = useApp((s) => s.sessions);\n  const history = useApp((s) => s.settings.tipHistory);\n  const logs = useApp((s) => s.habitLogs);\n  return useMemo(() => {\n    if (!profile || !plan) return [];\n    const today = dateKey(plan.now, profile.timezone);\n    const caffeineLateDays = logs.filter((l) => l.habitKey === 'caffeine_cutoff' && l.status === 'skipped').length;\n    return selectTips({ plan, sessions, profile, today, history, caffeineLateDays });\n  }, [profile, plan, sessions, history, logs]);\n}\n"},{"path":"src/state/useReminders.ts","content":"import { useEffect } from 'react';\nimport { Platform } from 'react-native';\nimport { HABIT_BY_KEY } from '@/content/habits';\nimport { dateKey } from '@/engine/time';\nimport { planReminders } from '@/services/notificationPlan';\nimport {\n  attachResponseHandler,\n  hasNotificationPermission,\n  scheduleReminders,\n  setupNotifications,\n  snooze,\n} from '@/services/notifications';\nimport type { HabitKey } from '@/data/types';\nimport { useApp } from './app';\n\n/** Plan reminders for the next 7 days and (re)schedule them whenever relevant data changes. */\nexport function useReminderScheduling(active: boolean) {\n  const profile = useApp((s) => s.profile);\n  const sessions = useApp((s) => s.sessions);\n  const habits = useApp((s) => s.habits);\n  const morningCheck = useApp((s) => s.settings.morningCheck);\n  const logHabit = useApp((s) => s.logHabit);\n\n  useEffect(() => {\n    if (!active || Platform.OS === 'web') return;\n    setupNotifications();\n    return attachResponseHandler((r) => {\n      if (r.kind in HABIT_BY_KEY && r.date) {\n        if (r.action === 'done') logHabit(r.kind as HabitKey, r.date, 'done');\n        if (r.action === 'skip') logHabit(r.kind as HabitKey, r.date, 'skipped');\n      }\n      if (r.action === 'later') snooze(r);\n    });\n  }, [active, logHabit]);\n\n  useEffect(() => {\n    if (!active || !profile || Platform.OS === 'web') return;\n    let cancelled = false;\n    const timer = setTimeout(async () => {\n      if (!(await hasNotificationPermission()) || cancelled) return;\n      const reminders = planReminders({ profile, sessions, habits, now: Date.now(), morningCheck });\n      if (!cancelled) await scheduleReminders(reminders);\n    }, 1500);\n    return () => {\n      cancelled = true;\n      clearTimeout(timer);\n    };\n  }, [active, profile, sessions, habits, morningCheck]);\n}\n\nexport const todayKey = (tz: string) => dateKey(Date.now(), tz);\n"},{"path":"src/ui/NightEditor.tsx","content":"import { useRouter } from 'expo-router';\nimport React, { useState } from 'react';\nimport { Alert, Platform, Switch, View } from 'react-native';\nimport type { SleepSession } from '@/engine/types';\nimport { addDaysToKey, dateKey, formatClock, formatDuration, localTimeToMs } from '@/engine/time';\nimport { t } from '@/i18n';\nimport { useApp } from '@/state/app';\nimport { useNow } from '@/state/hooks';\nimport { TimeStepper } from './components/TimeStepper';\nimport { AppText, Button, Card, Notice, Screen } from './components/primitives';\nimport { spacing, useTheme } from './theme';\n\nexport const MAX_SLEEP_MIN = 16 * 60;\n\n/** Compute session bounds from a wake date and two clock times. */\nexport function resolveBounds(\n  wakeDate: string,\n  bedHHmm: string,\n  wakeHHmm: string,\n  tz: string,\n): { startAt: number; endAt: number; minutes: number; valid: boolean } {\n  const endAt = localTimeToMs(wakeDate, wakeHHmm, tz);\n  let startAt = localTimeToMs(wakeDate, bedHHmm, tz);\n  if (startAt >= endAt) startAt = localTimeToMs(addDaysToKey(wakeDate, -1), bedHHmm, tz);\n  const minutes = (endAt - startAt) / 60_000;\n  return { startAt, endAt, minutes, valid: minutes >= 10 && minutes \u003c= MAX_SLEEP_MIN };\n}\n\nexport function NightEditor({ session }: { session?: SleepSession }) {\n  const router = useRouter();\n  const { colors } = useTheme();\n  const profile = useApp((s) => s.profile);\n  const saveNight = useApp((s) => s.saveNight);\n  const deleteNight = useApp((s) => s.deleteNight);\n  const tz = profile?.timezone ?? 'Europe/Berlin';\n  const now = useNow(300_000);\n  const today = dateKey(now, tz);\n\n  const [wakeDate, setWakeDate] = useState(session ? dateKey(session.endAt, tz) : today);\n  const [bed, setBed] = useState(session ? formatClock(session.startAt, tz) : '23:00');\n  const [wake, setWake] = useState(session ? formatClock(session.endAt, tz) : '07:00');\n  const [nap, setNap] = useState(session?.isNap ?? false);\n\n  const b = resolveBounds(wakeDate, bed, wake, tz);\n\n  const save = async () => {\n    if (!b.valid) return;\n    await saveNight({ id: session?.id, startAt: b.startAt, endAt: b.endAt, isNap: nap });\n    router.back();\n  };\n\n  const remove = () => {\n    const run = async () => {\n      if (session) await deleteNight(session.id);\n      router.back();\n    };\n    if (Platform.OS === 'web') {\n      if (typeof window !== 'undefined' && window.confirm(t('night.deleteConfirm'))) run();\n      return;\n    }\n    Alert.alert(t('night.deleteConfirm'), undefined, [\n      { text: t('common.cancel'), style: 'cancel' },\n      { text: t('common.delete'), style: 'destructive', onPress: run },\n    ]);\n  };\n\n  return (\n    \u003cScreen>\n      {session && (\n        \u003cCard>\n          \u003cAppText variant=\"caption\" muted>\n            {t('night.source')}\n          \u003c/AppText>\n          \u003cAppText variant=\"h3\">\n            {session.sourceDetail ?? session.source}\n            {session.userEdited ? ` · ${t('night.edited')}` : ''}\n          \u003c/AppText>\n          {session.asleepMinutes != null && (\n            \u003cAppText variant=\"caption\" muted>\n              {t('night.asleep')}: {formatDuration(session.asleepMinutes)}\n            \u003c/AppText>\n          )}\n        \u003c/Card>\n      )}\n      \u003cCard>\n        \u003cAppText variant=\"h3\">{t('night.wake')}\u003c/AppText>\n        \u003cView style={{ flexDirection: 'row', alignItems: 'center', justifyContent: 'center', gap: spacing(4), marginVertical: spacing(2) }}>\n          \u003cButton label=\"‹\" variant=\"secondary\" onPress={() => setWakeDate(addDaysToKey(wakeDate, -1))} style={{ minWidth: 56 }} />\n          \u003cAppText variant=\"h3\" style={{ minWidth: 110, textAlign: 'center' }}>\n            {wakeDate}\n          \u003c/AppText>\n          \u003cButton label=\"›\" variant=\"secondary\" disabled={wakeDate >= today} onPress={() => setWakeDate(addDaysToKey(wakeDate, 1))} style={{ minWidth: 56 }} />\n        \u003c/View>\n        \u003cTimeStepper value={wake} onChange={setWake} />\n      \u003c/Card>\n      \u003cCard>\n        \u003cAppText variant=\"h3\">{t('night.bed')}\u003c/AppText>\n        \u003cTimeStepper value={bed} onChange={setBed} />\n      \u003c/Card>\n      \u003cCard style={{ flexDirection: 'row', alignItems: 'center', justifyContent: 'space-between' }}>\n        \u003cAppText variant=\"h3\">{t('night.nap')}\u003c/AppText>\n        \u003cSwitch accessibilityLabel={t('night.nap')} value={nap} onValueChange={setNap} trackColor={{ true: colors.accent, false: colors.surface2 }} />\n      \u003c/Card>\n      {b.valid ? (\n        \u003cAppText muted style={{ textAlign: 'center' }}>\n          {formatDuration(b.minutes)}\n        \u003c/AppText>\n      ) : (\n        \u003cNotice tone=\"warn\">{t('night.invalid')}\u003c/Notice>\n      )}\n      \u003cButton label={t('common.save')} onPress={save} disabled={!b.valid} />\n      {session && \u003cButton label={t('common.delete')} variant=\"danger\" onPress={remove} />}\n    \u003c/Screen>\n  );\n}\n"},{"path":"src/ui/__tests__/components.test.tsx","content":"import { render, screen } from '@testing-library/react-native';\nimport React from 'react';\nimport { computeDayPlan } from '@/engine/dayPlan';\nimport { constantNights, makeProfile, TZ } from '@/engine/__tests__/fixtures';\nimport { localTimeToMs } from '@/engine/time';\nimport { DebtGauge, angleFor } from '../components/DebtGauge';\nimport { curveAccessibilityLabel, EnergyCurve } from '../components/EnergyCurve';\nimport { Heatmap } from '../components/Heatmap';\nimport { TimelineRow } from '../components/TimelineRow';\nimport { TimeStepper } from '../components/TimeStepper';\nimport { SleepBarChart } from '../components/Charts';\nimport { contrastRatio, darkColors, lightColors } from '../theme';\n\nconst now = localTimeToMs('2025-05-14', '10:00', TZ);\nconst plan = computeDayPlan({ sessions: constantNights('2025-05-14', 20, 450), profile: makeProfile(), now });\n\njest.mock('expo-haptics', () => ({ selectionAsync: jest.fn(async () => undefined) }));\n\ndescribe('components', () => {\n  it('EnergyCurve exposes an accessibility label with the current energy and phase', async () => {\n    await render(\u003cEnergyCurve plan={plan} now={now} tz={TZ} />);\n    const el = screen.getByRole('image');\n    expect(el.props.accessibilityLabel).toMatch(/^Energie aktuell \\d+ von 100\\./);\n    expect(curveAccessibilityLabel(plan, now, TZ)).toContain('von 100');\n  });\n\n  it('DebtGauge labels the debt and level', async () => {\n    await render(\u003cDebtGauge minutes={400} level=\"medium\" />);\n    expect(screen.getByRole('image').props.accessibilityLabel).toBe('Schlafschuld 6 h 40 min, Spürbar. Hol in den nächsten Nächten etwas auf.');\n    expect(screen.getByText('6 h 40 min')).toBeTruthy();\n  });\n\n  it('DebtGauge shows an insufficient data state with a range', async () => {\n    await render(\u003cDebtGauge minutes={0} level=\"low\" insufficient range={[240, 420]} />);\n    expect(screen.getByText('Zu wenig Daten')).toBeTruthy();\n    expect(screen.getByText('wahrscheinlich 4 h bis 7 h')).toBeTruthy();\n  });\n\n  it('gauge angle runs from left to right and clamps', () => {\n    expect(angleFor(0)).toBeCloseTo(Math.PI);\n    expect(angleFor(600)).toBeCloseTo(Math.PI / 2);\n    expect(angleFor(5000)).toBeCloseTo(0);\n    expect(angleFor(-5)).toBeCloseTo(Math.PI);\n  });\n\n  it('TimelineRow renders time, title and description', async () => {\n    const w = plan.windows.find((x) => x.kind === 'afternoon_dip')!;\n    const { toJSON } = await render(\u003cTimelineRow window={w} tz={TZ} isNow extra=\"Dein Termin um 14:30 liegt im Nachmittagstief.\" />);\n    expect(screen.getByText('Nachmittagstief')).toBeTruthy();\n    expect(screen.getByText(/Dein Termin um 14:30/)).toBeTruthy();\n    expect(toJSON()).toMatchSnapshot();\n  });\n\n  it('TimelineRow renders point events without a duration bar', async () => {\n    const w = plan.windows.find((x) => x.kind === 'caffeine_stop')!;\n    await render(\u003cTimelineRow window={w} tz={TZ} isPast />);\n    expect(screen.getByText('Koffein-Stopp')).toBeTruthy();\n  });\n\n  it('TimeStepper shows the value', async () => {\n    await render(\u003cTimeStepper value=\"07:05\" onChange={() => undefined} label=\"Aufstehen\" />);\n    expect(screen.getByText('07:05')).toBeTruthy();\n    expect(screen.getByLabelText('Stunde später')).toBeTruthy();\n  });\n\n  it('Heatmap summarises the last 4 weeks', async () => {\n    await render(\u003cHeatmap today=\"2025-05-14\" logs={[{ habitKey: 'bedtime', date: '2025-05-14', status: 'done', at: 1 }]} />);\n    expect(screen.getByRole('image').props.accessibilityLabel).toBe('Letzte 4 Wochen: 1 von 28 Tagen erledigt');\n  });\n\n  it('SleepBarChart has a summary label', async () => {\n    await render(\u003cSleepBarChart nights={[{ date: '2025-05-13', minutes: 400 }]} need={480} />);\n    expect(screen.getByRole('image').props.accessibilityLabel).toContain('Bedarf 8 h');\n  });\n\n  it('theme colours meet the 4.5:1 contrast for text on every surface', () => {\n    for (const c of [darkColors, lightColors]) {\n      for (const fg of ['text', 'textMuted', 'accent', 'accent2', 'good', 'warn', 'bad', 'melatonin'] as const) {\n        for (const bg of ['bg', 'surface', 'surface2'] as const) {\n          expect(contrastRatio(c[fg], c[bg])).toBeGreaterThanOrEqual(4.5);\n        }\n      }\n      expect(contrastRatio(c.onAccent, c.accent)).toBeGreaterThanOrEqual(4.5);\n      expect(contrastRatio(c.onAccent, c.good)).toBeGreaterThanOrEqual(4.5);\n      expect(contrastRatio(c.onAccent, c.warn)).toBeGreaterThanOrEqual(4.5);\n      expect(contrastRatio(c.onBad, c.bad)).toBeGreaterThanOrEqual(4.5);\n    }\n  });\n});\n"},{"path":"src/ui/components/Charts.tsx","content":"import { line, curveMonotoneX } from 'd3-shape';\nimport { scaleLinear } from 'd3-scale';\nimport React, { useState } from 'react';\nimport { View } from 'react-native';\nimport Svg, { Line as SvgLine, Path, Rect, Text as SvgText } from 'react-native-svg';\nimport { formatDuration, hourOfDay } from '@/engine/time';\nimport type { SleepDay } from '@/engine/sleepDetection';\nimport { fonts, useTheme } from '../theme';\n\nexport interface NightPoint {\n  date: string;\n  minutes: number;\n}\n\nfunction useWidth() {\n  const [w, setW] = useState(0);\n  return { w, onLayout: (e: { nativeEvent: { layout: { width: number } } }) => setW(e.nativeEvent.layout.width) };\n}\n\n/** Sleep duration per night with the need as a horizontal line; deficit is coloured. */\nexport function SleepBarChart({ nights, need, height = 180 }: { nights: NightPoint[]; need: number; height?: number }) {\n  const { colors } = useTheme();\n  const { w, onLayout } = useWidth();\n  const max = Math.max(need * 1.25, ...nights.map((n) => n.minutes), 60);\n  const top = 12;\n  const bottom = 22;\n  const y = scaleLinear().domain([0, max]).range([height - bottom, top]);\n  const n = nights.length;\n  const gap = n > 45 ? 1 : 3;\n  const bw = n ? Math.max(2, (w - 8 - gap * (n - 1)) / n) : 0;\n  const summary = `Schlafdauer der letzten ${n} Nächte, Bedarf ${formatDuration(need)}`;\n  return (\n    \u003cView onLayout={onLayout} accessible accessibilityRole=\"image\" accessibilityLabel={summary}>\n      {w > 0 && (\n        \u003cSvg width={w} height={height}>\n          {nights.map((p, i) => {\n            const x = 4 + i * (bw + gap);\n            const hSlept = height - bottom - y(Math.min(p.minutes, need));\n            const hExtra = p.minutes > need ? y(need) - y(p.minutes) : 0;\n            const hDeficit = p.minutes \u003c need ? y(p.minutes) - y(need) : 0;\n            return (\n              \u003cReact.Fragment key={p.date}>\n                \u003cRect x={x} y={y(Math.min(p.minutes, need))} width={bw} height={hSlept} rx={Math.min(3, bw / 2)} fill={colors.accent2} />\n                {hExtra > 0 && \u003cRect x={x} y={y(p.minutes)} width={bw} height={hExtra} rx={Math.min(3, bw / 2)} fill={colors.good} opacity={0.8} />}\n                {hDeficit > 0 && \u003cRect x={x} y={y(need)} width={bw} height={hDeficit} rx={Math.min(3, bw / 2)} fill={colors.bad} opacity={0.55} />}\n              \u003c/React.Fragment>\n            );\n          })}\n          \u003cSvgLine x1={0} x2={w} y1={y(need)} y2={y(need)} stroke={colors.accent} strokeWidth={1.5} strokeDasharray=\"5 4\" />\n          \u003cSvgText x={w - 2} y={y(need) - 4} fontSize={11} fill={colors.accent} textAnchor=\"end\" fontFamily={fonts.medium}>\n            {formatDuration(need)}\n          \u003c/SvgText>\n        \u003c/Svg>\n      )}\n    \u003c/View>\n  );\n}\n\n/** Line chart of the sleep debt over time (values in minutes). */\nexport function DebtLineChart({ points, height = 140 }: { points: NightPoint[]; height?: number }) {\n  const { colors } = useTheme();\n  const { w, onLayout } = useWidth();\n  if (points.length \u003c 2) return \u003cView onLayout={onLayout} style={{ height: 8 }} />;\n  const maxV = Math.max(600, ...points.map((p) => p.minutes));\n  const x = scaleLinear().domain([0, points.length - 1]).range([6, Math.max(7, w - 6)]);\n  const y = scaleLinear().domain([0, maxV]).range([height - 14, 10]);\n  const d = line\u003cNightPoint>()\n    .x((_, i) => x(i))\n    .y((p) => y(p.minutes))\n    .curve(curveMonotoneX)(points);\n  return (\n    \u003cView onLayout={onLayout} accessible accessibilityRole=\"image\" accessibilityLabel={`Schlafschuld im Verlauf, aktuell ${formatDuration(points[points.length - 1].minutes)}`}>\n      {w > 0 && (\n        \u003cSvg width={w} height={height}>\n          \u003cSvgLine x1={0} x2={w} y1={y(300)} y2={y(300)} stroke={colors.good} strokeDasharray=\"4 4\" strokeWidth={1} opacity={0.7} />\n          \u003cSvgLine x1={0} x2={w} y1={y(600)} y2={y(600)} stroke={colors.bad} strokeDasharray=\"4 4\" strokeWidth={1} opacity={0.7} />\n          \u003cPath d={d ?? ''} stroke={colors.melatonin} strokeWidth={3} fill=\"none\" strokeLinecap=\"round\" />\n          \u003cSvgText x={4} y={y(300) - 3} fontSize={10} fill={colors.good} fontFamily={fonts.medium}>5 h\u003c/SvgText>\n          \u003cSvgText x={4} y={y(600) - 3} fontSize={10} fill={colors.bad} fontFamily={fonts.medium}>10 h\u003c/SvgText>\n        \u003c/Svg>\n      )}\n    \u003c/View>\n  );\n}\n\n/** Bands from falling asleep to waking up per night; the axis runs 18:00 → 14:00. */\nexport function RegularityChart({ days, tz, height = 170 }: { days: SleepDay[]; tz: string; height?: number }) {\n  const { colors } = useTheme();\n  const { w, onLayout } = useWidth();\n  const rows = days.filter((d) => d.bedAt != null && d.wakeAt != null);\n  const norm = (h: number) => (h \u003c 14 ? h + 24 : h); // 18..38\n  const x = scaleLinear().domain([18, 38]).range([26, Math.max(27, w - 6)]);\n  const n = rows.length;\n  const band = n ? Math.max(2, Math.min(10, (height - 24) / n - 1)) : 0;\n  return (\n    \u003cView onLayout={onLayout} accessible accessibilityRole=\"image\" accessibilityLabel=\"Einschlaf- und Aufwachzeiten pro Nacht\">\n      {w > 0 && (\n        \u003cSvg width={w} height={height}>\n          {[20, 24, 28, 32, 36].map((h) => (\n            \u003cReact.Fragment key={h}>\n              \u003cSvgLine x1={x(h)} x2={x(h)} y1={4} y2={height - 16} stroke={colors.border} strokeWidth={0.5} />\n              \u003cSvgText x={x(h)} y={height - 3} fontSize={10} fill={colors.textMuted} textAnchor=\"middle\" fontFamily={fonts.medium}>\n                {String(h % 24).padStart(2, '0')}\n              \u003c/SvgText>\n            \u003c/React.Fragment>\n          ))}\n          {rows.map((d, i) => {\n            const a = norm(hourOfDay(d.bedAt as number, tz));\n            let b = norm(hourOfDay(d.wakeAt as number, tz));\n            if (b \u003c a) b += 24;\n            const x0 = x(Math.min(a, 38));\n            const x1 = x(Math.min(b, 38));\n            return \u003cRect key={d.date} x={x0} y={4 + i * (band + 1)} width={Math.max(2, x1 - x0)} height={band} rx={band / 2} fill={colors.accent2} opacity={0.85} />;\n          })}\n        \u003c/Svg>\n      )}\n    \u003c/View>\n  );\n}\n"},{"path":"src/ui/components/DebtGauge.tsx","content":"import React, { useEffect } from 'react';\nimport { View } from 'react-native';\nimport Animated, { useAnimatedProps, useReducedMotion, useSharedValue, withSpring } from 'react-native-reanimated';\nimport Svg, { Circle, Line, Path } from 'react-native-svg';\nimport { DEBT_GAUGE_MAX, DEBT_LOW_MAX, DEBT_MID_MAX } from '@/engine/constants';\nimport type { DebtLevel } from '@/engine/types';\nimport { t } from '@/i18n';\nimport { formatDuration, levelColorKey } from '@/lib/format';\nimport { useTheme } from '../theme';\nimport { AppText } from './primitives';\n\nconst AnimatedLine = Animated.createAnimatedComponent(Line);\n\nconst W = 260;\nconst H = 142;\nconst CX = W / 2;\nconst CY = 130;\nconst R = 100;\n\n/** minutes → angle in radians; 0 min = π (left), max = 0 (right) */\nexport const angleFor = (minutes: number) => Math.PI * (1 - Math.min(Math.max(minutes, 0), DEBT_GAUGE_MAX) / DEBT_GAUGE_MAX);\n\nfunction arc(fromMin: number, toMin: number): string {\n  const a0 = angleFor(fromMin);\n  const a1 = angleFor(toMin);\n  const p = (a: number) => `${CX + R * Math.cos(a)} ${CY - R * Math.sin(a)}`;\n  return `M ${p(a0)} A ${R} ${R} 0 0 1 ${p(a1)}`;\n}\n\nexport interface DebtGaugeProps {\n  minutes: number;\n  level: DebtLevel;\n  insufficient?: boolean;\n  range?: [number, number] | null;\n}\n\nexport function DebtGauge({ minutes, level, insufficient, range }: DebtGaugeProps) {\n  const { colors } = useTheme();\n  const reduce = useReducedMotion();\n  const angle = useSharedValue(Math.PI);\n  useEffect(() => {\n    const target = angleFor(insufficient && range ? (range[0] + range[1]) / 2 : minutes);\n    angle.value = reduce ? target : withSpring(target, { damping: 9, stiffness: 80 });\n  }, [minutes, insufficient, range, reduce, angle]);\n  const needle = useAnimatedProps(() => ({\n    x2: CX + (R - 14) * Math.cos(angle.value),\n    y2: CY - (R - 14) * Math.sin(angle.value),\n  }));\n  const col = colors[levelColorKey(level)];\n  const label = insufficient\n    ? range\n      ? `${t('today.debtNoData')}, ${t('debt.range', { lo: formatDuration(range[0]), hi: formatDuration(range[1]) })}`\n      : t('today.debtNoData')\n    : `${t('today.debtTitle')} ${formatDuration(minutes)}, ${t(`debt.${level}`)}`;\n  return (\n    \u003cView\n      style={{ alignItems: 'center' }}\n      accessible\n      accessibilityRole=\"image\"\n      accessibilityLabel={label}\n    >\n      \u003cSvg width={W} height={H}>\n        \u003cPath d={arc(0, DEBT_LOW_MAX)} stroke={colors.good} strokeWidth={14} fill=\"none\" strokeLinecap=\"round\" opacity={0.9} />\n        \u003cPath d={arc(DEBT_LOW_MAX, DEBT_MID_MAX)} stroke={colors.warn} strokeWidth={14} fill=\"none\" opacity={0.9} />\n        \u003cPath d={arc(DEBT_MID_MAX, DEBT_GAUGE_MAX)} stroke={colors.bad} strokeWidth={14} fill=\"none\" strokeLinecap=\"round\" opacity={0.9} />\n        \u003cAnimatedLine x1={CX} y1={CY} stroke={colors.text} strokeWidth={4} strokeLinecap=\"round\" animatedProps={needle} />\n        \u003cCircle cx={CX} cy={CY} r={8} fill={colors.text} />\n      \u003c/Svg>\n      \u003cView style={{ alignItems: 'center', marginTop: 4 }}>\n        {insufficient ? (\n          \u003c>\n            \u003cAppText variant=\"h3\">{t('today.debtNoData')}\u003c/AppText>\n            {range ? (\n              \u003cAppText variant=\"caption\" muted>\n                {t('debt.range', { lo: formatDuration(range[0]), hi: formatDuration(range[1]) })}\n              \u003c/AppText>\n            ) : null}\n          \u003c/>\n        ) : (\n          \u003cAppText variant=\"number\" color={col}>\n            {formatDuration(minutes)}\n          \u003c/AppText>\n        )}\n      \u003c/View>\n    \u003c/View>\n  );\n}\n"},{"path":"src/ui/components/EnergyCurve.tsx","content":"import { area, curveMonotoneX, line } from 'd3-shape';\nimport { scaleLinear } from 'd3-scale';\nimport * as Haptics from 'expo-haptics';\nimport React, { useEffect, useMemo, useRef, useState } from 'react';\nimport { PanResponder, Platform, View } from 'react-native';\nimport Animated, {\n  Easing,\n  useAnimatedProps,\n  useReducedMotion,\n  useSharedValue,\n  withRepeat,\n  withTiming,\n} from 'react-native-reanimated';\nimport Svg, { Circle, ClipPath, Defs, G, Line, LinearGradient, Path, Rect, Stop, Text as SvgText } from 'react-native-svg';\nimport { windowColor } from '@/content/windows';\nimport { energyAt } from '@/engine/energyCurve';\nimport { phaseAt, type DayPlan } from '@/engine/dayPlan';\nimport { HOUR } from '@/engine/constants';\nimport { hourOfDay, formatClock } from '@/engine/time';\nimport { t } from '@/i18n';\nimport { phaseSentence } from '@/lib/format';\nimport { fonts, useTheme } from '../theme';\nimport { AppText } from './primitives';\n\nconst AnimatedRect = Animated.createAnimatedComponent(Rect);\nconst AnimatedCircle = Animated.createAnimatedComponent(Circle);\n\nconst BAND_KINDS = ['grogginess', 'morning_peak', 'afternoon_dip', 'evening_peak', 'melatonin'] as const;\nconst PAD = { left: 10, right: 10, top: 14, bottom: 36 };\n\nexport interface EnergyCurveProps {\n  plan: DayPlan;\n  now: number;\n  tz: string;\n  height?: number;\n}\n\nexport function curveAccessibilityLabel(plan: DayPlan, now: number, tz: string): string {\n  const phase = phaseAt(plan, now);\n  return `Energie aktuell ${Math.round(plan.currentEnergy)} von 100. ${phaseSentence(plan, phase, tz)}`;\n}\n\nexport function EnergyCurve({ plan, now, tz, height = 260 }: EnergyCurveProps) {\n  const { colors } = useTheme();\n  const reduce = useReducedMotion();\n  const [width, setWidth] = useState(0);\n  const [scrub, setScrub] = useState\u003c{ t: number } | null>(null);\n  const lastPhase = useRef\u003cstring>('');\n  const start = plan.wakeAt;\n  const end = plan.bedtime.bedtime;\n  const innerW = Math.max(1, width - PAD.left - PAD.right);\n\n  const geometry = useMemo(() => {\n    if (width === 0) return null;\n    const x = scaleLinear().domain([start, end]).range([PAD.left, PAD.left + innerW]);\n    const y = scaleLinear().domain([0, 100]).range([height - PAD.bottom, PAD.top]);\n    const pts = plan.curve.points.filter((p) => p.t >= start && p.t \u003c= end);\n    const lineGen = line\u003c{ t: number; energy: number }>()\n      .x((p) => x(p.t))\n      .y((p) => y(p.energy))\n      .curve(curveMonotoneX);\n    const areaGen = area\u003c{ t: number; energy: number }>()\n      .x((p) => x(p.t))\n      .y0(height - PAD.bottom)\n      .y1((p) => y(p.energy))\n      .curve(curveMonotoneX);\n    return { x, y, linePath: lineGen(pts) ?? '', areaPath: areaGen(pts) ?? '' };\n  }, [width, start, end, plan.curve.points, innerW, height]);\n\n  const progress = useSharedValue(reduce ? 1 : 0);\n  useEffect(() => {\n    progress.value = reduce ? 1 : withTiming(1, { duration: 600, easing: Easing.out(Easing.cubic) });\n  }, [reduce, progress]);\n  const revealProps = useAnimatedProps(() => ({ width: progress.value * (innerW + PAD.left + PAD.right) }));\n\n  const pulse = useSharedValue(0);\n  useEffect(() => {\n    if (reduce) {\n      pulse.value = 0;\n      return;\n    }\n    pulse.value = withRepeat(withTiming(1, { duration: 1400, easing: Easing.out(Easing.quad) }), -1, false);\n  }, [reduce, pulse]);\n  const pulseProps = useAnimatedProps(() => ({ r: 6 + pulse.value * 8, opacity: 0.5 * (1 - pulse.value) }));\n\n  const timeFromX = (px: number) => {\n    const f = Math.min(1, Math.max(0, (px - PAD.left) / innerW));\n    return start + f * (end - start);\n  };\n\n  const responder = useMemo(\n    () =>\n      PanResponder.create({\n        onStartShouldSetPanResponder: () => true,\n        onMoveShouldSetPanResponder: () => true,\n        onPanResponderTerminationRequest: () => false,\n        onPanResponderGrant: (e) => {\n          const tt = timeFromX(e.nativeEvent.locationX);\n          setScrub({ t: tt });\n        },\n        onPanResponderMove: (e) => {\n          const tt = timeFromX(e.nativeEvent.locationX);\n          setScrub({ t: tt });\n          const ph = phaseAt(plan, tt);\n          if (ph !== lastPhase.current) {\n            lastPhase.current = ph;\n            if (Platform.OS !== 'web') Haptics.selectionAsync().catch(() => undefined);\n          }\n        },\n        onPanResponderRelease: () => setScrub(null),\n        onPanResponderTerminate: () => setScrub(null),\n      }),\n    // eslint-disable-next-line react-hooks/exhaustive-deps\n    [plan, start, end, innerW],\n  );\n\n  const ticks = useMemo(() => {\n    const out: number[] = [];\n    let tt = Math.ceil(start / HOUR) * HOUR;\n    for (; tt \u003c= end; tt += HOUR) if (Math.round(hourOfDay(tt, tz)) % 3 === 0) out.push(tt);\n    return out;\n  }, [start, end, tz]);\n\n  const nowIn = now >= start && now \u003c= end;\n  const label = curveAccessibilityLabel(plan, now, tz);\n\n  return (\n    \u003cView\n      style={{ height }}\n      onLayout={(e) => setWidth(e.nativeEvent.layout.width)}\n      accessible\n      accessibilityRole=\"image\"\n      accessibilityLabel={label}\n      {...responder.panHandlers}\n    >\n      {geometry && (\n        \u003cSvg width={width} height={height}>\n          \u003cDefs>\n            \u003cLinearGradient id=\"fill\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n              \u003cStop offset=\"0\" stopColor={colors.accent} stopOpacity={0.55} />\n              \u003cStop offset=\"1\" stopColor={colors.accent} stopOpacity={0.02} />\n            \u003c/LinearGradient>\n            \u003cClipPath id=\"reveal\">\n              \u003cAnimatedRect x={0} y={0} height={height} animatedProps={revealProps} />\n            \u003c/ClipPath>\n            \u003cClipPath id=\"past\">\n              \u003cRect x={0} y={0} width={Math.max(0, nowIn ? geometry.x(now) : now > end ? width : 0)} height={height} />\n            \u003c/ClipPath>\n            \u003cClipPath id=\"future\">\n              \u003cRect\n                x={nowIn ? geometry.x(now) : now > end ? width : 0}\n                y={0}\n                width={Math.max(0, width - (nowIn ? geometry.x(now) : now > end ? width : 0))}\n                height={height}\n              />\n            \u003c/ClipPath>\n          \u003c/Defs>\n\n          \u003cG clipPath=\"url(#reveal)\">\n            {[0, 25, 50, 75, 100].map((v) => (\n              \u003cLine key={v} x1={PAD.left} x2={width - PAD.right} y1={geometry.y(v)} y2={geometry.y(v)} stroke={colors.border} strokeWidth={0.5} strokeDasharray=\"3 5\" />\n            ))}\n            \u003cG clipPath=\"url(#past)\" opacity={0.4}>\n              \u003cPath d={geometry.areaPath} fill=\"url(#fill)\" />\n              \u003cPath d={geometry.linePath} stroke={colors.accent} strokeWidth={3} fill=\"none\" strokeLinecap=\"round\" />\n            \u003c/G>\n            \u003cG clipPath=\"url(#future)\">\n              \u003cPath d={geometry.areaPath} fill=\"url(#fill)\" />\n              \u003cPath d={geometry.linePath} stroke={colors.accent} strokeWidth={3} fill=\"none\" strokeLinecap=\"round\" />\n            \u003c/G>\n            {BAND_KINDS.map((k) => {\n              const w = plan.windows.find((x) => x.kind === k);\n              if (!w) return null;\n              const x0 = geometry.x(Math.max(w.start, start));\n              const x1 = geometry.x(Math.min(w.end, end));\n              if (x1 \u003c= x0) return null;\n              return \u003cRect key={k} x={x0} y={height - PAD.bottom + 6} width={x1 - x0} height={8} rx={4} fill={windowColor(k, colors)} opacity={0.9} />;\n            })}\n            {ticks.map((tt) => (\n              \u003cSvgText key={tt} x={geometry.x(tt)} y={height - 6} fontSize={11} fill={colors.textMuted} textAnchor=\"middle\" fontFamily={fonts.medium}>\n                {formatClock(tt, tz).slice(0, 2)}\n              \u003c/SvgText>\n            ))}\n          \u003c/G>\n\n          {nowIn && (\n            \u003cG>\n              \u003cLine x1={geometry.x(now)} x2={geometry.x(now)} y1={PAD.top} y2={height - PAD.bottom} stroke={colors.text} strokeWidth={1} strokeDasharray=\"2 3\" opacity={0.6} />\n              \u003cAnimatedCircle cx={geometry.x(now)} cy={geometry.y(energyAt(plan.curve.points, now))} fill={colors.accent} animatedProps={pulseProps} />\n              \u003cCircle cx={geometry.x(now)} cy={geometry.y(energyAt(plan.curve.points, now))} r={6} fill={colors.accent} stroke={colors.bg} strokeWidth={2} />\n            \u003c/G>\n          )}\n\n          {scrub && (\n            \u003cG>\n              \u003cLine x1={geometry.x(scrub.t)} x2={geometry.x(scrub.t)} y1={PAD.top} y2={height - PAD.bottom} stroke={colors.accent2} strokeWidth={1.5} />\n              \u003cCircle cx={geometry.x(scrub.t)} cy={geometry.y(energyAt(plan.curve.points, scrub.t))} r={5} fill={colors.accent2} />\n            \u003c/G>\n          )}\n        \u003c/Svg>\n      )}\n      {scrub && geometry && (\n        \u003cView\n          pointerEvents=\"none\"\n          style={{\n            position: 'absolute',\n            top: 0,\n            left: Math.min(Math.max(geometry.x(scrub.t) - 70, 0), Math.max(0, width - 140)),\n            width: 140,\n            backgroundColor: colors.surface2,\n            borderRadius: 12,\n            padding: 8,\n            borderWidth: 1,\n            borderColor: colors.border,\n          }}\n        >\n          \u003cAppText variant=\"h3\">{formatClock(scrub.t, tz)}\u003c/AppText>\n          \u003cAppText variant=\"caption\" muted>\n            {t(`phases.${phaseAt(plan, scrub.t)}`)} · {Math.round(energyAt(plan.curve.points, scrub.t))}/100\n          \u003c/AppText>\n        \u003c/View>\n      )}\n    \u003c/View>\n  );\n}\n"},{"path":"src/ui/components/Heatmap.tsx","content":"import React from 'react';\nimport { View } from 'react-native';\nimport { addDaysToKey } from '@/engine/time';\nimport type { HabitLog } from '@/data/types';\nimport { useTheme } from '../theme';\n\n/** 4-week mini heatmap (28 days, oldest first). */\nexport function Heatmap({ logs, today }: { logs: HabitLog[]; today: string }) {\n  const { colors } = useTheme();\n  const byDate = new Map(logs.map((l) => [l.date, l.status]));\n  const days = Array.from({ length: 28 }, (_, i) => addDaysToKey(today, -(27 - i)));\n  const done = days.filter((d) => byDate.get(d) === 'done').length;\n  return (\n    \u003cView accessible accessibilityRole=\"image\" accessibilityLabel={`Letzte 4 Wochen: ${done} von 28 Tagen erledigt`} style={{ flexDirection: 'row', flexWrap: 'wrap', gap: 6 }}>\n      {days.map((d) => {\n        const s = byDate.get(d);\n        return (\n          \u003cView\n            key={d}\n            style={{\n              width: 34,\n              height: 34,\n              borderRadius: 8,\n              backgroundColor: s === 'done' ? colors.good : s === 'skipped' ? colors.warn : colors.surface2,\n              opacity: s ? 1 : 0.7,\n              borderWidth: d === today ? 2 : 0,\n              borderColor: colors.text,\n            }}\n          />\n        );\n      })}\n    \u003c/View>\n  );\n}\n"},{"path":"src/ui/components/Icon.tsx","content":"import {\n  AlarmClock,\n  BatteryLow,\n  BedDouble,\n  Brain,\n  Coffee,\n  Dumbbell,\n  Lightbulb,\n  Moon,\n  Sun,\n  Utensils,\n  Wind,\n  Zap,\n  type LucideIcon,\n} from 'lucide-react-native';\nimport type { IconName } from '@/content/windows';\n\nconst MAP: Record\u003cIconName, LucideIcon> = {\n  AlarmClock,\n  BatteryLow,\n  BedDouble,\n  Brain,\n  Coffee,\n  Dumbbell,\n  Lightbulb,\n  Moon,\n  Sun,\n  Utensils,\n  Wind,\n  Zap,\n};\n\nexport function Icon({ name, size = 20, color }: { name: IconName; size?: number; color: string }) {\n  const C = MAP[name];\n  return \u003cC size={size} color={color} />;\n}\n"},{"path":"src/ui/components/TimeStepper.tsx","content":"import React from 'react';\nimport { Pressable, View } from 'react-native';\nimport { formatHHmm, parseHHmm } from '@/engine/time';\nimport { radius, spacing, useTheme } from '../theme';\nimport { AppText } from './primitives';\n\nfunction Step({ label, onPress, a11y }: { label: string; onPress: () => void; a11y: string }) {\n  const { colors } = useTheme();\n  return (\n    \u003cPressable\n      accessibilityRole=\"button\"\n      accessibilityLabel={a11y}\n      onPress={onPress}\n      hitSlop={6}\n      style={({ pressed }) => ({\n        width: 48,\n        height: 48,\n        borderRadius: radius.button,\n        backgroundColor: colors.surface2,\n        alignItems: 'center',\n        justifyContent: 'center',\n        opacity: pressed ? 0.7 : 1,\n      })}\n    >\n      \u003cAppText variant=\"h2\">{label}\u003c/AppText>\n    \u003c/Pressable>\n  );\n}\n\n/** Large time picker without native modules: hour and minute steppers. Value is \"HH:mm\". */\nexport function TimeStepper({\n  value,\n  onChange,\n  label,\n  minuteStep = 5,\n}: {\n  value: string;\n  onChange: (v: string) => void;\n  label?: string;\n  minuteStep?: number;\n}) {\n  const total = Math.round(parseHHmm(value) * 60);\n  const set = (mins: number) => onChange(formatHHmm(((mins % 1440) + 1440) % 1440 / 60));\n  const h = Math.floor(total / 60);\n  const m = total % 60;\n  return (\n    \u003cView style={{ gap: spacing(2) }}>\n      {label ? \u003cAppText variant=\"body\">{label}\u003c/AppText> : null}\n      \u003cView\n        accessible\n        accessibilityRole=\"adjustable\"\n        accessibilityLabel={label ?? 'Uhrzeit'}\n        accessibilityValue={{ text: value }}\n        accessibilityActions={[{ name: 'increment' }, { name: 'decrement' }]}\n        onAccessibilityAction={(e) => set(total + (e.nativeEvent.actionName === 'increment' ? 15 : -15))}\n        style={{ flexDirection: 'row', alignItems: 'center', justifyContent: 'center', gap: spacing(3) }}\n      >\n        \u003cView style={{ alignItems: 'center', gap: 6 }}>\n          \u003cStep label=\"+\" a11y=\"Stunde später\" onPress={() => set(total + 60)} />\n          \u003cStep label=\"−\" a11y=\"Stunde früher\" onPress={() => set(total - 60)} />\n        \u003c/View>\n        \u003cAppText variant=\"number\" style={{ minWidth: 130, textAlign: 'center' }}>\n          {`${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`}\n        \u003c/AppText>\n        \u003cView style={{ alignItems: 'center', gap: 6 }}>\n          \u003cStep label=\"+\" a11y={`${minuteStep} Minuten später`} onPress={() => set(total + minuteStep)} />\n          \u003cStep label=\"−\" a11y={`${minuteStep} Minuten früher`} onPress={() => set(total - minuteStep)} />\n        \u003c/View>\n      \u003c/View>\n    \u003c/View>\n  );\n}\n"},{"path":"src/ui/components/TimelineRow.tsx","content":"import React from 'react';\nimport { View } from 'react-native';\nimport { WINDOW_ICON, windowColor } from '@/content/windows';\nimport { formatClock, formatDuration } from '@/engine/time';\nimport type { DayWindow } from '@/engine/types';\nimport { t } from '@/i18n';\nimport { spacing, useTheme } from '../theme';\nimport { Icon } from './Icon';\nimport { AppText } from './primitives';\n\nexport interface TimelineRowProps {\n  window: DayWindow;\n  tz: string;\n  isNow?: boolean;\n  isPast?: boolean;\n  extra?: string | null;\n}\n\nexport function TimelineRow({ window: w, tz, isNow, isPast, extra }: TimelineRowProps) {\n  const { colors } = useTheme();\n  const color = windowColor(w.kind, colors);\n  const minutes = (w.end - w.start) / 60_000;\n  const title = t(`windows.${w.kind}`);\n  const time = w.point ? formatClock(w.start, tz) : `${formatClock(w.start, tz)}–${formatClock(w.end, tz)}`;\n  return (\n    \u003cView\n      accessible\n      accessibilityLabel={`${time}, ${title}. ${t(`windowText.${w.kind}`)}${extra ? ` ${extra}` : ''}`}\n      style={{\n        flexDirection: 'row',\n        gap: spacing(3),\n        padding: spacing(3),\n        borderRadius: 16,\n        backgroundColor: isNow ? colors.surface2 : 'transparent',\n        borderWidth: isNow ? 1 : 0,\n        borderColor: color,\n        opacity: isPast ? 0.55 : 1,\n      }}\n    >\n      \u003cView style={{ width: 64 }}>\n        \u003cAppText variant=\"h3\" style={{ fontVariant: ['tabular-nums'] }}>\n          {formatClock(w.start, tz)}\n        \u003c/AppText>\n        {!w.point ? (\n          \u003cAppText variant=\"caption\" muted>\n            {formatDuration(minutes)}\n          \u003c/AppText>\n        ) : null}\n      \u003c/View>\n      \u003cView\n        style={{\n          width: 36,\n          height: 36,\n          borderRadius: 18,\n          backgroundColor: color + '33',\n          alignItems: 'center',\n          justifyContent: 'center',\n        }}\n      >\n        \u003cIcon name={WINDOW_ICON[w.kind]} size={18} color={color} />\n      \u003c/View>\n      \u003cView style={{ flex: 1, gap: 2 }}>\n        \u003cAppText variant=\"h3\">{title}\u003c/AppText>\n        \u003cAppText variant=\"caption\" muted>\n          {t(`windowText.${w.kind}`)}\n        \u003c/AppText>\n        {extra ? (\n          \u003cAppText variant=\"caption\" color={colors.warn}>\n            {extra}\n          \u003c/AppText>\n        ) : null}\n        {!w.point ? (\n          \u003cView style={{ height: 4, borderRadius: 2, backgroundColor: color, width: `${Math.min(100, 20 + minutes / 1.5)}%`, opacity: 0.8, marginTop: 4 }} />\n        ) : null}\n      \u003c/View>\n    \u003c/View>\n  );\n}\n"},{"path":"src/ui/components/primitives.tsx","content":"import React from 'react';\nimport {\n  Pressable,\n  RefreshControl,\n  ScrollView,\n  StyleSheet,\n  Text,\n  View,\n  type StyleProp,\n  type TextProps,\n  type TextStyle,\n  type ViewStyle,\n} from 'react-native';\nimport { useSafeAreaInsets } from 'react-native-safe-area-context';\nimport { fonts, radius, spacing, useTheme } from '../theme';\n\ntype Variant = 'title' | 'h2' | 'h3' | 'body' | 'caption' | 'number' | 'numberSmall';\n\nconst VARIANTS: Record\u003cVariant, TextStyle> = {\n  title: { fontSize: 28, lineHeight: 34, fontFamily: fonts.bold },\n  h2: { fontSize: 20, lineHeight: 26, fontFamily: fonts.semibold },\n  h3: { fontSize: 16, lineHeight: 22, fontFamily: fonts.semibold },\n  body: { fontSize: 15, lineHeight: 22, fontFamily: fonts.regular },\n  caption: { fontSize: 13, lineHeight: 18, fontFamily: fonts.medium },\n  number: { fontSize: 36, lineHeight: 42, fontFamily: fonts.bold, fontVariant: ['tabular-nums'] },\n  numberSmall: { fontSize: 22, lineHeight: 28, fontFamily: fonts.bold, fontVariant: ['tabular-nums'] },\n};\n\nexport interface AppTextProps extends TextProps {\n  variant?: Variant;\n  muted?: boolean;\n  color?: string;\n}\n\nexport function AppText({ variant = 'body', muted, color, style, ...rest }: AppTextProps) {\n  const { colors } = useTheme();\n  return (\n    \u003cText\n      {...rest}\n      style={[VARIANTS[variant], { color: color ?? (muted ? colors.textMuted : colors.text) }, style]}\n    />\n  );\n}\n\nexport function Card({\n  children,\n  style,\n  onPress,\n  accessibilityLabel,\n}: {\n  children: React.ReactNode;\n  style?: StyleProp\u003cViewStyle>;\n  onPress?: () => void;\n  accessibilityLabel?: string;\n}) {\n  const { colors } = useTheme();\n  const base: ViewStyle = {\n    backgroundColor: colors.surface,\n    borderRadius: radius.card,\n    padding: spacing(4),\n    borderWidth: StyleSheet.hairlineWidth,\n    borderColor: colors.border,\n  };\n  if (onPress) {\n    return (\n      \u003cPressable\n        accessibilityRole=\"button\"\n        accessibilityLabel={accessibilityLabel}\n        onPress={onPress}\n        style={({ pressed }) => [base, { opacity: pressed ? 0.85 : 1 }, style]}\n      >\n        {children}\n      \u003c/Pressable>\n    );\n  }\n  return \u003cView style={[base, style]}>{children}\u003c/View>;\n}\n\nexport function Button({\n  label,\n  onPress,\n  variant = 'primary',\n  disabled,\n  style,\n}: {\n  label: string;\n  onPress: () => void;\n  variant?: 'primary' | 'secondary' | 'danger' | 'ghost';\n  disabled?: boolean;\n  style?: StyleProp\u003cViewStyle>;\n}) {\n  const { colors } = useTheme();\n  const bg =\n    variant === 'primary' ? colors.accent : variant === 'danger' ? colors.bad : variant === 'secondary' ? colors.surface2 : 'transparent';\n  const fg = variant === 'primary' ? colors.onAccent : variant === 'danger' ? colors.onBad : colors.text;\n  return (\n    \u003cPressable\n      accessibilityRole=\"button\"\n      accessibilityLabel={label}\n      accessibilityState={{ disabled: !!disabled }}\n      disabled={disabled}\n      onPress={onPress}\n      style={({ pressed }) => [\n        {\n          minHeight: 48,\n          paddingHorizontal: spacing(5),\n          borderRadius: radius.button,\n          backgroundColor: bg,\n          alignItems: 'center',\n          justifyContent: 'center',\n          opacity: disabled ? 0.4 : pressed ? 0.85 : 1,\n        },\n        style,\n      ]}\n    >\n      \u003cAppText variant=\"h3\" color={fg}>\n        {label}\n      \u003c/AppText>\n    \u003c/Pressable>\n  );\n}\n\nexport function Segmented\u003cT extends string | number>({\n  options,\n  value,\n  onChange,\n}: {\n  options: { value: T; label: string }[];\n  value: T;\n  onChange: (v: T) => void;\n}) {\n  const { colors } = useTheme();\n  return (\n    \u003cView\n      accessibilityRole=\"tablist\"\n      style={{ flexDirection: 'row', backgroundColor: colors.surface2, borderRadius: radius.button, padding: 3 }}\n    >\n      {options.map((o) => {\n        const active = o.value === value;\n        return (\n          \u003cPressable\n            key={String(o.value)}\n            accessibilityRole=\"tab\"\n            accessibilityState={{ selected: active }}\n            onPress={() => onChange(o.value)}\n            style={{\n              flex: 1,\n              minHeight: 44,\n              alignItems: 'center',\n              justifyContent: 'center',\n              borderRadius: radius.button - 3,\n              backgroundColor: active ? colors.surface : 'transparent',\n            }}\n          >\n            \u003cAppText variant=\"caption\" color={active ? colors.text : colors.textMuted}>\n              {o.label}\n            \u003c/AppText>\n          \u003c/Pressable>\n        );\n      })}\n    \u003c/View>\n  );\n}\n\nexport function Chip({ label, active, onPress }: { label: string; active: boolean; onPress: () => void }) {\n  const { colors } = useTheme();\n  return (\n    \u003cPressable\n      accessibilityRole=\"checkbox\"\n      accessibilityState={{ checked: active }}\n      onPress={onPress}\n      style={{\n        minHeight: 44,\n        paddingHorizontal: spacing(4),\n        justifyContent: 'center',\n        borderRadius: radius.chip,\n        backgroundColor: active ? colors.accent : colors.surface2,\n      }}\n    >\n      \u003cAppText variant=\"caption\" color={active ? colors.onAccent : colors.text}>\n        {label}\n      \u003c/AppText>\n    \u003c/Pressable>\n  );\n}\n\nexport function Screen({\n  children,\n  onRefresh,\n  refreshing,\n  contentStyle,\n  padBottom = true,\n}: {\n  children: React.ReactNode;\n  onRefresh?: () => void;\n  refreshing?: boolean;\n  contentStyle?: StyleProp\u003cViewStyle>;\n  padBottom?: boolean;\n}) {\n  const { colors } = useTheme();\n  const insets = useSafeAreaInsets();\n  return (\n    \u003cScrollView\n      style={{ flex: 1, backgroundColor: colors.bg }}\n      contentContainerStyle={[\n        { padding: spacing(4), paddingTop: insets.top + spacing(3), gap: spacing(4), paddingBottom: padBottom ? spacing(10) : spacing(4) },\n        contentStyle,\n      ]}\n      refreshControl={onRefresh ? \u003cRefreshControl refreshing={!!refreshing} onRefresh={onRefresh} tintColor={colors.accent} /> : undefined}\n    >\n      {children}\n    \u003c/ScrollView>\n  );\n}\n\nexport function SectionTitle({ children }: { children: React.ReactNode }) {\n  return (\n    \u003cAppText variant=\"h2\" style={{ marginTop: spacing(2) }} accessibilityRole=\"header\">\n      {children}\n    \u003c/AppText>\n  );\n}\n\nexport function Row({\n  title,\n  subtitle,\n  right,\n  onPress,\n  last,\n}: {\n  title: string;\n  subtitle?: string;\n  right?: React.ReactNode;\n  onPress?: () => void;\n  last?: boolean;\n}) {\n  const { colors } = useTheme();\n  const content = (\n    \u003cView\n      style={{\n        minHeight: 56,\n        flexDirection: 'row',\n        alignItems: 'center',\n        gap: spacing(3),\n        borderBottomWidth: last ? 0 : StyleSheet.hairlineWidth,\n        borderBottomColor: colors.border,\n        paddingVertical: spacing(2),\n      }}\n    >\n      \u003cView style={{ flex: 1 }}>\n        \u003cAppText variant=\"h3\">{title}\u003c/AppText>\n        {subtitle ? (\n          \u003cAppText variant=\"caption\" muted>\n            {subtitle}\n          \u003c/AppText>\n        ) : null}\n      \u003c/View>\n      {right}\n    \u003c/View>\n  );\n  if (!onPress) return content;\n  return (\n    \u003cPressable accessibilityRole=\"button\" accessibilityLabel={title} onPress={onPress}>\n      {content}\n    \u003c/Pressable>\n  );\n}\n\nexport function ProgressBar({ value, color }: { value: number; color?: string }) {\n  const { colors } = useTheme();\n  return (\n    \u003cView\n      accessibilityRole=\"progressbar\"\n      accessibilityValue={{ min: 0, max: 100, now: Math.round(value * 100) }}\n      style={{ height: 6, borderRadius: 3, backgroundColor: colors.surface2, overflow: 'hidden' }}\n    >\n      \u003cView style={{ width: `${Math.min(100, Math.max(0, value * 100))}%`, height: 6, backgroundColor: color ?? colors.accent }} />\n    \u003c/View>\n  );\n}\n\nexport function Notice({ children, tone = 'info' }: { children: React.ReactNode; tone?: 'info' | 'warn' }) {\n  const { colors } = useTheme();\n  return (\n    \u003cView\n      style={{\n        borderRadius: radius.small + 4,\n        padding: spacing(3),\n        backgroundColor: colors.surface2,\n        borderLeftWidth: 3,\n        borderLeftColor: tone === 'warn' ? colors.warn : colors.accent2,\n      }}\n    >\n      \u003cAppText variant=\"caption\">{children}\u003c/AppText>\n    \u003c/View>\n  );\n}\n"},{"path":"src/ui/forms.tsx","content":"import React from 'react';\nimport { Switch, TextInput, View } from 'react-native';\nimport type { ChronotypeAnswers, PeakTime } from '@/engine/chronotype';\nimport type { WorkSchedule } from '@/engine/types';\nimport { t } from '@/i18n';\nimport { TimeStepper } from './components/TimeStepper';\nimport { AppText, Card, Chip, Notice } from './components/primitives';\nimport { fonts, radius, spacing, useTheme } from './theme';\n\nexport const DEFAULT_ANSWERS: ChronotypeAnswers = {\n  freeSleepStart: '00:00',\n  freeWake: '08:00',\n  workBed: '23:00',\n  workWake: '07:00',\n  peak: 'midday',\n  workDaysPerWeek: 5,\n};\n\nexport function TextField({\n  value,\n  onChangeText,\n  placeholder,\n  keyboardType,\n  label,\n  maxLength,\n}: {\n  value: string;\n  onChangeText: (v: string) => void;\n  placeholder?: string;\n  keyboardType?: 'default' | 'number-pad';\n  label: string;\n  maxLength?: number;\n}) {\n  const { colors } = useTheme();\n  return (\n    \u003cView style={{ gap: 6 }}>\n      \u003cAppText variant=\"caption\" muted>\n        {label}\n      \u003c/AppText>\n      \u003cTextInput\n        accessibilityLabel={label}\n        value={value}\n        onChangeText={onChangeText}\n        placeholder={placeholder}\n        placeholderTextColor={colors.textMuted}\n        keyboardType={keyboardType}\n        maxLength={maxLength}\n        style={{\n          minHeight: 48,\n          borderRadius: radius.button,\n          paddingHorizontal: spacing(4),\n          backgroundColor: colors.surface2,\n          color: colors.text,\n          fontFamily: fonts.medium,\n          fontSize: 16,\n        }}\n      />\n    \u003c/View>\n  );\n}\n\nconst PEAKS: { value: PeakTime; key: string }[] = [\n  { value: 'morning', key: 'onboarding.peakMorning' },\n  { value: 'midday', key: 'onboarding.peakMidday' },\n  { value: 'evening', key: 'onboarding.peakEvening' },\n  { value: 'night', key: 'onboarding.peakNight' },\n];\n\nexport function ChronotypeForm({ value, onChange }: { value: ChronotypeAnswers; onChange: (v: ChronotypeAnswers) => void }) {\n  const set = (patch: Partial\u003cChronotypeAnswers>) => onChange({ ...value, ...patch });\n  return (\n    \u003cView style={{ gap: spacing(4) }}>\n      \u003cCard>\n        \u003cTimeStepper label={t('onboarding.freeSleep')} value={value.freeSleepStart} onChange={(v) => set({ freeSleepStart: v })} />\n      \u003c/Card>\n      \u003cCard>\n        \u003cTimeStepper label={t('onboarding.freeWake')} value={value.freeWake} onChange={(v) => set({ freeWake: v })} />\n      \u003c/Card>\n      \u003cCard style={{ gap: spacing(3) }}>\n        \u003cAppText>{t('onboarding.peak')}\u003c/AppText>\n        \u003cView style={{ flexDirection: 'row', flexWrap: 'wrap', gap: spacing(2) }}>\n          {PEAKS.map((p) => (\n            \u003cChip key={p.value} label={t(p.key)} active={value.peak === p.value} onPress={() => set({ peak: p.value })} />\n          ))}\n        \u003c/View>\n      \u003c/Card>\n      \u003cCard>\n        \u003cTimeStepper label={t('onboarding.workSleep')} value={value.workBed} onChange={(v) => set({ workBed: v })} />\n      \u003c/Card>\n      \u003cCard>\n        \u003cTimeStepper label={t('onboarding.workWake')} value={value.workWake} onChange={(v) => set({ workWake: v })} />\n      \u003c/Card>\n    \u003c/View>\n  );\n}\n\nconst DAYS = [\n  { d: 1, label: 'Mo' },\n  { d: 2, label: 'Di' },\n  { d: 3, label: 'Mi' },\n  { d: 4, label: 'Do' },\n  { d: 5, label: 'Fr' },\n  { d: 6, label: 'Sa' },\n  { d: 0, label: 'So' },\n];\n\nexport function WorkForm({ value, onChange }: { value: WorkSchedule; onChange: (v: WorkSchedule) => void }) {\n  const { colors } = useTheme();\n  const toggle = (d: number) =>\n    onChange({ ...value, workDays: value.workDays.includes(d) ? value.workDays.filter((x) => x !== d) : [...value.workDays, d].sort() });\n  return (\n    \u003cView style={{ gap: spacing(4) }}>\n      \u003cCard style={{ gap: spacing(3) }}>\n        \u003cAppText variant=\"h3\">{t('onboarding.workDays')}\u003c/AppText>\n        \u003cView style={{ flexDirection: 'row', flexWrap: 'wrap', gap: spacing(2) }}>\n          {DAYS.map((x) => (\n            \u003cChip key={x.d} label={x.label} active={value.workDays.includes(x.d)} onPress={() => toggle(x.d)} />\n          ))}\n        \u003c/View>\n      \u003c/Card>\n      \u003cCard style={{ gap: spacing(3) }}>\n        \u003cView style={{ flexDirection: 'row', alignItems: 'center', gap: spacing(3) }}>\n          \u003cView style={{ flex: 1 }}>\n            \u003cAppText variant=\"h3\">{t('onboarding.shiftMode')}\u003c/AppText>\n            \u003cAppText variant=\"caption\" muted>\n              {t('onboarding.shiftHint')}\n            \u003c/AppText>\n          \u003c/View>\n          \u003cSwitch\n            accessibilityLabel={t('onboarding.shiftMode')}\n            value={value.shiftMode}\n            onValueChange={(v) => onChange({ ...value, shiftMode: v })}\n            trackColor={{ true: colors.accent, false: colors.surface2 }}\n          />\n        \u003c/View>\n      \u003c/Card>\n      {value.shiftMode && \u003cNotice>{t('onboarding.shiftHint')}\u003c/Notice>}\n    \u003c/View>\n  );\n}\n\nexport function TargetWakeForm({ value, onChange }: { value: string | null; onChange: (v: string | null) => void }) {\n  const { colors } = useTheme();\n  return (\n    \u003cCard style={{ gap: spacing(3) }}>\n      \u003cView style={{ flexDirection: 'row', alignItems: 'center', gap: spacing(3) }}>\n        \u003cAppText variant=\"h3\" style={{ flex: 1 }}>\n          {t('onboarding.targetWake')}\n        \u003c/AppText>\n        \u003cSwitch\n          accessibilityLabel={t('onboarding.targetWake')}\n          value={value != null}\n          onValueChange={(v) => onChange(v ? '07:00' : null)}\n          trackColor={{ true: colors.accent, false: colors.surface2 }}\n        />\n      \u003c/View>\n      {value != null ? \u003cTimeStepper value={value} onChange={onChange} /> : \u003cAppText variant=\"caption\" muted>{t('onboarding.targetWakeOff')}\u003c/AppText>}\n    \u003c/Card>\n  );\n}\n\nexport const CAFFEINE_OPTIONS = [6, 8, 10];\n"},{"path":"src/ui/theme.ts","content":"import { createContext, useContext } from 'react';\n\nexport type ThemeMode = 'dark' | 'light';\nexport type ThemePref = 'system' | 'dark' | 'light';\n\nexport interface Colors {\n  bg: string;\n  surface: string;\n  surface2: string;\n  border: string;\n  text: string;\n  textMuted: string;\n  accent: string;\n  accent2: string;\n  good: string;\n  warn: string;\n  bad: string;\n  groggy: string;\n  peak: string;\n  dip: string;\n  melatonin: string;\n  onAccent: string;\n  onBad: string;\n}\n\nexport const darkColors: Colors = {\n  bg: '#0B0E1A',\n  surface: '#141A2E',\n  surface2: '#1C2340',\n  border: '#2A3358',\n  text: '#F2F4FA',\n  textMuted: '#9AA3BF',\n  accent: '#FFB547',\n  accent2: '#7C8CFF',\n  good: '#4FD1A1',\n  warn: '#FFB547',\n  bad: '#FF6B6B',\n  groggy: '#5A6488',\n  peak: '#FFB547',\n  dip: '#5B7CFA',\n  melatonin: '#9B7CFF',\n  onAccent: '#1A1300',\n  onBad: '#2A0000',\n};\n\nexport const lightColors: Colors = {\n  bg: '#F5F6FB',\n  surface: '#FFFFFF',\n  surface2: '#E9ECF7',\n  border: '#D5DAEB',\n  text: '#141A2E',\n  textMuted: '#525B78',\n  accent: '#955700',\n  accent2: '#4A5BD6',\n  good: '#0A7552',\n  warn: '#8F5208',\n  bad: '#B02E2E',\n  groggy: '#6B7599',\n  peak: '#D98A00',\n  dip: '#3E5FE0',\n  melatonin: '#6444D0',\n  onAccent: '#FFFFFF',\n  onBad: '#FFFFFF',\n};\n\nexport const spacing = (n: number) => n * 4;\nexport const radius = { card: 20, button: 14, chip: 999, small: 10 } as const;\n\nexport const fonts = {\n  regular: 'Manrope_400Regular',\n  medium: 'Manrope_500Medium',\n  semibold: 'Manrope_600SemiBold',\n  bold: 'Manrope_700Bold',\n} as const;\n\nexport interface ThemeValue {\n  mode: ThemeMode;\n  colors: Colors;\n}\n\nexport const ThemeContext = createContext\u003cThemeValue>({ mode: 'dark', colors: darkColors });\nexport const useTheme = () => useContext(ThemeContext);\n\nexport function resolveMode(pref: ThemePref, system: 'light' | 'dark' | null | undefined): ThemeMode {\n  if (pref === 'light') return 'light';\n  if (pref === 'dark') return 'dark';\n  return system === 'light' ? 'light' : 'dark';\n}\n\n/** WCAG relative luminance contrast ratio between two hex colours. */\nexport function contrastRatio(a: string, b: string): number {\n  const lum = (hex: string) => {\n    const n = parseInt(hex.slice(1), 16);\n    const ch = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => {\n      const s = v / 255;\n      return s \u003c= 0.03928 ? s / 12.92 : ((s + 0.055) / 1.055) ** 2.4;\n    });\n    return 0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2];\n  };\n  const [hi, lo] = [lum(a), lum(b)].sort((x, y) => y - x);\n  return (hi + 0.05) / (lo + 0.05);\n}\n"},{"path":"tsconfig.json","content":"{\n  \"extends\": \"expo/tsconfig.base\",\n  \"compilerOptions\": {\n    \"strict\": true,\n    \"paths\": { \"@/*\": [\"./src/*\"] },\n    \"resolveJsonModule\": true,\n    \"types\": [\"jest\", \"node\"]\n  },\n  \"include\": [\"**/*.ts\", \"**/*.tsx\", \".expo/types/**/*.ts\", \"expo-env.d.ts\"],\n  \"exclude\": [\"node_modules\"]\n}\n"}];
const list=document.getElementById('list'),main=document.getElementById('main');
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const dl=(name,text)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));a.download=name;a.click();};
FILES.forEach((f,i)=>{
  const a=document.createElement('a');a.href='#f'+i;a.textContent=f.path;a.dataset.p=f.path.toLowerCase();list.appendChild(a);
  const s=document.createElement('section');s.id='f'+i;
  s.innerHTML='<h2>'+esc(f.path)+' <button data-c="'+i+'">Kopieren</button> <button data-d="'+i+'">Laden</button></h2><pre>'+esc(f.content)+'</pre>';
  main.appendChild(s);
});
main.addEventListener('click',e=>{const c=e.target.dataset.c,d=e.target.dataset.d;
  if(c!==undefined)navigator.clipboard.writeText(FILES[c].content).then(()=>{e.target.textContent='Kopiert'});
  if(d!==undefined)dl(FILES[d].path.split('/').pop(),FILES[d].content);});
document.getElementById('q').oninput=e=>{const v=e.target.value.toLowerCase();list.querySelectorAll('a').forEach(a=>a.style.display=a.dataset.p.includes(v)?'':'none');};
document.getElementById('all').onclick=()=>dl('tagwerk-quellcode.txt',FILES.map(f=>'===== '+f.path+' =====\n'+f.content).join('\n\n'));
</script></body></html>
