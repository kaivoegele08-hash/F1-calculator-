const FILES=[{"path":".gitignore","content":"node_modules/\n.expo/\ndist/\ncoverage/\nios/\nandroid/\n*.log\nexpo-env.d.ts\n"},{"path":".npmrc","content":"legacy-peer-deps=true\n"},{"path":".prettierrc","content":"{ \"singleQuote\": true, \"trailingComma\": \"all\", \"printWidth\": 100 }\n"},{"path":"DECISIONS.md","content":"# Entscheidungen\n\n- App liegt im Unterordner `tagwerk/` des bestehenden Repos, damit der vorhandene F1-Rechner unberührt bleibt.\n- Expo SDK 58 (aktuell installiert), expo-router mit Root-Ordner `app/` wie in der Spezifikation.\n- Process C: Die Formel nutzt `x = φ − t` (Zeitrichtung umgekehrt gegenüber `t − φ`). Nur so steigt die Kurve ~16 h langsam und fällt ~8 h schnell, mit Minimum ≈ 04:00 und Maximum ≈ 20:00. Mit `t − φ` wäre der Abstand Minimum→Maximum nur 8 h und die Vorgabe (04–05 Uhr / 18–20 Uhr) unerreichbar.\n- Energie: `E = 2.5·C + Semidian − S − I − D`. Der Gewichtungsfaktor und eine zirkasemidiane Komponente (Mittagstief) kommen zur Spezifikation dazu, sonst hat die Kurve nur einen monotonen Abfall und kein Morgenhoch / Nachmittagstief / Abendhoch. Beide Werte stehen in `constants.ts`.\n- Schlafträgheit ist zusätzlich nahe am C-Minimum stärker (Faktor 1 + 0.5·Nähe), wie im Text der Spezifikation beschrieben.\n- Prozess S wird pro Segment exakt (geschlossene Form) statt in 5-Minuten-Schritten simuliert. Gleiches Ergebnis, schneller.\n- Normierung der Energie: feste Skala aus einem ausgeschlafenen Referenztag (`E_MIN_REF`, `E_MAX_REF`).\n- Habituelle Einschlafzeit des Referentyps = 22:30; Melatonin-Fenster startet dort (DLMO ≈ 20:30).\n- Erster Schlafbedarf-Schätzwert wird nicht geglättet (nichts zum Glätten); danach 0.8·alt + 0.2·neu.\n- Zeitzonen-/Jetlag-Logik: Beim Wechsel der Session-Zeitzone verschiebt sich die Phase um die UTC-Differenz und holt dann max. 60 Min./Tag auf.\n- Eigene Zeitzonen-Offset-Berechnung via `Intl` statt `date-fns-tz.getTimezoneOffset`, weil Letzteres rund um Zeitumstellungen um eine Stunde abwich.\n- Engine bekommt `needMinutes` von außen (gecachter Schätzwert), die teure 90-Tage-Schätzung läuft nur nachts bzw. nach Datenänderungen.\n- Daten: `SqliteStore` ist gegen eine synchrone Drizzle-Datenbank geschrieben und läuft sowohl mit `expo-sqlite` (App) als auch mit `better-sqlite3` (Tests). Web nutzt einen `MemoryStore` mit localStorage, weil `expo-sqlite` im Web noch experimentell ist.\n- Migrationen: eigener versionierter Runner (`migration_log`) mit SQL-Statements statt drizzle-kit-Bundle, damit er ohne Metro-Sonderkonfiguration läuft.\n- Wissensartikel liegen als TypeScript-Strings (`src/content/library.ts`) statt `.md`-Dateien, damit Metro sie ohne Zusatz-Transformer bündelt. Format ist ein kleines Markdown-Subset.\n- Zeit-Picker: eigene Stepper (Stunde/Minute) statt nativer Picker, damit sie überall (Web, iOS, Android) gleich funktionieren und groß genug sind.\n- Reanimated wird in Jest durch einen schlanken Mock ersetzt, d3 und lucide werden auf ihre CommonJS-Builds gemappt.\n- Kontrast: Hell-Modus-Farben wurden nach einem Kontrasttest (≥ 4,5:1) abgedunkelt, `onAccent`/`onBad` regeln die Schriftfarbe auf Akzent-Flächen.\n- Widgets (7.7) bewusst nicht gebaut: WidgetKit braucht ein natives Swift-Target (z. B. `expo-apple-targets`) und eine App Group, Android-Widgets `react-native-android-widget` samt Headless-Task. Beides lässt sich ohne Gerät/Xcode nicht prüfen. Stattdessen erzeugt `buildWidgetSnapshot()` das JSON für beide Seiten. To-do.\n- Sanfter Wecker: Benachrichtigung statt echter Alarm (iOS-Einschränkung), im UI offen kommuniziert.\n- Summary-Cache (`daily_summary`) wird beim Öffnen von „Heute“ geschrieben und bei jeder Datenänderung geleert. Die Berechnung selbst ist so schnell, dass sie nicht davon abhängt.\n- Dev-Menü: Die Demo-Szenarien sind als normaler „Demo-Modus“ unter Einstellungen → Daten verfügbar (nicht nur in `__DEV__`), weil sie auch Nutzern das Ausprobieren erlauben.\n- Erinnerungen: Plan über 7 Tage (max. 60 Benachrichtigungen, iOS-Limit 64), jeder Folgetag wird unter der Annahme einer vollen Nacht zur empfohlenen Zeit berechnet; zwischen Schlafenszeit und Aufwachen wird nichts geplant.\n"},{"path":"PLAN.md","content":"# Tagwerk – Plan\n\nChecklist nach Phasen (Spezifikation: Abschnitt 14).\n\n## Phase 1 – Fundament\n- [x] Expo-Projekt (SDK 58), TypeScript strict\n- [x] ESLint, Prettier, Jest (`npm test` = tsc + jest)\n- [x] expo-router mit 5 Tabs, Theme, Fonts\n- [x] SQLite + Drizzle + erste Migration\n- [x] Demo-Datengenerator + 5 Szenarien\n- [x] README-Grundgerüst\n\n## Phase 2 – Engine\n- [x] Konstanten, Typen, Zeit-Hilfen (DST-sicher)\n- [x] Schlaftag-Zuordnung, Merge, Naps, Quellen-Priorität\n- [x] Schlafbedarf, Schlafschuld (+ Prognose)\n- [x] Zwei-Prozess-Modell, Schlafträgheit, Schichtmodus/Jetlag\n- [x] Energiekurve, Fenster, Schlafenszeit\n- [x] Chronotyp (Fragebogen + Lernen)\n- [x] Empfehlungen\n- [x] Tests (> 90 % Zeilenabdeckung), Benchmark\n\n## Phase 3 – Kern-UI\n- [x] Home: EnergyCurve (Scrubbing), DebtGauge, Tipps, letzte Nacht\n- [x] Schlaf-Tab mit Charts\n- [x] Tagesplan-Timeline\n- [x] Night-Detail inkl. Bearbeiten\n\n## Phase 4 – Echte Daten & Onboarding\n- [x] HealthProvider (iOS/Android/Mock), 90-Tage-Import, Sync\n- [x] Manuelle Eingabe\n- [x] Onboarding mit Ergebnis-Reveal\n\n## Phase 5 – Gewohnheiten, Benachrichtigungen, Kalender, Wissen\n- [x] Habits + Logs + Heatmap\n- [x] Lokale Benachrichtigungen + Neuplanung\n- [x] Kalender-Overlay\n- [x] Wissensbibliothek, Tools, Einstellungen, Export/Import\n\n## Phase 6 – Feinschliff\n- [x] Light Mode, i18n EN, Barrierefreiheit\n- [x] Sanfter Wecker, Widgets (To-do dokumentiert)\n- [x] Abschlusstest gegen Akzeptanzkriterien\n"},{"path":"README.md","content":"# Tagwerk\n\n**Schlafschuld runter, Energie rauf.** Eine local-first Schlaf- und Energie-App (Expo / React Native / TypeScript), die auf zwei Dingen aufbaut:\n\n1. **Schlafschuld:** gewichtet über die letzten 14 Nächte, gemessen an deinem persönlichen Schlafbedarf.\n2. **Innerer Rhythmus:** Energiekurve des Tages (Benommenheit, Morgenhoch, Nachmittagstief, Abendhoch), Melatonin-Fenster und ideale Schlafenszeit.\n\n> **Kein Medizinprodukt.** Alle Werte sind Schätzungen aus wissenschaftlichen Modellen und ersetzen keine Diagnose. Alle Daten bleiben auf dem Gerät (kein Backend, kein Tracking).\n\nDie Spezifikation, nach der die App gebaut wurde, steht im Prompt zu diesem Projekt (Abschnitte 0–15). Die Abschnittsnummern unten verweisen darauf.\n\n## Setup\n\n```bash\ncd tagwerk\nnpm install            # .npmrc setzt legacy-peer-deps (einige Expo-Peer-Ranges sind enger als die React-19-Versionen)\nnpm test                 # tsc --noEmit + Jest (Engine, Daten, Services, Komponenten)\nnpm run lint             # ESLint ohne Warnungen\nnpx expo start --web     # Web-Vorschau mit Demo-Daten\nnpx expo start           # Expo Go: alles außer Gesundheitsdaten\n```\n\n### Demo-Modus / Web-Vorschau\n\nIm Browser (und überall, wo keine Gesundheitsdaten verfügbar sind) nutzt Tagwerk einen Demo-Datenanbieter. Im Onboarding erzeugt „Verbinden“ dort 90 Nächte Demodaten. Unter **Mehr → Einstellungen → Daten** lassen sich fünf Szenarien laden:\ngut ausgeschlafen · Prüfungswoche · Spättyp mit Frühschicht · Wochenend-Nachholer · Schichtarbeiter.\nIm Web liegen die Daten in `localStorage`, auf dem Gerät in SQLite.\n\n### Development Build (HealthKit / Health Connect)\n\nHealthKit (`react-native-health`) und Health Connect (`react-native-health-connect`) sind native Module und laufen **nicht in Expo Go**. Dafür ein Development Build:\n\n```bash\n# iOS (benötigt macOS + Xcode)\nnpx expo prebuild --platform ios\nnpx expo run:ios --device          # echtes iPhone für HealthKit-Daten\n\n# Android (Health Connect muss auf dem Gerät installiert sein, ab Android 14 integriert)\nnpx expo prebuild --platform android\nnpx expo run:android --device\n```\n\nOder mit EAS: `eas build --profile development --platform ios|android` und `npx expo start --dev-client`.\nDie Config-Plugins in `app.json` setzen HealthKit-Entitlement, Nutzungstexte, Health-Connect-Berechtigung (`READ_SLEEP`) und `minSdkVersion 26`. Beide Prebuilds wurden getestet.\nOhne Wearable schreibt auch ein iPhone Schlafdaten in Apple Health, wenn der „Schlafplan“ genutzt wird.\n\n## Architektur\n\n```\napp/                    expo-router: Tabs (Heute, Schlaf, Tagesplan, Gewohnheiten, Mehr), Onboarding, Nacht, Wissen, Tools, Einstellungen\nsrc/engine/             REINE Logik ohne React/Expo (Konstanten zentral in constants.ts, ENGINE_VERSION)\nsrc/data/               Drizzle-Schema, versionierte Migrationen, SqliteStore + MemoryStore (gleiche Schnittstelle), Export/Import (zod), Demo-Generator\nsrc/integrations/       HealthProvider (HealthKit, Health Connect, Mock), Konvertierung von Rohdaten in Sessions\nsrc/services/           Benachrichtigungsplan, Kalender, Sync, Hintergrundaufgabe, Geräusche, Summary-Cache, Widget-Snapshot\nsrc/state/              Zustand-Store und Hooks (useDayPlan, useTips …)\nsrc/ui/                 Theme (dunkel/hell), Komponenten (EnergyCurve, DebtGauge, Charts …)\nsrc/content/            Wissensbibliothek (eigene Texte), Gewohnheiten\nsrc/i18n/               de (vollständig), en (teilweise, Fallback auf de)\n```\n\nDie Engine bekommt nur reine Datenobjekte (`SleepSession[]`, `Profile`), Repositories wandeln um. Alle Zeiten sind UTC-Millisekunden, die Anzeige nutzt die Zeitzone aus `profile.timezone`.\n\n## Engine-Formeln (Spezifikation Abschnitt 5)\n\n| Baustein | Datei | Kurzfassung |\n|---|---|---|\n| Schlaftag-Zuordnung (5.1) | `sleepDetection.ts` | Hauptschlaf gehört zum Datum des Aufwachens, Lücken ≤ 45 Min. werden verschmolzen, Nap \u003c 3 h zwischen 09 und 20 Uhr, Quellen-Priorität userEdited > Wearable > Handy > manuell |\n| Schlafbedarf (5.2) | `sleepNeed.ts` | Median der Erholungsnächte (sonst 80. Perzentil der letzten 30 Nächte), Grenzen 6:00–10:30 h, Glättung 0,8·alt + 0,2·neu, manuell hat Vorrang |\n| Schlafschuld (5.3) | `sleepDebt.ts` | `Σ w_i · delta_i`, `w_i = 1 − i·0,85/13`, Mehrschlaf zählt halb, Naps 0,75, fehlende Nächte = Median, > 5 fehlend = „Zu wenig Daten“ + Bereich, Prognose für die nächste Nacht |\n| Zwei-Prozess-Modell (5.4) | `twoProcess.ts` | S: τ_r = 18,2 h, τ_d = 4,2 h; C: Harmonische mit A = 0,12; Trägheit I0 = 0,25, τ_i = 0,6 h; Schuld-Malus D = 0,08·min(h/10, 1,5) |\n| Energiekurve (5.5) | `energyCurve.ts` | 5-Min-Schritte, feste Skala 0–100, Extrema aus 30-Min-geglätteter Kurve, Fenster 45–150 Min. |\n| Chronotyp (5.6) | `chronotype.ts` | MSF/MSFsc, Einstufung 03/05 Uhr, Offset ±240 Min., Lernen ab 21 Nächten mit max. 15 Min./Woche |\n| Schichtmodus / Jetlag (5.7) | `twoProcess.ts` | Phase folgt dem Schlaf der letzten 1–3 Tage, max. 60 Min./Tag, Zeitzonenwechsel verschiebt um die UTC-Differenz |\n| Fenster & Schlafenszeit (5.8) | `windows.ts` | Koffein-Stopp, Nap, Sport, Mahlzeit, Licht, Wind-down, Melatonin, Schlafenszeit mit/ohne Wunsch-Aufstehzeit |\n| Tipps (5.9) | `recommendations.ts` | regelbasiert, 1–3 Tipps, kein Tipp länger als 2 Tage in Folge |\n| Sanfter Wecker (7.8) | `alarm.ts` | Ende eines 90-Minuten-Zyklus innerhalb der Weck-Spanne |\n\nAbweichungen von der Spezifikation (mit Begründung) stehen in [`DECISIONS.md`](DECISIONS.md). Die wichtigste: Process C nutzt die Zeitrichtung `φ − t`, und die Energie enthält einen Mittagstief-Term, sonst wären die geforderten Extremstellen mathematisch nicht erreichbar.\n\n## Tests\n\n`npm test` prüft Typen (`tsc --noEmit`) und führt Jest aus: Engine (Zeilenabdeckung ≈ 99 %, Mindestwert 90 % ist als Schwellwert hinterlegt), Datenschicht gegen echtes SQLite (`better-sqlite3`) und gegen den Memory-Store, Gesundheits-Konvertierung, Sync, Benachrichtigungsplan, App-Store, Komponenten (Render, Snapshot, Kontrast). Enthalten sind Tests für die Zeitumstellung in `Europe/Berlin` (März und Oktober), Nächte über Mitternacht, Zeitzonenwechsel und einen Benchmark (Tagesberechnung mit 90 Nächten deutlich unter 50 ms).\n\n## Bekannte Einschränkungen\n\n- **Widgets (7.7):** nicht umgesetzt, nur vorbereitet (`services/widgetSnapshot.ts` erzeugt das JSON, das ein WidgetKit-/Android-Widget lesen würde). Begründung in `DECISIONS.md`.\n- **Sanfter Wecker:** iOS erlaubt Drittanbieter-Apps keinen Wecker, der den Stummschalter umgeht. Tagwerk plant eine Benachrichtigung und weist darauf hin.\n- **HealthKit / Health Connect** konnten in dieser Umgebung (Linux, kein Gerät) nur kompiliert und per Prebuild geprüft, nicht mit echten Daten getestet werden. Die Konvertierung der Rohdaten ist durch Tests abgedeckt.\n- **Hintergrund-Sync** (`expo-background-task`) ist „best effort“, das Betriebssystem entscheidet über die Ausführung.\n- **Wissensartikel:** 13 eigene Texte mit 1,5–3 Minuten Lesezeit statt 3–5.\n- Englisch ist unvollständig, fehlende Texte erscheinen auf Deutsch.\n- Die Modelle sind Schätzungen. Die Konstanten sind in `src/engine/constants.ts` kalibriert und anpassbar (bei Änderungen `ENGINE_VERSION` erhöhen).\n"},{"path":"app.json","content":"{\n  \"expo\": {\n    \"name\": \"Tagwerk\",\n    \"slug\": \"tagwerk\",\n    \"scheme\": \"tagwerk\",\n    \"version\": \"1.0.0\",\n    \"orientation\": \"portrait\",\n    \"icon\": \"./assets/icon.png\",\n    \"userInterfaceStyle\": \"automatic\",\n    \"newArchEnabled\": true,\n    \"splash\": {\n      \"image\": \"./assets/splash-icon.png\",\n      \"resizeMode\": \"contain\",\n      \"backgroundColor\": \"#0B0E1A\"\n    },\n    \"ios\": {\n      \"supportsTablet\": false,\n      \"bundleIdentifier\": \"app.tagwerk.sleep\",\n      \"infoPlist\": {\n        \"NSHealthShareUsageDescription\": \"Tagwerk liest deine Schlafdaten, um Schlafbedarf, Schlafschuld und deinen Rhythmus zu schätzen. Die Daten bleiben auf deinem Gerät.\",\n        \"NSCalendarsUsageDescription\": \"Tagwerk zeigt deine Termine neben deinen Energiefenstern an.\",\n        \"NSCalendarsFullAccessUsageDescription\": \"Tagwerk zeigt deine Termine neben deinen Energiefenstern an.\",\n        \"UIBackgroundModes\": [\n          \"fetch\",\n          \"processing\"\n        ]\n      }\n    },\n    \"android\": {\n      \"package\": \"app.tagwerk.sleep\",\n      \"permissions\": [\n        \"android.permission.health.READ_SLEEP\",\n        \"android.permission.READ_CALENDAR\",\n        \"android.permission.WRITE_CALENDAR\",\n        \"android.permission.POST_NOTIFICATIONS\"\n      ],\n      \"adaptiveIcon\": {\n        \"backgroundColor\": \"#0B0E1A\",\n        \"foregroundImage\": \"./assets/android-icon-foreground.png\"\n      }\n    },\n    \"web\": {\n      \"bundler\": \"metro\",\n      \"output\": \"single\",\n      \"favicon\": \"./assets/favicon.png\"\n    },\n    \"plugins\": [\n      \"expo-router\",\n      \"expo-sqlite\",\n      \"expo-font\",\n      \"expo-audio\",\n      \"expo-sharing\",\n      \"expo-background-task\",\n      \"expo-notifications\",\n      \"expo-dev-client\",\n      [\n        \"react-native-health\",\n        {\n          \"healthSharePermission\": \"Tagwerk liest deine Schlafzeiten, um Schlafbedarf, Schlafschuld und deinen Rhythmus zu schätzen. Die Daten bleiben auf deinem Gerät.\",\n          \"healthUpdatePermission\": \"Tagwerk schreibt keine Gesundheitsdaten.\",\n          \"isClinicalDataEnabled\": false\n        }\n      ],\n      \"react-native-health-connect\",\n      [\n        \"expo-build-properties\",\n        {\n          \"android\": {\n            \"minSdkVersion\": 26,\n            \"compileSdkVersion\": 35,\n            \"targetSdkVersion\": 35\n          }\n        }\n      ]\n    ],\n    \"experiments\": {\n      \"typedRoutes\": false\n    }\n  }\n}"},{"path":"app/(tabs)/_layout.tsx","content":"import { Tabs } from 'expo-router';\nimport { CalendarClock, Home, MoonStar, MoreHorizontal, ListChecks } from 'lucide-react-native';\nimport React from 'react';\nimport { t } from '@/i18n';\nimport { useTheme } from '@/ui/theme';\n\nexport default function TabsLayout() {\n  const { colors } = useTheme();\n  return (\n    \u003cTabs\n      screenOptions={{\n        headerShown: false,\n        tabBarActiveTintColor: colors.accent,\n        tabBarInactiveTintColor: colors.textMuted,\n        tabBarStyle: { backgroundColor: colors.surface, borderTopColor: colors.border, height: 64, paddingTop: 6 },\n        tabBarLabelStyle: { fontFamily: 'Manrope_600SemiBold', fontSize: 10 },\n      }}\n    >\n      \u003cTabs.Screen name=\"index\" options={{ title: t('tabs.today'), tabBarIcon: ({ color }) => \u003cHome size={22} color={color} /> }} />\n      \u003cTabs.Screen name=\"sleep\" options={{ title: t('tabs.sleep'), tabBarIcon: ({ color }) => \u003cMoonStar size={22} color={color} /> }} />\n      \u003cTabs.Screen name=\"schedule\" options={{ title: t('tabs.schedule'), tabBarIcon: ({ color }) => \u003cCalendarClock size={22} color={color} /> }} />\n      \u003cTabs.Screen name=\"habits\" options={{ title: t('tabs.habits'), tabBarIcon: ({ color }) => \u003cListChecks size={22} color={color} /> }} />\n      \u003cTabs.Screen name=\"more\" options={{ title: t('tabs.more'), tabBarIcon: ({ color }) => \u003cMoreHorizontal size={22} color={color} /> }} />\n    \u003c/Tabs>\n  );\n}\n"},{"path":"app/(tabs)/habits.tsx","content":"import { useRouter } from 'expo-router';\nimport React from 'react';\nimport { Pressable, Switch, View } from 'react-native';\nimport { HABITS } from '@/content/habits';\nimport { dateKey } from '@/engine/time';\nimport { t } from '@/i18n';\nimport { useApp } from '@/state/app';\nimport { useNow } from '@/state/hooks';\nimport { AppText, Card, Screen } from '@/ui/components/primitives';\nimport { spacing, useTheme } from '@/ui/theme';\n\nexport default function HabitsScreen() {\n  const router = useRouter();\n  const { colors } = useTheme();\n  const habits = useApp((s) => s.habits);\n  const logs = useApp((s) => s.habitLogs);\n  const saveHabit = useApp((s) => s.saveHabit);\n  const logHabit = useApp((s) => s.logHabit);\n  const tz = useApp((s) => s.profile?.timezone ?? 'Europe/Berlin');\n  const now = useNow(300_000);\n  const today = dateKey(now, tz);\n\n  return (\n    \u003cScreen>\n      \u003cAppText variant=\"title\">{t('habits.title')}\u003c/AppText>\n      {HABITS.map((meta) => {\n        const h = habits.find((x) => x.key === meta.key);\n        if (!h) return null;\n        const status = logs.find((l) => l.habitKey === meta.key && l.date === today)?.status;\n        return (\n          \u003cCard key={meta.key}>\n            \u003cPressable accessibilityRole=\"button\" accessibilityLabel={`${meta.title} Details`} onPress={() => router.push(`/habit/${meta.key}`)} style={{ flexDirection: 'row', alignItems: 'center', gap: spacing(3) }}>\n              \u003cView style={{ flex: 1 }}>\n                \u003cAppText variant=\"h3\">{meta.title}\u003c/AppText>\n                \u003cAppText variant=\"caption\" muted>{meta.short}\u003c/AppText>\n              \u003c/View>\n              \u003cSwitch\n                accessibilityLabel={`${meta.title} ${t('habits.enabled')}`}\n                value={h.enabled}\n                onValueChange={(v) => saveHabit({ ...h, enabled: v, reminderEnabled: v ? h.reminderEnabled || meta.defaultReminder : false })}\n                trackColor={{ true: colors.accent, false: colors.surface2 }}\n              />\n            \u003c/Pressable>\n            {h.enabled && (\n              \u003cView style={{ flexDirection: 'row', gap: spacing(2), marginTop: spacing(3) }}>\n                \u003cPressable\n                  accessibilityRole=\"button\"\n                  accessibilityState={{ selected: status === 'done' }}\n                  onPress={() => logHabit(meta.key, today, status === 'done' ? null : 'done')}\n                  style={{ flex: 1, minHeight: 44, borderRadius: 12, alignItems: 'center', justifyContent: 'center', backgroundColor: status === 'done' ? colors.good : colors.surface2 }}\n                >\n                  \u003cAppText variant=\"caption\" color={status === 'done' ? colors.onAccent : colors.text}>{t('habits.done')}\u003c/AppText>\n                \u003c/Pressable>\n                \u003cPressable\n                  accessibilityRole=\"button\"\n                  accessibilityState={{ selected: status === 'skipped' }}\n                  onPress={() => logHabit(meta.key, today, status === 'skipped' ? null : 'skipped')}\n                  style={{ flex: 1, minHeight: 44, borderRadius: 12, alignItems: 'center', justifyContent: 'center', backgroundColor: status === 'skipped' ? colors.warn : colors.surface2 }}\n                >\n                  \u003cAppText variant=\"caption\" color={status === 'skipped' ? colors.onAccent : colors.text}>{t('habits.skipped')}\u003c/AppText>\n                \u003c/Pressable>\n              \u003c/View>\n            )}\n          \u003c/Card>\n        );\n      })}\n    \u003c/Screen>\n  );\n}\n"},{"path":"app/(tabs)/index.tsx","content":"import { useRouter } from 'expo-router';\nimport React, { useEffect } from 'react';\nimport { ScrollView, View } from 'react-native';\nimport { phaseAt } from '@/engine/dayPlan';\nimport { computeDebt } from '@/engine/sleepDebt';\nimport { Minus, TrendingDown, TrendingUp } from 'lucide-react-native';\nimport { debtText, greeting, levelColorKey, phaseSentence, relativeIn } from '@/lib/format';\nimport { t } from '@/i18n';\nimport { cacheSummary } from '@/services/summaryCache';\nimport { dataStore, useApp } from '@/state/app';\nimport { useDayPlan, useTips } from '@/state/hooks';\nimport { DebtGauge } from '@/ui/components/DebtGauge';\nimport { EnergyCurve } from '@/ui/components/EnergyCurve';\nimport { AppText, Button, Card, Notice, Screen, SectionTitle } from '@/ui/components/primitives';\nimport { addDaysToKey, dateKey, formatClock, formatDuration, hourOfDay } from '@/engine/time';\nimport { spacing, useTheme } from '@/ui/theme';\n\nexport default function TodayScreen() {\n  const router = useRouter();\n  const { colors } = useTheme();\n  const profile = useApp((s) => s.profile);\n  const sessions = useApp((s) => s.sessions);\n  const syncing = useApp((s) => s.syncing);\n  const syncNow = useApp((s) => s.syncNow);\n  const settings = useApp((s) => s.settings);\n  const setSetting = useApp((s) => s.setSetting);\n  const { plan, now } = useDayPlan();\n  const tips = useTips(plan);\n  const tz = profile?.timezone ?? 'Europe/Berlin';\n\n  // Cache today's result so widgets and exports can read it without recomputing.\n  useEffect(() => {\n    if (plan && profile) cacheSummary(dataStore, plan, sessions, profile, plan.now).catch(() => undefined);\n    // eslint-disable-next-line react-hooks/exhaustive-deps\n  }, [plan?.date, plan?.debt.debtMinutes]);\n\n  // Remember which tips were shown today so none repeats on more than two days in a row.\n  useEffect(() => {\n    if (!plan || tips.length === 0) return;\n    const today = dateKey(now, tz);\n    const ids = tips.map((x) => x.id);\n    const cur = settings.tipHistory[today];\n    if (!cur || cur.join() !== ids.join()) {\n      const pruned = Object.fromEntries(Object.entries(settings.tipHistory).filter(([k]) => k >= dateKey(now - 10 * 86_400_000, tz)));\n      setSetting('tipHistory', { ...pruned, [today]: ids }).catch(() => undefined);\n    }\n    // eslint-disable-next-line react-hooks/exhaustive-deps\n  }, [plan?.date, tips.map((x) => x.id).join()]);\n\n  if (!profile || !plan) return \u003cScreen>\u003cAppText>{t('common.loading')}\u003c/AppText>\u003c/Screen>;\n\n  const phase = phaseAt(plan, now);\n  const lastNight = [...sessions].filter((s) => !s.isNap && s.endAt \u003c= now).sort((a, b) => b.endAt - a.endAt)[0];\n  const yesterday = computeDebt(sessions, plan.needMinutes, tz, plan.now, {\n    refDate: addDaysToKey(plan.date, -1),\n    shiftMode: profile.workSchedule.shiftMode,\n  });\n  const trend = plan.debt.debtMinutes - yesterday.debtMinutes;\n  const trendKey = Math.abs(trend) \u003c 5 ? 'today.trendFlat' : trend > 0 ? 'today.trendUp' : 'today.trendDown';\n  const TrendIcon = Math.abs(trend) \u003c 5 ? Minus : trend > 0 ? TrendingUp : TrendingDown;\n  const delta = plan.forecast.reductionMinutes;\n  const forecastKey = delta >= 0 ? 'debt.forecast' : 'debt.forecastUp';\n\n  return (\n    \u003cScreen onRefresh={() => syncNow()} refreshing={syncing}>\n      \u003cView>\n        \u003cAppText variant=\"title\">{greeting(hourOfDay(now, tz), profile.name)}\u003c/AppText>\n        \u003cAppText muted>{phaseSentence(plan, phase, tz)}\u003c/AppText>\n      \u003c/View>\n\n      {!plan.hasWakeData && \u003cNotice>{t('today.estimatedWake')}\u003c/Notice>}\n      {plan.phase.adapting && \u003cNotice tone=\"warn\">{t('today.clockAdapting', { days: plan.phase.adaptDaysLeft })}\u003c/Notice>}\n\n      \u003cCard style={{ paddingHorizontal: spacing(2) }}>\n        \u003cView style={{ flexDirection: 'row', justifyContent: 'space-between', paddingHorizontal: spacing(2) }}>\n          \u003cAppText variant=\"h3\">{t('today.energyNow')}\u003c/AppText>\n          \u003cAppText variant=\"numberSmall\" color={colors.accent}>\n            {now >= plan.wakeAt && now \u003c= plan.bedtime.bedtime ? Math.round(plan.currentEnergy) : '–'}\n          \u003c/AppText>\n        \u003c/View>\n        \u003cEnergyCurve plan={plan} now={now} tz={tz} height={260} />\n      \u003c/Card>\n\n      \u003cCard onPress={() => router.push('/debt')} accessibilityLabel=\"Schlafschuld Details öffnen\">\n        \u003cAppText variant=\"h3\">{t('today.debtTitle')}\u003c/AppText>\n        \u003cDebtGauge\n          minutes={plan.debt.debtMinutes}\n          level={plan.debt.level}\n          insufficient={plan.debt.insufficientData}\n          range={plan.debt.range}\n        />\n        \u003cAppText variant=\"body\" color={colors[levelColorKey(plan.debt.level)]} style={{ textAlign: 'center' }}>\n          {plan.debt.insufficientData ? t('empty.generic') : debtText(plan.debt.level)}\n        \u003c/AppText>\n        {!plan.debt.insufficientData && (\n          \u003cView style={{ flexDirection: 'row', justifyContent: 'center', alignItems: 'center', gap: 6, marginTop: 6 }}>\n            \u003cTrendIcon size={16} color={colors.textMuted} />\n            \u003cAppText variant=\"caption\" muted>\n              {Math.abs(trend) \u003c 5 ? t(trendKey) : `${formatDuration(Math.abs(trend))} ${t(trendKey)}`}\n            \u003c/AppText>\n          \u003c/View>\n        )}\n        {!plan.debt.insufficientData && (\n          \u003cAppText variant=\"caption\" muted style={{ textAlign: 'center', marginTop: 6 }}>\n            {t(forecastKey, { time: formatClock(plan.bedtime.bedtime, tz), debt: formatDuration(plan.forecast.debtMinutes) })}\n          \u003c/AppText>\n        )}\n        \u003cAppText variant=\"caption\" muted style={{ textAlign: 'center', marginTop: 4 }}>\n          {t('debt.goal')}\n        \u003c/AppText>\n      \u003c/Card>\n\n      {plan.nextEvent && (\n        \u003cCard>\n          \u003cAppText variant=\"caption\" muted>\n            {t('today.next')}\n          \u003c/AppText>\n          \u003cAppText variant=\"h2\">\n            {relativeIn(plan.nextEvent.at - now)}: {t(`windows.${plan.nextEvent.kind}`)}\n          \u003c/AppText>\n        \u003c/Card>\n      )}\n\n      {plan.bedtime.hint === 'too_early' && \u003cNotice tone=\"warn\">{t('schedule.tooEarly')}\u003c/Notice>}\n\n      \u003cSectionTitle>{t('today.tips')}\u003c/SectionTitle>\n      \u003cScrollView horizontal showsHorizontalScrollIndicator={false} contentContainerStyle={{ gap: spacing(3) }}>\n        {tips.map((tip) => (\n          \u003cCard\n            key={tip.id}\n            style={{ width: 270, minHeight: 150 }}\n            onPress={tip.librarySlug ? () => router.push(`/library/${tip.librarySlug}`) : tip.ctaHabitKey ? () => router.push(`/habit/${tip.ctaHabitKey}`) : undefined}\n          >\n            \u003cAppText variant=\"h3\">{tip.title}\u003c/AppText>\n            \u003cAppText variant=\"caption\" muted style={{ marginTop: 6 }}>\n              {tip.body}\n            \u003c/AppText>\n          \u003c/Card>\n        ))}\n      \u003c/ScrollView>\n\n      \u003cSectionTitle>{t('today.lastNight')}\u003c/SectionTitle>\n      {lastNight ? (\n        \u003cCard>\n          \u003cAppText variant=\"numberSmall\">\n            {formatDuration((lastNight.asleepMinutes ?? (lastNight.endAt - lastNight.startAt) / 60_000))}\n          \u003c/AppText>\n          \u003cAppText muted>\n            {formatClock(lastNight.startAt, tz)} – {formatClock(lastNight.endAt, tz)} · {lastNight.sourceDetail ?? lastNight.source}\n          \u003c/AppText>\n          \u003cButton\n            label={t('common.edit')}\n            variant=\"secondary\"\n            style={{ marginTop: spacing(3) }}\n            onPress={() => router.push(`/night/${lastNight.id}`)}\n          />\n        \u003c/Card>\n      ) : (\n        \u003cCard>\n          \u003cAppText muted>{t('today.noNights')}\u003c/AppText>\n          \u003cButton label={t('today.addNight')} style={{ marginTop: spacing(3) }} onPress={() => router.push('/night/new')} />\n        \u003c/Card>\n      )}\n    \u003c/Screen>\n  );\n}\n"},{"path":"app/(tabs)/more.tsx","content":"import { useRouter } from 'expo-router';\nimport React from 'react';\nimport { ENGINE_VERSION } from '@/engine/constants';\nimport { t } from '@/i18n';\nimport { AppText, Card, Row, Screen, SectionTitle } from '@/ui/components/primitives';\nimport Constants from 'expo-constants';\n\nexport default function MoreScreen() {\n  const router = useRouter();\n  return (\n    \u003cScreen>\n      \u003cAppText variant=\"title\">{t('more.title')}\u003c/AppText>\n      \u003cSectionTitle>{t('more.library')}\u003c/SectionTitle>\n      \u003cCard style={{ paddingVertical: 4 }}>\n        \u003cRow title={t('more.library')} subtitle=\"Kurze Artikel zu Schlaf und Energie\" onPress={() => router.push('/library')} last />\n      \u003c/Card>\n      \u003cSectionTitle>{t('more.tools')}\u003c/SectionTitle>\n      \u003cCard style={{ paddingVertical: 4 }}>\n        \u003cRow title={t('more.sounds')} subtitle=\"Regen, Rauschen, Wellen, Ventilator\" onPress={() => router.push('/tools/sounds')} />\n        \u003cRow title={t('more.breathing')} subtitle=\"Animierter Atemkreis\" onPress={() => router.push('/tools/breathing')} />\n        \u003cRow title={t('more.cantSleep')} subtitle=\"Was jetzt hilft\" onPress={() => router.push('/tools/cant-sleep')} last />\n      \u003c/Card>\n      \u003cSectionTitle>{t('more.settings')}\u003c/SectionTitle>\n      \u003cCard style={{ paddingVertical: 4 }}>\n        \u003cRow title={t('more.settings')} subtitle=\"Profil, Erinnerungen, Daten\" onPress={() => router.push('/settings')} />\n        \u003cRow title={t('settings.about')} onPress={() => router.push('/settings/about')} last />\n      \u003c/Card>\n      \u003cAppText variant=\"caption\" muted style={{ textAlign: 'center' }}>\n        Tagwerk {Constants.expoConfig?.version ?? '1.0.0'} · Engine {ENGINE_VERSION}\n      \u003c/AppText>\n    \u003c/Screen>\n  );\n}\n"},{"path":"app/(tabs)/schedule.tsx","content":"import React, { useEffect, useMemo, useRef, useState } from 'react';\nimport { Alert, Platform, ScrollView, View, type ScrollViewInstance } from 'react-native';\nimport { useSafeAreaInsets } from 'react-native-safe-area-context';\nimport { formatClock, formatDuration } from '@/engine/time';\nimport type { DayPlan } from '@/engine/dayPlan';\nimport { t } from '@/i18n';\nimport { exportWindowsToCalendar, hasCalendarAccess, loadEvents } from '@/services/calendar';\nimport { findConflicts, type CalendarItem } from '@/services/calendarLogic';\nimport { useApp } from '@/state/app';\nimport { useDayPlan, useTomorrowPlan } from '@/state/hooks';\nimport { TimelineRow } from '@/ui/components/TimelineRow';\nimport { AppText, Button, Card, Notice, Segmented } from '@/ui/components/primitives';\nimport { spacing, useTheme } from '@/ui/theme';\nimport type { DayWindow } from '@/engine/types';\n\ntype Which = 'today' | 'tomorrow';\n\nexport default function ScheduleScreen() {\n  const { colors } = useTheme();\n  const insets = useSafeAreaInsets();\n  const profile = useApp((s) => s.profile);\n  const optIn = useApp((s) => s.settings.calendarOptIn);\n  const { plan: today, now } = useDayPlan();\n  const tomorrowPlan = useTomorrowPlan();\n  const [which, setWhich] = useState\u003cWhich>('today');\n  const [events, setEvents] = useState\u003cCalendarItem[]>([]);\n  const scroller = useRef\u003cScrollViewInstance>(null);\n  const nowY = useRef\u003cnumber | null>(null);\n  const tz = profile?.timezone ?? 'Europe/Berlin';\n  const plan: DayPlan | null = which === 'today' ? today : tomorrowPlan;\n\n  useEffect(() => {\n    let live = true;\n    (async () => {\n      if (!plan || !optIn || Platform.OS === 'web' || !(await hasCalendarAccess())) return setEvents([]);\n      const ev = await loadEvents(plan.wakeAt, plan.bedtime.bedtime);\n      if (live) setEvents(ev);\n    })();\n    return () => {\n      live = false;\n    };\n  }, [plan, optIn]);\n\n  const conflicts = useMemo(() => (plan ? findConflicts(events, plan.windows, tz) : []), [plan, events, tz]);\n\n  const items = useMemo(() => {\n    if (!plan) return [];\n    const wins = plan.windows.map((w) => ({ type: 'window' as const, at: w.start, w }));\n    const evs = events.filter((e) => !e.allDay).map((e) => ({ type: 'event' as const, at: e.start, e }));\n    return [...wins, ...evs].sort((a, b) => a.at - b.at);\n  }, [plan, events]);\n\n  useEffect(() => {\n    if (which === 'today' && nowY.current != null) scroller.current?.scrollTo({ y: Math.max(0, nowY.current - 120), animated: true });\n  }, [which, plan?.date, items.length]);\n\n  if (!profile || !plan) return \u003cView style={{ flex: 1, backgroundColor: colors.bg }} />;\n\n  const currentIdx = (() => {\n    if (which !== 'today') return -1;\n    let idx = -1;\n    items.forEach((it, i) => {\n      if (it.type === 'window' && it.w.start \u003c= now && (it.w.point ? it.w.start + 30 * 60_000 : it.w.end) > now) idx = idx === -1 ? i : idx;\n    });\n    return idx;\n  })();\n\n  const doExport = async () => {\n    if (Platform.OS === 'web') return Alert.alert(t('schedule.calendar'), 'Im Browser nicht verfügbar.');\n    const n = await exportWindowsToCalendar(plan);\n    Alert.alert(t('schedule.calendar'), n > 0 ? `${n} Einträge im Kalender „Tagwerk“ angelegt.` : 'Keine neuen Einträge angelegt (Zugriff verweigert oder schon vorhanden).');\n  };\n\n  const conflictFor = (w: DayWindow) => conflicts.find((c) => c.window === w)?.message ?? null;\n\n  return (\n    \u003cScrollView\n      ref={scroller}\n      style={{ flex: 1, backgroundColor: colors.bg }}\n      contentContainerStyle={{ padding: spacing(4), paddingTop: insets.top + spacing(3), gap: spacing(3), paddingBottom: spacing(10) }}\n    >\n      \u003cAppText variant=\"title\">{t('schedule.title')}\u003c/AppText>\n      \u003cSegmented\u003cWhich>\n        value={which}\n        onChange={setWhich}\n        options={[\n          { value: 'today', label: t('schedule.today') },\n          { value: 'tomorrow', label: t('schedule.tomorrow') },\n        ]}\n      />\n      {which === 'tomorrow' && \u003cNotice>{t('schedule.tomorrowNote')}\u003c/Notice>}\n      {plan.bedtime.hint === 'too_early' && \u003cNotice tone=\"warn\">{t('schedule.tooEarly')}\u003c/Notice>}\n      \u003cAppText variant=\"caption\" muted>\n        {formatClock(plan.wakeAt, tz)} → {formatClock(plan.bedtime.bedtime, tz)} · {t('windows.bedtime')} {formatClock(plan.bedtime.bedtime, tz)} ({formatDuration(plan.needMinutes)} Bedarf)\n      \u003c/AppText>\n\n      {items.map((it, i) =>\n        it.type === 'window' ? (\n          \u003cView\n            key={`${it.w.kind}-${it.w.start}`}\n            onLayout={(e) => {\n              if (i === currentIdx) {\n                nowY.current = e.nativeEvent.layout.y;\n                scroller.current?.scrollTo({ y: Math.max(0, e.nativeEvent.layout.y - 120), animated: false });\n              }\n            }}\n          >\n            \u003cTimelineRow window={it.w} tz={tz} isNow={i === currentIdx} isPast={which === 'today' && (it.w.point ? it.w.start : it.w.end) \u003c now && i !== currentIdx} extra={conflictFor(it.w)} />\n          \u003c/View>\n        ) : (\n          \u003cCard key={`ev-${it.e.id}-${it.e.start}`} style={{ backgroundColor: colors.surface2, opacity: 0.8 }}>\n            \u003cAppText variant=\"caption\" muted>\n              {formatClock(it.e.start, tz)}–{formatClock(it.e.end, tz)} · Kalender\n            \u003c/AppText>\n            \u003cAppText variant=\"h3\">{it.e.title}\u003c/AppText>\n          \u003c/Card>\n        ),\n      )}\n\n      \u003cButton label={t('schedule.calendar')} variant=\"secondary\" onPress={doExport} />\n    \u003c/ScrollView>\n  );\n}\n"},{"path":"app/(tabs)/sleep.tsx","content":"import { useRouter } from 'expo-router';\nimport React, { useMemo, useState } from 'react';\nimport { View } from 'react-native';\nimport { learnChronotype } from '@/engine/chronotype';\nimport { computeDebt } from '@/engine/sleepDebt';\nimport { buildSleepDays } from '@/engine/sleepDetection';\nimport { estimateSleepNeed } from '@/engine/sleepNeed';\nimport { resolveNeed } from '@/engine/dayPlan';\nimport { addDaysToKey, dateKey, formatClock, formatDuration } from '@/engine/time';\nimport { t } from '@/i18n';\nimport { useApp } from '@/state/app';\nimport { useNow } from '@/state/hooks';\nimport { DebtLineChart, RegularityChart, SleepBarChart } from '@/ui/components/Charts';\nimport { AppText, Button, Card, Row, Screen, Segmented, SectionTitle } from '@/ui/components/primitives';\nimport { radius, spacing, useTheme } from '@/ui/theme';\n\ntype Range = 7 | 14 | 30 | 90;\n\nexport default function SleepScreen() {\n  const router = useRouter();\n  const { colors } = useTheme();\n  const profile = useApp((s) => s.profile);\n  const sessions = useApp((s) => s.sessions);\n  const [range, setRange] = useState\u003cRange>(14);\n  const tz = profile?.timezone ?? 'Europe/Berlin';\n  const shift = profile?.workSchedule.shiftMode ?? false;\n  const now = useNow(300_000);\n\n  const model = useMemo(() => {\n    if (!profile) return null;\n    const need = resolveNeed(profile, now);\n    const days = buildSleepDays(sessions, tz, shift);\n    const today = dateKey(now, tz);\n    const dates = Array.from({ length: range }, (_, i) => addDaysToKey(today, -(range - 1 - i)));\n    const nights = dates\n      .map((d) => ({ date: d, minutes: days.get(d)?.mainMinutes ?? 0 }))\n      .filter((n) => n.minutes > 0);\n    const debt = dates\n      .filter((d) => days.has(d))\n      .map((d) => ({ date: d, minutes: computeDebt(sessions, need, tz, now, { refDate: d, shiftMode: shift }).debtMinutes }));\n    const rows = dates.map((d) => days.get(d)).filter((d): d is NonNullable\u003ctypeof d> => !!d && d.main.length > 0);\n    const needInfo = estimateSleepNeed(sessions, profile, now);\n    const learned = learnChronotype(sessions, profile, now, profile.chronotypeUpdatedAt ?? undefined);\n    const list = [...days.values()].filter((d) => d.main.length > 0).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 14);\n    return { need, nights, debt, rows, needInfo, learned, list };\n  }, [profile, sessions, range, tz, shift, now]);\n\n  if (!profile || !model) return \u003cScreen>\u003cAppText>{t('common.loading')}\u003c/AppText>\u003c/Screen>;\n  const { need, nights, debt, rows, needInfo, learned, list } = model;\n  const score = learned?.score ?? profile.chronotypeScore;\n  const markerLeft = `${Math.round(((score + 1) / 2) * 100)}%` as `${number}%`;\n\n  const needText =\n    needInfo.basis === 'manual' ? t('sleep.needManual') : needInfo.basis === 'estimated' ? t('sleep.needEstimated') : t('sleep.needDefault');\n\n  return (\n    \u003cScreen>\n      \u003cAppText variant=\"title\">{t('tabs.sleep')}\u003c/AppText>\n      \u003cSegmented\u003cRange>\n        value={range}\n        onChange={setRange}\n        options={[\n          { value: 7, label: t('sleep.range7') },\n          { value: 14, label: t('sleep.range14') },\n          { value: 30, label: t('sleep.range30') },\n          { value: 90, label: t('sleep.range90') },\n        ]}\n      />\n\n      {nights.length === 0 ? (\n        \u003cCard>\n          \u003cAppText muted>{t('sleep.empty')}\u003c/AppText>\n          \u003cButton label={t('today.addNight')} style={{ marginTop: spacing(3) }} onPress={() => router.push('/night/new')} />\n        \u003c/Card>\n      ) : (\n        \u003c>\n          \u003cCard>\n            \u003cAppText variant=\"h3\">{t('sleep.duration')}\u003c/AppText>\n            \u003cSleepBarChart nights={nights} need={need} />\n          \u003c/Card>\n          \u003cCard>\n            \u003cAppText variant=\"h3\">{t('sleep.debtTrend')}\u003c/AppText>\n            \u003cDebtLineChart points={debt} />\n          \u003c/Card>\n          \u003cCard>\n            \u003cAppText variant=\"h3\">{t('sleep.regularity')}\u003c/AppText>\n            \u003cRegularityChart days={rows} tz={tz} />\n          \u003c/Card>\n        \u003c/>\n      )}\n\n      \u003cCard>\n        \u003cAppText variant=\"h3\">{t('sleep.needTitle')}\u003c/AppText>\n        \u003cAppText variant=\"number\">{formatDuration(need)}\u003c/AppText>\n        \u003cAppText variant=\"caption\" muted>\n          {needInfo.nights > 0 ? t('sleep.needBasedOn', { n: needInfo.nights }) + '. ' : ''}\n          {needText}\n        \u003c/AppText>\n        \u003cButton label={t('sleep.needSetManual')} variant=\"secondary\" style={{ marginTop: spacing(3) }} onPress={() => router.push('/settings/sleep-need')} />\n      \u003c/Card>\n\n      \u003cCard>\n        \u003cAppText variant=\"h3\">{t('sleep.chronoTitle')}\u003c/AppText>\n        \u003cView style={{ marginTop: spacing(3), height: 12, borderRadius: 6, backgroundColor: colors.surface2, justifyContent: 'center' }}>\n          \u003cView style={{ position: 'absolute', left: markerLeft, marginLeft: -9, width: 18, height: 18, borderRadius: 9, backgroundColor: colors.accent, borderWidth: 3, borderColor: colors.bg }} />\n        \u003c/View>\n        \u003cView style={{ flexDirection: 'row', justifyContent: 'space-between', marginTop: 6 }}>\n          \u003cAppText variant=\"caption\" muted>{t('sleep.early')}\u003c/AppText>\n          \u003cAppText variant=\"caption\" muted>{t('sleep.intermediate')}\u003c/AppText>\n          \u003cAppText variant=\"caption\" muted>{t('sleep.late')}\u003c/AppText>\n        \u003c/View>\n        \u003cAppText variant=\"caption\" muted style={{ marginTop: spacing(2) }}>\n          {t('sleep.socialJetlag')}: {learned ? formatDuration(learned.socialJetlagHours * 60) : '–'}\n        \u003c/AppText>\n      \u003c/Card>\n\n      \u003cSectionTitle>{t('sleep.nights')}\u003c/SectionTitle>\n      \u003cCard style={{ paddingVertical: spacing(1) }}>\n        {list.length === 0 ? (\n          \u003cAppText muted style={{ paddingVertical: spacing(3) }}>{t('sleep.empty')}\u003c/AppText>\n        ) : (\n          list.map((d, i) => (\n            \u003cRow\n              key={d.date}\n              title={`${d.date} · ${formatDuration(d.mainMinutes)}`}\n              subtitle={`${formatClock(d.bedAt as number, tz)} – ${formatClock(d.wakeAt as number, tz)}${d.napMinutes ? ` · Nap ${formatDuration(d.napMinutes)}` : ''}`}\n              onPress={() => router.push(`/night/${d.main[0].id}`)}\n              last={i === list.length - 1}\n            />\n          ))\n        )}\n      \u003c/Card>\n      \u003cButton label={t('today.addNight')} variant=\"secondary\" onPress={() => router.push('/night/new')} />\n      \u003cView style={{ height: radius.small }} />\n    \u003c/Screen>\n  );\n}\n"},{"path":"app/_layout.tsx","content":"import {\n  Manrope_400Regular,\n  Manrope_500Medium,\n  Manrope_600SemiBold,\n  Manrope_700Bold,\n  useFonts,\n} from '@expo-google-fonts/manrope';\nimport { Stack, useRouter, useSegments } from 'expo-router';\nimport { StatusBar } from 'expo-status-bar';\nimport React, { useEffect, useMemo, useRef } from 'react';\nimport { AppState, useColorScheme, View } from 'react-native';\nimport { SafeAreaProvider } from 'react-native-safe-area-context';\nimport { registerBackgroundSync } from '@/services/background';\nimport { useApp } from '@/state/app';\nimport { useReminderScheduling } from '@/state/useReminders';\nimport { darkColors, lightColors, resolveMode, ThemeContext } from '@/ui/theme';\n\nexport default function RootLayout() {\n  const [fontsLoaded, fontError] = useFonts({ Manrope_400Regular, Manrope_500Medium, Manrope_600SemiBold, Manrope_700Bold });\n  const ready = useApp((s) => s.ready);\n  const init = useApp((s) => s.init);\n  const profile = useApp((s) => s.profile);\n  const pref = useApp((s) => s.settings.theme);\n  const system = useColorScheme();\n  const segments = useSegments();\n  const router = useRouter();\n\n  useEffect(() => {\n    init();\n  }, [init]);\n\n  const mode = resolveMode(pref, system);\n  const theme = useMemo(() => ({ mode, colors: mode === 'dark' ? darkColors : lightColors }), [mode]);\n\n  const onboarded = !!profile?.onboardingCompletedAt;\n  const inOnboarding = segments[0] === 'onboarding';\n  useEffect(() => {\n    if (!ready) return;\n    if (!onboarded && !inOnboarding) router.replace('/onboarding');\n    if (onboarded && inOnboarding) router.replace('/');\n  }, [ready, onboarded, inOnboarding, router]);\n\n  // Sync on returning to the foreground.\n  const syncNow = useApp((s) => s.syncNow);\n  const lastActive = useRef(0);\n  useEffect(() => {\n    if (!ready || !onboarded) return;\n    syncNow().catch(() => undefined);\n    const sub = AppState.addEventListener('change', (st) => {\n      if (st === 'active' && Date.now() - lastActive.current > 60_000) syncNow().catch(() => undefined);\n      if (st !== 'active') lastActive.current = Date.now();\n    });\n    return () => sub.remove();\n  }, [ready, onboarded, syncNow]);\n\n  useReminderScheduling(ready && onboarded);\n  useEffect(() => {\n    if (ready && onboarded) registerBackgroundSync();\n  }, [ready, onboarded]);\n\n  if (!(fontsLoaded || fontError) || !ready) {\n    return \u003cView style={{ flex: 1, backgroundColor: darkColors.bg }} />;\n  }\n\n  return (\n    \u003cThemeContext.Provider value={theme}>\n      \u003cSafeAreaProvider>\n        \u003cStatusBar style={mode === 'dark' ? 'light' : 'dark'} />\n        \u003cStack\n          screenOptions={{\n            headerStyle: { backgroundColor: theme.colors.bg },\n            headerTintColor: theme.colors.text,\n            headerTitleStyle: { fontFamily: 'Manrope_600SemiBold' },\n            contentStyle: { backgroundColor: theme.colors.bg },\n            headerShadowVisible: false,\n          }}\n        >\n          \u003cStack.Screen name=\"(tabs)\" options={{ headerShown: false }} />\n          \u003cStack.Screen name=\"onboarding/index\" options={{ headerShown: false, gestureEnabled: false }} />\n        \u003c/Stack>\n      \u003c/SafeAreaProvider>\n    \u003c/ThemeContext.Provider>\n  );\n}\n"},{"path":"app/debt.tsx","content":"import { Stack } from 'expo-router';\nimport React from 'react';\nimport { View } from 'react-native';\nimport { formatClock, formatDuration } from '@/engine/time';\nimport { t } from '@/i18n';\nimport { debtText } from '@/lib/format';\nimport { useApp } from '@/state/app';\nimport { useDayPlan } from '@/state/hooks';\nimport { DebtGauge } from '@/ui/components/DebtGauge';\nimport { AppText, Card, Notice, Screen } from '@/ui/components/primitives';\nimport { spacing, useTheme } from '@/ui/theme';\n\nexport default function DebtDetail() {\n  const { colors } = useTheme();\n  const { plan } = useDayPlan();\n  const tz = useApp((s) => s.profile?.timezone ?? 'Europe/Berlin');\n  if (!plan) return \u003cScreen>\u003cAppText>{t('common.loading')}\u003c/AppText>\u003c/Screen>;\n  const max = Math.max(plan.needMinutes * 1.2, ...plan.debt.nights.map((n) => n.sleptMinutes));\n  return (\n    \u003c>\n      \u003cStack.Screen options={{ title: t('today.debtTitle') }} />\n      \u003cScreen>\n        \u003cCard>\n          \u003cDebtGauge minutes={plan.debt.debtMinutes} level={plan.debt.level} insufficient={plan.debt.insufficientData} range={plan.debt.range} />\n          \u003cAppText style={{ textAlign: 'center' }}>{debtText(plan.debt.level)}\u003c/AppText>\n          \u003cAppText variant=\"caption\" muted style={{ textAlign: 'center', marginTop: 6 }}>\n            {t('debt.forecast', { time: formatClock(plan.bedtime.bedtime, tz), debt: formatDuration(plan.forecast.debtMinutes) })}\n          \u003c/AppText>\n        \u003c/Card>\n        \u003cNotice>{t('debt.detailExplain')}\u003c/Notice>\n        \u003cAppText variant=\"h2\">{t('debt.detailTitle')}\u003c/AppText>\n        \u003cCard style={{ gap: spacing(3) }}>\n          {plan.debt.nights.map((n) => (\n            \u003cView key={n.date} accessible accessibilityLabel={`${n.date}: ${formatDuration(n.sleptMinutes)}, Gewicht ${n.weight.toFixed(2)}, Beitrag ${formatDuration(n.contributionMinutes)}`}>\n              \u003cView style={{ flexDirection: 'row', justifyContent: 'space-between' }}>\n                \u003cAppText variant=\"caption\">{n.date}{n.estimated ? ` · ${t('debt.estimated')}` : ''}\u003c/AppText>\n                \u003cAppText variant=\"caption\" muted>\n                  {formatDuration(n.sleptMinutes)} · ×{n.weight.toFixed(2)}\n                \u003c/AppText>\n              \u003c/View>\n              \u003cView style={{ height: 8, borderRadius: 4, backgroundColor: colors.surface2, marginTop: 4, overflow: 'hidden' }}>\n                \u003cView style={{ width: `${(n.sleptMinutes / max) * 100}%`, height: 8, backgroundColor: n.estimated ? colors.groggy : n.deltaMinutes > 0 ? colors.bad : colors.good, opacity: 0.4 + n.weight * 0.6 }} />\n              \u003c/View>\n            \u003c/View>\n          ))}\n        \u003c/Card>\n      \u003c/Screen>\n    \u003c/>\n  );\n}\n"},{"path":"app/habit/[key].tsx","content":"import { Stack, useLocalSearchParams, useRouter } from 'expo-router';\nimport React from 'react';\nimport { Switch, View } from 'react-native';\nimport { HABIT_BY_KEY } from '@/content/habits';\nimport type { HabitKey } from '@/data/types';\nimport { dateKey } from '@/engine/time';\nimport { t } from '@/i18n';\nimport { useApp } from '@/state/app';\nimport { useNow } from '@/state/hooks';\nimport { Heatmap } from '@/ui/components/Heatmap';\nimport { AppText, Button, Card, Row, Screen } from '@/ui/components/primitives';\nimport { spacing, useTheme } from '@/ui/theme';\n\nconst OFFSETS = [-60, -30, -15, 0, 15, 30];\n\nexport default function HabitDetail() {\n  const { key } = useLocalSearchParams\u003c{ key: string }>();\n  const router = useRouter();\n  const { colors } = useTheme();\n  const habits = useApp((s) => s.habits);\n  const logs = useApp((s) => s.habitLogs);\n  const saveHabit = useApp((s) => s.saveHabit);\n  const logHabit = useApp((s) => s.logHabit);\n  const tz = useApp((s) => s.profile?.timezone ?? 'Europe/Berlin');\n  const now = useNow(300_000);\n  const meta = HABIT_BY_KEY[key as HabitKey];\n  const habit = habits.find((h) => h.key === key);\n  if (!meta || !habit) return \u003cScreen>\u003cAppText muted>{t('empty.generic')}\u003c/AppText>\u003c/Screen>;\n  const today = dateKey(now, tz);\n  const mine = logs.filter((l) => l.habitKey === meta.key);\n  const status = mine.find((l) => l.date === today)?.status;\n\n  return (\n    \u003c>\n      \u003cStack.Screen options={{ title: meta.title }} />\n      \u003cScreen>\n        \u003cCard>\n          \u003cAppText variant=\"h3\">{t('habits.why')}\u003c/AppText>\n          \u003cAppText style={{ marginTop: 6 }}>{meta.why}\u003c/AppText>\n          {meta.librarySlug && \u003cButton label=\"Mehr dazu im Wissen\" variant=\"ghost\" onPress={() => router.push(`/library/${meta.librarySlug}`)} />}\n        \u003c/Card>\n        \u003cCard style={{ paddingVertical: 4 }}>\n          \u003cRow title={t('habits.enabled')} right={\u003cSwitch accessibilityLabel={t('habits.enabled')} value={habit.enabled} onValueChange={(v) => saveHabit({ ...habit, enabled: v })} trackColor={{ true: colors.accent, false: colors.surface2 }} />} />\n          \u003cRow title={t('habits.reminder')} subtitle={meta.notification.body} right={\u003cSwitch accessibilityLabel={t('habits.reminder')} value={habit.reminderEnabled} onValueChange={(v) => saveHabit({ ...habit, enabled: habit.enabled || v, reminderEnabled: v })} trackColor={{ true: colors.accent, false: colors.surface2 }} />} last />\n        \u003c/Card>\n        \u003cCard>\n          \u003cAppText variant=\"h3\">{t('habits.offset')}\u003c/AppText>\n          \u003cView style={{ flexDirection: 'row', flexWrap: 'wrap', gap: spacing(2), marginTop: spacing(2) }}>\n            {OFFSETS.map((o) => (\n              \u003cButton key={o} label={o === 0 ? 'Zum Start' : `${o > 0 ? '+' : ''}${o} min`} variant={habit.reminderOffsetMin === o ? 'primary' : 'secondary'} onPress={() => saveHabit({ ...habit, reminderOffsetMin: o })} />\n            ))}\n          \u003c/View>\n        \u003c/Card>\n        \u003cCard>\n          \u003cAppText variant=\"h3\">{t('habits.today')}\u003c/AppText>\n          \u003cView style={{ flexDirection: 'row', gap: spacing(2), marginTop: spacing(2) }}>\n            \u003cButton style={{ flex: 1 }} label={t('habits.done')} variant={status === 'done' ? 'primary' : 'secondary'} onPress={() => logHabit(meta.key, today, status === 'done' ? null : 'done')} />\n            \u003cButton style={{ flex: 1 }} label={t('habits.skipped')} variant={status === 'skipped' ? 'primary' : 'secondary'} onPress={() => logHabit(meta.key, today, status === 'skipped' ? null : 'skipped')} />\n          \u003c/View>\n        \u003c/Card>\n        \u003cCard>\n          \u003cAppText variant=\"h3\" style={{ marginBottom: spacing(2) }}>{t('habits.history')}\u003c/AppText>\n          \u003cHeatmap logs={mine} today={today} />\n        \u003c/Card>\n      \u003c/Screen>\n    \u003c/>\n  );\n}\n"},{"path":"app/library/[slug].tsx","content":"import { Stack, useLocalSearchParams } from 'expo-router';\nimport React from 'react';\nimport { View } from 'react-native';\nimport { ARTICLE_BY_SLUG, parseBody } from '@/content/library';\nimport { t } from '@/i18n';\nimport { AppText, Card, Screen } from '@/ui/components/primitives';\nimport { spacing, useTheme } from '@/ui/theme';\n\nexport default function ArticleScreen() {\n  const { slug } = useLocalSearchParams\u003c{ slug: string }>();\n  const { colors } = useTheme();\n  const article = ARTICLE_BY_SLUG[slug ?? ''];\n  if (!article) return \u003cScreen>\u003cAppText muted>{t('empty.generic')}\u003c/AppText>\u003c/Screen>;\n  const blocks = parseBody(article.body);\n  return (\n    \u003c>\n      \u003cStack.Screen options={{ title: '' }} />\n      \u003cScreen>\n        \u003cAppText variant=\"title\" accessibilityRole=\"header\">{article.title}\u003c/AppText>\n        \u003cAppText variant=\"caption\" muted>{article.minutes} Min. Lesezeit\u003c/AppText>\n        {blocks.map((b, i) =>\n          b.type === 'h' ? (\n            \u003cAppText key={i} variant=\"h2\" accessibilityRole=\"header\" style={{ marginTop: spacing(2) }}>{b.text}\u003c/AppText>\n          ) : b.type === 'li' ? (\n            \u003cView key={i} style={{ flexDirection: 'row', gap: spacing(2) }}>\n              \u003cAppText color={colors.accent}>•\u003c/AppText>\n              \u003cAppText style={{ flex: 1 }}>{b.text}\u003c/AppText>\n            \u003c/View>\n          ) : (\n            \u003cAppText key={i}>{b.text}\u003c/AppText>\n          ),\n        )}\n        \u003cCard>\n          \u003cAppText variant=\"caption\" muted>{article.sources}\u003c/AppText>\n        \u003c/Card>\n        \u003cAppText variant=\"caption\" muted>{t('disclaimer')}\u003c/AppText>\n      \u003c/Screen>\n    \u003c/>\n  );\n}\n"},{"path":"app/library/index.tsx","content":"import { Stack, useRouter } from 'expo-router';\nimport React from 'react';\nimport { ARTICLES } from '@/content/library';\nimport { t } from '@/i18n';\nimport { AppText, Card, Screen } from '@/ui/components/primitives';\n\nexport default function LibraryIndex() {\n  const router = useRouter();\n  return (\n    \u003c>\n      \u003cStack.Screen options={{ title: t('more.library') }} />\n      \u003cScreen>\n        {ARTICLES.map((a) => (\n          \u003cCard key={a.slug} onPress={() => router.push(`/library/${a.slug}`)} accessibilityLabel={a.title}>\n            \u003cAppText variant=\"h3\">{a.title}\u003c/AppText>\n            \u003cAppText variant=\"caption\" muted style={{ marginTop: 4 }}>\n              {a.teaser} · {a.minutes} Min.\n            \u003c/AppText>\n          \u003c/Card>\n        ))}\n      \u003c/Screen>\n    \u003c/>\n  );\n}\n"},{"path":"app/night/[date].tsx","content":"import { Stack, useLocalSearchParams } from 'expo-router';\nimport React from 'react';\nimport { buildSleepDays } from '@/engine/sleepDetection';\nimport { t } from '@/i18n';\nimport { useApp } from '@/state/app';\nimport { AppText, Screen } from '@/ui/components/primitives';\nimport { NightEditor } from '@/ui/NightEditor';\n\n/** The param is a session id, or a YYYY-MM-DD wake date (resolves to that night's main sleep). */\nexport default function NightScreen() {\n  const { date } = useLocalSearchParams\u003c{ date: string }>();\n  const sessions = useApp((s) => s.sessions);\n  const profile = useApp((s) => s.profile);\n  let session = sessions.find((s) => s.id === date);\n  if (!session && /^\\d{4}-\\d{2}-\\d{2}$/.test(date ?? '') && profile) {\n    session = buildSleepDays(sessions, profile.timezone, profile.workSchedule.shiftMode).get(date)?.main[0];\n  }\n  return (\n    \u003c>\n      \u003cStack.Screen options={{ title: t('night.title') }} />\n      {session ? (\n        \u003cNightEditor key={session.id} session={session} />\n      ) : (\n        \u003cScreen>\n          \u003cAppText muted>{t('sleep.empty')}\u003c/AppText>\n        \u003c/Screen>\n      )}\n    \u003c/>\n  );\n}\n"},{"path":"app/night/new.tsx","content":"import { Stack } from 'expo-router';\nimport React from 'react';\nimport { t } from '@/i18n';\nimport { NightEditor } from '@/ui/NightEditor';\n\nexport default function NewNight() {\n  return (\n    \u003c>\n      \u003cStack.Screen options={{ title: t('night.newTitle') }} />\n      \u003cNightEditor />\n    \u003c/>\n  );\n}\n"},{"path":"app/onboarding/index.tsx","content":"import { useRouter } from 'expo-router';\nimport React, { useMemo, useState } from 'react';\nimport { Platform, ScrollView, Switch, View } from 'react-native';\nimport { useSafeAreaInsets } from 'react-native-safe-area-context';\nimport { demoProfile, generateDemoSessions } from '@/data/demo/generator';\nimport { HABITS } from '@/content/habits';\nimport type { HabitKey } from '@/data/types';\nimport { chronotypeFromAnswers, type ChronotypeAnswers } from '@/engine/chronotype';\nimport { computeDayPlan } from '@/engine/dayPlan';\nimport { dateKey, formatClock, formatDuration } from '@/engine/time';\nimport type { WorkSchedule } from '@/engine/types';\nimport { getHealthProvider } from '@/integrations/health';\nimport { requestNotificationPermission } from '@/services/notifications';\nimport { syncHealth } from '@/services/sync';\nimport { DEFAULT_WORK, dataStore, deviceTimezone, useApp } from '@/state/app';\nimport { t } from '@/i18n';\nimport { useDayPlan } from '@/state/hooks';\nimport { EnergyCurve } from '@/ui/components/EnergyCurve';\nimport { AppText, Button, Card, Chip, Notice, ProgressBar } from '@/ui/components/primitives';\nimport { CAFFEINE_OPTIONS, ChronotypeForm, DEFAULT_ANSWERS, TargetWakeForm, TextField, WorkForm } from '@/ui/forms';\nimport { spacing, useTheme } from '@/ui/theme';\n\nconst STEPS = ['welcome', 'principles', 'about', 'chrono', 'daily', 'caffeine', 'health', 'notifications', 'result', 'medical'] as const;\ntype Step = (typeof STEPS)[number];\n\nconst DEFAULT_REMINDERS: Partial\u003cRecord\u003cHabitKey, boolean>> = {\n  morning_light: true,\n  caffeine_cutoff: true,\n  wind_down: true,\n  bedtime: true,\n};\n\nfunction WelcomeCurve() {\n  const tz = deviceTimezone();\n  const [nowMs] = useState(() => Date.now());\n  const plan = useMemo(() => {\n    const sessions = generateDemoSessions({ scenario: 'rested', lastWakeKey: dateKey(nowMs, tz), tz, nights: 20 }).filter((s) => s.endAt \u003c= nowMs);\n    const profile = { ...demoProfile('rested', tz, nowMs), timezone: tz };\n    return computeDayPlan({ sessions, profile, now: nowMs });\n  }, [tz, nowMs]);\n  return \u003cEnergyCurve plan={plan} now={nowMs} tz={tz} height={220} />;\n}\n\nfunction Title({ children }: { children: React.ReactNode }) {\n  return (\n    \u003cAppText variant=\"title\" accessibilityRole=\"header\">\n      {children}\n    \u003c/AppText>\n  );\n}\n\nexport default function Onboarding() {\n  const router = useRouter();\n  const insets = useSafeAreaInsets();\n  const { colors } = useTheme();\n  const [stepIdx, setStepIdx] = useState(0);\n  const step: Step = STEPS[stepIdx];\n\n  const [name, setName] = useState('');\n  const [year, setYear] = useState('');\n  const [answers, setAnswers] = useState\u003cChronotypeAnswers>(DEFAULT_ANSWERS);\n  const [work, setWork] = useState\u003cWorkSchedule>(DEFAULT_WORK);\n  const [targetWake, setTargetWake] = useState\u003cstring | null>(null);\n  const [caffeine, setCaffeine] = useState\u003c'yes' | 'no'>('yes');\n  const [cutoff, setCutoff] = useState(8);\n  const [reminders, setReminders] = useState(DEFAULT_REMINDERS);\n  const [morningCheck, setMorningCheck] = useState(false);\n  const [healthMsg, setHealthMsg] = useState\u003cstring | null>(null);\n  const [healthBusy, setHealthBusy] = useState(false);\n  const [calculating, setCalculating] = useState(false);\n\n  const applyOnboarding = useApp((s) => s.applyOnboarding);\n  const finishOnboarding = useApp((s) => s.finishOnboarding);\n  const loadDemo = useApp((s) => s.loadDemo);\n  const reload = useApp((s) => s.reload);\n  const updateEstimates = useApp((s) => s.updateEstimates);\n  const { plan, now } = useDayPlan();\n  const tz = deviceTimezone();\n\n  const y = parseInt(year, 10);\n  const yearOk = year === '' || (y >= 1900 && y \u003c= new Date().getFullYear());\n  const progress = (stepIdx + 1) / STEPS.length;\n\n  const next = () => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));\n  const back = () => setStepIdx((i) => Math.max(0, i - 1));\n\n  const connectHealth = async () => {\n    setHealthBusy(true);\n    setHealthMsg(null);\n    try {\n      if (Platform.OS === 'web') {\n        await loadDemo('rested');\n        setHealthMsg('Demo-Daten geladen.');\n      } else {\n        const provider = getHealthProvider(tz);\n        const perm = await provider.requestPermissions();\n        if (perm !== 'granted') {\n          setHealthMsg(t('onboarding.healthDenied'));\n        } else {\n          const res = await syncHealth(dataStore, provider, tz);\n          await reload();\n          setHealthMsg(res.imported > 0 ? t('settings.syncDone', { n: res.imported }) : 'Keine Schlafdaten gefunden. Du kannst Nächte manuell eintragen oder Demo-Daten laden.');\n        }\n      }\n    } finally {\n      setHealthBusy(false);\n    }\n  };\n\n  const demoInstead = async () => {\n    setHealthBusy(true);\n    await loadDemo('rested');\n    setHealthMsg('Demo-Daten geladen.');\n    setHealthBusy(false);\n  };\n\n  const goResult = async () => {\n    if (Object.values(reminders).some(Boolean) && Platform.OS !== 'web') await requestNotificationPermission();\n    setCalculating(true);\n    setStepIdx(STEPS.indexOf('result'));\n    await applyOnboarding({\n      name: name.trim() || null,\n      birthYear: year ? y : null,\n      answers: { ...answers, workDaysPerWeek: Math.max(1, work.workDays.length) },\n      workSchedule: work,\n      targetWakeTime: targetWake,\n      caffeineCutoffHours: caffeine === 'yes' ? cutoff : 8,\n      habitReminders: reminders,\n      morningCheck,\n    });\n    await updateEstimates(true);\n    setTimeout(() => setCalculating(false), 1400);\n  };\n\n  const finish = async () => {\n    await finishOnboarding();\n    router.replace('/');\n  };\n\n  const chrono = chronotypeFromAnswers(answers);\n\n  return (\n    \u003cView style={{ flex: 1, backgroundColor: colors.bg, paddingTop: insets.top + spacing(2) }}>\n      \u003cView style={{ paddingHorizontal: spacing(4), gap: spacing(2) }}>\n        \u003cProgressBar value={progress} />\n        \u003cAppText variant=\"caption\" muted>\n          {stepIdx + 1} / {STEPS.length}\n        \u003c/AppText>\n      \u003c/View>\n      \u003cScrollView contentContainerStyle={{ padding: spacing(4), gap: spacing(4), paddingBottom: spacing(6) }} keyboardShouldPersistTaps=\"handled\">\n        {step === 'welcome' && (\n          \u003c>\n            \u003cTitle>{t('onboarding.welcomeTitle')}\u003c/Title>\n            \u003cAppText muted>{t('onboarding.welcomeText')}\u003c/AppText>\n            \u003cCard>\u003cWelcomeCurve />\u003c/Card>\n          \u003c/>\n        )}\n\n        {step === 'principles' && (\n          \u003c>\n            \u003cTitle>{t('onboarding.principlesTitle')}\u003c/Title>\n            \u003cCard>\n              \u003cAppText variant=\"h2\">{t('onboarding.debtCard')}\u003c/AppText>\n              \u003cAppText muted style={{ marginTop: 6 }}>{t('onboarding.debtCardText')}\u003c/AppText>\n            \u003c/Card>\n            \u003cCard>\n              \u003cAppText variant=\"h2\">{t('onboarding.clockCard')}\u003c/AppText>\n              \u003cAppText muted style={{ marginTop: 6 }}>{t('onboarding.clockCardText')}\u003c/AppText>\n            \u003c/Card>\n          \u003c/>\n        )}\n\n        {step === 'about' && (\n          \u003c>\n            \u003cTitle>{t('onboarding.aboutTitle')}\u003c/Title>\n            \u003cCard style={{ gap: spacing(4) }}>\n              \u003cTextField label={t('onboarding.name')} value={name} onChangeText={setName} maxLength={30} />\n              \u003cTextField label={t('onboarding.birthYear')} value={year} onChangeText={(v) => setYear(v.replace(/\\D/g, ''))} keyboardType=\"number-pad\" maxLength={4} />\n              {!yearOk && \u003cAppText variant=\"caption\" color={colors.bad}>Bitte ein gültiges Jahr eingeben.\u003c/AppText>}\n            \u003c/Card>\n          \u003c/>\n        )}\n\n        {step === 'chrono' && (\n          \u003c>\n            \u003cTitle>{t('onboarding.chronoTitle')}\u003c/Title>\n            \u003cChronotypeForm value={answers} onChange={setAnswers} />\n            \u003cNotice>\n              {t(`sleep.${chrono.chronotype}`)} · {t('sleep.socialJetlag')} {chrono.socialJetlagHours.toFixed(1)} h\n            \u003c/Notice>\n          \u003c/>\n        )}\n\n        {step === 'daily' && (\n          \u003c>\n            \u003cTitle>{t('onboarding.dailyTitle')}\u003c/Title>\n            \u003cWorkForm value={work} onChange={setWork} />\n            \u003cTargetWakeForm value={targetWake} onChange={setTargetWake} />\n          \u003c/>\n        )}\n\n        {step === 'caffeine' && (\n          \u003c>\n            \u003cTitle>{t('onboarding.caffeineTitle')}\u003c/Title>\n            \u003cCard style={{ gap: spacing(3) }}>\n              \u003cAppText variant=\"h3\">{t('onboarding.caffeineQuestion')}\u003c/AppText>\n              \u003cView style={{ flexDirection: 'row', gap: spacing(2) }}>\n                \u003cChip label={t('common.yes')} active={caffeine === 'yes'} onPress={() => setCaffeine('yes')} />\n                \u003cChip label={t('onboarding.caffeineNone')} active={caffeine === 'no'} onPress={() => setCaffeine('no')} />\n              \u003c/View>\n              {caffeine === 'yes' && (\n                \u003c>\n                  \u003cAppText variant=\"caption\" muted>{t('onboarding.caffeineCutoff')}\u003c/AppText>\n                  \u003cView style={{ flexDirection: 'row', gap: spacing(2) }}>\n                    {CAFFEINE_OPTIONS.map((h) => (\n                      \u003cChip key={h} label={`${h} h`} active={cutoff === h} onPress={() => setCutoff(h)} />\n                    ))}\n                  \u003c/View>\n                \u003c/>\n              )}\n            \u003c/Card>\n          \u003c/>\n        )}\n\n        {step === 'health' && (\n          \u003c>\n            \u003cTitle>{t('onboarding.healthTitle')}\u003c/Title>\n            \u003cAppText muted>{t('onboarding.healthText')}\u003c/AppText>\n            {Platform.OS === 'web' && \u003cNotice>{t('onboarding.healthWeb')}\u003c/Notice>}\n            \u003cButton label={healthBusy ? t('common.loading') : t('onboarding.healthButton')} onPress={connectHealth} disabled={healthBusy} />\n            {healthMsg && \u003cNotice>{healthMsg}\u003c/Notice>}\n            {Platform.OS !== 'web' && healthMsg && \u003cButton label=\"Demo-Daten laden\" variant=\"secondary\" onPress={demoInstead} />}\n            \u003cButton label={t('onboarding.healthSkip')} variant=\"ghost\" onPress={next} />\n          \u003c/>\n        )}\n\n        {step === 'notifications' && (\n          \u003c>\n            \u003cTitle>{t('onboarding.notifTitle')}\u003c/Title>\n            \u003cAppText muted>{t('onboarding.notifText')}\u003c/AppText>\n            \u003cCard style={{ gap: spacing(1) }}>\n              {HABITS.filter((h) => ['morning_light', 'caffeine_cutoff', 'wind_down', 'bedtime', 'dim_light', 'powernap'].includes(h.key)).map((h) => (\n                \u003cView key={h.key} style={{ flexDirection: 'row', alignItems: 'center', minHeight: 52, gap: spacing(3) }}>\n                  \u003cView style={{ flex: 1 }}>\n                    \u003cAppText variant=\"h3\">{h.title}\u003c/AppText>\n                  \u003c/View>\n                  \u003cSwitch\n                    accessibilityLabel={h.title}\n                    value={!!reminders[h.key]}\n                    onValueChange={(v) => setReminders({ ...reminders, [h.key]: v })}\n                    trackColor={{ true: colors.accent, false: colors.surface2 }}\n                  />\n                \u003c/View>\n              ))}\n              \u003cView style={{ flexDirection: 'row', alignItems: 'center', minHeight: 52, gap: spacing(3) }}>\n                \u003cView style={{ flex: 1 }}>\n                  \u003cAppText variant=\"h3\">Morgendliche Schnellabfrage\u003c/AppText>\n                  \u003cAppText variant=\"caption\" muted>Wann bist du eingeschlafen?\u003c/AppText>\n                \u003c/View>\n                \u003cSwitch accessibilityLabel=\"Morgendliche Schnellabfrage\" value={morningCheck} onValueChange={setMorningCheck} trackColor={{ true: colors.accent, false: colors.surface2 }} />\n              \u003c/View>\n            \u003c/Card>\n          \u003c/>\n        )}\n\n        {step === 'result' && (\n          \u003c>\n            \u003cTitle>{calculating ? t('onboarding.calculating') : t('onboarding.resultTitle')}\u003c/Title>\n            {calculating || !plan ? (\n              \u003cCard style={{ alignItems: 'center', paddingVertical: spacing(10) }}>\n                \u003cAppText variant=\"h2\">{t('onboarding.calculating')}\u003c/AppText>\n              \u003c/Card>\n            ) : (\n              \u003c>\n                \u003cCard style={{ gap: spacing(4) }}>\n                  \u003cView>\n                    \u003cAppText variant=\"caption\" muted>{t('onboarding.resultNeed')}\u003c/AppText>\n                    \u003cAppText variant=\"number\" color={colors.accent2}>{formatDuration(plan.needMinutes)}\u003c/AppText>\n                  \u003c/View>\n                  \u003cView>\n                    \u003cAppText variant=\"caption\" muted>{t('onboarding.resultDebt')}\u003c/AppText>\n                    \u003cAppText variant=\"number\" color={colors.warn}>\n                      {plan.debt.insufficientData ? t('today.debtNoData') : formatDuration(plan.debt.debtMinutes)}\n                    \u003c/AppText>\n                  \u003c/View>\n                  \u003cView>\n                    \u003cAppText variant=\"caption\" muted>{t('onboarding.resultBed')}\u003c/AppText>\n                    \u003cAppText variant=\"number\" color={colors.melatonin}>{formatClock(plan.bedtime.bedtime, tz)}\u003c/AppText>\n                  \u003c/View>\n                \u003c/Card>\n                \u003cCard style={{ paddingHorizontal: spacing(2) }}>\n                  \u003cEnergyCurve plan={plan} now={now} tz={tz} height={230} />\n                \u003c/Card>\n              \u003c/>\n            )}\n          \u003c/>\n        )}\n\n        {step === 'medical' && (\n          \u003c>\n            \u003cTitle>{t('onboarding.medicalTitle')}\u003c/Title>\n            \u003cNotice tone=\"warn\">{t('disclaimer')}\u003c/Notice>\n            \u003cCard>\n              \u003cAppText>{t('privacy')}\u003c/AppText>\n            \u003c/Card>\n          \u003c/>\n        )}\n      \u003c/ScrollView>\n\n      \u003cView style={{ flexDirection: 'row', gap: spacing(3), padding: spacing(4), paddingBottom: insets.bottom + spacing(4) }}>\n        {stepIdx > 0 && step !== 'result' && \u003cButton label={t('common.back')} variant=\"secondary\" onPress={back} style={{ flex: 1 }} />}\n        {step === 'notifications' ? (\n          \u003cButton label={t('common.next')} onPress={goResult} style={{ flex: 2 }} />\n        ) : step === 'result' ? (\n          \u003cButton label={t('common.next')} onPress={next} disabled={calculating} style={{ flex: 1 }} />\n        ) : step === 'medical' ? (\n          \u003cButton label={t('onboarding.start')} onPress={finish} style={{ flex: 2 }} />\n        ) : step === 'health' ? (\n          \u003cButton label={t('common.next')} onPress={next} style={{ flex: 2 }} />\n        ) : (\n          \u003cButton label={t('common.next')} onPress={next} disabled={step === 'about' && !yearOk} style={{ flex: 2 }} />\n        )}\n      \u003c/View>\n    \u003c/View>\n  );\n}\n"},{"path":"app/settings/about.tsx","content":"import { Stack } from 'expo-router';\nimport React from 'react';\nimport { ENGINE_VERSION } from '@/engine/constants';\nimport { t } from '@/i18n';\nimport { AppText, Card, Notice, Screen } from '@/ui/components/primitives';\n\nexport default function About() {\n  return (\n    \u003c>\n      \u003cStack.Screen options={{ title: t('settings.about') }} />\n      \u003cScreen>\n        \u003cNotice tone=\"warn\">{t('disclaimer')}\u003c/Notice>\n        \u003cCard>\n          \u003cAppText variant=\"h3\">Datenschutz\u003c/AppText>\n          \u003cAppText style={{ marginTop: 6 }}>{t('privacy')}\u003c/AppText>\n        \u003c/Card>\n        \u003cCard>\n          \u003cAppText variant=\"h3\">Modell\u003c/AppText>\n          \u003cAppText style={{ marginTop: 6 }} muted>\n            Tagwerk kombiniert ein Zwei-Prozess-Modell der Schlafregulation (Schlafdruck und innere Uhr) mit einer gewichteten Schlafschuld über 14 Nächte. Alle Werte sind Modellschätzungen.\n          \u003c/AppText>\n        \u003c/Card>\n        \u003cCard>\n          \u003cAppText variant=\"h3\">Impressum\u003c/AppText>\n          \u003cAppText style={{ marginTop: 6 }} muted>\n            Tagwerk ist ein unabhängiges Projekt. Anbieterangaben bitte vor einer Veröffentlichung ergänzen.\n          \u003c/AppText>\n        \u003c/Card>\n        \u003cAppText variant=\"caption\" muted style={{ textAlign: 'center' }}>\n          {t('common.version')} 1.0.0 · Engine {ENGINE_VERSION}\n        \u003c/AppText>\n      \u003c/Screen>\n    \u003c/>\n  );\n}\n"},{"path":"app/settings/alarm.tsx","content":"import { Stack } from 'expo-router';\nimport * as Notifications from 'expo-notifications';\nimport React, { useMemo, useState } from 'react';\nimport { Platform } from 'react-native';\nimport { suggestWakeTime } from '@/engine/alarm';\nimport { MIN } from '@/engine/constants';\nimport { formatClock, formatDuration, localTimeToMs, dateKey, addDaysToKey, parseHHmm } from '@/engine/time';\nimport { requestNotificationPermission } from '@/services/notifications';\nimport { useApp } from '@/state/app';\nimport { useDayPlan } from '@/state/hooks';\nimport { AppText, Button, Card, Notice, Screen } from '@/ui/components/primitives';\nimport { TimeStepper } from '@/ui/components/TimeStepper';\n\nexport default function AlarmSettings() {\n  const profile = useApp((s) => s.profile);\n  const { plan, now } = useDayPlan();\n  const tz = profile?.timezone ?? 'Europe/Berlin';\n  const defaultEnd = profile?.targetWakeTime ?? '07:00';\n  const [start, setStart] = useState(() => {\n    const e = parseHHmm(defaultEnd) * 60 - 30;\n    return `${String(Math.floor(((e + 1440) % 1440) / 60)).padStart(2, '0')}:${String((e + 1440) % 60).padStart(2, '0')}`;\n  });\n  const [end, setEnd] = useState(defaultEnd);\n  const [message, setMessage] = useState\u003cstring | null>(null);\n\n  const suggestion = useMemo(() => {\n    if (!plan) return null;\n    const onset = plan.bedtime.bedtime + 15 * MIN;\n    const day = dateKey(onset, tz);\n    const wakeDay = parseHHmm(end) * 60 \u003c 12 * 60 ? addDaysToKey(day, 1) : day;\n    const s = localTimeToMs(wakeDay, start, tz);\n    let e = localTimeToMs(wakeDay, end, tz);\n    if (e \u003c= s) e = s + 30 * MIN;\n    return { onset, ...suggestWakeTime(onset, s, e) };\n  }, [plan, start, end, tz]);\n\n  const schedule = async () => {\n    if (!suggestion) return;\n    if (Platform.OS === 'web') return setMessage('Im Browser kann kein Wecker geplant werden.');\n    if (!(await requestNotificationPermission())) return setMessage('Benachrichtigungen sind nicht erlaubt.');\n    try {\n      await Notifications.scheduleNotificationAsync({\n        identifier: 'gentle-alarm',\n        content: { title: '⏰ Guten Morgen', body: 'Du bist am Ende eines Schlafzyklus. Zeit zum Aufstehen.', sound: true },\n        trigger: { type: Notifications.SchedulableTriggerInputTypes.DATE, date: new Date(Math.max(suggestion.wakeAt, now + 60_000)) },\n      });\n      setMessage(`Erinnerung für ${formatClock(suggestion.wakeAt, tz)} geplant.`);\n    } catch {\n      setMessage('Das Planen hat nicht geklappt.');\n    }\n  };\n\n  return (\n    \u003c>\n      \u003cStack.Screen options={{ title: 'Sanfter Wecker' }} />\n      \u003cScreen>\n        \u003cNotice tone=\"warn\">\n          Hinweis: iOS erlaubt Apps von Drittanbietern keinen echten Wecker, der den Stummschalter oder „Nicht stören“ umgeht. Die Weck-Erinnerung ist eine Benachrichtigung. Trag die Zeit zur Sicherheit auch in die Uhr-App ein.\n        \u003c/Notice>\n        \u003cCard>\u003cTimeStepper label=\"Frühester Zeitpunkt\" value={start} onChange={setStart} />\u003c/Card>\n        \u003cCard>\u003cTimeStepper label=\"Spätester Zeitpunkt\" value={end} onChange={setEnd} />\u003c/Card>\n        {suggestion && (\n          \u003cCard>\n            \u003cAppText variant=\"caption\" muted>Vorschlag (Ende eines 90-Minuten-Zyklus)\u003c/AppText>\n            \u003cAppText variant=\"number\">{formatClock(suggestion.wakeAt, tz)}\u003c/AppText>\n            \u003cAppText variant=\"caption\" muted>\n              {suggestion.cycles} Zyklen, ca. {formatDuration((suggestion.wakeAt - suggestion.onset) / MIN)} Schlaf bei Einschlafen um {formatClock(suggestion.onset, tz)}\n              {suggestion.aligned ? '' : '. In deinem Zeitfenster endet kein Zyklus, wir nehmen das späteste.'}\n            \u003c/AppText>\n          \u003c/Card>\n        )}\n        \u003cButton label=\"Weck-Erinnerung planen\" onPress={schedule} />\n        {message && \u003cNotice>{message}\u003c/Notice>}\n      \u003c/Screen>\n    \u003c/>\n  );\n}\n"},{"path":"app/settings/calendar.tsx","content":"import { Stack } from 'expo-router';\nimport React from 'react';\nimport { Platform, Switch } from 'react-native';\nimport { t } from '@/i18n';\nimport { requestCalendarAccess } from '@/services/ca
